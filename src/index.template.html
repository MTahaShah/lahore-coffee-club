<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFF7E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)">
  <!-- Installable app (PWA): build.sh copies manifest.json and icons/ next to index.html -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LCC">
  <meta name="description" content="Lahore Coffee Club: one monthly pass for the city’s best independent cafés. Prototype.">
  <title>Lahore Coffee Club</title>
  <!-- Link previews (WhatsApp, iMessage, X…). The image is og.png in the repo root, rendered by headless Chrome. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lahore Coffee Club">
  <meta property="og:title" content="Every café you love. One monthly pass.">
  <meta property="og:description" content="Pick your places, pick your cups. Pay once, drink well all month.">
  <meta property="og:url" content="https://lcc-omega.vercel.app/">
  <meta property="og:image" content="https://lcc-omega.vercel.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lahore Coffee Club: Every café you love. One monthly pass.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Every café you love. One monthly pass.">
  <meta name="twitter:description" content="Pick your places, pick your cups. Pay once, drink well all month.">
  <meta name="twitter:image" content="https://lcc-omega.vercel.app/og.png">
<!-- @favicon -->
<!-- @styles -->
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
<!-- @logos -->
  <header id="proto-bar"></header>
  <main id="main" tabindex="-1"></main>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">This prototype needs JavaScript to run.</p></noscript>
  <!-- QR generation for the member pass (qrcode-generator, pinned). Falls back to the numeric code if it can't load. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Live sync across devices (Realtime Broadcast only). Not on cdnjs, so jsDelivr: approved exception, see CLAUDE.md. Falls back to this-computer-only sync if it can't load. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<!-- @scripts -->
  <!-- Service worker (sw.js, copied next to index.html by build.sh). Needs http(s); skipped on file://. -->
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
