@keyframes card-seal { from { opacity: 0; transform: rotate(-24deg) scale(0.9); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .mcard.is-issuing, .mcard.is-issuing .mcard__no, .mcard.is-issuing .mcard__foot, .mcard.is-issuing .mcard__seal { animation: none; }
}

/* Club tab --------------------------------------------------------------- */
.club { display: grid; gap: var(--space-5); }
.club > .app-section { margin-top: var(--space-3); }

.pbar { height: 4px; border-radius: var(--radius-pill); background: var(--line); overflow: hidden; }
.pbar span { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(var(--p, 0)); background: var(--primary); border-radius: inherit; transition: transform 600ms var(--ease); }

.ladder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); }
.ladder__step { position: relative; display: grid; gap: 2px; padding-top: 20px; }
.ladder__step::before { content: ""; position: absolute; top: 5px; left: 12px; right: calc(-1 * var(--space-2)); height: 1px; background: var(--line-strong); }
.ladder__step:last-child::before { display: none; }
.ladder__step.is-reached:not(.is-current)::before { background: var(--primary); }
.ladder__dot { position: absolute; top: 0; left: 0; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--bg); }
.ladder__step.is-reached .ladder__dot { border-color: var(--primary); background: var(--primary); }
.ladder__step.is-current .ladder__dot { box-shadow: 0 0 0 4px var(--primary-soft); }
.ladder__name { font-size: var(--fs-14); font-weight: 500; color: var(--ink-3); }
.ladder__step.is-reached .ladder__name { color: var(--ink); }
.ladder__line { font-size: var(--fs-12); line-height: 1.35; color: var(--ink-3); }
.club-next { display: grid; gap: var(--space-2); margin-top: var(--space-4); padding-top: var(--space-4); border-top: var(--hairline); }
.club-next strong { font-weight: 500; }
.club-next__row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-3); }
.club-next__row .num { min-width: 96px; text-align: right; }

/* Coffee passport: a closed book that opens ----------------------------
   Black cover (no espresso or brown surfaces), cream foil type, the ring
   logo's bricks. Pages are paper (--surface). Stamps are ink in
   --accent-text, the text-safe coffee colour in both modes. */
.passport { display: grid; gap: var(--space-4); }
.pbook-stage { padding: var(--space-2) 0; overflow: clip; overflow-clip-margin: 24px; }
.pbook {
  position: relative;
  width: min(100%, 300px);
  aspect-ratio: 88 / 125;           /* a passport booklet */
  margin-inline: auto;
  perspective: 1400px;
}

/* Cover */
.pbook__cover {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  justify-items: center;
  align-items: center;
  padding: 28px 20px 22px;
  border-radius: 6px 14px 14px 6px;
  background: var(--black);
  color: var(--cream);
  --logo-ink: var(--cream);
  text-align: center;
  cursor: pointer;
  transform-origin: left center;
  backface-visibility: hidden;
  -webkit-tap-highlight-color: transparent;
}
.pbook__cover:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.pbook__cover:active { transform: scale(0.99); }
/* A blind-stamped frame and a spine line, in faint cream */
.pbook__frame { position: absolute; inset: 10px 10px 10px 16px; border: 1px solid color-mix(in srgb, var(--cream) 18%, transparent); border-radius: 4px 10px 10px 4px; pointer-events: none; }
.pbook__cover::before { content: ""; position: absolute; top: 0; bottom: 0; left: 8px; width: 1px; background: color-mix(in srgb, var(--cream) 14%, transparent); }
.pbook__foil {
  position: relative;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  /* foil: cream with a soft sheen across it */
  background: linear-gradient(100deg, var(--cream) 0%, color-mix(in srgb, var(--cream) 62%, var(--black)) 45%, var(--cream) 70%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.pbook__foil--title { font-size: 15px; letter-spacing: 0.3em; margin-top: var(--space-4); }
.pbook__crest { position: relative; width: 58%; line-height: 0; }
.pbook__crest .logo, .pbook__crest svg { width: 100%; height: auto; }
.pbook__holder { position: relative; margin-top: var(--space-5); font-size: var(--fs-12); letter-spacing: 0.08em; color: color-mix(in srgb, var(--cream) 70%, transparent); }

/* Pages */
.pbook__page {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: var(--space-4);
  padding: 16px 18px 18px;
  border: var(--hairline);
  border-radius: 4px 12px 12px 4px;
  background:
    repeating-radial-gradient(circle at 50% 120%, transparent 0 13px, color-mix(in srgb, var(--line) 55%, transparent) 13px 14px),
    var(--surface);
  color: var(--ink);
  transform-origin: left center;
  backface-visibility: hidden;
  touch-action: pan-y;               /* horizontal swipes turn the page */
  user-select: none;
  -webkit-user-select: none;
}
.pbook__page:focus { outline: none; }
.pbook__page:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.pbook__page[hidden] { display: none; }
.pbook__page.is-top { z-index: 2; }
.pbook__head { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-3); }

/* Turning: hinged on the left, 360ms with the brand easing */
.is-flipping { transition: transform 360ms var(--ease); }
.is-flipping.is-away { transform: rotateY(-180deg); }
/* Reduced motion: a crossfade instead (beats the global 1ms rule) */
.is-fading { transition: opacity 240ms linear !important; }
.is-fading.is-away { opacity: 0; }
.pbook__cover[hidden] { display: none; }

/* ID page */
.pid { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: var(--space-4); align-content: start; }
.pid__photo { display: grid; place-items: center; aspect-ratio: 4 / 5; border: var(--hairline); border-radius: 4px; background: var(--surface-2); font-size: var(--fs-28); color: var(--ink-3); }
.pid__fields { display: grid; gap: var(--space-3); margin: 0; }
.pid__fields dt, .pid__label { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-3); }
.pid__fields dd { margin: 2px 0 0; font-size: var(--fs-16); }
.pid__no { display: grid; gap: 4px; align-self: end; }
.pid__digits { font-size: var(--fs-28); letter-spacing: 0.3em; font-variant-numeric: tabular-nums; }  /* the monospace look, in the brand face */
.pid__sign { display: grid; gap: 6px; margin-top: var(--space-4); }
.pid__line { display: block; width: 70%; height: 1px; background: var(--line-strong); }
.pbook__page:has(.pid) { grid-template-rows: auto auto 1fr auto; }

/* Stamp pages: 4 stamps, 2 by 2 */
.pstamps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: var(--space-3); align-items: center; justify-items: center; }
.pstamp { display: grid; place-items: center; width: 100%; height: 100%; }
.pstamp__ink { display: grid; justify-items: center; align-content: center; gap: 3px; width: 112px; max-width: 100%; aspect-ratio: 1; padding: 10px; text-align: center; }
.pstamp__name { font-size: 11px; font-weight: 700; line-height: 1.15; letter-spacing: 0.08em; text-transform: uppercase; }
.pstamp__area { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
.pstamp__date { font-size: 10px; letter-spacing: 0.06em; }
/* Earned: ink, double ruled, slightly rotated and a touch uneven */
.pstamp:not(.is-empty) .pstamp__ink {
  color: var(--accent-text);
  border: 2px solid currentColor;
  box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px currentColor;   /* the inner rule, not a shadow */
  transform: rotate(var(--tilt, 0deg));
  opacity: 0.88;
}
.pstamp--round .pstamp__ink { border-radius: 50%; }
.pstamp--rect .pstamp__ink { aspect-ratio: 1.3; width: 124px; border-radius: 6px; }
.pstamp:not(.is-empty) .pstamp__date { border-top: 1px solid currentColor; padding-top: 3px; }
/* Not yet: a faint dotted outline with the café's name */
.pstamp.is-empty .pstamp__ink { border: 1.5px dotted var(--line-strong); border-radius: 50%; color: var(--ink-4); }
.pstamp.is-empty .pstamp__name { font-weight: 500; }

/* Under the book */
.pbook__controls { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--space-2); text-align: center; }
.pbook__controls[hidden] { display: none; }
.pbook__controls .btn { gap: 4px; padding-inline: var(--space-3); }
.pbook__controls .btn svg { width: 18px; height: 18px; }
.pbook__controls .btn[aria-disabled="true"] { opacity: 0.35; cursor: default; }
.passport__foot { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); }
.passport__foot .btn--link[hidden] { display: none; }
.passport__head { display: grid; gap: 2px; }
.passport__count { color: var(--primary); }

/* Badges */
.badge-mark { display: grid; place-items: center; width: var(--tap); height: var(--tap); flex: none; border-radius: 50%; border: 1px dashed var(--line-strong); color: var(--ink-4); }
.badge-mark svg { width: 24px; height: 24px; }
.badge-row.is-earned .badge-mark { border: 1.5px solid var(--primary); color: var(--primary); background: var(--primary-soft); }
.badge-row:not(.is-earned) .row__title { color: var(--ink-2); }
.badge-row:not(.is-earned) { opacity: 0.7; }   /* still to earn: greyed */
.badges-row { width: 100%; text-align: left; cursor: pointer; }
.badges-row .badge-mark.is-earned { border: 1.5px solid var(--primary); color: var(--primary); background: var(--primary-soft); }
.badges-row .row__title { font-weight: 500; }
.badges-sheet { display: grid; gap: var(--space-5); }
.badges-sheet__bar { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; }
.badges-sheet .eyebrow { margin-bottom: var(--space-1); }

/* Perks: a row that fans out a stack of ticket stubs ----------------------
   Tickets are paper (--surface) with a hairline, a dashed perforation
   before the stub and a torn right edge (a mask, no images). The stub's
   word is the one accent. Fan: 280ms with the brand easing. */
.perks-row .row__trail svg { transition: transform var(--dur-2) var(--ease); }
.perks-row[aria-expanded="true"] .row__trail svg { transform: rotate(180deg); }
.tickets { --ticket-h: 128px; --step: 62px; display: grid; gap: var(--space-3); padding-top: var(--space-3); opacity: 1; }
.tickets[hidden] { display: none; }
.tickets__bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-right: -10px; }
.tickets__fan { position: relative; height: calc(var(--ticket-h) + (var(--n) - 1) * var(--step) + 8px); }
.ticket-slot {
  position: absolute;
  top: 4px; left: 0; right: 0;
  z-index: calc(var(--i) + 1);
  transform: translateY(0) rotate(0deg);
  transition: transform 280ms var(--ease);
}
.tickets.is-fanned .ticket-slot { transform: translateY(calc(var(--i) * var(--step))) rotate(var(--tilt, 0deg)); }
.tickets.is-fanned .ticket-slot.is-front { z-index: 20; transform: translateY(calc(var(--i) * var(--step))) rotate(0deg); }
/* Reduced motion: the fan is already in place; the stack fades in and out */
.tickets.is-still .ticket-slot { transition: none; transform: translateY(calc(var(--i) * var(--step))) rotate(var(--tilt, 0deg)); }
.tickets.is-still { transition: opacity 220ms linear !important; opacity: 0; }
.tickets.is-still.is-fanned { opacity: 1; }

.ticket { display: block; width: 100%; height: var(--ticket-h); padding: 0; text-align: left; color: var(--ink); border-radius: 10px; -webkit-tap-highlight-color: transparent; }
.ticket:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.ticket__paper {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 52px;
  height: 100%;
  background: var(--surface);
  border: var(--hairline);
  border-radius: 10px;
  /* the torn, perforated right edge: a bite every 10px */
  -webkit-mask: radial-gradient(circle 4px at 100% 50%, transparent 3.5px, #000 4px) 0 0 / 100% 10px repeat-y;
  mask: radial-gradient(circle 4px at 100% 50%, transparent 3.5px, #000 4px) 0 0 / 100% 10px repeat-y;
}
.ticket__main { display: grid; grid-template-rows: auto 1fr auto; gap: 4px; min-width: 0; padding: 14px 14px 12px 16px; }
.ticket__cafe { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticket__perk { align-self: start; font-size: var(--fs-16); font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ticket__meta { display: grid; gap: 2px; font-size: var(--fs-12); color: var(--ink-3); }
/* Tickets partly under the next one show their perk on one line */
.ticket-slot:not(.is-front):not(:last-child) .ticket__perk { -webkit-line-clamp: 1; }
.perks-row .row__main { display: grid; gap: 2px; }
.ticket__stub { display: grid; place-items: center; border-left: 1.5px dashed var(--line-strong); }
.ticket__stub span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent-text); }
/* Used or expired: faded, with the word on the stub and the date */
.ticket.is-used .ticket__main, .ticket.is-expired .ticket__main { opacity: 0.5; }
.ticket.is-used .ticket__stub span, .ticket.is-expired .ticket__stub span { color: var(--ink-3); }
.perks > .tickets .t-micro { margin-top: var(--space-1); }

/* Gatherings */
.gather { display: grid; gap: var(--space-3); }
.gather__when { display: flex; align-items: center; gap: var(--space-2); color: var(--ink-2); }
.gather__when svg { flex: none; color: var(--ink-3); }
.gather__seats { display: grid; gap: var(--space-2); padding-block: var(--space-2); }
.gather__seats strong { font-weight: 500; }
.gather__action { display: grid; gap: var(--space-2); justify-items: start; }
.gather__action .btn--block { justify-self: stretch; }
.gather__action .btn--link { padding-inline: 0; }
.gather__going { display: flex; align-items: center; gap: var(--space-2); font-weight: 500; color: var(--primary); }
.gather__going svg { flex: none; }
.gather-past .row__title { font-weight: 400; color: var(--ink-2); }

/* Invite and gift links */
.invite { display: grid; gap: var(--space-4); }
.invite__code { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; align-items: center; column-gap: var(--space-2); padding: var(--space-3) var(--space-2) var(--space-3) var(--space-4); border-radius: var(--radius-card); background: var(--surface-2); }
.invite__code .t-micro { grid-column: 1; }
.invite__value { grid-column: 1; font-family: var(--font-sans); font-size: var(--fs-28); font-weight: 400; letter-spacing: 0.06em; line-height: 1.1; }
.invite__code .icon-btn { grid-column: 2; grid-row: 1 / span 2; }
.btn svg + * { margin: 0; }
.invite .btn { gap: var(--space-2); }
.gift-link { text-decoration: none; color: inherit; }
.gift-link .badge-mark { border-style: solid; color: var(--ink-2); }
.gift-link:hover .row__title { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }

/* Gift flow ---------------------------------------------------------------- */
.gift-source { padding: var(--space-3) var(--space-4); border-radius: var(--radius-card); background: var(--surface-2); }
.method.is-empty { opacity: 0.5; cursor: default; }
.gift-cups { display: flex; align-items: center; gap: var(--space-4); }
.gift-msg { min-height: 88px; }
.gift-card {
  display: grid;
  gap: var(--space-2);
  padding: 20px 22px;
  border-radius: 16px;
  --logo-ink: var(--cream);
  background: var(--black);
  color: var(--cream);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cream) 16%, transparent);
}
.gift-card__top { display: flex; justify-content: space-between; align-items: center; color: color-mix(in srgb, var(--cream) 66%, transparent); }
.gift-card__cups { margin-top: var(--space-3); font-family: var(--font-sans); font-size: var(--fs-28); font-weight: 400; line-height: 1.15; }
.gift-card__to { font-size: var(--fs-14); }
.gift-card__msg { font-family: var(--font-sans); font-size: var(--fs-16); line-height: 1.4; overflow-wrap: anywhere; }
.gift-card__msg[hidden] { display: none; }
.gift-card__foot { display: flex; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-2); padding-top: var(--space-3); border-top: 1px solid color-mix(in srgb, var(--cream) 16%, transparent); font-size: var(--fs-12); color: color-mix(in srgb, var(--cream) 66%, transparent); }
.gift-code { font-family: var(--font-sans); font-size: var(--fs-40); font-weight: 400; letter-spacing: 0.12em; line-height: 1; margin-block: var(--space-2); }

/* Onboarding ------------------------------------------------------------- */
.welcome-intro { display: grid; gap: var(--space-4); padding-top: var(--space-6); }
.welcome-intro__title { font-size: 44px; line-height: 1.04; max-width: 11ch; }
.welcome-intro .btn { margin-top: var(--space-5); }
.welcome-invite { display: flex; gap: var(--space-2); align-items: flex-start; padding: var(--space-3) var(--space-4); border-radius: var(--radius-card); background: var(--primary-soft); color: var(--primary); font-size: var(--fs-14); font-weight: 500; }
.welcome-invite svg { flex: none; margin-top: 1px; }
.ob-form { display: grid; gap: var(--space-4); }
.ob-form > h1 { margin-top: var(--space-2); }
.ob-form > p.t-small { margin-top: calc(-1 * var(--space-2)); }
.ob-form > .btn { margin-top: var(--space-3); }
.ob-form .btn--link { height: auto; padding: 0; font-size: inherit; }
.ob-code { letter-spacing: 0.5em; text-align: center; }
.area-pick { display: flex; flex-wrap: wrap; gap: var(--space-2); border: 0; padding: 0; margin: 0; min-width: 0; }
.area-chip { cursor: pointer; }
.area-chip:has(input:checked) { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.area-chip:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
.area-pick .field__error { flex-basis: 100%; }
.area-pick[data-invalid="true"] .field__error { display: block; }

.issued { min-height: 100%; display: grid; align-content: center; gap: var(--space-5); padding-block: var(--space-6); }
.issued__eyebrow { animation: card-ink 600ms var(--ease) both; }
.issued__text { display: grid; gap: var(--space-2); animation: card-ink 600ms var(--ease) 1300ms both; }
.issued__actions { display: grid; gap: var(--space-3); animation: card-ink 600ms var(--ease) 1500ms both; }
@media (prefers-reduced-motion: reduce) {
  .issued__eyebrow, .issued__text, .issued__actions { animation: none; }
}

/* Rows built from spans: title above meta */
.badge-row .row__main, .gather-past .row__main, .gift-link .row__main { display: grid; gap: 2px; }
[data-gift-body] [role="status"]:focus { outline: none; }
.welcome-intro__mark { width: 160px; margin-bottom: var(--space-2); }

/* ---- src/landing.css ---- */
/* =====================================================================
   Lahore Coffee Club — landing.css
   Landing page (#/). Layout and the few new pieces only; buttons,
   inputs, cards, rows, steppers, pills and pins come from base.css
   and app.css.
   ===================================================================== */

.lp { padding-bottom: 0; }
.lp a:not(.btn):not(.wordmark):not(.landing-nav__link) { color: var(--ink); text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.lp .landing-nav { gap: var(--space-4); }
.lp .landing-nav__links { gap: var(--space-5); }
@media (max-width: 400px) {
  .lp .wordmark { font-size: var(--fs-16); }
  .lp .landing-nav .btn--compact { padding: 0 var(--space-3); }
}

/* Hero ------------------------------------------------------------- */
.lp-hero { display: grid; gap: var(--space-5); padding-block: var(--space-8) var(--space-9); }
.lp-hero__title { max-width: 13ch; font-size: clamp(44px, 8vw, 88px); }
.lp-hero__sub { max-width: 40ch; font-size: clamp(16px, 2vw, 20px); }
.lp-hero__actions { display: flex; flex-wrap: wrap; gap: var(--space-3); }
@media (max-width: 480px) {
  .lp-hero { padding-block: var(--space-7) var(--space-8); }
  .lp-hero__actions .btn { flex: 1 1 100%; }
}

/* Sections: head on the left, content on the right (desktop) ------- */
.lp-section { display: grid; gap: var(--space-6); }
@media (min-width: 960px) {
  .lp-section { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); column-gap: var(--space-7); align-items: start; }
  .lp-section > :not(.lp-head) { grid-column: 2; }
  .lp-section > .lp-head { grid-row: 1 / span 6; position: sticky; top: calc(var(--proto-h) + var(--space-5)); }
}
.lp-head { display: grid; gap: var(--space-3); }
.lp-head .t-h1 { font-size: clamp(32px, 4vw, 40px); }

/* How it works ---------------------------------------------------- */
.lp-steps { display: grid; }
.lp-steps li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--space-4); padding-block: var(--space-5); border-top: var(--hairline); }
.lp-steps li:first-child { border-top: 0; padding-top: 0; }
.lp-steps li > div { display: grid; gap: var(--space-2); }
.lp-steps__n { font-family: var(--font-sans); font-weight: 400; font-size: var(--fs-28); line-height: 1; color: var(--ink-3); }

/* Plans ------------------------------------------------------------ */
.lp-plans { display: grid; gap: var(--space-6); }
@media (min-width: 1200px) { .lp-plans { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; } }
.lp-table { width: 100%; border-collapse: collapse; }
.lp-table th, .lp-table td { padding: var(--space-4) 0; border-bottom: var(--hairline); text-align: left; vertical-align: baseline; }
.lp-table td, .lp-table thead th:not(:first-child) { text-align: right; padding-left: var(--space-4); }
.lp-table thead th { font-size: var(--fs-12); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); padding-top: 0; }
.lp-table tbody th { font-weight: 400; }
.lp-table tbody th > span { display: block; }
.lp-table tbody th > span + span { margin-top: 2px; }
.lp-table td.t-h3 { white-space: nowrap; }
@media (max-width: 480px) { .lp-table__per { display: none; } }

.lp-teaser { display: grid; gap: var(--space-3); }
.lp-teaser__head { display: grid; gap: var(--space-1); }
.lp-teaser__sum { display: flex; justify-content: space-between; align-items: baseline; padding-top: var(--space-3); border-top: var(--hairline); }
.lp-teaser [data-teaser-note] { min-height: 1.45em; }
.lp-teaser [data-teaser-note].is-save { color: var(--accent-text); }   /* accent: the savings line */

/* Busy map ----------------------------------------------------------- */
.lp-map { display: grid; gap: var(--space-5); }
@media (min-width: 720px) { .lp-map { grid-template-columns: minmax(0, 360px) minmax(0, 1fr); align-items: start; } }
.lp-map__map { border: var(--hairline); border-radius: var(--radius-card); max-width: 420px; }
.lp-map__map .pin { pointer-events: none; }
.lp-map__list .row { min-height: 52px; padding-block: var(--space-2); }
.lp-caption { margin-top: calc(-1 * var(--space-3)); }

/* Two short columns ---------------------------------------------- */
.lp-two { display: grid; gap: var(--space-6); }
.lp-two > div { display: grid; gap: var(--space-2); align-content: start; }
@media (min-width: 720px) { .lp-two { grid-template-columns: 1fr 1fr; } }

/* For cafés ------------------------------------------------------------ */
.lp-points { display: grid; gap: 0; margin: 0; }
.lp-points > div { display: grid; gap: var(--space-1); padding-block: var(--space-4); border-top: var(--hairline); }
.lp-points > div:first-child { border-top: 0; padding-top: 0; }
.lp-points dd { margin: 0; }
@media (min-width: 720px) {
  .lp-points { grid-template-columns: 1fr 1fr; column-gap: var(--space-6); }
  .lp-points > div:nth-child(2) { border-top: 0; padding-top: 0; }
}

.lp-partner { display: grid; gap: var(--space-7); }
@media (min-width: 1200px) { .lp-partner { grid-template-columns: 1fr 1fr; gap: var(--space-6); align-items: start; } }

.lp-est { display: grid; gap: var(--space-5); }
.lp-est > p.t-small { margin-top: calc(-1 * var(--space-4)); }
.lp-est__out { display: grid; gap: var(--space-1); padding-top: var(--space-4); border-top: var(--hairline); }
.lp-est__total { font-size: clamp(40px, 6vw, 56px); color: var(--primary); }

.lp-slider { display: grid; gap: var(--space-2); }
.lp-slider__top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.lp-slider__top output { font-size: var(--fs-14); color: var(--ink-2); }
.lp-slider__ends { display: flex; justify-content: space-between; }
.lp-slider input[type="range"] {
  width: 100%;
  height: var(--tap);
  margin: 0;
  background: transparent;
  accent-color: var(--primary);
  cursor: pointer;
}

/* Forms -------------------------------------------------------------- */
.lp-form-wrap { display: grid; gap: var(--space-5); align-content: start; }
.lp-form-wrap--narrow { max-width: 560px; }
.lp-form { display: grid; gap: var(--space-4); }
.lp-form__send { display: grid; gap: var(--space-2); margin-top: var(--space-2); }
.lp-thanks { display: grid; justify-items: start; gap: var(--space-3); padding: var(--space-6); background: var(--surface); border: var(--hairline); border-radius: var(--radius-card); }
.lp-thanks .check-draw { width: 56px; height: 56px; color: var(--primary); }
.lp-thanks .btn--link { padding-inline: 0; }

/* FAQ accordion ----------------------------------------------------- */
.lp-faq { border-top: var(--hairline); }
.lp-faq__item { border-bottom: var(--hairline); }
.lp-faq__q { font: inherit; }
.lp-faq__q button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  width: 100%;
  min-height: 64px;
  padding-block: var(--space-4);
  text-align: left;
  font-size: var(--fs-16);
  font-weight: 500;
  color: var(--ink);
}
.lp-faq__q svg { flex: none; color: var(--ink-3); transition: transform var(--dur-2) var(--ease); }
.lp-faq__q button[aria-expanded="true"] svg { transform: rotate(180deg); }
.lp-faq__q button:hover span { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.lp-faq__a { padding-bottom: var(--space-5); }
.lp-faq__a:not([hidden]) { animation: enter var(--dur-2) var(--ease) both; }

/* Footer ------------------------------------------------------------- */
.lp-footer { margin-top: var(--space-8); border-top: var(--hairline); background: var(--surface); }
.lp-footer__inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4); padding-block: var(--space-6) calc(var(--space-6) + env(safe-area-inset-bottom)); }
.lp-footer__links { display: flex; gap: var(--space-4); }
.lp-footer__links a { color: var(--ink-2); }

/* Plan types (Pass 7) */
.lp-types { display: grid; gap: var(--space-4); margin: 0; }
.lp-types > div { display: grid; gap: var(--space-1); }
.lp-types dd { margin: 0; }
@media (min-width: 720px) { .lp-types { grid-template-columns: 1fr 1fr; column-gap: var(--space-6); } }

/* Brand logos (inline SVG, see ui.logo) */
.lp .landing-nav .wordmark { width: 120px; }
.lp-hero__mark { width: clamp(160px, 22vw, 240px); margin-bottom: var(--space-3); }
.lp-footer .wordmark { width: 120px; }

</style>

  /* Members --------------------------------------------------------------
     Two plan types:
       explorer  one pool of cups for any café, at most 2 a cycle at each

     Mumtaz is the demo member. The others exist so the café view (Kiln &
     Bean) can show a realistic month and every rule:
       Bilal  — Explorer, already 2 cups at Kiln & Bean this month (cap)
       Sana   — My cafés: Kiln & Bean 6, Maple Roastery 4 (3 + 3 left)
       Omar   — Explorer Starter, first visit to Kiln & Bean today
       Zara   — My cafés, 2 cups at Kiln & Bean today (daily limit)
       Hamza  — Explorer Starter, no cups left                          */
  const cycleStart = startOfDay(now) - 9 * DAY; // seeded members’ month started 9 days ago
  const cycleOf = (id) => `c_${id}_seed`;

  const mumtaz = {
    id: "m_ayesha",            // internal id kept from an earlier name

    demo("m_omar",  "Omar",  "him",  { type: "explorer", tierId: "starter" },  "558190", { kiln: 1, noon: 2, slowpour: 2, thirdfloor: 1 }, 356),
    demo("m_zara",  "Zara",  "her",  { type: "mycafes", allocation: { kiln: 6, ember: 4 } }, "482913", { kiln: 4, ember: 2 }, 418),

  // Small seeded PRNG. Seeded by date, so every open window builds the same month.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const startOfToday = startOfDay(now);
  const today = new Date(startOfToday);
  const rand = mulberry32(today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate());

  /* Background regulars: they fill each café’s month. No codes, so they

      const n = 1 + Math.floor(rand() * 3);
      while (Object.keys(allocation).length < n) allocation[pick(POPULAR)] = 2 + Math.floor(rand() * 5);
      let total = Object.values(allocation).reduce((a, b) => a + b, 0);
      const first = Object.keys(allocation)[0];
      if (total < rules.minCupsTotal) allocation[first] += rules.minCupsTotal - total;
      plan = { type: "mycafes", allocation };

  /* Ledger ----------------------------------------------------------------
     Append-only. Every change to a member’s cups is one entry:
       { id, type: purchase|redeem|gift|expire, memberId, cafeId|null,
         cups (signed: purchase +, everything else −), at, cycle }
     Redeem entries also carry drinkId, credits and firstVisit, so the
     café’s redemption list is read straight from the ledger.
     // BACKEND: this becomes a Supabase table (ledger), insert-only.   */
  const ledger = [];
  let seq = 0;
  const tierCups = (id) => tiers.find((t) => t.id === id).cups;
  const brandPlanCups = (plan) => brands.find((b) => b.id === plan.brandId).plans.find((x) => x.id === plan.planId).cups;
  function purchase(m) {
    const at = m.cycleStartedAt;
    if (m.plan.type === "brand") ledger.push({ id: `s${seq++}`, type: "purchase", memberId: m.id, cafeId: null, brandId: m.plan.brandId, cups: brandPlanCups(m.plan), at, cycle: m.cycle });
    else if (m.plan.type === "explorer") ledger.push({ id: `s${seq++}`, type: "purchase", memberId: m.id, cafeId: null, cups: tierCups(m.plan.tierId), at, cycle: m.cycle });
    else Object.entries(m.plan.allocation).forEach(([cafeId, n]) => ledger.push({ id: `s${seq++}`, type: "purchase", memberId: m.id, cafeId, cups: n, at, cycle: m.cycle }));
  }
  members.forEach(purchase);

  const cafeById = Object.fromEntries(cafes.map((c) => [c.id, c]));
  const drinkCredits = (cafeId, drinkId) => cafeById[cafeId].drinks.find((d) => d.id === drinkId).credits;
  function redeem(m, cafeId, drinkId, at, firstVisit = false) {
    const credits = drinkCredits(cafeId, drinkId);
    ledger.push({ id: `s${seq++}`, type: "redeem", memberId: m.id, cafeId, cups: -credits, credits, drinkId, firstVisit, at, cycle: m.cycle });
  }
  /** A cup at a brand branch: one cup, the drink as served (hot or iced), its
      counter price and any top-up the member paid at the till. */
  const dsItem = (drinkId) => DS.menu.find((d) => d.id === drinkId);
  function brandRedeem(m, cafeId, drinkId, temp, at, firstVisit = false) {
    const d = dsItem(drinkId);
    const t = temp === "iced" ? (d.iced != null ? "iced" : "hot") : (d.hot != null ? "hot" : "iced");
    const price = d[t];
    ledger.push({ id: `s${seq++}`, type: "redeem", memberId: m.id, cafeId, brandId: DS.id, cups: -1, credits: 1, drinkId, temp: t, price,
      topUp: Math.max(0, price - DS.economics.coverUpTo), firstVisit, at, cycle: m.cycle });
  }

  /* Mumtaz’s earlier months --------------------------------------------
     She joined three months before this cycle on My cafés (Kiln & Bean 6,
     Noon Café 4, Slow Pour 3), used 12 of 13 cups each month, then
     switched to Explorer Regular when this cycle began. The Club tab
     (status, passport, badges) reads all of it from the ledger.        */
  const clockAgo = (d, h, m = 0) => startOfToday - d * DAY + (h * 60 + m) * MIN;
  const monthsBefore = (ts, n) => { const d = new Date(ts); d.setMonth(d.getMonth() - n); return d.getTime(); };
  (function mumtazHistory() {
    const plan = { kiln: 6, noon: 4, slowpour: 3 };
    // [day in cycle, café, drink, hour, minute]; two Noon cups a month before 9 am

      [1, "kiln", "kiln-flat", 10, 30], [3, "noon", "noon-capp", 8, 10], [5, "kiln", "kiln-cort", 13, 15],
      [7, "slowpour", "sp-v60", 18, 20], [9, "kiln", "kiln-flat", 16, 40], [11, "noon", "noon-latte", 8, 35],

      const start = startOfDay(monthsBefore(mumtaz.cycleStartedAt, k));
      const end = k === 1 ? mumtaz.cycleStartedAt : startOfDay(monthsBefore(mumtaz.cycleStartedAt, k - 1));
      const cycle = `c_m_ayesha_past${k}`;
      Object.entries(plan).forEach(([cafeId, n]) => ledger.push({ id: `s${seq++}`, type: "purchase", memberId: mumtaz.id, cafeId, cups: n, at: start + 9 * 60 * MIN, cycle }));

        ledger.push({ id: `s${seq++}`, type: "redeem", memberId: mumtaz.id, cafeId, cups: -1, credits: drinkCredits(cafeId, drinkId), drinkId, firstVisit: k === 3 && day <= 7, at: start + day * DAY + (h * 60 + m) * MIN, cycle });

      ledger.push({ id: `s${seq++}`, type: "expire", memberId: mumtaz.id, cafeId: "slowpour", cups: -1, at: end, cycle });

  const byId = Object.fromEntries(members.map((m) => [m.id, m]));
  const HISTORY = {

  /* Double Shot, this cycle. Mumtaz: 4 of 15 used at four branches (one

  const todayAt = (h, m, backoff) => Math.max(startOfToday + MIN, Math.min(clockAgo(0, h, m), now - backoff * MIN));
  const DS_HISTORY = {

  const handToday = {

      { memberId: "m_zara",   drinkId: "kiln-flat" },
      { memberId: "m_zara",   drinkId: "kiln-cort" },
      { memberId: "m_omar",   drinkId: "kiln-cort", firstVisit: true },
      { memberId: "m_bilal",  drinkId: "kiln-flat" },
      { memberId: "m_sana",   drinkId: "kiln-flat" },
    ],
  };

  /** n timestamps across a day’s open hours, weighted by busyByHour.
      Today: only the hours that have passed (counts stay fixed, so the
      demo looks the same at any hour; early on they bunch up).        */
  function dayTimes(cafe, dayStart, n, isToday) {
    const at = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return dayStart + (h * 60 + (m || 0)) * MIN; };
    let start = at(cafe.hours.open);
    let close = at(cafe.hours.close);
    if (close <= start) close += DAY;
    let end = isToday ? Math.min(now - 2 * MIN, close) : close;
    if (isToday && end - start < 60 * MIN) { start = Math.max(dayStart, now - 3 * 60 * MIN); end = now - 2 * MIN; }
    if (end <= start) start = end - 30 * MIN;
    const slots = [];
    let total = 0;
    for (let t = start; t < end; ) {
      const next = new Date(t); next.setMinutes(60, 0, 0);
      const stop = Math.min(end, next.getTime());
      const w = Math.max(0.08, cafe.busyByHour[new Date(t).getHours() - 8] ?? 0.1) * (stop - t);
      slots.push({ t, stop, w }); total += w; t = stop;
    }
    return Array.from({ length: n }, () => {
      let u = rand() * total;
      const slot = slots.find((s) => (u -= s.w) <= 0) || slots[slots.length - 1];
      return Math.round(slot.t + rand() * (slot.stop - slot.t));
    }).sort((a, b) => a - b);
  }

  /* Regulars’ month so far, generated under the real rules: balance,
     2 a day per café, Explorer 2 a cycle per café, My cafés only where
     reserved.                                                         */
  (function generateMonth() {
    const left = {};      // memberId -> pool left (explorer) or { cafeId: left } (mycafes)
    const usedHere = {};  // memberId -> { cafeId: cups this cycle }
    regulars.forEach((m) => {
      left[m.id] = m.plan.type === "explorer" ? tierCups(m.plan.tierId) : { ...m.plan.allocation };
      usedHere[m.id] = {};
    });
    const canUse = (m, cafeId, credits, today) => {
      if ((today[m.id]?.[cafeId] || 0) + credits > rules.dailyLimitPerCafe) return false;
      if (m.plan.type === "mycafes") return (left[m.id][cafeId] || 0) >= credits;
      return left[m.id] >= credits && (usedHere[m.id][cafeId] || 0) + credits <= rules.explorerCapPerCafe;
    };
    const use = (m, cafeId, credits, today) => {
      if (m.plan.type === "mycafes") left[m.id][cafeId] -= credits; else left[m.id] -= credits;
      usedHere[m.id][cafeId] = (usedHere[m.id][cafeId] || 0) + credits;
      today[m.id] = today[m.id] || {};
      today[m.id][cafeId] = (today[m.id][cafeId] || 0) + credits;
    };
    for (let d = 9; d >= 0; d--) {
      const dayStart = startOfToday - d * DAY;
      const isToday = d === 0;
      const todayUse = {};
      cafes.filter((c) => !c.brandId).forEach((cafe) => {
        const hand = isToday ? (handToday[cafe.id] || []) : [];
        const handCups = hand.reduce((n, s) => n + drinkCredits(cafe.id, s.drinkId), 0);
        // A normal day wobbles around the café’s average
        let target = Math.max(0, Math.round(cafe.avgDailyCups * (0.75 + rand() * 0.5)) - handCups);
        if (isToday) target = Math.max(0, cafe.avgDailyCups - handCups); // fixed, so today looks the same all day
        const oneCup = cafe.drinks.filter((x) => x.credits === 1);
        const twoCup = cafe.drinks.filter((x) => x.credits > 1);
        const rows = hand.map((s) => ({ m: byId[s.memberId], drinkId: s.drinkId, firstVisit: !!s.firstVisit }));
        let cups = 0, guard = 0;
        while (cups < target && guard++ < 400) {
          const m = pick(regulars);
          const drink = twoCup.length && rand() < 0.08 ? pick(twoCup) : pick(oneCup);
          if (!canUse(m, cafe.id, drink.credits, todayUse)) continue;
          use(m, cafe.id, drink.credits, todayUse);
          const first = !(m.visits[cafe.id] > 0) && rand() < 0.35;
          m.visits[cafe.id] = (m.visits[cafe.id] || 0) + 1;
          rows.push({ m, drinkId: drink.id, firstVisit: first });
          cups += drink.credits;
        }
        for (let i = rows.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [rows[i], rows[j]] = [rows[j], rows[i]]; }
        const times = dayTimes(cafe, dayStart, rows.length, isToday);
        rows.forEach((r, i) => redeem(r.m, cafe.id, r.drinkId, times[i], r.firstVisit));
      });
    }
  })();

  /* Double Shot regulars: 90 members on Double Shot plans, generated under
     the real rules (cups from the brand pool, 2 a day per branch), around
     each branch's average day. Drinks weighted towards what sells.      */
  const DS_POPULAR = [
    ["ds-spanish", 10], ["ds-latte", 8], ["ds-americano", 6], ["ds-flat-white", 5], ["ds-cappuccino", 5], ["ds-caramel", 5],
    ["ds-mocha-101", 4], ["ds-matcha", 4], ["ds-caramel-f", 4], ["ds-cortado", 3], ["ds-vanilla", 3], ["ds-hazelnut", 3], ["ds-chai", 3],
    ["ds-honey", 2], ["ds-toffee-nut", 2], ["ds-dark-latte", 2], ["ds-salted-caramel", 2], ["ds-pistachio", 2], ["ds-java-chip", 2],
    ["ds-v60", 2], ["ds-choc-classic", 2], ["ds-peach-tea", 2], ["ds-espresso", 2], ["ds-kunafa", 1], ["ds-ube-latte", 1], ["ds-frosted-toffee", 1], ["ds-coconut-latte", 1],
  ];
  const DS_WEIGHT = DS_POPULAR.reduce((n, [, w]) => n + w, 0);
  const pickDrink = () => { let u = rand() * DS_WEIGHT; return (DS_POPULAR.find(([, w]) => (u -= w) <= 0) || DS_POPULAR[0])[0]; };
  const dsRegulars = Array.from({ length: 90 }, (_, i) => {
    const firstName = REGULAR_NAMES[(i * 7 + 3) % REGULAR_NAMES.length];
    const id = `m_d${i}_${firstName.toLowerCase()}`;
    const u = rand();
    const plan = { type: "brand", brandId: DS.id, planId: u < 0.3 ? "ds8" : u < 0.8 ? "ds15" : "ds22" };
    const m = { id, firstName, lastName: `${INITIALS[(i + 5) % INITIALS.length]}.`, pronoun: "them", plan, background: true, visits: {},
      cycle: cycleOf(id), cycleStartedAt: cycleStart, renewsAt: cycleStart + 30 * DAY };
    members.push(m); byId[id] = m; purchase(m);
    return m;
  });
  (function generateBrandMonth() {
    const branches = cafes.filter((c) => c.brandId === DS.id);
    const left = Object.fromEntries(dsRegulars.map((m) => [m.id, brandPlanCups(m.plan)]));
    for (let d = 9; d >= 0; d--) {
      const dayStart = startOfToday - d * DAY;
      const isToday = d === 0;
      const todayUse = {};
      branches.forEach((cafe) => {
        const target = isToday ? cafe.avgDailyCups : Math.round(cafe.avgDailyCups * (0.75 + rand() * 0.5));
        const rows = [];
        let guard = 0;
        while (rows.length < target && guard++ < 600) {
          const m = pick(dsRegulars);
          const k = `${m.id}:${cafe.id}`;
          if (left[m.id] < 1 || (todayUse[k] || 0) >= rules.dailyLimitPerCafe) continue;
          left[m.id] -= 1; todayUse[k] = (todayUse[k] || 0) + 1;
          const drinkId = pickDrink();
          const item = dsItem(drinkId);
          const temp = item.hot != null && item.iced != null ? (rand() < 0.55 ? "iced" : "hot") : item.hot != null ? "hot" : "iced";
          const first = !(m.visits[cafe.id] > 0);
          m.visits[cafe.id] = (m.visits[cafe.id] || 0) + 1;
          rows.push({ m, drinkId, temp, first });
        }
        const times = dayTimes(cafe, dayStart, rows.length, isToday);
        rows.forEach((r, i) => brandRedeem(r.m, cafe.id, r.drinkId, r.temp, times[i], r.first));
      });
    }
  })();

  ledger.sort((a, b) => a.at - b.at);

  // Mumtaz’s lifetime visits per café (café-detail loyalty), straight from her ledger
  mumtaz.visits = {};
  ledger.filter((e) => e.memberId === mumtaz.id && e.type === "redeem").forEach((e) => { mumtaz.visits[e.cafeId] = (mumtaz.visits[e.cafeId] || 0) + 1; });
  mumtaz.cafesTried = Object.keys(mumtaz.visits);

  /* The club ---------------------------------------------------------------
     Status, passport and badges are earned by use and computed from the
     ledger in state.js (select.club). Only the rules live here.         */
  const saturdayFrom = (ts, dir) => { const d = new Date(startOfDay(ts)); while (d.getDay() !== 6) d.setDate(d.getDate() + dir); return d.getTime(); };
  const club = {
    foundingLimit: 500,         // the first 500 member numbers are Founding Members
    membersIssued: 486,         // the next new member gets No. 0487. BACKEND: a sequence
    // Free cup when the passport reaches these counts ("all" = every partner café)
    passportRewards: [5, "all"],
    inviteReward: 1,            // cups each, for the member and the friend they invite
    levels: [
      { id: "member",      name: "Member",      plural: "Members",      cups: 0,   cafes: 0,  line: "Everyone starts here." },
      { id: "local",       name: "Local",       plural: "Locals",       cups: 30,  cafes: 0,  line: "30 cups with the club." },
      { id: "connoisseur", name: "Connoisseur", plural: "Connoisseurs", cups: 100, cafes: 10, line: null }, // 10 cafés, or every partner café while there are fewer (line is written in select.club)
    ],
    // metric: cups | founding | cafes | morning (cups before 9 am) | area:<id>; goal "all" = every partner café
    badges: [
      { id: "first-cup",  name: "First cup",       how: "Have your first cup with the club.",   metric: "cups",         goal: 1 },
      { id: "founding",   name: "Founding Member", how: "One of the first 500 members.",        metric: "founding",     goal: 1 },
      { id: "explorer",   name: "Explorer",        how: "Have a cup at 5 different cafés.",     metric: "cafes",        goal: 5 },
      { id: "all-lahore", name: "All of Lahore",   how: "Have a cup at every partner café.",    metric: "cafes",        goal: "all" },
      { id: "morning",    name: "Morning person",  how: "10 cups before 9 am.",                 metric: "morning",      goal: 10 },
      { id: "gulberg",    name: "Gulberg local",   how: "10 cups at cafés in Gulberg.",         metric: "area:gulberg", goal: 10 },
      { id: "dha",        name: "DHA local",       how: "10 cups at cafés in DHA.",             metric: "area:dha",     goal: 10 },
      { id: "familiar",   name: "Familiar face",   how: "50 cups with the club.",               metric: "cups",         goal: 50 },
      { id: "first-light", name: "First light",    how: "30 cups before 9 am.",                 metric: "morning",      goal: 30 },
    ],
    // Funded by each café, not by plans. for: local (Local and up) | connoisseur | founding
    perks: [
      { id: "kiln-shot",      cafeId: "kiln",     for: "local",       text: "An extra shot in any drink, on the house" },
      { id: "kiln-pastry",    cafeId: "kiln",     for: "connoisseur", text: "A free pastry with your coffee, once a week" },
      { id: "noon-refill",    cafeId: "noon",     for: "local",       text: "A free refill on filter coffee" },
      { id: "ember-croissant", cafeId: "ember",   for: "local",       text: "Half-price croissants before 10 am" },
      { id: "slowpour-first", cafeId: "slowpour", for: "connoisseur", text: "The first pour of every new single origin" },
      { id: "maple-beans",    cafeId: "maple",    for: "founding",    text: "A bag of the house roast on your club anniversary" },
    ],
    // BACKEND: gatherings and RSVPs become tables (gatherings, rsvps); seats are enforced server-side
    gatherings: [
      {
        id: "gather-maple-cupping",
        kind: "Club morning",
        title: "Cupping at Maple Roastery",
        cafeId: "maple",
        at: saturdayFrom(now + 14 * DAY, 1) + 9 * 60 * MIN,
        seats: 30,
        taken: 19,                // RSVPs before this session
        priorityDays: 7,          // Founding Members and Connoisseurs book first; everyone else from a week before
        line: "Six coffees from three origins, tasted side by side with Maple’s roaster. Tea and something baked after.",
      },
      {
        id: "gather-slowpour-brew",
        kind: "Club evening",
        title: "Brew bar at Slow Pour",
        cafeId: "slowpour",
        at: saturdayFrom(now - 14 * DAY, -1) + 18 * 60 * MIN,
        seats: 24,
        came: 22,
        line: "Three brew methods, one coffee, and a long argument about which was best.",
      },
    ],
  };

  /* Partner settings (café view) ------------------------------------------
     Kiln & Bean is the demo café, so it has real-looking settings. Other
     cafés get defaults in state.js. Staff PINs are demo knowledge:
     Bilal 1234, Hira 5678, Saad 2468.
     // BACKEND: partner_settings, partner_staff and payouts tables     */
  const monthStart = (n) => { const d = new Date(startOfToday); d.setDate(1); d.setMonth(d.getMonth() - n); return d.getTime(); };
  const partner = {
    kiln: {
      staff: [
        { id: "st_bilal", name: "Bilal", role: "counter", pin: "1234" },
        { id: "st_hira",  name: "Hira",  role: "counter", pin: "5678" },
        { id: "st_saad",  name: "Saad",  role: "owner",   pin: "2468" },
      ],
      staffOnShift: "st_bilal",
      covers: { categories: ["espresso", "milk", "filter", "tea"], size: "regular", extrasPaid: true },
      limits: { cafePerDay: 40, perMemberPerDay: rules.dailyLimitPerCafe },
      account: { label: "bank account", last4: "4821" },
      payoutDay: 5,
      // Last three months, oldest last. Paid on the 5th of the next month.
      payouts: [
        { month: monthStart(1), cups: 248, paidAt: monthStart(0) + 4 * DAY },
        { month: monthStart(2), cups: 231, paidAt: monthStart(1) + 4 * DAY },
        { month: monthStart(3), cups: 204, paidAt: monthStart(2) + 4 * DAY },
      ],
    },
  };
  // Double Shot branches: staff PINs per branch (presenter knowledge): the
  // branch's number in the list, then 234 (counter) or 678 (manager).
  // Gulberg 1234 / 1678, Cantt 2234 / 2678, Model Town 3234 / 3678, Phase 6
  // 4234 / 4678, Lalak Jan 5234 / 5678, Pine Avenue 6234 / 6678, Dolmen 7234 / 7678.
  // Payouts go to one head-office account; the statement splits by branch.
  const DS_STAFF = [["Usman", "Hira"], ["Faraz", "Amna"], ["Danish", "Rida"], ["Saad", "Mahnoor"], ["Taimur", "Iqra"], ["Hamid", "Sara"], ["Ali", "Noor"]];
  const DS_AVG_PAYOUT = [552, 547, 549, 556, 551, 545, 558]; // Rs a cup, from each branch's drink mix
  cafes.filter((c) => c.brandId === DS.id).forEach((c, i) => {
    const n = i + 1;
    const [counter, manager] = DS_STAFF[i];
    partner[c.id] = {
      staff: [
        { id: `st_${c.id}_c`, name: counter, role: "counter", pin: `${n}234` },
        { id: `st_${c.id}_m`, name: manager, role: "manager", pin: `${n}678` },
      ],
      staffOnShift: `st_${c.id}_c`,
      covers: { categories: ["espresso", "milk", "filter", "tea", "cold"], size: "any", extrasPaid: true },
      limits: { cafePerDay: c.avgDailyCups * 10, perMemberPerDay: rules.dailyLimitPerCafe },
      account: { label: "Double Shot head office account", last4: "7302" },
      payoutDay: 5,
      payouts: [1, 2, 3].map((k) => {
        const cups = Math.round(c.avgDailyCups * 30 * (1.02 - k * 0.11));
        return { month: monthStart(k), cups, amount: cups * DS_AVG_PAYOUT[i], paidAt: monthStart(k - 1) + 4 * DAY };
      }),
    };
  });

  // What a member cup can cover; each café ticks its own
  const drinkCategories = [
    { id: "espresso", name: "Espresso and americano" },
    { id: "milk",     name: "Milk drinks: latte, flat white, cortado" },
    { id: "filter",   name: "Filter and pour-over" },
    { id: "tea",      name: "Chai and tea" },
    { id: "cold",     name: "Cold drinks" },
  ];

  LCC.data = {
    seededAt: now,
    rules,
    tiers,
    areas,
    brands,
    cafes,
    members,
    memberId: mumtaz.id,
    partnerCafeId: "ds-gulberg", // the café shown in the partner view: Double Shot Gulberg
    ledger,
    club,
    partner,
    drinkCategories,
    // Builder default for the “My cafés” plan
    builderDraft: { kiln: 4, slowpour: 2, noon: 2 },
  };
})();
