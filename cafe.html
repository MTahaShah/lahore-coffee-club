    // Tab bar
    home: '<path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1v-8.5z"/>',
    store: '<path d="M4 9.5L5.5 4h13L20 9.5M4 9.5h16M4 9.5a2.67 2.67 0 0 0 5.33 0 2.67 2.67 0 0 0 5.34 0A2.67 2.67 0 0 0 20 9.5M5.5 12.5V20h13v-7.5M10 20v-4.5h4V20"/>',
    qr: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2.5v2.5H14zM17.5 17.5H20V20h-2.5zM14 20h1M20 14v1"/>',
    map: '<path d="M9 5L4 7v12l5-2 6 2 5-2V5l-5 2-6-2zM9 5v12M15 7v12"/>',
    award: '<circle cx="12" cy="9" r="5"/><path d="M9 13.2L7.5 20l4.5-2.5 4.5 2.5-1.5-6.8"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    pin: '<path d="M12 20.5s6-5.6 6-10.5a6 6 0 0 0-12 0c0 4.9 6 10.5 6 10.5z"/><circle cx="12" cy="10" r="2"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
    wallet: '<path d="M4 7.5A1.5 1.5 0 0 1 5.5 6H18v3"/><rect x="4" y="9" width="16" height="10" rx="1.5"/><path d="M16 14h.01"/>',
    card: '<rect x="3.5" y="6" width="17" height="12" rx="1.5"/><path d="M3.5 10h17M7 15h3"/>',
    gift: '<rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5V20h14v-7.5M12 8.5V20M12 8.5C10.5 5.5 7 5 7 7.25S10 8.5 12 8.5zM12 8.5c1.5-3 5-3.5 5-1.25S14 8.5 12 8.5z"/>',
    calendar: '<rect x="4" y="5.5" width="16" height="14" rx="1.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
    copy: '<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="1.5"/><path d="M15.5 8.5V5.5A1.5 1.5 0 0 0 14 4H5.5A1.5 1.5 0 0 0 4 5.5V14a1.5 1.5 0 0 0 1.5 1.5h3"/>',
    share: '<path d="M12 4v11M7.5 8.5L12 4l4.5 4.5M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/>',
    users: '<circle cx="9" cy="8.5" r="3.5"/><path d="M3 19.5c.6-3.3 3-5 6-5s5.4 1.7 6 5M15.5 5.3a3.5 3.5 0 0 1 0 6.4M17.5 14.8c1.8.7 3 2.3 3.5 4.7"/>',
    user: '<circle cx="12" cy="8.5" r="3.75"/><path d="M4.75 20c.9-3.75 3.75-5.75 7.25-5.75s6.35 2 7.25 5.75"/>',
    sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
    sun: '<circle cx="12" cy="12" r="3.5"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/>',
  };
  function icon(name, { size = 24, label } = {}) {
    const a11y = label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true" focusable="false"';
    return raw(
      `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ${a11y}>${ICON_PATHS[name] || ""}</svg>`
    );
  }

  /* Cup-level icon: how full the café is ---------------------------------
     Outline cup = quiet, half full = moderate, full = packed. Fill uses
     currentColor, so it inverts inside a selected (ink) segment.        */
  const CUP_BODY = "M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5V8z";
  const CUP_FILL = {
    quiet: "",
    moderate: '<path d="M5 13.25h12V14a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5v-.75z" fill="currentColor" stroke="none"/>',
    packed: `<path d="${CUP_BODY}" fill="currentColor" stroke="none"/>`,
  };
  function cupIcon(status, { size = 16, cls = "status__icon" } = {}) {
    return raw(
      `<svg class="${cls}" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">` +
        `${CUP_FILL[status] || ""}<path d="${CUP_BODY}"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/></svg>`
    );
  }

  /* Logos ----------------------------------------------------------------
     The real SVGs from src/logos/, inlined by build.sh as
     <template id="logo-NAME">. Their fills read --logo-ink, --logo-face,
     --logo-side and --logo-top, so CSS sets the colours (ink for type, coffee tones for bricks).
     name: wordmark | monogram-horizontal | ring | app-icon-mark          */
  const logoCache = {};
  function logo(name, { label = "Lahore Coffee Club", cls = "" } = {}) {
    if (!(name in logoCache)) {
      const tpl = document.getElementById(`logo-${name}`);
      logoCache[name] = tpl
        ? tpl.innerHTML.trim().replace(/\s(role|aria-label)="[^"]*"/g, "").replace("<svg ", '<svg aria-hidden="true" focusable="false" ')
        : null;
    }
    const svg = logoCache[name];
    const a11y = label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"';
    if (!svg) return raw(`<span class="logo logo--${name} logo--text ${cls}" ${a11y}>Lahore Coffee Club</span>`);
    return raw(`<span class="logo logo--${name} ${cls}" ${a11y}>${svg}</span>`);
  }

  /* Brick ring -----------------------------------------------------------
     The brand's signature graphic: one brick per cup on a ring, with one
     gap at 3 o'clock. Bricks run clockwise from the gap; the first `filled`
     are solid, the rest (used cups) are outlined. Flat in the interface.
     Colours come from CSS (.brick-ring: color for bricks, --brick-line). */
  function brickRing({ total = 0, filled = 0, size = 200, radius = 82, length = 22, twist = 14, cls = "", stagger = false } = {}) {
    const c = size / 2;
    if (!total) {
      return raw(`<svg class="brick-ring ${cls}" viewBox="0 0 ${size} ${size}" aria-hidden="true" focusable="false"><circle class="brick-ring__empty" cx="${c}" cy="${c}" r="${radius}"/></svg>`);
    }
    const slots = total + 1;                       // one empty slot: the gap at 3 o'clock
    const step = 360 / slots;
    const arc = (2 * Math.PI * radius) / slots;
    const width = Math.max(4, Math.min(length * 0.5, arc * 0.45));
    let out = "";
    for (let i = 0; i < total; i++) {
      const angle = (i + 1) * step;                // 0deg = 3 o'clock, clockwise in SVG
      const on = i < filled;
      out += `<g transform="translate(${c} ${c}) rotate(${angle.toFixed(2)}) translate(${radius} 0) rotate(${twist})">` +
        `<rect class="brick${on ? " is-full" : " is-used"}"${stagger && on ? ` style="--i:${i}"` : ""} x="${(-length / 2).toFixed(2)}" y="${(-width / 2).toFixed(2)}" width="${length}" height="${width.toFixed(2)}" rx="${Math.min(2.5, width / 3).toFixed(2)}"/></g>`;
    }
    return raw(`<svg class="brick-ring ${cls}" viewBox="0 0 ${size} ${size}" aria-hidden="true" focusable="false">${out}</svg>`);
  }

  /* Status pill --------------------------------------------------------- */
  /** Renders a pill bound to a café; it updates itself on store changes. */
  function statusPill(cafeId, { bare = false, time = true } = {}) {
    const cafe = store.select.cafe(cafeId);
    return html`<span class="status${bare ? " status--bare" : ""}" data-status="${cafe.status}" data-live-status="${cafeId}" data-live-time="${time ? "1" : "0"}">
      ${cupIcon(cafe.status)}
      <span class="status__label">${fmt.statusLabel(cafe.status)}</span>
      ${time ? html`<span class="status__time" data-rel-time="${cafe.statusUpdatedAt}" data-rel-prefix="updated">${fmt.updated(cafe.statusUpdatedAt)}</span>` : ""}
    </span>`;
  }

  function refreshStatusPills(cafeId, { flash = false } = {}) {
    const cafe = store.select.cafe(cafeId);
    $$(`[data-live-status="${cafeId}"]`).forEach((el) => {
      el.dataset.status = cafe.status;
      const ic = el.querySelector(".status__icon");
      if (ic) ic.outerHTML = cupIcon(cafe.status).s;
      const label = el.querySelector(".status__label");
      if (label) label.textContent = fmt.statusLabel(cafe.status);
      const t = el.querySelector("[data-rel-time]");
      if (t) { t.dataset.relTime = cafe.statusUpdatedAt; t.textContent = fmt.updated(cafe.statusUpdatedAt); }
      if (flash) { el.classList.remove("is-changed"); void el.offsetWidth; el.classList.add("is-changed"); }
    });
  }

  function refreshRelativeTimes() {
    $$("[data-rel-time]").forEach((el) => {
      const ts = Number(el.dataset.relTime);
      const prefix = el.dataset.relPrefix;
      el.textContent = prefix ? `${prefix} ${fmt.ago(ts)}` : fmt.ago(ts);
    });
  }

  store.on("cafe:status", ({ cafeId }) => refreshStatusPills(cafeId, { flash: true }));
  store.on("tick", refreshRelativeTimes);

  /* Number animation ---------------------------------------------------- */
  const running = new WeakMap();
  /** Count from the element’s current value to `to`. */
  function animateNumber(el, to, { format = fmt.num, duration = 420 } = {}) {
    if (!el) return;
    const from = Number(el.dataset.value ?? to);
    el.dataset.value = to;
    if (from === to || reducedMotion()) { el.textContent = format(to); return; }
    cancelAnimationFrame(running.get(el));
    const t0 = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const step = (now) => {
      const p = Math.min(1, (now - t0) / duration);
      el.textContent = format(Math.round(from + (to - from) * ease(p)));
      if (p < 1) running.set(el, requestAnimationFrame(step));
    };
    running.set(el, requestAnimationFrame(step));
  }

  /* Toast --------------------------------------------------------------- */
  function toast(message, { iconName = "check", duration = 2800, region } = {}) {
    const host = region || $(".phone__screen .toast-region") || $("#toast-region");
    if (!host) return;
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `${iconName ? icon(iconName, { size: 18 }) : ""}<span>${esc(message)}</span>`;
    host.appendChild(el);
    setTimeout(() => {
      el.classList.add("is-leaving");
      el.addEventListener("animationend", () => el.remove(), { once: true });
      setTimeout(() => el.remove(), 400);
    }, duration);
  }

  /* Bottom sheet -------------------------------------------------------
     Markup:
       <div class="sheet" id="x" role="dialog" aria-modal="true" aria-labelledby="x-title" aria-hidden="true">
         <div class="sheet__scrim" data-sheet-close></div>
         <div class="sheet__panel">
           <div class="sheet__handle" aria-hidden="true"></div>
           <div class="sheet__body">…</div>
         </div>
       </div>
     Opens with focus moved inside, closes on scrim, Escape, or drag down.  */
  const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])';
  const openSheets = [];

  function openSheet(sheet, { onClose } = {}) {
    if (!sheet || sheet.dataset.open === "true") return;
    sheet._returnFocus = document.activeElement;
    sheet._onClose = onClose;
    sheet.dataset.open = "true";
    sheet.setAttribute("aria-hidden", "false");
    openSheets.push(sheet);
    bindDrag(sheet);
    requestAnimationFrame(() => {
      const target = sheet.querySelector("[autofocus]") || sheet.querySelector(FOCUSABLE) || sheet.querySelector(".sheet__panel");
      if (target) { if (!target.hasAttribute("tabindex") && target.classList.contains("sheet__panel")) target.tabIndex = -1; target.focus({ preventScroll: true }); }
    });
  }

  function closeSheet(sheet) {
    if (!sheet || sheet.dataset.open !== "true") return;
    sheet.dataset.open = "false";
    sheet.setAttribute("aria-hidden", "true");
    sheet.style.removeProperty("--drag");
    const i = openSheets.indexOf(sheet);
    if (i > -1) openSheets.splice(i, 1);
    const back = sheet._returnFocus;
    if (back && document.contains(back)) back.focus({ preventScroll: true });
    if (typeof sheet._onClose === "function") sheet._onClose();
  }

  function bindDrag(sheet) {
    if (sheet._dragBound) return;
    sheet._dragBound = true;
    if (sheet.classList.contains("sheet--drawer")) { bindSwipe(sheet); return; }
    const handle = sheet.querySelector(".sheet__handle");
    if (!handle) return;
    let startY = 0, dy = 0, t0 = 0, active = false;
    handle.addEventListener("pointerdown", (e) => {
      active = true; startY = e.clientY; dy = 0; t0 = performance.now();
      sheet.classList.add("is-dragging");
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener("pointermove", (e) => {
      if (!active) return;
      dy = Math.max(0, e.clientY - startY);
      sheet.style.setProperty("--drag", `${dy}px`);
    });
    const end = () => {
      if (!active) return;
      active = false;
      sheet.classList.remove("is-dragging");
      const velocity = dy / Math.max(1, performance.now() - t0);
      if (dy > 96 || velocity > 0.6) closeSheet(sheet);
      else sheet.style.setProperty("--drag", "0px");
    };
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  }

  /* Side drawer (.sheet--drawer): swipe right on the panel to close.
     Vertical moves are left alone, so the drawer still scrolls. */
  function bindSwipe(sheet) {
    const panel = sheet.querySelector(".sheet__panel");
    let x0 = 0, y0 = 0, dx = 0, t0 = 0, mode = null; // null: undecided, "x": dragging, "y": scrolling
    panel.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse") return;
      x0 = e.clientX; y0 = e.clientY; dx = 0; t0 = performance.now(); mode = null;
    });
    panel.addEventListener("pointermove", (e) => {
      if (mode === "y" || e.pointerType === "mouse") return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (mode === null) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        mode = Math.abs(mx) > Math.abs(my) ? "x" : "y";
        if (mode === "x") { sheet.classList.add("is-dragging"); panel.setPointerCapture(e.pointerId); }
        return;
      }
      dx = Math.max(0, mx);
      sheet.style.setProperty("--drag", `${dx}px`);
    });
    const end = () => {
      if (mode !== "x") { mode = null; return; }
      mode = null;
      sheet.classList.remove("is-dragging");
      const velocity = dx / Math.max(1, performance.now() - t0);
      if (dx > 80 || velocity > 0.5) closeSheet(sheet);
      else sheet.style.setProperty("--drag", "0px");
    };
    panel.addEventListener("pointerup", end);
    panel.addEventListener("pointercancel", end);
  }

  document.addEventListener("click", (e) => {
    const closer = e.target.closest("[data-sheet-close]");
    if (closer) closeSheet(closer.closest(".sheet"));
    const opener = e.target.closest("[data-sheet-open]");
    if (opener) openSheet(document.getElementById(opener.dataset.sheetOpen));
  });

  document.addEventListener("keydown", (e) => {
    const top = openSheets[openSheets.length - 1];
    if (!top) return;
    if (e.key === "Escape") { e.preventDefault(); closeSheet(top); return; }
    if (e.key === "Tab") {
      const items = $$(FOCUSABLE, top).filter((el) => el.offsetParent !== null);
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* QR code (qrcode-generator from cdnjs) -----------------------------
     Returns SVG markup, or a fallback note when the library didn't load. */
  function qrSvg(payload, { fallback = "QR unavailable offline. Read the code below to the barista." } = {}) {
    if (typeof window.qrcode !== "function") return html`<div class="qr--fallback" style="height:100%">${fallback}</div>`.s;
    try {
      const qr = window.qrcode(0, "M");
      qr.addData(payload);
      qr.make();
      const n = qr.getModuleCount();
      let d = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
      return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" aria-hidden="true" focusable="false"><path d="${d}" fill="currentColor"/></svg>`;
    } catch (err) {
      console.warn("[LCC] QR render failed", err);
      return html`<div class="qr--fallback" style="height:100%">${fallback}</div>`.s;
    }
  }

  /* Stepper ------------------------------------------------------------- */
  function stepper({ id, value = 0, min = 0, max = 10, label }) {
    return html`<div class="stepper" role="group" aria-label="${label}" data-stepper="${id}" data-min="${min}" data-max="${max}">
      <button type="button" class="stepper__btn" data-step="-1" aria-label="One fewer" ${value <= min ? raw("disabled") : ""}>${icon("minus")}</button>
      <output class="stepper__value" aria-live="polite">${value}</output>
      <button type="button" class="stepper__btn" data-step="1" aria-label="One more" ${value >= max ? raw("disabled") : ""}>${icon("plus")}</button>
    </div>`;
  }
  /** Sync a rendered stepper with a new value. */
  function setStepper(el, value) {
    const min = Number(el.dataset.min), max = Number(el.dataset.max);
    el.querySelector(".stepper__value").textContent = value;
    el.querySelector('[data-step="-1"]').disabled = value <= min;
    el.querySelector('[data-step="1"]').disabled = value >= max;
  }

  /* Segmented control --------------------------------------------------- */
  function segmented({ name, options, value, label }) {
    const index = Math.max(0, options.findIndex((o) => o.value === value));
    return html`<div class="segmented" role="tablist" aria-label="${label}" data-segmented="${name}" style="--count:${options.length};--index:${index}">
      <span class="segmented__thumb" aria-hidden="true"></span>
      ${options.map((o) => html`<button type="button" role="tab" class="segmented__option" data-value="${o.value}" aria-selected="${o.value === value}" tabindex="${o.value === value ? 0 : -1}">${o.label}</button>`)}
    </div>`;
  }
  function selectSegment(group, value) {
    const opts = $$(".segmented__option", group);
    opts.forEach((o, i) => {
      const on = o.dataset.value === value;
      o.setAttribute("aria-selected", on);
      o.tabIndex = on ? 0 : -1;
      if (on) group.style.setProperty("--index", i);
    });
  }
  // Arrow keys move between segments (tablist pattern)
  document.addEventListener("keydown", (e) => {
    const opt = e.target.closest?.(".segmented__option");
    if (!opt || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
    const opts = $$(".segmented__option", opt.parentElement);
    const next = opts[(opts.indexOf(opt) + (e.key === "ArrowRight" ? 1 : -1) + opts.length) % opts.length];
    next.focus(); next.click();
  });

  LCC.ui = {
    html, raw, esc, $, $$, icon, logo, brickRing,
    cupIcon, statusPill, refreshStatusPills, refreshRelativeTimes,
    animateNumber, toast, openSheet, closeSheet, qrSvg,
    stepper, setStepper, segmented, selectSegment,
    reducedMotion,
  };
})();

</script>
<script>
/* ---- src/router.js ---- */
/* =====================================================================
   Lahore Coffee Club — router.js
   Hash routes:
     #/            landing
     #/app[/…]     member app (phone frame); sub-paths go to the app
     #/cafe[/…]    café partner view
     #/kit         component sheet (not in the switcher; for review)

   Surfaces register as:
     LCC.router.register("app", {
       title: "Member app",
       mount(el, path) { …; return cleanup },   // called on entering
       update(path) { … },                       // sub-path change only
     });
   The shells below are the Pass 1 defaults; later passes replace them.
   ===================================================================== */
(function () {
  "use strict";
  // The page's own title: "Lahore Coffee Club", or "LCC Cafés" in cafe.html
  const BASE_TITLE = document.title || "Lahore Coffee Club";
  const LCC = (window.LCC = window.LCC || {});
  const { store, fmt, ui } = LCC;
  const { html, raw, $, icon } = ui;

  const surfaces = {};
  let current = { name: null, cleanup: null };

  function register(name, def) {
    surfaces[name] = def;
    // Re-render if the surface being replaced is on screen
    if (current.name === name) { current.name = null; render(); }
  }

  function parse() {
    // “#/cafe?room=4821” -> cafe. The query belongs to sync.js.
    const clean = location.hash.replace(/^#\/?/, "").replace(/\?.*$/, "").replace(/\/+$/, "");
    const [name = "", ...path] = clean.split("/");
    return { name, path };
  }

  function navigate(to) {
    if (location.hash !== to) location.hash = to;
    else render();
  }

  function render() {
    const { name, path } = parse();
    if (!surfaces[name]) { history.replaceState(null, "", "#/"); return render(); }
    const main = $("#main");
    const def = surfaces[name];

    if (current.name === name && def.update) {
      def.update(path);
    } else {
      if (typeof current.cleanup === "function") current.cleanup();
      const firstLoad = current.name === null && !main.childElementCount;
      main.innerHTML = "";
      main.dataset.surface = name || "landing";
      current = { name, cleanup: def.mount(main, path) || null };
      window.scrollTo(0, 0);
      if (!firstLoad) main.focus({ preventScroll: true });
    }
    document.title = def.title ? `${def.title} · ${BASE_TITLE}` : BASE_TITLE;
    applyTheme(); // the flavour belongs to the member app only
    renderProtoBar(name);
  }

  /* -------------------------------------------------------------------
     Prototype switcher
     ------------------------------------------------------------------- */
  const SWITCH = [
    { name: "", href: "#/", label: "Landing" },
    { name: "app", href: "#/app", label: "Member app" },
    { name: "cafe", href: "#/cafe", label: "Café view" },
  ];
  const THEMES = ["auto", "light", "dark"];
  let theme = "auto"; // Light / Dark / Auto (follows the phone); in memory, as before

  /* Flavour: Coffee (default) or Matcha, for the member app only. The
     café view and landing stay coffee, so data-flavour is on <html> only
     while #/app is showing. Remembered on this device (CLAUDE.md:
     approved localStorage exception); any storage failure means Coffee. */
  const FLAVOUR_KEY = "lcc-flavour";
  let flavour = "coffee";
  try { if (localStorage.getItem(FLAVOUR_KEY) === "matcha") flavour = "matcha"; } catch (e) { /* Coffee */ }
  const FLAVOUR_SURFACES = ["app"];
  const darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  /** Point the phone's status bar at the page background. */
  function paintThemeColor() {
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    if (bg) document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute("content", bg));
  }
  /** Apply mode and flavour to <html>; fade colours unless it's the first paint. */
  function applyTheme({ fade = false } = {}) {
    const root = document.documentElement;
    if (fade && !ui.reducedMotion()) {
      root.classList.add("theme-fading");
      clearTimeout(applyTheme.t);
      applyTheme.t = setTimeout(() => root.classList.remove("theme-fading"), 320);
    }
    if (theme === "auto") root.removeAttribute("data-theme");
    else root.dataset.theme = theme;
    if (flavour === "matcha" && FLAVOUR_SURFACES.includes(current.name)) root.dataset.flavour = "matcha";
    else root.removeAttribute("data-flavour");
    paintThemeColor();
  }
  darkQuery?.addEventListener?.("change", paintThemeColor);

  function setMode(next) {
    if (!THEMES.includes(next) || next === theme) return;
    theme = next;
    applyTheme({ fade: true });
    renderProtoBar(parse().name);
  }
  function setFlavour(next) {
    if (!["coffee", "matcha"].includes(next) || next === flavour) return;
    flavour = next;
    try { localStorage.setItem(FLAVOUR_KEY, flavour); } catch (e) { /* this session only */ }
    applyTheme({ fade: true });
    document.dispatchEvent(new CustomEvent("lcc:flavour", { detail: { flavour } }));
  }

  function renderProtoBar(active) {
    const bar = $("#proto-bar");
    bar.className = "proto-bar";
    bar.setAttribute("aria-label", "Prototype navigation");
    bar.innerHTML = html`
      <span class="proto-bar__label">Prototype</span>
      <nav class="proto-bar__nav" aria-label="Surfaces">
        ${SWITCH.map((s) => html`<a class="proto-bar__link" href="${s.href}" ${s.name === active ? raw('aria-current="page"') : ""}>${s.label}</a>`)}
      </nav>
      <div class="proto-bar__end">
        <div class="proto-demo">
          <button type="button" class="proto-bar__theme" data-demo-toggle aria-expanded="false" aria-controls="proto-demo-menu">Demo</button>
          <div class="proto-demo__menu" id="proto-demo-menu" role="menu" aria-label="Presenter" hidden>
            <button type="button" role="menuitem" data-demo="new">Start as a new member</button>
            <button type="button" role="menuitem" data-demo="mumtaz">Back to Mumtaz’s demo</button>
          </div>
        </div>
        <button type="button" class="proto-bar__theme" data-theme-toggle aria-label="Colour theme: ${theme}. Change theme">
          ${theme === "auto" ? "Auto" : theme === "light" ? "Light" : "Dark"}
        </button>
      </div>`;
  }

  /* Presenter menu: start onboarding as a new member, or go back to Mumtaz */
  function demoMenu(open) {
    const btn = $("[data-demo-toggle]"), menu = $("#proto-demo-menu");
    if (!btn || !menu) return;
    btn.setAttribute("aria-expanded", String(open));
    menu.hidden = !open;
    if (open) menu.querySelector("[role=menuitem]").focus();
  }
  const withRoom = (h) => (LCC.sync ? LCC.sync.withRoom(h) : h);
  function demoAction(which) {
    demoMenu(false);

<script>
/* ---- src/sync.js ---- */
/* =====================================================================
   Lahore Coffee Club — sync.js
   Live sync between devices in the same demo "room".

     #/cafe?room=4821        café tablet
     #/app/pass?room=4821    member phone

   Two transports, both carrying the same small messages:
     1. BroadcastChannel  windows on the same computer (always on)
     2. Supabase Realtime Broadcast  other devices, over the internet.
        Broadcast only: no tables, nothing stored. If it can't connect
        the app carries on with (1) and says “Offline, this device only”.

   Messages: { v, id, from, type, data }. `from` is this window's sender
   id, so a window ignores its own messages; `id` de-duplicates a message
   that arrives over both transports. Incoming data goes through
   store.applyRemote(), which never re-sends, so there are no echo loops.

   What travels: café status, and ledger entries (redeem, purchase, expire,
   gift) with the plan header of any member whose plan changed. Entries are
   append-only with stable ids, so applying one twice is harmless.

   Join handshake: a window that joins says “hello”. A café window answers
   with statuses plus this session’s ledger entries and plan changes; any
   other window that has live entries answers with those (newest plan wins).

   Approved exception to “no backend” (see CLAUDE.md).
   // BACKEND: replace Broadcast with Supabase tables + Postgres Changes:
   //   cafe_status (cafe_id, status, updated_at), ledger (insert-only:
   //   purchase/redeem/gift/expire), subscriptions (member_id, plan, cycle,
   //   renews_at). Balances stay derived from the ledger. Rooms go away.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, ui } = LCC;
  const { html } = ui;

  // Publishable key: meant for browser code. Never put a secret key here.
  const SUPABASE_URL = "https://nfgqswdtaemhpmnrries.supabase.co";
  const SUPABASE_KEY = "sb_publishable_iZ_OxDTfGnMoQlWuPswSVA_iuizC6qZ";
  // Where a paired phone goes. Always the deployed site, so pairing works
  // even when the café window runs from this computer.
  const LIVE_URL = "https://lcc-omega.vercel.app/";
  const CONNECT_TIMEOUT_MS = 8000;
  const ROOM_RE = /^[A-Za-z0-9-]{1,32}$/;

  const sender = Math.random().toString(36).slice(2, 10);
  const seen = new Set(); // message ids already applied
  let status = "connecting"; // connecting | online | offline
  let channel = null;      // Supabase channel
  let bc = null;           // BroadcastChannel
  let timeout = null;

  /* -------------------------------------------------------------------
     Room: from the URL, else the last one this browser used, else new
     ------------------------------------------------------------------- */
  function roomFromHash() {
    const q = location.hash.split("?")[1];
    const r = q ? new URLSearchParams(q).get("room") : null;
    return r && ROOM_RE.test(r) ? r : null;
  }
  function remembered() {
    try { const r = localStorage.getItem("lcc-room"); return r && ROOM_RE.test(r) ? r : null; } catch (_) { return null; }
  }
  const room = roomFromHash() || remembered() || String(1000 + Math.floor(Math.random() * 9000));
  try { localStorage.setItem("lcc-room", room); } catch (_) { /* fine without it */ }

  /** Any in-app hash, with this room attached. */
  function withRoom(hash) {
    const [path, q] = String(hash || "#/").split("?");
    const params = new URLSearchParams(q || "");
    params.set("room", room);
    return `${path}?${params}`;
  }
  // Links inside the app drop the query; put the room back without a new history entry
  function ensureRoomInUrl() {
    if (roomFromHash() === room) return;
    history.replaceState(null, "", withRoom(location.hash || "#/"));
  }
  ensureRoomInUrl();
  window.addEventListener("hashchange", ensureRoomInUrl);

  /** Link a phone opens to join this room on the member pass (always the live site). */
  function pairUrl() {
    return `${LIVE_URL}${withRoom("#/app/pass")}`;
  }

  /* -------------------------------------------------------------------
     Sending and receiving
     ------------------------------------------------------------------- */
  const msgId = () => `${sender}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;

  function post(type, data) {
    const msg = { v: 1, id: msgId(), from: sender, type, data };
    seen.add(msg.id);
    if (bc) { try { bc.postMessage(msg); } catch (_) { /* ignore */ } }
    if (channel && status === "online") {
      channel.send({ type: "broadcast", event: "lcc", payload: msg }).catch?.(() => {});
    }
  }

  function receive(msg) {
    if (!msg || msg.v !== 1 || msg.from === sender || seen.has(msg.id)) return;
    seen.add(msg.id);
    if (seen.size > 1000) seen.delete(seen.values().next().value);
    if (msg.type === "hello") return answerHello();
    store.applyRemote(msg.type, msg.data);
  }

  const isCafeDevice = () => LCC.router?.parse().name === "cafe";
  function answerHello() {
    if (isCafeDevice()) post("snapshot", store.roomSnapshot({ statuses: true }));
    else if (store.hasLiveData()) post("snapshot", store.roomSnapshot({ statuses: false }));
  }

  // Everything the store wants shared goes out on both transports
  store.addTransport((type, data) => post(type, data));

  /* -------------------------------------------------------------------
     Transport 1: same computer
     ------------------------------------------------------------------- */
  try {
    if ("BroadcastChannel" in window) {
      bc = new BroadcastChannel(`lahore-coffee-club:${room}`);
      bc.onmessage = ({ data }) => receive(data);
    }
  } catch (_) { bc = null; }

  /* -------------------------------------------------------------------
     Transport 2: Supabase Realtime Broadcast
     ------------------------------------------------------------------- */
  function setStatus(next) {
    if (status === next) return;
    status = next;
    paintPills();
    store.emit("sync", { status, room }, { remote: true });
  }

  function connect() {
    const lib = window.supabase;
    if (!lib || typeof lib.createClient !== "function") { setStatus("offline"); return; }
    try {
      const client = lib.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      });
      // BACKEND: a private channel with RLS on realtime.messages, once members sign in
      channel = client.channel(`lcc-room-${room}`, { config: { broadcast: { self: false, ack: false } } });
      channel.on("broadcast", { event: "lcc" }, ({ payload }) => receive(payload));
      channel.subscribe((s) => {
        if (s === "SUBSCRIBED") {
          clearTimeout(timeout);
          setStatus("online");
          post("hello", {}); // so the café (or a newer member copy) fills this device in
        } else if (s === "CHANNEL_ERROR" || s === "TIMED_OUT" || s === "CLOSED") {
          setStatus("offline"); // supabase-js keeps retrying; SUBSCRIBED flips it back
        }
      });
      timeout = setTimeout(() => { if (status !== "online") setStatus("offline"); }, CONNECT_TIMEOUT_MS);
    } catch (err) {
      console.warn("[LCC] live sync unavailable; this device only", err);
      setStatus("offline");
    }
  }

  window.addEventListener("offline", () => setStatus("offline"));

  // Say hello on this computer straight away; the network hello follows on connect
  post("hello", {});
  connect();

  /* -------------------------------------------------------------------
     Quiet indicator: <span data-sync-pill> updates itself
     ------------------------------------------------------------------- */
  const LABELS = { connecting: "Connecting…", online: "Connected", offline: "Offline, this device only" };
  function pill() {
    return html`<span class="sync-pill" data-sync-pill data-state="${status}" role="status" title="Room ${room}">
      <span class="sync-pill__dot" aria-hidden="true"></span><span data-sync-label>${LABELS[status]}</span>
    </span>`;
  }
  function paintPills() {
    ui.$$("[data-sync-pill]").forEach((el) => {
      el.dataset.state = status;
      ui.$("[data-sync-label]", el).textContent = LABELS[status];
    });
  }

  LCC.sync = { room, sender, withRoom, pairUrl, pill, liveUrl: LIVE_URL, status: () => status };
})();

</script>

                  <button class="btn btn--secondary btn--block" type="button" data-sheet-open="kit-sheet">Open café sheet</button>
                  <button class="btn btn--ghost btn--block" type="button" data-kit-toast="Cup redeemed. 10 left.">Show toast</button>
                  <svg class="check-draw" data-kit-check viewBox="0 0 48 48" width="48" height="48" style="color:var(--primary);margin:var(--space-2) auto 0" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/><path d="M15 24.5l6 6 12-13" pathLength="1"/></svg>
                </div>
                <div class="sheet" id="kit-sheet" role="dialog" aria-modal="true" aria-labelledby="kit-sheet-title" aria-hidden="true">
                  <div class="sheet__scrim" data-sheet-close></div>
                  <div class="sheet__panel">
                    <div class="sheet__handle" aria-hidden="true"></div>
                    <div class="sheet__body stack" style="--stack-gap:var(--space-3)">
                      <h3 class="t-h2" id="kit-sheet-title">${kiln.name}</h3>
                      ${ui.statusPill("kiln")}
                      <p class="t-small t-muted">${kiln.blurb}</p>
                      <button class="btn btn--primary btn--block" type="button" data-sheet-close>Directions</button>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>`;

      // Builder
      const cupsEl = $("[data-kit-cups]", el), priceEl = $("[data-kit-price]", el), saveEl = $("[data-kit-savings]", el);
      const paintPrice = (animate) => {
        const p = store.select.customPrice();
        cupsEl.textContent = `${fmt.cups(p.cups)} a month`;
        if (animate) ui.animateNumber(priceEl, p.price, { format: fmt.rs }); else { priceEl.textContent = fmt.rs(p.price); priceEl.dataset.value = p.price; }
        saveEl.textContent = p.meetsMinimum ? `You save ${fmt.rs(p.savings)} vs paying at the counter` : `Add ${fmt.cups(p.cupsShort)} to reach the six-cup minimum`;
      };
      paintPrice(false);

      const onClick = (e) => {
        const step = e.target.closest("[data-step]");
        if (step) {
          const box = step.closest("[data-stepper]");
          const id = box.dataset.stepper;
          store.actions.setBuilderCups(id, (store.getState().builder[id] || 0) + Number(step.dataset.step));
          ui.setStepper(box, store.getState().builder[id] || 0);
        }
        const st = e.target.closest("[data-kit-status]");
        if (st) store.actions.setCafeStatus("kiln", st.dataset.kitStatus);
        const chip = e.target.closest("[data-kit-chip]");
        if (chip) chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed") !== "true");
        const tog = e.target.closest("[data-kit-toggle]");
        if (tog) tog.setAttribute("aria-checked", tog.getAttribute("aria-checked") !== "true");
        const seg = e.target.closest(".segmented__option");
        if (seg) ui.selectSegment(seg.parentElement, seg.dataset.value);
        const t = e.target.closest("[data-kit-toast]");
        if (t) {
          ui.toast(t.dataset.kitToast);
          const check = $("[data-kit-check]", el);
          const clone = check.cloneNode(true); check.replaceWith(clone); // replay draw
        }
      };
      el.addEventListener("click", onClick);

      const form = $("[data-kit-form]", el);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const field = $("#kit-name", el).closest(".field");
        const ok = $("#kit-name", el).value.trim().length > 0;
        field.dataset.invalid = String(!ok);
        $("#kit-name", el).setAttribute("aria-invalid", String(!ok));
        if (ok) ui.toast("Looks good.");
        else $("#kit-name", el).focus();
      });

      const offs = [
        store.on("builder", () => {
          paintPrice(true);
          $$("[data-kit-builder] [data-stepper]", el).forEach((box) => ui.setStepper(box, store.getState().builder[box.dataset.stepper] || 0));
        }),
        store.on("member", () => {
          const a = store.select.member();
          $("[data-kit-ayesha]", el).textContent = `${store.select.balance().left} of ${store.select.balance().total}`;
          $("[data-kit-plan]", el).textContent = planMeta();
        }),
        store.on("redeem", ({ member }) => {
          const a = store.select.member();
          if (member.id === a.id) $("[data-kit-ayesha]", el).textContent = `${store.select.balance().left} of ${store.select.balance().total}`;
        }),
        store.on("cafe:status", ({ cafeId, status }) => {
          if (cafeId !== "kiln") return;
          $$("[data-kit-status]", el).forEach((b) => b.setAttribute("aria-pressed", b.dataset.kitStatus === status));
        }),
      ];
      return () => { el.removeEventListener("click", onClick); offs.forEach((f) => f()); };
    },
  });
})();

</script>
<script>
/* ---- src/cafe.js ---- */
/* =====================================================================
   Lahore Coffee Club — cafe.js
   Café partner view (#/cafe). For the counter, the till and the books:
   calm, plain, big targets.

     Header   ring logo, café, area · staff on shift (PIN) · taking cups
     Counter  scan or enter a code, redeem, last 5 cups, busy level, pause
     Today    four numbers, cups by hour, every redemption, CSV export
     Payouts  this month, next payout, history, statement
     Settings what a cup covers, limits, hours, staff PINs

   Tablet: a slim left rail. Phone: a segmented control at the top.
   Reads and writes the shared store, so a redemption here takes a cup
   off the member's phone, and the busy level shows on the member map.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, raw, $, $$, icon } = ui;
  const S = store.select;
  const A = store.actions;

  const RESET_AFTER_MS = 6000;
  const RECENT_LIMIT = 5;
  const PAUSE_MINUTES = 30;
  const SECTIONS = [
    { id: "counter",  label: "Counter" },
    { id: "today",    label: "Today" },
    { id: "payouts",  label: "Payouts" },
    { id: "settings", label: "Settings" },
  ];
  const BUSY = [
    { id: "auto", label: "Auto" },
    { id: "quiet", label: "Quiet" },
    { id: "moderate", label: "Moderate" },
    { id: "packed", label: "Packed" },
  ];
  const ROLES = { counter: "counter", owner: "owner", manager: "manager" };

  // Thin-line icons for the rail, drawn like ui.icon (24 grid, 1.5 stroke)
  const RAIL_ICONS = {
    counter: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2.5v2.5H14zM17.5 17.5H20V20h-2.5z"/>',
    today: '<path d="M4 20h16M7 20v-6M12 20V8M17 20v-9"/>',
    payouts: '<rect x="3.5" y="6" width="17" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.5"/><path d="M7 9.5v5M17 9.5v5"/>',
    settings: '<path d="M5 7h9M18 7h1M5 17h3M12 17h7"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  };
  const railIcon = (id) => raw(`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${RAIL_ICONS[id]}</svg>`);

  const firstName = (m) => (m ? m.firstName : "Member");
  const cafeSlug = (c) => c.name.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const isoDay = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

  LCC.router.register("cafe", {
    title: "Café view",
    mount(el) {
      let cafeId = store.getState().partnerCafeId;
      let section = "counter";
      let r = freshRedeem();       // counter: idle | error | found | success
      let resetTimer = null, scanTimer = null;
      let pin = "";                // staff sign-in entry
      let wasPaused = false;       // so the tick only redraws the pause control when it ends
      let scope = "branch";        // brands: Today and Payouts for "this branch" or "all branches"

      function freshRedeem() { return { state: "idle", code: "", message: "", lookup: null, result: null }; }
      const cafe = () => S.cafe(cafeId);
      const P = () => S.partner(cafeId);
      const staffOnShift = () => P().staff.find((x) => x.id === P().staffOnShift) || P().staff[0];
      const defaultDrink = () => cafe().drinks.find((d) => d.credits === 1) || cafe().drinks[0];
      const brand = () => S.brandOf(cafeId);
      /** The drink to ring up: the member's choice in the app, or a latte until staff pick. */
      function drinkFor(member) {
        const b = brand();
        const o = S.order(member.id);
        if (o && o.brandId === b.id) return { drinkId: o.drinkId, temp: o.temp, fromApp: true };
        return { drinkId: "ds-latte", temp: "hot", fromApp: false };
      }

      /* ---------------------------------------------------------------
         Shell
         --------------------------------------------------------------- */
      function renderAll() {
        const c = cafe();
        el.innerHTML = html`
          <div class="surface cv">
            <header class="cv-head">
              <div class="cv-brand">
                ${brand() ? html`<span class="monogram cv-brand__ring" aria-hidden="true">${brand().monogram}</span>` : ui.logo("ring", { label: null, cls: "cv-brand__ring" })}
                <div>
                  <h1 class="cv-name">${brand() ? `${brand().name} · ${c.short}` : c.name}</h1>
                  ${brand()
                    ? html`<label class="cv-branch"><span class="sr-only">Branch</span><span class="select"><select class="input" data-branch>
                        ${S.branches(brand().id).map((x) => html`<option value="${x.id}" ${x.id === cafeId ? raw("selected") : ""}>${x.branch}</option>`)}
                      </select></span></label>`
                    : html`<p class="t-small t-muted">${S.area(c.area).name}</p>`}
                </div>
              </div>
              <div class="cv-head__aside">
                <button type="button" class="cv-staff" data-staff aria-haspopup="dialog" aria-label="On the counter: ${staffLabel()}. Change with a PIN">
                  <span data-staff-label>${staffLabel()}</span>${icon("chevronDown", { size: 16 })}
                </button>
                <p class="cv-state" data-cv-state>${stateLine()}</p>
              </div>
            </header>

            <div class="cv-body">
              <nav class="cv-nav" aria-label="Café view">
                <div class="cv-tabs" role="tablist" aria-label="Sections">
                  ${SECTIONS.map((x) => html`<button type="button" role="tab" class="cv-tab" id="cv-tab-${x.id}" data-section="${x.id}"
                      aria-controls="cv-panel" aria-selected="${x.id === section}" tabindex="${x.id === section ? 0 : -1}">
                      ${railIcon(x.id)}<span>${x.label}</span>
                    </button>`)}
                </div>
              </nav>

              <main class="cv-main" id="cv-panel" role="tabpanel" aria-labelledby="cv-tab-${section}" tabindex="-1" data-panel></main>

              <div class="cv-demo">
                ${LCC.sync ? html`<div class="cv-demo__sync">${LCC.sync.pill()}<span class="t-micro t-faint num">Room ${LCC.sync.room}</span></div>
                  <button type="button" class="btn btn--secondary btn--compact" data-pair>Pair a phone</button>` : ""}
                <label class="cv-demo__cafe">
                  <span class="t-micro t-faint">Demo café</span>
                  <span class="select"><select class="input" data-viewing>
                    ${(() => {
                      // A brand is one choice here; its branches are picked in the header
                      const firstBranch = (b) => (brand()?.id === b.id ? cafeId : S.branches(b.id)[0].id);
                      const brands = [...new Set(S.cafes().filter((x) => x.brandId).map((x) => x.brandId))].map((id) => S.brand(id));
                      return html`${brands.map((b) => html`<option value="${firstBranch(b)}" ${brand()?.id === b.id ? raw("selected") : ""}>${b.name} (${S.branches(b.id).length} branches)</option>`)}
                        ${S.clubCafes().map((x) => html`<option value="${x.id}" ${x.id === cafeId ? raw("selected") : ""}>${x.name}</option>`)}`;
                    })()}
                  </select></span>
                </label>
              </div>
            </div>
          </div>
          ${sheets()}`;
        paintSection();
      }

      const staffLabel = () => { const s = staffOnShift(); return `${s.name} · ${ROLES[s.role] || s.role}`; };
      function stateLine() {
        const paused = S.isPaused(cafeId);
        return html`<span class="cv-state__dot" data-paused="${paused}" aria-hidden="true"></span>${paused ? `Paused until ${fmt.time(cafe().pausedUntil)}` : "Taking member cups"}`;
      }
      function paintHead() {
        const st = $("[data-cv-state]", el);
        if (st) st.innerHTML = stateLine().s;
        const lab = $("[data-staff-label]", el);
        if (lab) { lab.textContent = staffLabel(); $("[data-staff]", el).setAttribute("aria-label", `On the counter: ${staffLabel()}. Change with a PIN`); }
      }

      function showSection(id, { focus = false } = {}) {
        section = id;
        $$("[data-section]", el).forEach((b) => { const on = b.dataset.section === id; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; });
        $("[data-panel]", el).setAttribute("aria-labelledby", `cv-tab-${id}`);
        paintSection();
        if (focus) $("[data-panel]", el).focus({ preventScroll: true });
      }

      function paintSection() {
        const panel = $("[data-panel]", el);
        if (!panel) return;
        const make = { counter: counterHtml, today: todayHtml, payouts: payoutsHtml, settings: settingsHtml }[section];
        panel.innerHTML = `<div class="enter">${make().s}</div>`;
        if (section === "counter") { paintRedeem(); paintRecent(); paintBusy(); paintPause(); }
      }

      /* ---------------------------------------------------------------
         Counter
         --------------------------------------------------------------- */
      function counterHtml() {
        return html`<div class="cv-counter">
          <section class="cv-redeem" aria-labelledby="redeem-h">
            <h2 class="eyebrow" id="redeem-h">Redeem a cup</h2>
            <div data-redeem-body></div>
          </section>
          <div class="cv-side">
            <section aria-labelledby="recent-h">
              <h2 class="eyebrow" id="recent-h">Last ${RECENT_LIMIT} cups</h2>
              <ol class="cv-list" role="list" data-recent aria-live="polite"></ol>
            </section>
            <section aria-labelledby="busy-h">
              <h2 class="eyebrow" id="busy-h">Busy level</h2>
              <div class="cv-busy" role="radiogroup" aria-labelledby="busy-h" data-busy>
                ${BUSY.map((b) => html`<button type="button" role="radio" class="cv-busy__opt" data-busy-option="${b.id}" aria-checked="false" tabindex="-1">
                  ${b.id === "auto" ? "" : ui.cupIcon(b.id, { size: 16, cls: "cv-busy__icon" })}<span>${b.label}</span></button>`)}
              </div>
              <p class="t-small t-muted" data-busy-line></p>
              <p class="t-small t-muted">Members see this on the map, so they come when you have room.</p>
            </section>
            <section aria-label="Pause member cups" data-pause></section>
          </div>
        </div>`;
      }

      function paintRedeem({ focus = false } = {}) {
        const body = $("[data-redeem-body]", el);
        if (!body) return;

        if (r.state === "idle" || r.state === "error") {
          const invalid = r.state === "error";
          body.innerHTML = html`
            <div class="cv-entry">
              <button type="button" class="btn btn--primary btn--block btn--tall" data-sim-scan>${icon("qr")}<span>Scan pass</span></button>
              <p class="cv-or t-small t-faint"><span>or enter the code</span></p>
              <form class="cv-code" data-code-form novalidate>
                <div class="field" data-invalid="${invalid}">
                  <label class="field__label" for="member-code">Six-digit code</label>
                  <input class="input code-input" id="member-code" name="code" value="${r.code}"
                    inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000"
                    aria-describedby="member-code-hint member-code-err" aria-invalid="${invalid}">
                  <p class="field__hint" id="member-code-hint">Under the QR on the member’s pass.</p>
                  <p class="field__error cv-error" id="member-code-err" role="alert">${r.message}</p>
                </div>
                <button type="submit" class="btn btn--secondary btn--block">Check code</button>
              </form>
            </div>`.s;
          if (focus) { const input = $("#member-code", body); input.focus(); if (invalid) input.select(); }
          return;
        }

        if (r.state === "found" && brand()) {
          const { member, left, usedToday, dailyLimit } = r.lookup;
          const b = brand();
          const club = member.memberNo != null ? S.club(member.id) : null;
          const clubLine = club ? [club.number, club.founding && "Founding Member", club.level.id !== "member" && club.level.name].filter(Boolean).join(" · ") : "";
          body.innerHTML = html`
            <div class="cv-member enter">
              ${clubLine ? html`<p class="cv-member__club num">${clubLine}</p>` : ""}
              <p class="cv-member__name" id="member-name">${member.firstName}</p>
              <dl class="cv-facts">
                <div><dt>Plan</dt><dd>${S.planLabel(member)}</dd></div>
                <div><dt>Cups left</dt><dd class="num">${left} <span class="t-faint">· any ${b.name} branch</span></dd></div>
                <div><dt>Today here</dt><dd class="num">${usedToday} of ${dailyLimit}</dd></div>
              </dl>
              <div class="cv-order">
                <div class="cv-order__head">
                  <label class="eyebrow" for="cv-drink">Drink</label>
                  <span class="badge" data-cv-from ${r.drink.fromApp ? "" : raw("hidden")}>Chosen in the app</span>
                </div>
                <span class="select"><select class="input" id="cv-drink" data-cv-drink>
                  ${[...new Set(b.menu.map((d) => d.section))].map((sec) => html`<optgroup label="${sec}">
                    ${b.menu.filter((d) => d.section === sec).map((d) => html`<option value="${d.id}" ${d.id === r.drink.drinkId ? raw("selected") : ""}>${d.name}</option>`)}
                  </optgroup>`)}
                </select></span>
                <div data-cv-temp>${tempHtml()}</div>
                <p class="cv-order__cover num" data-cv-cover aria-live="polite">${coverHtml()}</p>
              </div>
              <button type="button" class="btn btn--primary btn--block btn--tall" data-redeem aria-describedby="member-name">Redeem 1 cup</button>
              <button type="button" class="btn btn--link" data-reset>Not ${member.firstName}? Enter another code</button>
            </div>`.s;
          if (focus) $("[data-redeem]", body).focus();
          return;
        }

        if (r.state === "found") {
          const { member, left, here, usedToday, dailyLimit } = r.lookup;
          const club = member.memberNo != null ? S.club(member.id) : null;
          const clubLine = club ? [club.number, club.founding && "Founding Member", club.level.id !== "member" && club.level.name].filter(Boolean).join(" · ") : "";
          const perks = club ? S.perksAt(member.id, cafeId) : [];
          const hereLine = here.bonus ? "Free cup from the club"
            : here.type === "mycafes" ? `${here.left} of ${here.reserved} reserved here`
            : `${Math.max(0, here.cap - here.used)} of ${here.cap} left here this month`;
          body.innerHTML = html`
            <div class="cv-member enter">
              ${clubLine ? html`<p class="cv-member__club num">${clubLine}</p>` : ""}
              <p class="cv-member__name" id="member-name">${member.firstName}</p>
              <dl class="cv-facts">
                <div><dt>Plan</dt><dd>${S.planLabel(member)}</dd></div>
                <div><dt>Cups left</dt><dd class="num">${left} <span class="t-faint">· ${hereLine}</span></dd></div>
                <div><dt>Today here</dt><dd class="num">${usedToday} of ${dailyLimit}</dd></div>
                <div><dt>A cup covers</dt><dd>${S.coversLine(cafeId)}</dd></div>
                ${perks.length ? html`<div><dt>Perk to offer</dt><dd>${perks.map((p) => p.text).join("; ")}</dd></div>` : ""}
              </dl>
              <button type="button" class="btn btn--primary btn--block btn--tall" data-redeem aria-describedby="member-name">Redeem 1 cup</button>
              <button type="button" class="btn btn--link" data-reset>Not ${member.firstName}? Enter another code</button>
            </div>`.s;
          if (focus) $("[data-redeem]", body).focus();
          return;
        }

        if (r.state === "success" && entry0()?.brandId) {
          const { member, entry } = r.result;
          body.innerHTML = html`
            <div class="cv-success" role="status">
              <svg class="check-draw" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/><path d="M15 24.5l6 6 12-13" pathLength="1"/></svg>
              <p class="cv-success__title">Cup redeemed for ${member.firstName}</p>
              <p class="cv-success__drink">${S.entryDrinkName(entry)}</p>
              ${entry.topUp
                ? html`<p class="cv-topup num">Collect ${fmt.rs(entry.topUp)} top-up</p>`
                : html`<p class="t-small t-muted">Fully covered by the cup.</p>`}
              <p class="cv-success__ref num">Reference ${S.redemptionRef(entry)}</p>
              <p class="cv-till">Ring it up on your till as: <strong>LCC member</strong></p>
              <p class="t-small t-faint num">${fmt.time(entry.at)} · ${member.firstName} has ${fmt.cups(S.balance(member.id).left)} left, any branch</p>
              <button type="button" class="btn btn--secondary" data-reset>Next</button>
              <span class="cv-success__timer" aria-hidden="true"></span>
            </div>`.s;
          if (focus) $("[data-reset]", body).focus({ preventScroll: true });
          return;
        }

        if (r.state === "success") {
          const { member, entry } = r.result;
          body.innerHTML = html`
            <div class="cv-success" role="status">
              <svg class="check-draw" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/><path d="M15 24.5l6 6 12-13" pathLength="1"/></svg>
              <p class="cv-success__title">Cup redeemed for ${member.firstName}</p>
              <p class="cv-success__ref num">Reference ${S.redemptionRef(entry)}</p>
              <p class="cv-till">Ring it up on your till as: <strong>LCC member</strong></p>
              <p class="t-small t-faint num">${fmt.time(entry.at)} · ${member.firstName} has ${fmt.cups(S.balance(member.id).left)} left this month</p>
              <button type="button" class="btn btn--secondary" data-reset>Next</button>
              <span class="cv-success__timer" aria-hidden="true"></span>
            </div>`.s;
          if (focus) $("[data-reset]", body).focus({ preventScroll: true });
        }
      }

      const entry0 = () => r.result?.entry;
      function tempHtml() {
        const item = S.menuItem(brand().id, r.drink.drinkId);
        if (item.hot != null && item.iced != null) {
          return ui.segmented({ name: "cvtemp", label: "Hot or iced", value: S.servedTemp(item, r.drink.temp), options: [{ value: "hot", label: "Hot" }, { value: "iced", label: "Iced" }] });
        }
        return html`<p class="t-small t-muted">${item.hot != null ? "Hot only" : "Iced only"}</p>`;
      }
      function coverHtml() {
        const item = S.menuItem(brand().id, r.drink.drinkId);
        const p = S.drinkPrice(brand().id, item, r.drink.temp);
        return p.included
          ? html`${S.drinkLabel(item, p.temp)}, ${fmt.rs(p.price)}: <strong>covered by the cup</strong>`
          : html`${S.drinkLabel(item, p.temp)}, ${fmt.rs(p.price)}: <strong class="cv-topup">Collect ${fmt.rs(p.topUp)} top-up</strong>`;
      }
      function paintDrink({ temp = true } = {}) {
        const t = $("[data-cv-temp]", el); if (t && temp) t.innerHTML = tempHtml().s;
        const c = $("[data-cv-cover]", el); if (c) c.innerHTML = coverHtml().s;
        const f = $("[data-cv-from]", el); if (f) f.hidden = !r.drink.fromApp;
      }

      function check(code, { focus = true } = {}) {
        r.code = code;
        const keep = r.state === "found" ? r.drink : null; // a re-check keeps what staff picked
        const res = store.lookupCode(code, cafeId, 1);
        r = res.ok ? { ...freshRedeem(), state: "found", code, lookup: res } : { ...freshRedeem(), state: "error", code, message: res.message };
        if (res.ok && brand()) r.drink = keep && keep.memberId === res.member.id ? keep : { ...drinkFor(res.member), memberId: res.member.id };
        paintRedeem({ focus });
      }

      function redeemNow() {
        // store.actions.redeem carries the // BACKEND: POST /redeem seam
        const res = brand()
          ? A.redeem({ code: r.code, cafeId, drinkId: r.drink.drinkId, temp: r.drink.temp })
          : A.redeem({ code: r.code, cafeId, drinkId: defaultDrink().id });
        if (!res.ok) {
          // e.g. the code expired, or the café paused, while the barista looked
          r = { ...freshRedeem(), state: "error", code: r.code, message: res.message };
          paintRedeem({ focus: true });
          return;
        }
        r = { ...freshRedeem(), state: "success", result: { member: res.member, entry: res.entry } };
        paintRedeem({ focus: true });
        clearTimeout(resetTimer);
        // A top-up to collect gets a little longer on screen
        resetTimer = setTimeout(() => reset({ focus: el.contains(document.activeElement) }), RESET_AFTER_MS * (res.entry.topUp ? 1.75 : 1));
      }

      function reset({ focus = true } = {}) {
        clearTimeout(resetTimer); clearTimeout(scanTimer);
        r = freshRedeem();
        paintRedeem({ focus });
      }

      function simulateScan(btn) {
        // BACKEND: a real scan decodes the QR payload (LCC1:<member>:<code>) with the camera
        btn.disabled = true;
        btn.querySelector("span").textContent = "Scanning…";
        clearTimeout(scanTimer);
        scanTimer = setTimeout(() => check(S.pass(store.getState().memberId).code), 600);
      }

      function paintRecent(newId) {
        const list = $("[data-recent]", el);

          ? html`${rows.map((e) => html`<li class="cv-row${e.id === newId ? " enter" : ""}">

        const group = $("[data-busy]", el);

         --------------------------------------------------------------- */
      const onClick = (e) => {
        const t = e.target;
        const tab = t.closest("[data-section]");
        if (tab) return showSection(tab.dataset.section);
        const busy = t.closest("[data-busy-option]");
        if (busy) return A.setBusyMode(cafeId, busy.dataset.busyOption);
        const tseg = t.closest('[data-segmented="cvtemp"] .segmented__option');
        if (tseg) { ui.selectSegment(tseg.parentElement, tseg.dataset.value); r.drink = { ...r.drink, temp: tseg.dataset.value, fromApp: false }; return paintDrink({ temp: false }); }
        const sseg = t.closest('[data-segmented="cvscope"] .segmented__option');
        if (sseg) { if (scope === sseg.dataset.value) return; scope = sseg.dataset.value; paintSection(); return $(`[data-segmented="cvscope"] [data-value="${scope}"]`, el)?.focus(); }
        if (t.closest("[data-sim-scan]")) return simulateScan(t.closest("[data-sim-scan]"));
        if (t.closest("[data-redeem]")) return redeemNow();
        if (t.closest("[data-reset]")) return reset();
        if (t.closest("[data-pause-now]")) { A.pauseMemberCups(cafeId, PAUSE_MINUTES); return ui.toast(`Member cups paused until ${fmt.time(cafe().pausedUntil)}.`); }
        if (t.closest("[data-resume]")) { A.pauseMemberCups(cafeId, 0); return ui.toast("Taking member cups again."); }
        if (t.closest("[data-staff]")) return openPin();
        const key = t.closest("[data-key]");
        if (key) return pressKey(key.dataset.key);
        if (t.closest("[data-pair]")) return openPair();
        if (t.closest("[data-export]")) {
          // BACKEND: GET /cafes/:id/day.csv
          const d = S.cafeDay(cafeId);
          return ui.toast(`${cafeSlug(cafe())}-${isoDay(Date.now())}.csv: ${fmt.cups(d.cups)}, ${fmt.rs(d.earnings)}. Prototype: no file saved.`, { duration: 4200 });
        }
        if (t.closest("[data-statement]")) {
          // BACKEND: GET /cafes/:id/statements/:month.pdf
          return ui.toast("Statement for the last 3 months is ready. Prototype: no file saved.", { duration: 4200 });
        }
        const step = t.closest("[data-stepper] [data-step]");
        if (step) {
          const st = step.closest("[data-stepper]");
          const id = st.dataset.stepper;
          const min = Number(st.dataset.min), max = Number(st.dataset.max);
          const by = id === "cafePerDay" ? 5 : 1;
          const next = Math.max(min, Math.min(max, P().limits[id] + Number(step.dataset.step) * by));
          A.updatePartner(cafeId, { limits: { [id]: next } });
          ui.setStepper(st, next);
          return;
        }
        const rm = t.closest("[data-remove-staff]");
        if (rm) {
          const name = P().staff.find((x) => x.id === rm.dataset.removeStaff)?.name;
          if (A.removeStaff(cafeId, rm.dataset.removeStaff).ok) { paintSection(); saved(`${name} removed.`); }
        }
      };

      const onInput = (e) => {
        const t = e.target;
        if (t.id === "member-code") {
          const digits = t.value.replace(/\D/g, "").slice(0, 6);
          if (t.value !== digits) t.value = digits;
          r.code = digits;
          const field = t.closest(".field");
          if (field.dataset.invalid === "true") { field.dataset.invalid = "false"; t.setAttribute("aria-invalid", "false"); r.state = "idle"; }
          if (digits.length === 6) check(digits);
          return;
        }
        if (t.matches("[data-pin-input]")) {
          pin = t.value.replace(/\D/g, "").slice(0, 4);
          paintPin();
          if (pin.length === 4) tryPin();
          return;
        }
        if (t.id === "st-pin") t.value = t.value.replace(/\D/g, "").slice(0, 4);
      };

      const onChange = (e) => {
        const t = e.target;
        if (t.matches("[data-viewing]") || t.matches("[data-branch]")) return A.setPartnerCafe(t.value);
        if (t.matches("[data-cv-drink]")) {
          const item = S.menuItem(brand().id, t.value);
          r.drink = { ...r.drink, drinkId: t.value, temp: S.servedTemp(item, r.drink.temp), fromApp: false };
          return paintDrink();
        }
        if (t.name === "cat") {
          const cats = $$('input[name="cat"]:checked', el).map((x) => x.value);
          if (!cats.length) { t.checked = true; return ui.toast("A member cup needs to cover at least one kind of drink.", { iconName: "info" }); }
          A.updatePartner(cafeId, { covers: { categories: cats } }); paintSection(); return saved();
        }
        if (t.name === "size") { A.updatePartner(cafeId, { covers: { size: t.value } }); paintSection(); return saved(); }
        if (t.name === "extras") { A.updatePartner(cafeId, { covers: { extrasPaid: t.checked } }); paintSection(); return saved(); }
        if (t.name === "open" || t.name === "close") {
          const open = $("#cv-open", el).value, close = $("#cv-close", el).value;
          if (!open || !close) return;
          A.setCafeHours(cafeId, open.replace(/^0(\d)/, "$1"), close === "00:00" ? "24:00" : close.replace(/^0(\d)/, "$1"));
          paintSection(); return saved("Hours saved.");
        }
      };

      const onSubmit = (e) => {
        if (e.target.matches("[data-code-form]")) {
          e.preventDefault();
          const code = $("#member-code", el).value.replace(/\D/g, "");
          if (code.length !== 6) {
            r = { ...freshRedeem(), state: "error", code, message: code.length ? `That’s ${code.length} digit${code.length === 1 ? "" : "s"}. Member codes have six.` : "Enter the six-digit code from the member’s pass." };
            return paintRedeem({ focus: true });
          }
          return check(code);
        }
        if (e.target.matches("[data-add-staff]")) {
          e.preventDefault();
          const f = e.target;
          const name = f.elements.name.value.trim(), role = f.elements.role.value, p = f.elements.pin.value;
          const err = !name ? "Add a name." : !/^\d{4}$/.test(p) ? "PINs are four digits." : "";
          if (err) { $("[data-add-err]", el).textContent = err; return; }
          const res = A.addStaff(cafeId, { name, role, pin: p });
          if (!res.ok) { $("[data-add-err]", el).textContent = res.message; return; }
          paintSection();
          saved(`${name} added. Their PIN works on the counter now.`);
        }
      };

      // Arrow keys: section tabs and the busy radio group
      const onKeydown = (e) => {
        const tab = e.target.closest?.("[data-section]");
        const opt = e.target.closest?.("[data-busy-option]");
        if (!tab && !opt) return;
        const ids = tab ? SECTIONS.map((x) => x.id) : BUSY.map((x) => x.id);
        let i = ids.indexOf(tab ? tab.dataset.section : opt.dataset.busyOption);
        const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
        if (e.key in keys) i = (i + keys[e.key] + ids.length) % ids.length;
        else if (e.key === "Home") i = 0;
        else if (e.key === "End") i = ids.length - 1;
        else return;
        e.preventDefault();
        if (tab) { showSection(ids[i]); $(`[data-section="${ids[i]}"]`, el).focus(); }
        else { A.setBusyMode(cafeId, ids[i]); $(`[data-busy-option="${ids[i]}"]`, el).focus(); }
      };

      el.addEventListener("click", onClick);
      el.addEventListener("input", onInput);
      el.addEventListener("change", onChange);
      el.addEventListener("submit", onSubmit);
      el.addEventListener("keydown", onKeydown);

      const offs = [
        store.on("cafe:status", ({ cafeId: id }) => { if (id === cafeId) paintBusy(); }),
        store.on("cafe:pause", ({ cafeId: id }) => {
          if (id !== cafeId) return;
          wasPaused = S.isPaused(cafeId);
          paintHead(); paintPause();
          if (r.state === "found") check(r.code, { focus: false });
        }),
        store.on("redeem", ({ entry }) => {
          if (entry.cafeId !== cafeId) {
            // Another branch of this brand: the all-branches views and brand-wide cups change
            if (!brand() || entry.brandId !== brand().id) return;
            if (scope === "brand" && (section === "today" || section === "payouts")) paintSection();
            if (r.state === "found" && r.lookup.member.id === entry.memberId) check(r.code, { focus: false });
            return;
          }
          A.refreshAutoBusy(cafeId);
          paintBusy();   // the cup count in the busy line, even if the level holds
          paintRecent(entry.id);
          if (section === "today" || section === "payouts") paintSection();
          // Another window redeemed for the member on screen: refresh their numbers
          if (r.state === "found" && r.lookup.member.id === entry.memberId) check(r.code, { focus: false });
        }),
        store.on("partner:settings", ({ cafeId: id }) => { if (id === cafeId) { paintHead(); if (r.state === "found") check(r.code, { focus: false }); } }),
        store.on("cafe:viewing", ({ cafeId: id }) => {
          cafeId = id;
          clearTimeout(resetTimer); clearTimeout(scanTimer);
          r = freshRedeem();
          A.refreshAutoBusy(cafeId);
          renderAll();
          $("[data-viewing]", el)?.focus();
        }),
        store.on("tick", () => {
          A.refreshAutoBusy(cafeId);  // cups age out of the 30-minute window
          paintHead(); paintBusy();
          const paused = S.isPaused(cafeId);
          if (paused !== wasPaused) { wasPaused = paused; paintPause(); }
        }),
        // A plan bought or switched (here or on a phone) changes reserved cups
        store.on("plan", () => { if (r.state === "found") check(r.code, { focus: false }); }),
        // The member picked (or changed) a drink on their phone while the counter has them up
        store.on("order", ({ memberId }) => {
          if (r.state !== "found" || !brand() || r.lookup.member.id !== memberId) return;
          r.drink = { ...drinkFor(r.lookup.member), memberId };
          const sel = $("[data-cv-drink]", el); if (sel) sel.value = r.drink.drinkId;
          paintDrink();
        }),
        // A device that joined the room was filled in by another café window
        store.on("snapshot", () => { renderAll(); }),
      ];

      /* Keep the counter tablet awake during service, but only when the café
         view runs as an installed app. Released when hidden; asked for again
         when the app comes back. Fails silently where unsupported. */
      const installed = () => window.matchMedia?.("(display-mode: standalone)").matches || navigator.standalone === true;
      let wakeLock = null;
      async function keepAwake() {
        if (!installed() || !("wakeLock" in navigator) || document.visibilityState !== "visible" || wakeLock) return;
        try {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        } catch (_) { wakeLock = null; /* low battery, not allowed, or not supported */ }
      }
      const onVisible = () => { if (document.visibilityState === "visible") keepAwake(); };
      document.addEventListener("visibilitychange", onVisible);
      keepAwake();

      A.refreshAutoBusy(cafeId);
      renderAll();

      return () => {
        document.removeEventListener("visibilitychange", onVisible);
        if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
        clearTimeout(resetTimer); clearTimeout(scanTimer);
        offs.forEach((off) => off());
        el.removeEventListener("click", onClick);
        el.removeEventListener("input", onInput);
        el.removeEventListener("change", onChange);
        el.removeEventListener("submit", onSubmit);
        el.removeEventListener("keydown", onKeydown);
      };
    },
  });
})();

</script>
<script>
/* ---- src/app.js ---- */
/* =====================================================================
   Lahore Coffee Club — app.js
   Member app (#/app). Replaces the Pass 1 shell in router.js.

   Routes:  #/app (Home) · #/app/cafes · #/app/cafes/:id · #/app/pass
            #/app/map · #/app/club · #/app/gift · #/app/plan
            #/app/plan/pay · #/app/welcome · #/app/welcome/card
   This file owns the shell, tabs, Home, Pass and Map. Cafés live in
   app-cafes.js, the plan picker and payment in app-plan.js, the Club
   and gifting in app-club.js, onboarding in app-welcome.js; they add
   screen factories to LCC.appScreens and get a small ctx object.

   Everything reads the shared store, so a redemption or status change
   in the café view (same window or another one) shows up here live.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, raw, $, $$, icon } = ui;
  const S = store.select;
  const A = store.actions;
  // Screens added by app-cafes.js / app-plan.js: name -> (ctx, arg) => screen
  const REG = (LCC.appScreens = LCC.appScreens || {});

  const TABS = [
    { id: "home",    label: "Home",    icon: "home" },
    { id: "cafes",   label: "Cafés",   icon: "store" },
    { id: "pass",    label: "Pass",    icon: "qr" },
    { id: "map",     label: "Map",     icon: "map" },
    { id: "club",    label: "Club",    icon: "award" },
  ];
  const tabFromPath = (path) => (TABS.some((t) => t.id === path[0]) ? path[0] : "home");
  const hrefFor = (id) => (id === "home" ? "#/app" : `#/app/${id}`);

  /* -------------------------------------------------------------------
     Map geometry. data.js stores café/area positions on a 1000 x 800
     landscape grid; the phone map is a portrait 360 x 560 schematic.
     ------------------------------------------------------------------- */
  const MAP_W = 360, MAP_H = 560;
  const project = (x, y) => ({ x: 24 + (x - 260) * 0.58, y: 60 + (y - 250) * 1.1 });
  // Where each pin's name sits, so names stay inside the frame and don't collide (default: right)
  const LABEL_SIDE = {
    slowpour: "left", maple: "left", grind: "left", quiethours: "left", ember: "below", thirdfloor: "below",
    "ds-gulberg": "left", "ds-cantt": "below", "ds-lalakjan": "left", "ds-dha6": "left", "ds-dolmen": "left", "ds-pine": "left", "ds-modeltown": "left",
  };
  const AREA_LABELS = {
    gulberg: [236, 196], liberty: [92, 286], fortress: [292, 70],
    dha: [300, 540], "model-town": [196, 512], "johar-town": [58, 530], cantt: [318, 270],
  };
  const USUAL_HOUR = 18;

  function mapSvg() {
    const areas = store.getState().areas;
    return html`<svg viewBox="0 0 ${MAP_W} ${MAP_H}" aria-hidden="true" focusable="false">
      ${areas.map((a) => { const p = project(a.x, a.y); return html`<ellipse class="m-area" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" rx="64" ry="54"/>`; })}
      <path class="m-river" d="M-20 78 C 50 52, 110 22, 190 -16"/>
      <path class="m-road m-road--major" d="M40 140 L 360 296"/>
      <path class="m-road m-road--major" d="M0 392 C 110 548, 250 572, 360 476"/>
      <path class="m-road" d="M150 0 L 112 560"/>
      <path class="m-road" d="M0 336 L 360 226"/>
      <path class="m-road" d="M262 0 L 236 560"/>
      <path class="m-canal" d="M336 0 C 284 112, 222 150, 206 262 S 122 424, 66 560"/>
      <text class="m-label m-label--water" x="34" y="44">Ravi</text>
      <text class="m-label m-label--water" x="150" y="372" transform="rotate(-58 150 372)">Canal</text>
      ${areas.map((a) => { const [x, y] = AREA_LABELS[a.id] || [0, 0]; return html`<text class="m-label" x="${x}" y="${y}" text-anchor="middle">${a.name}</text>`; })}
    </svg>`;
  }

  // The landing page's busy-map teaser draws the same map
  LCC.memberMap = { svg: mapSvg, project, labelSide: LABEL_SIDE, width: MAP_W, height: MAP_H };

  /* -------------------------------------------------------------------
     Surface
     ------------------------------------------------------------------- */
  let api = null; // set while mounted, so router.update can reach it

  LCC.router.register("app", {
    title: "Member app",
    update(path, opts) { if (api) api.show(path, opts); },
    mount(el, path) {
      const member = () => S.member();
      let active = { key: null, tab: null, cleanup: null, on: {} };
      // Screens visited in this app session, so Back knows whether history.back() stays in the app
      const trail = [];
      let replacing = false;
      let mapMode = "now";

      // Fit the 844px frame on short laptop screens
      const fit = () => {
        const scale = Math.min(1, Math.max(0.6, (window.innerHeight - 88) / 864));
        document.documentElement.style.setProperty("--phone-scale", scale.toFixed(3));
      };
      fit();
      window.addEventListener("resize", fit);

      el.innerHTML = html`
        <div class="surface stage">
          <div class="phone">
            <div class="phone__screen">
              <div class="phone__status" aria-hidden="true">
                <span>9:41</span>
                <span class="phone__island"></span>
                <span class="phone__status-icons">
                  <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                  <svg viewBox="0 0 26 12" style="width:26px"><rect x="0.75" y="0.75" width="21.5" height="10.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.6" fill="currentColor"/><rect x="23.5" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
                </span>
              </div>
              <div class="app-view" id="app-view" role="tabpanel" tabindex="-1"></div>
              <div class="tabbar" role="tablist" aria-label="Sections">
                ${TABS.map((t) => html`
                  <button type="button" role="tab" class="tab${t.id === "pass" ? " tab--pass" : ""}" id="tab-${t.id}" data-tab="${t.id}"
                    aria-controls="app-view" aria-selected="false" tabindex="-1">
                    ${t.id === "pass" ? html`<span class="tab__pass">${icon(t.icon)}</span>` : icon(t.icon)}
                    <span>${t.label}</span>
                  </button>`)}
              </div>
              <div class="sheet" id="cafe-sheet" role="dialog" aria-modal="true" aria-labelledby="cafe-sheet-title" aria-hidden="true">
                <div class="sheet__scrim" data-sheet-close></div>
                <div class="sheet__panel">
                  <div class="sheet__handle" aria-hidden="true"></div>
                  <div class="sheet__body" data-sheet-body></div>
