                </div>
              </div>
              <div class="sheet sheet--drawer" id="profile-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
                <div class="sheet__scrim" data-sheet-close></div>
                <div class="sheet__panel" data-drawer-body></div>
              </div>
              <div class="toast-region" style="position:absolute;bottom:104px" role="status" aria-live="polite"></div>
            </div>
          </div>
        </div>`;

      const view = $("#app-view", el);

      /* ---------------- Routing inside the app ---------------- */
      function resolve(path) {
        const [a = "home", b] = path;
        const brandId = b && (S.brand(b) ? b : S.cafe(b)?.brandId);
        if (a === "cafes" && brandId && REG.brand) return { key: `cafes/${brandId}`, tab: "cafes", make: () => REG.brand(ctx, brandId) };
        if (a === "cafes" && b && S.cafe(b) && REG.cafeDetail) return { key: `cafes/${b}`, tab: "cafes", make: () => REG.cafeDetail(ctx, b) };
        if (a === "cafes" && REG.cafes) return { key: "cafes", tab: "cafes", make: () => REG.cafes(ctx) };
        if (a === "plan" && b === "pay" && REG.pay) return { key: "plan/pay", tab: "home", flow: true, make: () => REG.pay(ctx) };
        if (a === "plan" && REG.plan) return { key: "plan", tab: "home", flow: true, make: () => REG.plan(ctx) };
        if (a === "club" && REG.club) return { key: "club", tab: "club", make: () => REG.club(ctx) };
        if (a === "rewards") return { key: "rewards", tab: "club", make: () => ({ redirect: "#/app/club" }) };
        if (a === "gift" && REG.gift) return { key: "gift", tab: "home", flow: true, make: () => REG.gift(ctx) };
        if (a === "welcome" && b === "card" && REG.issued) return { key: "welcome/card", tab: "home", flow: true, make: () => REG.issued(ctx) };
        if (a === "welcome" && REG.welcome) return { key: "welcome", tab: "home", flow: true, make: () => REG.welcome(ctx) };
        const tab = tabFromPath(path);
        return { key: tab, tab, make: SCREENS[tab] };
      }

      function show(path, { force = false } = {}) {
        const r = resolve(Array.isArray(path) ? path : [path]);
        if (active.key === r.key && !force) return;
        const screen = r.make();
        if (screen.redirect) { history.replaceState(null, "", LCC.sync ? LCC.sync.withRoom(screen.redirect) : screen.redirect); LCC.router.render(); return; }
        if (active.key !== r.key) {
          if (replacing && trail.length) trail[trail.length - 1] = r.key;
          else if (trail[trail.length - 2] === r.key) trail.pop();
          else trail.push(r.key);
        }
        replacing = false;
        if (typeof active.cleanup === "function") active.cleanup();
        ui.closeSheet($("#cafe-sheet", el));
        ui.closeSheet($("#profile-drawer", el));
        $$("[data-tab]", el).forEach((btn) => {
          const on = btn.dataset.tab === r.tab;
          btn.setAttribute("aria-selected", on);
          btn.tabIndex = on ? 0 : -1;
        });
        // Plan and payment are a focused flow: no tab bar
        $(".phone__screen", el).classList.toggle("is-flow", !!r.flow);
        // The pass is the moment at the counter: a black screen (BRAND.md)
        $(".phone__screen", el).classList.toggle("theme-dark", r.tab === "pass");
        view.setAttribute("aria-labelledby", `tab-${r.tab}`);
        view.scrollTop = 0;
        view.innerHTML = `<div class="enter">${screen.html}</div>`;
        active = { key: r.key, tab: r.tab, cleanup: screen.mount ? screen.mount() : null, on: screen.on || {} };
      }

      /** Navigate inside the app. replace: swap the history entry (after payment, redirects). */
      function go(hash, { replace = false } = {}) {
        const to = LCC.sync ? LCC.sync.withRoom(hash) : hash; // keep the sync room in the URL
        if (replace) { replacing = true; history.replaceState(null, "", to); LCC.router.render(); }
        else location.hash = to;
      }
      /** Back button: step back if we got here inside the app, otherwise go to the fallback. */
      function back(fallback) {
        if (trail.length > 1) history.back();
        else go(fallback, { replace: true });
      }
      const ctx = { el, view, go, back, member, openCafe: (id) => openCafe(id), toast: ui.toast, rerender: () => show(LCC.router.parse().path, { force: true }) };

      /* ---------------- Café sheet ---------------- */
      function openCafe(cafeId) {
        const c = S.cafe(cafeId);
        const open = S.openState(c);
        const usual = S.usualStatus(c, USUAL_HOUR).status;
        const brand = S.brandOf(cafeId);
        if (brand) {
          const cover = brand.economics.coverUpTo;
          $("[data-sheet-body]", el).innerHTML = html`
            <div class="cafe-sheet">
              <div class="stack" style="--stack-gap:var(--space-1)">
                <h2 class="t-h2" id="cafe-sheet-title">${brand.name}</h2>
                <p class="t-small t-muted">${c.branch} · ${c.distanceKm} km · one of ${S.branches(brand.id).length} branches</p>
              </div>
              <div>${ui.statusPill(c.id)}</div>
              <div class="cafe-sheet__facts">
                <span>${icon("clock")} ${c.hours.label} · ${open.open ? "open now" : "closed now"}</span>
                <span>${ui.cupIcon(usual, { size: 18, cls: "" })} Usually ${fmt.statusLabel(usual).toLowerCase()} at 6 pm</span>
              </div>
              <p class="t-small t-muted">A cup covers any drink up to ${fmt.rs(cover)}. ${S.member().plan?.brandId === brand.id ? html`Your ${brand.name} cups work at every branch.` : `${brand.name} cups come with a ${brand.name} plan.`}</p>
              <div class="cafe-sheet__actions">
                <a class="btn btn--primary btn--block" href="#/app/cafes/${brand.id}">Menu and plans</a>
                <button type="button" class="btn btn--secondary btn--block" data-directions="${c.id}">Directions</button>
              </div>
            </div>`.s;
          ui.openSheet($("#cafe-sheet", el));
          return;
        }
        $("[data-sheet-body]", el).innerHTML = html`
          <div class="cafe-sheet">
            <div class="stack" style="--stack-gap:var(--space-1)">
              <h2 class="t-h2" id="cafe-sheet-title">${c.name}</h2>
              <p class="t-small t-muted">${S.area(c.area).name} · ${c.distanceKm} km · ${fmt.rs(c.price)} a cup at the counter</p>
            </div>
            <div>${ui.statusPill(c.id)}</div>
            <div class="cafe-sheet__facts">
              <span>${icon("clock")} ${c.hours.label} · ${open.open ? "open now" : "closed now"}</span>
              <span>${ui.cupIcon(usual, { size: 18, cls: "" })} Usually ${fmt.statusLabel(usual).toLowerCase()} at 6 pm</span>
            </div>
            <p class="t-small t-muted">${c.blurb}</p>
            <div>
              <h3 class="eyebrow">Signature drinks</h3>
              <ul role="list">
                ${c.drinks.map((d) => html`<li class="row"><div class="row__main"><div class="row__title">${d.name}</div></div><span class="badge">${fmt.cups(d.credits)}</span></li>`)}
              </ul>
            </div>
            <div class="cafe-sheet__actions">
              <button type="button" class="btn btn--primary btn--block" data-directions="${c.id}">Directions</button>
              <a class="btn btn--secondary btn--block" href="#/app/cafes/${c.id}">More about ${c.name}</a>
            </div>
          </div>`;
        ui.openSheet($("#cafe-sheet", el));
      }

      /* ---------------- Screens ---------------- */
      const SCREENS = {
        home: homeScreen,
        pass: passScreen,
        map: mapScreen,
      };

      /* Home ------------------------------------------------------------ */
      // One calm, centred block: the brick ring, cups left, renewal, two actions.
      // Recent activity, plan details and help live in the profile drawer.
      function homeScreen() {
        const m = member();
        return {
          html: html`
            <div class="app-screen home">
              <div class="app-top">
                <div class="app-brand">${ui.logo("monogram-horizontal")}</div>
                ${profileButton()}
              </div>
              <div>
                <p class="t-small t-muted">${fmt.date(Date.now())}</p>
                <h1 class="t-h2">Salaam, ${m.firstName}.</h1>
              </div>

              <div class="home__center">
                <div class="ring ring--home" data-ring role="img" aria-label="${S.balance().left} of ${S.balance().total} cups left this month">
                  <div class="ring__bricks" data-bricks>${ui.brickRing({ total: S.balance().total, filled: S.balance().left, size: 248, radius: 104, length: 26, stagger: true })}</div>
                  <div class="ring__center" aria-hidden="true">
                    <span class="ring__num" data-ring-num data-value="0">0</span>
                  </div>
                </div>
                <div class="home__lines">
                  <p class="t-body" data-home-line>${homeLine()}</p>
                  <p class="t-small t-muted" data-renew-line>${renewLine()}</p>
                </div>
                <div class="home__actions">
                  <button type="button" class="btn btn--primary btn--block" data-start-plan>${m.plan ? "Change plan" : "Choose a plan"}</button>
                  <a class="btn btn--secondary btn--block" href="#/app/gift">Send a gift</a>
                </div>
              </div>
            </div>`.s,
          mount() {
            requestAnimationFrame(() => paintRing());
          },
          on: {
            // Redemptions, gifts and free cups, from this window or another device
            ledger: ({ entries }) => {
              if (!entries.some((e) => e.memberId === member().id)) return;
              paintRing();
              const h = $("[data-home-line]", view); if (h) h.textContent = homeLine();
            },
            member: () => {
              paintRing();
              const l = $("[data-renew-line]", view); if (l) l.textContent = renewLine();
              const h = $("[data-home-line]", view); if (h) h.textContent = homeLine();
            },
          },
        };
      }

      /** Under the ring: "Double Shot · 11 cups left · any branch" on a brand plan. */
      const homeLine = () => S.brandBalanceLine() || "cups left this month";

      function renewLine() {
        const m = member();
        return m.plan ? `Renews on ${fmt.shortDate(m.renewsAt)}` : "No plan yet";
      }

      /* Profile drawer ---------------------------------------------------- */
      function profileButton() {
        return html`<button type="button" class="icon-btn profile-btn" data-open-drawer aria-label="Profile and account" aria-haspopup="dialog" aria-controls="profile-drawer">${icon("user")}</button>`;
      }

      function drawerHtml() {
        const m = member();
        const club = S.club(m.id);
        const plan = S.memberPlan(m);
        const quote = m.plan ? S.quote(m.plan) : null;
        const clubLine = [club.number, club.founding && "Founding Member", club.level.name].filter(Boolean).join(" · ");
        return html`
          <div class="drawer__bar">
            <h2 class="t-h3" id="drawer-title">${[m.firstName, m.lastName].filter(Boolean).join(" ")}</h2>
            <button type="button" class="icon-btn" data-sheet-close aria-label="Close">${icon("close")}</button>
          </div>
          <div class="drawer__body">
            <section class="drawer__section" aria-labelledby="dr-profile">
              <h3 class="eyebrow" id="dr-profile">Profile</h3>
              <p class="t-body">${clubLine}</p>
              ${m.phone ? html`<p class="t-small t-muted num">${m.phone}</p>` : ""}
              <a class="btn btn--link" href="#/app/club">Your member card</a>
            </section>

            <section class="drawer__section" aria-labelledby="dr-recent">
              <h3 class="eyebrow" id="dr-recent">Recent activity</h3>
              <ul role="list" data-recent aria-live="polite">${recentRows()}</ul>
            </section>

            <section class="drawer__section" aria-labelledby="dr-plan">
              <h3 class="eyebrow" id="dr-plan">Plan and billing</h3>
              ${m.plan
                ? html`<p class="t-body">${S.planLabel(m)}${plan.type === "brand" ? ", any branch" : `, ${fmt.cups(plan.cups)} this month`}</p>
                    <p class="t-small t-muted num">${quote ? `${fmt.rs(quote.price)} a month · ` : ""}renews on ${fmt.shortDate(m.renewsAt)}</p>
                    ${m.payment ? html`<p class="t-small t-muted num">Paid with ${m.payment.method} ending ${m.payment.last4}</p>` : ""}`
                : html`<p class="t-body">No plan yet</p>`}
              <button type="button" class="btn btn--link" data-start-plan>${m.plan ? "Change plan" : "Choose a plan"}</button>
            </section>

            <section class="drawer__section drawer__appearance" aria-labelledby="dr-look">
              <h3 class="eyebrow" id="dr-look">Appearance</h3>
              ${ui.segmented({ name: "flavour", label: "Colour theme", value: LCC.theme.flavour(), options: [{ value: "coffee", label: "Coffee" }, { value: "matcha", label: "Matcha" }] })}
              ${ui.segmented({ name: "mode", label: "Light or dark", value: LCC.theme.mode(), options: [{ value: "light", label: "Light" }, { value: "dark", label: "Dark" }, { value: "auto", label: "Auto" }] })}
            </section>

            <section class="drawer__section" aria-labelledby="dr-help">
              <h3 class="eyebrow" id="dr-help">Help</h3>
              <p class="t-small t-muted">Show your pass at the counter, or read the barista your 6-digit code. Unused cups end with the month.</p>
              <a class="btn btn--link" href="https://wa.me/923100008242" target="_blank" rel="noopener">Message us on WhatsApp</a>
            </section>
          </div>`;
      }

      function openDrawer() {
        const d = $("#profile-drawer", el);
        $("[data-drawer-body]", d).innerHTML = drawerHtml().s;
        ui.openSheet(d);
      }

      const REWARD_LINES = { "passport-5": "fifth café", "passport-all": "every café", invite: "a friend joined", invited: "invited by a friend" };
      function recentRows(newId) {
        const rows = S.activity().slice(0, 3);
        if (!rows.length) return html`<li class="row"><div class="row__main row__meta">No cups used yet. Your first one is waiting.</div></li>`;
        return html`${rows.map((r) => {
          const c = S.cafe(r.cafeId);
          if (r.type !== "redeem") {
            const title = r.type === "gift" ? `Gift to ${r.toName || "a friend"}` : `Free cup: ${REWARD_LINES[r.reason] || "from the club"}`;
            const where = r.type === "gift" ? (c ? `For ${c.name}` : "For any partner café") : "Any partner café";
            return html`<li class="row${r.id === newId ? " enter" : ""}">
              <div class="row__main">
                <div class="row__title">${title}</div>
                <div class="row__meta">${where} · <span data-rel-time="${r.at}">${fmt.ago(r.at)}</span></div>
              </div>
              <span class="badge${r.type === "reward" ? " badge--accent" : ""}">${r.type === "reward" ? "+" : "−"}${fmt.cups(Math.abs(r.cups))}</span>
            </li>`;
          }
          return html`<li class="row${r.id === newId ? " enter" : ""}">
            <div class="row__main">
              <div class="row__title">${S.entryDrinkName(r)}</div>
              <div class="row__meta">${S.placeName(r.cafeId)}${r.topUp ? ` · ${fmt.rs(r.topUp)} top-up` : ""} · <span data-rel-time="${r.at}">${fmt.ago(r.at)}</span></div>
            </div>
            <span class="badge">${fmt.cups(r.credits)}</span>
          </li>`;
        })}`;
      }

      function paintRing() {
        const ring = $("[data-ring]", view);
        if (!ring) return;
        // Total cups across the plan, either type; read from the ledger
        // One brick per cup; used cups outlined (the brick ring, BRAND.md)
        const b = S.balance();
        const key = `${b.total}:${b.left}`;
        const bricks = $("[data-bricks]", ring);
        if (bricks.dataset.key && bricks.dataset.key !== key) bricks.innerHTML = ui.brickRing({ total: b.total, filled: Math.max(0, b.left), size: 248, radius: 104, length: 26 }).s;
        bricks.dataset.key = key;
        ui.animateNumber($("[data-ring-num]", ring), b.left, { duration: 700 });
        ring.setAttribute("aria-label", `${b.left} of ${b.total} cups left this month`);
      }

      /* Pass ------------------------------------------------------------ */
      const CD_C = 2 * Math.PI * 8;
      function passScreen() {
        const m = member();
        let timer = null, backTimer = null, lastCode = null;
        return {
          html: html`
            <div class="app-screen pass">
              <div class="stack" style="--stack-gap:var(--space-1)">
                <p class="eyebrow">Your pass</p>
                <h1 class="t-h2">${[m.firstName, m.lastName].filter(Boolean).join(" ")}</h1>
              </div>
              <div class="pass__card" data-pass-card></div>
              <p class="pass__note">${icon("sun")} Turn your brightness up if the scanner struggles.</p>
              ${LCC.sync ? LCC.sync.pill() : ""}
            </div>`.s,
          mount() {
            paintQrCard();
            timer = setInterval(tickCountdown, 250);
            return () => { clearInterval(timer); clearTimeout(backTimer); };
          },
          on: {
            pass: () => rotate(),
            redeem: ({ entry, member: who }) => { if (who.id === member().id) showSuccess(entry); },
            member: () => paintMeta(),
            ledger: () => paintMeta(),
            order: ({ memberId }) => { if (memberId !== member().id) return; const box = $("[data-pass-order]", view); if (box) box.innerHTML = orderHtml().s; },
          },
        };

        function paintQrCard() {
          const m2 = member();
          const plan = S.memberPlan(m2);
          const card = $("[data-pass-card]", view);
          card.innerHTML = html`
            <div class="pass-order" data-pass-order>${orderHtml()}</div>
            <div class="pass-ring">
              <div class="pass-ring__bricks" data-pass-ring>${passRing()}</div>
              <div class="qr" data-qr role="img" aria-label="QR code for your pass"></div>
            </div>
            <div class="countdown" aria-hidden="true">
              <svg viewBox="0 0 20 20"><circle class="track" cx="10" cy="10" r="8"/><circle class="bar" data-cd-bar cx="10" cy="10" r="8" stroke-dasharray="${CD_C.toFixed(2)}"/></svg>
              <span data-cd-text></span>
            </div>
            <p class="pass__code" data-code></p>
            <p class="t-small t-muted">Show this to the barista, or read them the code.</p>
            <div class="pass__meta">
              <div><p class="t-micro t-faint">Cups left</p><p class="t-h3 num"><span data-pass-cups>${S.balance().left}</span> of <span data-pass-total>${S.balance().total}</span></p></div>
              <div style="text-align:right"><p class="t-micro t-faint" data-pass-type>${plan.typeName}</p><p class="t-h3" data-pass-plan>${plan.name}</p></div>
            </div>
            <div class="pass__cafes" data-pass-cafes>${passCafes()}</div>`.s;
          lastCode = null;
          paintCode();
          tickCountdown();
        }

        /** The drink chosen in the app, with any top-up, shown above the QR. */
        function orderHtml() {
          const o = S.order();
          if (!o) return "";
          const item = S.menuItem(o.brandId, o.drinkId);
          const p = S.drinkPrice(o.brandId, item, o.temp);
          return html`
            <p class="t-micro t-faint">Your order at ${S.brand(o.brandId).name}</p>
            <p class="pass-order__drink">${S.drinkLabel(item, o.temp)}</p>
            <p class="t-small t-muted num">${p.included ? "Included in your cup" : `Cup + ${fmt.rs(p.topUp)}, paid at the till`}</p>
            <p class="pass-order__acts"><a class="btn btn--link" href="#/app/cafes/${o.brandId}">Change</a><button type="button" class="btn btn--link" data-clear-order>Order at the counter instead</button></p>`;
        }

        /** Caramel bricks around the QR: one per cup, used ones outlined. */
        function passRing() {
          const b = S.balance();
          return ui.brickRing({ total: b.total, filled: Math.max(0, b.left), size: 330, radius: 150, length: 26, twist: 12 });
        }

        /** Explorer: cafés used this month (“Kiln & Bean 2 of 2”).
            My cafés: each café's balance (“Kiln & Bean 3 of 6”).        */
        function passCafes() {
          const b = S.balance();
          const cap = store.getState().rules.explorerCapPerCafe;
          const brandLine = S.brandBalanceLine();
          if (brandLine) return html`<p class="pass__brand num">${brandLine}</p>`;
          if (b.type === "mycafes") {
            return html`<p class="t-micro t-faint">Reserved at</p>
              <ul role="list">${Object.entries(b.perCafe).filter(([, x]) => x.reserved).map(([id, x]) => html`<li><span>${S.cafe(id).name}</span> <span class="num">${x.left} of ${x.reserved}</span></li>`)}</ul>`;
          }
          const used = Object.entries(b.usedAt);
          return html`<p class="t-micro t-faint">Used this month · up to ${cap} at each café</p>
            ${used.length
              ? html`<ul role="list">${used.map(([id, n]) => html`<li><span>${S.cafe(id).name}</span> <span class="num">${n} of ${cap}</span></li>`)}</ul>`
              : html`<p class="t-small t-muted">No cups used yet. Your first one is waiting.</p>`}`;
        }

        // Plan change, redemption elsewhere or gift while the pass is open
        function paintMeta() {
          const m2 = member();
          const b = S.balance();
          const p = S.memberPlan(m2);
          const set = (sel, v) => { const n = $(sel, view); if (n) n.textContent = v; };
          set("[data-pass-cups]", b.left);
          set("[data-pass-total]", b.total);
          set("[data-pass-plan]", p.name);
          set("[data-pass-type]", p.typeName);
          const list = $("[data-pass-cafes]", view);
          if (list) list.innerHTML = passCafes().s;
          const ringEl = $("[data-pass-ring]", view);
          if (ringEl) ringEl.innerHTML = passRing().s;
        }

        function paintCode() {
          const p = S.pass();
          if (p.code === lastCode) return;
          lastCode = p.code;
          const qrEl = $("[data-qr]", view);
          if (qrEl) qrEl.innerHTML = ui.qrSvg(p.payload);
          const codeEl = $("[data-code]", view);
          if (codeEl) {
            codeEl.innerHTML = html`<span>${p.code.slice(0, 3)}</span><span>${p.code.slice(3)}</span>`.s;
            codeEl.setAttribute("aria-label", `Code ${p.code.split("").join(" ")}`);
          }
        }

        function rotate() {
          const qrEl = $("[data-qr]", view);
          if (!qrEl) return;
          qrEl.classList.add("is-rotating");
          setTimeout(() => { paintCode(); qrEl.classList.remove("is-rotating"); }, ui.reducedMotion() ? 0 : 180);
        }

        function tickCountdown() {
          const text = $("[data-cd-text]", view);
          if (!text) return;
          const p = S.pass();
          if (p.code !== lastCode) rotate(); // safety net if the rotation event was missed
          text.textContent = `Refreshes in ${fmt.countdown(p.secondsLeft)}`;
          $("[data-cd-bar]", view).setAttribute("stroke-dashoffset", (CD_C * (1 - p.secondsLeft / p.period)).toFixed(2));
        }

        function showSuccess(entry) {
          const card = $("[data-pass-card]", view);
          if (!card) return;
          const m2 = member();
          const cafe = S.cafe(entry.cafeId);
          const b = S.balance();
          const before = b.left + entry.credits;
          const here = S.cafeBalance(m2.id, entry.cafeId);
          const hereLine = entry.bonus ? "That was a free cup from the club"
            : here.type === "brand" ? `Your cups work at every ${cafe.name} branch`
            : here.type === "mycafes"
            ? `${here.left} of ${here.reserved} left at ${cafe.name}`
            : here.left > 0 ? `${here.left} more at ${cafe.name} this month` : `That’s your ${here.cap} at ${cafe.name} this month`;
          card.innerHTML = html`
            <div class="pass-success" role="status">
              <svg class="check-draw" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/><path d="M15 24.5l6 6 12-13" pathLength="1"/></svg>
              <p class="t-h2">Enjoy your coffee at ${cafe.name}.</p>
              ${entry.topUp ? html`<p class="t-body num">Pay ${fmt.rs(entry.topUp)} at the till for the difference.</p>` : ""}
              <p class="t-body t-muted">${S.entryDrinkName(entry)} · <span class="num" style="color:var(--ink);font-weight:500" data-success-cups data-value="${before}">${before}</span> of ${b.total} cups left</p>
              <p class="t-small t-faint num" data-success-here>${hereLine}</p>
              <button type="button" class="btn btn--secondary" data-pass-back style="margin-top:var(--space-3)">Back to my pass</button>
            </div>`.s;
          setTimeout(() => ui.animateNumber($("[data-success-cups]", view), b.left, { duration: 600 }), ui.reducedMotion() ? 0 : 450);
          clearTimeout(backTimer);
          backTimer = setTimeout(paintQrCard, 8000);
        }
      }

      /* Map ------------------------------------------------------------- */
      function pinStatus(c) {
        return mapMode === "now" ? c.status : S.usualStatus(c, USUAL_HOUR).status;
      }
      function pinLabel(c, status) {
        return mapMode === "now"
          ? `${S.placeName(c.id)}, ${fmt.statusLabel(status)}, ${fmt.updated(c.statusUpdatedAt)}`
          : `${S.placeName(c.id)}, usually ${fmt.statusLabel(status).toLowerCase()} at 6 pm`;
      }
      function pinHtml(c) {
        const p = project(c.x, c.y);
        const status = pinStatus(c);
        return html`<button type="button" class="pin${LABEL_SIDE[c.id] ? ` pin--${LABEL_SIDE[c.id]}` : ""}" data-pin="${c.id}" data-status="${status}"
            style="left:${(p.x / MAP_W * 100).toFixed(2)}%;top:${(p.y / MAP_H * 100).toFixed(2)}%" aria-label="${pinLabel(c, status)}">
            <span class="pin__dot">${ui.cupIcon(status, { size: 18, cls: "pin__icon" })}</span>
            <span class="pin__name" aria-hidden="true">${c.pinName || c.name}</span>
          </button>`;
      }
      function mapNote() {
        return mapMode === "now"
          ? html`Live from each café. Tap a pin for details.`
          : html`How busy each café usually is at 6 pm, from past weeks.`;
      }

      function mapScreen() {
        return {
          html: html`
            <div class="app-screen--flush">
              <div class="map-head">
                <h1 class="t-h2">Know before you go.</h1>
                ${ui.segmented({ name: "mapmode", label: "Map view", value: mapMode, options: [{ value: "now", label: "Now" }, { value: "usual", label: "Usually at 6 pm" }] })}
              </div>
              <div class="map" data-map>
                ${mapSvg()}
                <div data-pins>${S.cafes().map(pinHtml)}</div>
              </div>
              <div class="map-foot">
                <div class="legend" aria-hidden="true">
                  ${store.statuses.map((s) => html`<span>${ui.cupIcon(s, { size: 16, cls: "" })}${fmt.statusLabel(s)}</span>`)}
                </div>
                <p class="t-small t-muted" data-map-note aria-live="polite">${mapNote()}</p>
              </div>
            </div>`.s,
          on: {
            "cafe:status": ({ cafeId }) => {
              const c = S.cafe(cafeId);
              if (mapMode !== "now") return;
              const pin = $(`[data-pin="${cafeId}"]`, view);
              if (pin) {
                pin.dataset.status = c.status;
                $(".pin__icon", pin).outerHTML = ui.cupIcon(c.status, { size: 18, cls: "pin__icon" }).s;
                pin.setAttribute("aria-label", pinLabel(c, c.status));
                pin.classList.remove("is-changed"); void pin.offsetWidth; pin.classList.add("is-changed");
              }
              $("[data-map-note]", view).innerHTML = html`${c.name} is now ${fmt.statusLabel(c.status).toLowerCase()} · <span data-rel-time="${c.statusUpdatedAt}" data-rel-prefix="updated">${fmt.updated(c.statusUpdatedAt)}</span>`.s;
            },
            tick: () => {
              if (mapMode !== "now") return;
              $$("[data-pin]", view).forEach((pin) => { const c = S.cafe(pin.dataset.pin); pin.setAttribute("aria-label", pinLabel(c, c.status)); });
            },
          },
        };
      }

      function setMapMode(mode) {
        mapMode = mode;
        const pins = $("[data-pins]", view);
        if (!pins) return;
        pins.innerHTML = html`${S.cafes().map(pinHtml)}`.s;
        $("[data-map-note]", view).innerHTML = mapNote().s;
      }

      /* ---------------- Events ---------------- */
      const onClick = (e) => {
        const t = e.target;
        const tab = t.closest("[data-tab]");
        if (tab) { location.hash = hrefFor(tab.dataset.tab); return; }
        // Focus the button first, so closing the drawer returns there (Safari doesn't focus on tap)
        const pb = t.closest("[data-open-drawer]");
        if (pb) { pb.focus(); openDrawer(); return; }
        const cafeBtn = t.closest("[data-open-cafe], [data-pin]");
        if (cafeBtn) { openCafe(cafeBtn.dataset.openCafe || cafeBtn.dataset.pin); return; }
        const look = t.closest('[data-segmented="flavour"] .segmented__option, [data-segmented="mode"] .segmented__option');
        if (look) {
          const group = look.parentElement;
          ui.selectSegment(group, look.dataset.value);
          if (group.dataset.segmented === "flavour") LCC.theme.setFlavour(look.dataset.value);
          else LCC.theme.setMode(look.dataset.value);
          return;
        }
        const seg = t.closest('[data-segmented="mapmode"] .segmented__option');
        if (seg) { ui.selectSegment(seg.parentElement, seg.dataset.value); setMapMode(seg.dataset.value); return; }
        if (t.closest("[data-clear-order]")) { A.placeOrder({}); return; }
        if (t.closest("[data-pass-back]")) { active.cleanup?.(); active.cleanup = null; show(["pass"], { force: true }); return; }
        const start = t.closest("[data-start-plan]");
        if (start) { LCC.appPlan?.start({ addCafe: start.dataset.startPlan || null }); go("#/app/plan"); return; }
        const backBtn = t.closest("[data-back]");
        if (backBtn) { back(backBtn.dataset.back); return; }
        const dir = t.closest("[data-directions]");
        if (dir) {
          // BACKEND: deep link to the phone's maps app with the café's coordinates
          ui.toast(`Directions to ${S.placeName(dir.dataset.directions)} open in your maps app.`, { iconName: "pin" });
        }
      };

      // Tabs: arrows move and activate, Home/End jump
      const onKeydown = (e) => {
        const tab = e.target.closest?.("[data-tab]");
        if (!tab) return;
        const ids = TABS.map((t) => t.id);
        let i = ids.indexOf(tab.dataset.tab);
        if (e.key === "ArrowRight") i = (i + 1) % ids.length;
        else if (e.key === "ArrowLeft") i = (i - 1 + ids.length) % ids.length;
        else if (e.key === "Home") i = 0;
        else if (e.key === "End") i = ids.length - 1;
        else return;
        e.preventDefault();
        $(`[data-tab="${ids[i]}"]`, el).focus();
        location.hash = hrefFor(ids[i]);
      };

      el.addEventListener("click", onClick);
      el.addEventListener("keydown", onKeydown);

      // Store events go to whichever screen is showing
      const dispatch = (type) => (payload) => active.on?.[type]?.(payload);
      // The drawer's recent activity follows the ledger while it is open
      const offDrawer = store.on("ledger", ({ entries }) => {
        const mine = entries.filter((e) => e.memberId === member().id);
        const list = $("#profile-drawer [data-recent]", el);
        if (mine.length && list) list.innerHTML = recentRows(mine[mine.length - 1].id).s;
      });
      const offs = ["redeem", "ledger", "member", "plan", "builder", "cafe:status", "pass", "tick", "rsvp", "order"].map((type) => store.on(type, dispatch(type)));

      // Club milestones: a free cup, a new badge, a new status. Same words on every device.
      const REWARD_TOASTS = {
        "passport-5": "Fifth café on your passport. A free cup is on us.",
        "passport-all": "Every partner café on your passport. A free cup is on us.",
        invite: "A friend joined with your code. A free cup is on us.",
      };
      const earnedNow = () => { const c = S.club(); return { level: c.level.id, badges: c.badges.filter((b) => b.earned).map((b) => b.id) }; };
      let earned = earnedNow();
      offs.push(offDrawer);
      offs.push(store.on("ledger", ({ entries, catchUp }) => {
        const mine = entries.filter((e) => e.memberId === member().id);
        if (!mine.length) return;
        const before = earned;
        earned = earnedNow();
        if (catchUp) return; // a join snapshot: no replayed news
        mine.filter((e) => e.type === "reward" && REWARD_TOASTS[e.reason]).forEach((e) => ui.toast(REWARD_TOASTS[e.reason], { iconName: "gift", duration: 4200 }));
        const club = S.club();
        const news = earned.badges.filter((id) => !before.badges.includes(id)).map((id) => `Badge earned: ${club.badges.find((x) => x.id === id).name}.`);
        if (earned.level !== before.level) news.push(`You’re a ${club.level.name} now.`);
        // After the “cup redeemed” and free-cup notes, not before
        if (news.length) setTimeout(() => news.forEach((t) => ui.toast(t, { iconName: "award", duration: 4200 })), 700);
      }));
      // Presenter switched member (new member, or back to Mumtaz): redraw
      offs.push(store.on("session", () => {
        earned = earnedNow();
        show(LCC.router.parse().path, { force: true });
      }));
      // A cup redeemed while Mumtaz is on another tab still deserves a word
      offs.push(store.on("redeem", ({ entry, member: who }) => {
        if (who.id !== member().id || active.key === "pass") return;
        ui.toast(`Cup redeemed at ${S.cafe(entry.cafeId).name}. ${fmt.cups(S.balance(who.id).left)} left.`);
      }));

      // Another device filled this one in (join handshake): redraw, unless mid-purchase
      offs.push(store.on("snapshot", () => {
        if (!$(".phone__screen", el).classList.contains("is-flow")) show(LCC.router.parse().path, { force: true });
      }));

      api = { show };
      show(path);

      return () => {
        if (typeof active.cleanup === "function") active.cleanup();
        offs.forEach((off) => off());
        el.removeEventListener("click", onClick);
        el.removeEventListener("keydown", onKeydown);
        window.removeEventListener("resize", fit);
        api = null;
      };
    },
  });
})();

</script>
<script>
/* ---- src/app-cafes.js ---- */
/* =====================================================================
   Lahore Coffee Club — app-cafes.js
   Member app: Cafés tab (#/app/cafes) and café detail (#/app/cafes/:id).
   Registers screen factories on LCC.appScreens; app.js mounts them.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, $, $$, icon } = ui;
  const S = store.select;
  const REG = (LCC.appScreens = LCC.appScreens || {});
  const USUAL_HOUR = 18;
  const EXPLORER_GOAL = 5;

  // Search and filters survive a trip into a café and back
  const filters = { query: "", areaId: null, openNow: false, statuses: [], tags: [] };
  const PAGE = 6;
  let shown = PAGE;
  let listScroll = 0;

  // Matcha mode: matcha drinks first, and a small tag on cafés that serve it (read from the drinks)
  const matchaMode = () => LCC.theme?.flavour() === "matcha";
  const isMatcha = (d) => /matcha/i.test(d.name);
  const servesMatcha = (c) => c.drinks.some(isMatcha);

  /** Filters from the sheet that are on: one per choice, for “Filters · 2”. */
  const sheetCount = (f = filters) => (f.openNow ? 1 : 0) + f.statuses.length + f.tags.length;

  /* -------------------------------------------------------------------
     Cafés list: sticky search, area dropdown, Filters sheet, short rows
     ------------------------------------------------------------------- */
  REG.cafes = (ctx) => {
    const { view, el } = ctx;
    const areas = store.getState().areas;
    // Every tag a partner café uses, in a stable order
    const allTags = [...new Set(S.cafes().flatMap((c) => c.tags))].sort();
    let draft = null; // the sheet's choices until Apply
    let sheet = null;
    let painted = ""; // what the list shows (ids and open state), so the clock only repaints on a change
    const signature = (results) => `${shown}|${results.map((c) => `${c.id}:${S.openState(c).open ? 1 : 0}`).join(",")}`;

    function rowHtml(c) {
      const open = S.openState(c).open;
      return html`<li>
        <a class="cafe-line" href="#/app/cafes/${c.brandId || c.id}" aria-label="${c.name}, ${c.branch || S.area(c.area).name}${matchaMode() && servesMatcha(c) ? ", serves matcha" : ""}, ${fmt.statusLabel(c.status).toLowerCase()}, ${open ? "open" : "closed"}">
          <span class="cafe-line__name">${c.name}</span>
          <span class="cafe-line__area">${c.branch || S.area(c.area).name}</span>
          <span class="cafe-line__end" aria-hidden="true">
            ${matchaMode() && servesMatcha(c) ? html`<span class="badge badge--matcha">Matcha</span>` : ""}
            ${ui.statusPill(c.id, { bare: true, time: false })}
            <span class="cafe-line__open${open ? "" : " is-closed"}">${open ? "Open" : "Closed"}</span>
          </span>
        </a>
      </li>`;
    }

    function paintList() {
      const list = $("[data-cafe-list]", view);
      if (!list) return;
      const results = S.searchCafes(filters);
      painted = signature(results);
      const any = filters.query || filters.areaId || sheetCount();
      $("[data-cafe-count]", view).textContent = any ? `${results.length} of ${S.cafes().length} cafés` : `${S.cafes().length} partner cafés`;
      list.innerHTML = results.length
        ? html`${results.slice(0, shown).map(rowHtml)}`.s
        : html`<li class="cafes-empty">
            <p class="t-body">No cafés match that. Try another area.</p>
            ${any ? html`<button type="button" class="btn btn--secondary btn--compact" data-clear-filters>Clear search and filters</button>` : ""}
          </li>`.s;
      const more = $("[data-show-more]", view);
      more.hidden = results.length <= shown;
      more.textContent = `Show more (${Math.max(0, results.length - shown)})`;
      const n = sheetCount();
      const fb = $("[data-open-filters]", view);
      $("[data-filter-label]", fb).textContent = n ? `Filters · ${n}` : "Filters";
      fb.classList.toggle("is-on", n > 0);
      fb.setAttribute("aria-label", n ? `Filters, ${n} on` : "Filters");
      $("[data-clear-search]", view).hidden = !filters.query;
      $("[data-cafe-area]", view).value = filters.areaId || "";
    }

    // A new search or filter starts the list from the top again
    const refilter = () => { shown = PAGE; paintList(); };

    /* Filters sheet: lives on the phone screen (not in the scrolling view) */
    function sheetHtml() {
      const chip = (label, attrs, on) => html`<button type="button" class="chip" ${ui.raw(attrs)} aria-pressed="${on}">${label}</button>`;
      return html`
        <div class="sheet__scrim" data-sheet-close></div>
        <div class="sheet__panel">
          <div class="sheet__handle" aria-hidden="true"></div>
          <div class="sheet__body filters">
            <h2 class="t-h3" id="filters-title">Filters</h2>
            <div class="filters__row">
              <span id="f-open-l">Open now</span>
              <button type="button" class="toggle" role="switch" aria-labelledby="f-open-l" aria-checked="${draft.openNow}" data-f-open></button>
            </div>
            <fieldset class="filters__group">
              <legend class="eyebrow">Busy level</legend>
              <div class="cluster" style="--cluster-gap:var(--space-2)">
                ${store.statuses.map((st) => chip(html`${ui.cupIcon(st, { size: 14, cls: "" })}${fmt.statusLabel(st)}`, `data-f-status="${st}"`, draft.statuses.includes(st)))}
              </div>
            </fieldset>
            <fieldset class="filters__group">
              <legend class="eyebrow">What they offer</legend>
              <div class="cluster" style="--cluster-gap:var(--space-2)">
                ${allTags.map((t) => chip(t, `data-f-tag="${t}"`, draft.tags.includes(t)))}
              </div>
            </fieldset>
            <div class="filters__actions">
              <button type="button" class="btn btn--secondary" data-f-clear>Clear</button>
              <button type="button" class="btn btn--primary" data-f-apply>Apply</button>
            </div>
          </div>
        </div>`;
    }

    function openFilters() {
      draft = { openNow: filters.openNow, statuses: [...filters.statuses], tags: [...filters.tags] };
      sheet.innerHTML = sheetHtml().s;
      ui.openSheet(sheet);
    }

    function paintDraft() {
      $("[data-f-open]", sheet).setAttribute("aria-checked", String(draft.openNow));
      $$("[data-f-status]", sheet).forEach((b) => b.setAttribute("aria-pressed", String(draft.statuses.includes(b.dataset.fStatus))));
      $$("[data-f-tag]", sheet).forEach((b) => b.setAttribute("aria-pressed", String(draft.tags.includes(b.dataset.fTag))));
    }

    const toggleIn = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);

    function onSheetClick(e) {
      const t = e.target;
      if (t.closest("[data-f-open]")) { draft.openNow = !draft.openNow; paintDraft(); return; }
      const st = t.closest("[data-f-status]");
      if (st) { draft.statuses = toggleIn(draft.statuses, st.dataset.fStatus); paintDraft(); return; }
      const tag = t.closest("[data-f-tag]");
      if (tag) { draft.tags = toggleIn(draft.tags, tag.dataset.fTag); paintDraft(); return; }
      if (t.closest("[data-f-clear]")) { draft = { openNow: false, statuses: [], tags: [] }; paintDraft(); return; }
      if (t.closest("[data-f-apply]")) {
        Object.assign(filters, draft);
        ui.closeSheet(sheet);
        refilter();
      }
    }

    function onInput(e) {
      if (e.target.matches("[data-cafe-q]")) { filters.query = e.target.value; refilter(); }
    }
    function onChange(e) {
      if (e.target.matches("[data-cafe-area]")) { filters.areaId = e.target.value || null; refilter(); }
    }

    function onClick(e) {
      const t = e.target;
      // Focus the button first, so closing the sheet returns there (Safari doesn't focus on tap)
      const fb = t.closest("[data-open-filters]");
      if (fb) { fb.focus(); openFilters(); return; }
      if (t.closest("[data-show-more]")) {
        const first = shown;
        shown = S.searchCafes(filters).length;
        paintList();
        // Keep keyboard focus in the list: on the first new café
        $$("[data-cafe-list] a", view)[first]?.focus();
        return;
      }
      if (t.closest("[data-clear-search]")) { filters.query = ""; $("[data-cafe-q]", view).value = ""; refilter(); $("[data-cafe-q]", view).focus(); return; }
      if (t.closest("[data-clear-filters]")) {
        Object.assign(filters, { query: "", areaId: null, openNow: false, statuses: [], tags: [] });
        $("[data-cafe-q]", view).value = "";
        refilter();
        $("[data-cafe-q]", view).focus();
      }
    }

    return {
      html: html`
        <div class="app-screen cafes">
          <h1 class="t-h2">Cafés</h1>
          <div class="cafes__search">
            <div class="search">
              <label class="sr-only" for="cafe-q">Search by café name or area</label>
              ${icon("search", { size: 20 })}
              <input class="input search__input" id="cafe-q" type="search" data-cafe-q placeholder="Café name or area" autocomplete="off" enterkeyhint="search" value="${filters.query}">
              <button type="button" class="icon-btn search__clear" data-clear-search aria-label="Clear search" hidden>${icon("close", { size: 18 })}</button>
            </div>
          </div>
          <div class="cafes__tools">
            <div class="select">
              <label class="sr-only" for="cafe-area">Area</label>
              <select class="input" id="cafe-area" data-cafe-area>
                <option value="">All areas</option>
                ${areas.map((a) => html`<option value="${a.id}">${a.name}</option>`)}
              </select>
            </div>
            <button type="button" class="btn btn--secondary cafes__filters" data-open-filters aria-haspopup="dialog" aria-controls="filters-sheet">
              ${icon("sliders", { size: 18 })}<span data-filter-label>Filters</span>
            </button>
          </div>
          <div>
            <p class="sr-only" data-cafe-count aria-live="polite"></p>
            <ul role="list" class="cafe-lines" data-cafe-list></ul>
            <button type="button" class="btn btn--secondary btn--block cafes__more" data-show-more hidden>Show more</button>
          </div>
        </div>`.s,
      mount() {
        sheet = document.createElement("div");
        sheet.className = "sheet";
        sheet.id = "filters-sheet";
        sheet.setAttribute("role", "dialog");
        sheet.setAttribute("aria-modal", "true");
        sheet.setAttribute("aria-labelledby", "filters-title");
        sheet.setAttribute("aria-hidden", "true");
        $(".phone__screen", el).appendChild(sheet);
        sheet.addEventListener("click", onSheetClick);
        paintList();
        view.scrollTop = listScroll;
        view.addEventListener("input", onInput);
        view.addEventListener("change", onChange);
        view.addEventListener("click", onClick);
        document.addEventListener("lcc:flavour", paintList);
        return () => {
          document.removeEventListener("lcc:flavour", paintList);
          listScroll = view.scrollTop;
          ui.closeSheet(sheet);
          sheet.remove();
          view.removeEventListener("input", onInput);
          view.removeEventListener("change", onChange);
          view.removeEventListener("click", onClick);
        };
      },
      on: {
        // Status words update themselves; the list only changes when a filter depends on it
        "cafe:status": () => { if (filters.statuses.length) paintList(); },
        tick: () => { if (signature(S.searchCafes(filters)) !== painted) paintList(); }, // open / closed follows the clock
      },
    };
  };

  /* -------------------------------------------------------------------
     Café detail
     ------------------------------------------------------------------- */
  REG.cafeDetail = (ctx, cafeId) => {
    const { view } = ctx;
    const c = S.cafe(cafeId);
    const area = S.area(c.area);

    function visitsHtml() {
      const m = ctx.member();
      const total = (m.visits || {})[c.id] || 0;
      const loyal = S.loyalty(c.id);
      // Same source as the Club tab's passport and Explorer badge: the ledger
      const tried = S.club(m.id).passport.stamps.filter((x) => x.visited).map((x) => x.cafe.id);
      const beenHere = tried.includes(c.id);
      let explorer;
      if (tried.length >= EXPLORER_GOAL) explorer = "You’ve earned Explorer: five cafés tried.";
      else if (beenHere) explorer = `One of the ${tried.length} cafés you’ve tried. ${EXPLORER_GOAL - tried.length} more for the Explorer badge.`;
      else explorer = `New to you. A cup here makes ${tried.length + 1} of ${EXPLORER_GOAL} cafés for the Explorer badge.`;
      const exploredNow = Math.min(EXPLORER_GOAL, tried.length);
      return html`
        <div class="visits">
          <div class="visits__item">
            <div class="visits__head">
              <span class="row__title">${total ? `${total} ${total === 1 ? "visit" : "visits"} here` : "You haven’t been yet"}</span>
              <span class="t-small t-muted num">${loyal.visits} of ${loyal.goal} to a free cup</span>
            </div>
            ${meter(loyal.visits, loyal.goal, `${loyal.visits} of ${loyal.goal} visits to a free cup`)}
            ${loyal.freeCupsEarned ? html`<p class="t-micro t-faint">${fmt.cups(loyal.freeCupsEarned)} on the house so far.</p>` : ""}
          </div>
          <div class="visits__item">
            <div class="visits__head">
              <span class="row__title">Explorer</span>
              <span class="t-small t-muted num">${exploredNow} of ${EXPLORER_GOAL} cafés</span>
            </div>
            ${meter(exploredNow, EXPLORER_GOAL, `${exploredNow} of ${EXPLORER_GOAL} cafés tried`)}
            <p class="t-small t-muted">${explorer}</p>
          </div>
        </div>`;
    }

    function meter(value, goal, label) {
      return html`<div class="meter" role="img" aria-label="${label}">
        ${Array.from({ length: goal }, (_, i) => html`<span class="meter__seg${i < value ? " is-on" : ""}"></span>`)}
      </div>`;
    }

    /** What the member can use here, from the ledger, and the next step. */
    function actionHtml() {
      const here = S.cafeBalance(ctx.member().id, c.id);
      if (here.type === "mycafes") {
        return here.reserved
          ? html`<p class="t-small t-muted num" data-here-line><strong>${fmt.cups(here.left)} reserved here</strong>, of ${here.reserved} this month.</p>
              <button type="button" class="btn btn--secondary btn--block" data-start-plan="${c.id}">Change my cups</button>`
          : html`<p class="t-small t-muted" data-here-line><strong>Not in your plan.</strong> Add it?</p>
              <button type="button" class="btn btn--primary btn--block" data-start-plan="${c.id}">Add to my plan</button>`;
      }
      const line = here.left > 0
        ? html`<strong>You can have ${here.left === 1 ? "1 more" : `${here.left} more`} here this month</strong> on your Explorer plan.`
        : here.used >= here.cap
          ? html`<strong>You’ve had your ${here.cap} here this month.</strong> Every other partner café is still open to you.`
          : html`<strong>No cups left this month.</strong> Your plan renews on ${fmt.shortDate(ctx.member().renewsAt)}.`;
      return html`<p class="t-small t-muted num" data-here-line>${line}</p>
        <button type="button" class="btn btn--secondary btn--block" data-start-plan="${c.id}">Reserve cups here with My cafés</button>`;
    }

    function paintOpen() {
      const n = $("[data-open-state]", view);
      if (n) n.textContent = S.openState(c).label;
    }

    let onScroll = null;
    return {
      html: html`
        <div class="cafe-detail">
          <div class="screen-bar" data-screen-bar>
            <button type="button" class="icon-btn" data-back="#/app/cafes" aria-label="Back">${icon("arrowLeft")}</button>
            <span class="screen-bar__title" aria-hidden="true">${c.name}</span>
          </div>
          <div class="app-screen cafe-detail__body">
            <div class="stack" style="--stack-gap:var(--space-2)">
              <p class="eyebrow">${area.name} · ${c.distanceKm} km</p>
              <h1 class="t-h1" data-detail-title>${c.name}</h1>
              <p class="t-body t-muted">${c.blurb}</p>
            </div>
            <div class="cafe-detail__status">${ui.statusPill(c.id)}</div>

            <dl class="facts">
              <div><dt>${icon("clock", { size: 18 })}<span class="sr-only">Hours</span></dt><dd>${c.hours.label}<span class="t-faint"> · <span data-open-state>${S.openState(c).label}</span></span></dd></div>
              <div><dt>${ui.cupIcon(S.usualStatus(c, USUAL_HOUR).status, { size: 18, cls: "" })}<span class="sr-only">Typical</span></dt><dd>Usually ${fmt.statusLabel(S.usualStatus(c, USUAL_HOUR).status).toLowerCase()} at 6 pm</dd></div>
              <div><dt>${icon("store", { size: 18 })}<span class="sr-only">Price</span></dt><dd class="num">${fmt.rs(c.price)} a cup at the counter</dd></div>
            </dl>
            <div class="cluster" style="--cluster-gap:var(--space-2)">${c.tags.map((t) => html`<span class="badge">${t}</span>`)}</div>

            <section class="app-section" aria-labelledby="drinks-h">
              <h2 class="eyebrow app-section__title" id="drinks-h">Signature drinks</h2>
              <ul role="list">
                ${(matchaMode() ? [...c.drinks.filter(isMatcha), ...c.drinks.filter((d) => !isMatcha(d))] : c.drinks).map((d) => html`<li class="row">
                  <div class="row__main"><div class="row__title">${d.name}</div><div class="row__meta num">${fmt.rs(d.price)} at the counter</div></div>
                  <span class="badge${d.credits > 1 ? " badge--accent" : ""}">Uses ${fmt.cups(d.credits)}</span>
                </li>`)}
              </ul>
            </section>

            <section class="app-section" aria-labelledby="visits-h">
              <h2 class="eyebrow app-section__title" id="visits-h">Your visits</h2>
              <div data-visits>${visitsHtml()}</div>
            </section>
          </div>
          <div class="sticky-action" data-detail-action>${actionHtml()}</div>
        </div>`.s,
      mount() {
        // The bar shows the name once the big title scrolls away
        const bar = $("[data-screen-bar]", view);
        const title = $("[data-detail-title]", view);
        onScroll = () => bar.classList.toggle("is-titled", title.getBoundingClientRect().bottom < bar.getBoundingClientRect().bottom);
        view.addEventListener("scroll", onScroll, { passive: true });
        return () => view.removeEventListener("scroll", onScroll);
      },
      on: {
        redeem: ({ entry }) => { if (entry.memberId === ctx.member().id) $("[data-visits]", view).innerHTML = visitsHtml().s; },
        plan: () => { $("[data-detail-action]", view).innerHTML = actionHtml().s; },
        ledger: () => { $("[data-detail-action]", view).innerHTML = actionHtml().s; },
        tick: paintOpen,
      },
    };
  };
})();

</script>
<script>
/* ---- src/app-brand.js ---- */
/* =====================================================================
   Lahore Coffee Club — app-brand.js
   Member app: a brand partner's page (#/app/cafes/doubleshot, also
   reached from any branch's row or pin). Your cups, the drinks menu with
   a Hot / Iced toggle, ordering ("Use a cup"), branches and plans.

   Cups belong to the brand, not a branch: they work at every branch.
   Ordering only tells the counter what you'd like; the cup is spent when
   the counter redeems your code (store.actions.placeOrder / redeem).
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, $, $$, icon } = ui;
  const S = store.select;
  const A = store.actions;
  const REG = (LCC.appScreens = LCC.appScreens || {});

  let menuTemp = "hot"; // the menu's Hot / Iced toggle, kept between visits

  REG.brand = (ctx, brandId) => {
    const { view, el } = ctx;
    const b = S.brand(brandId);
    const cover = b.economics.coverUpTo;
    const sections = [...new Set(b.menu.map((d) => d.section))];
    let sheet = null;
    let picked = null; // { item, temp } while the order sheet is open
    let onScroll = null;

    const hasPlan = () => ctx.member().plan?.type === "brand" && ctx.member().plan.brandId === b.id;
    const left = () => (hasPlan() ? Math.max(0, S.balance().left) : 0);
    const priceTag = (item, temp) => {
      const p = S.drinkPrice(b.id, item, temp);
      return p.included ? html`<span class="badge">Included</span>` : html`<span class="badge badge--top num">Cup + ${fmt.rs(p.topUp)}</span>`;
    };

    /* ---------------- Your cups ---------------- */
    function cupsHtml() {
      const m = ctx.member();
      if (hasPlan()) {
        return html`<p class="brand-cups__line num">${S.brandBalanceLine()}</p>
          <p class="t-small t-muted num">${S.planLabel(m)} plan · renews on ${fmt.shortDate(m.renewsAt)}. Pick a drink below, or just show your pass at the counter.</p>`;
      }
      return html`<p class="brand-cups__line">One plan, all ${S.branches(b.id).length} branches.</p>
        <p class="t-small t-muted">${b.name} cups come with a ${b.name} plan and work at any branch.${m.plan ? ` Your ${S.planLabel(m)} plan covers the other partner cafés.` : ""}</p>
        <a class="btn btn--secondary btn--compact" href="#brand-plans" data-to-plans>See ${b.name} plans</a>`;
    }

    /* ---------------- Menu ---------------- */
    // Matcha mode puts the Matcha section first; coffee keeps the brand's order
    const menuSections = () => (LCC.theme?.flavour() === "matcha"
      ? [...sections.filter((x) => /matcha/i.test(x)), ...sections.filter((x) => !/matcha/i.test(x))]
      : sections);
    function menuHtml() {
      return html`${menuSections().map((sec) => {
        const items = b.menu.filter((d) => d.section === sec && d[menuTemp] != null);
        if (!items.length) return "";
        return html`<section class="menu-sec" aria-label="${sec}">
          <h3 class="eyebrow menu-sec__title">${sec}</h3>
          <ul role="list">
            ${items.map((d) => html`<li>
              <button type="button" class="menu-row" data-drink="${d.id}" aria-haspopup="dialog" aria-controls="order-sheet">
                <span class="menu-row__main">
                  <span class="row__title">${S.drinkLabel(d, menuTemp)}</span>
                  <span class="row__meta num">${fmt.rs(d[menuTemp])}${d.hot != null && d.iced != null ? "" : ` · ${d.hot != null ? "hot only" : "iced only"}`}</span>
                </span>
                ${priceTag(d, menuTemp)}
              </button>
            </li>`)}
          </ul>
        </section>`;
      })}`;
    }

    /* ---------------- Branches ---------------- */
    function branchesHtml() {
      return html`<ul role="list">
        ${S.branches(b.id).map((c) => {
          const open = S.openState(c);
          return html`<li>
            <button type="button" class="row branch-row" data-open-cafe="${c.id}" aria-label="${c.branch}. ${open.label}. ${fmt.statusLabel(c.status)}. Details">
              <span class="row__main">
                <span class="row__title">${c.branch}</span>
                <span class="row__meta num">${open.label} · ${c.distanceKm} km</span>
              </span>
              ${ui.statusPill(c.id, { bare: true, time: false })}
            </button>
          </li>`;
        })}
      </ul>`;
    }

    /* ---------------- Plans ---------------- */
    function plansHtml() {
      const cur = ctx.member().plan;
      return html`<ul role="list" class="brand-plans">
        ${b.plans.map((p) => {
          const mine = cur?.type === "brand" && cur.brandId === b.id && cur.planId === p.id;
          return html`<li class="card brand-plan${mine ? " is-mine" : ""}">
            <div class="brand-plan__head">
              <span class="t-h3 num">${fmt.cups(p.cups)}</span>
              ${mine ? html`<span class="badge badge--accent">Your plan</span>` : ""}
              <span class="t-h3 num brand-plan__price">${fmt.rs(p.price)}</span>
            </div>
            <p class="t-small t-muted num">About ${fmt.rs(p.price / p.cups)} a cup, at any branch, every month.</p>
            ${mine ? "" : html`<button type="button" class="btn btn--secondary btn--block" data-brand-plan="${p.id}">Choose ${p.cups} cups</button>`}
          </li>`;
        })}
      </ul>`;
    }

    /* ---------------- Order sheet ---------------- */
    function sheetHtml() {
      const { item, temp } = picked;
      const p = S.drinkPrice(b.id, item, temp);
      const both = item.hot != null && item.iced != null;
      const canUse = hasPlan() && left() > 0;
      return html`
        <div class="sheet__scrim" data-sheet-close></div>
        <div class="sheet__panel">
          <div class="sheet__handle" aria-hidden="true"></div>
          <div class="sheet__body order-sheet">
            <div class="stack" style="--stack-gap:var(--space-1)">
              <p class="eyebrow">${item.section}</p>
              <h2 class="t-h2" id="order-title" data-order-name>${S.drinkLabel(item, temp)}</h2>
              <p class="t-small t-muted num" data-order-price>${fmt.rs(p.price)} at the counter</p>
            </div>
            ${both
              ? ui.segmented({ name: "ordertemp", label: "Hot or iced", value: p.temp, options: [{ value: "hot", label: "Hot" }, { value: "iced", label: "Iced" }] })
              : html`<p class="t-small t-muted">${item.hot != null ? "Served hot." : "Served iced."}</p>`}
            <p class="order-sheet__cover num" data-order-cover>${p.included ? "Included in your cup." : `Cup + ${fmt.rs(p.topUp)}. A cup covers up to ${fmt.rs(cover)}; you pay the difference at the till.`}</p>
            ${canUse
              ? html`<button type="button" class="btn btn--primary btn--block" data-use-cup>Use a cup</button>
                  <p class="t-micro t-faint">The counter sees your drink when they scan your pass. Nothing is spent until they do.</p>`
              : html`<p class="t-small t-muted">${hasPlan() ? "No cups left this month. Your plan renews soon." : `Choose a ${b.name} plan to use cups for this.`}</p>
                  ${hasPlan() ? "" : html`<button type="button" class="btn btn--primary btn--block" data-sheet-to-plans>See ${b.name} plans</button>`}`}
            <button type="button" class="btn btn--link" data-skip-order>Skip, I’ll order at the counter</button>
          </div>
        </div>`;
    }

    function openOrder(btn, drinkId) {
      const item = S.menuItem(b.id, drinkId);
      picked = { item, temp: S.servedTemp(item, menuTemp) };
      btn.focus(); // closing returns here (Safari doesn't focus on tap)
      sheet.innerHTML = sheetHtml().s;
      ui.openSheet(sheet);
    }
    function paintOrder() {
      const { item, temp } = picked;
      const p = S.drinkPrice(b.id, item, temp);
      $("[data-order-name]", sheet).textContent = S.drinkLabel(item, temp);
      $("[data-order-price]", sheet).textContent = `${fmt.rs(p.price)} at the counter`;
      $("[data-order-cover]", sheet).textContent = p.included ? "Included in your cup." : `Cup + ${fmt.rs(p.topUp)}. A cup covers up to ${fmt.rs(cover)}; you pay the difference at the till.`;
    }
    const toPlans = () => $("#brand-plans", view)?.scrollIntoView({ block: "start", behavior: ui.reducedMotion() ? "auto" : "smooth" });

    function onSheetClick(e) {
      const seg = e.target.closest('[data-segmented="ordertemp"] .segmented__option');
      if (seg) { ui.selectSegment(seg.parentElement, seg.dataset.value); picked.temp = seg.dataset.value; paintOrder(); return; }
      if (e.target.closest("[data-use-cup]")) {
        A.placeOrder({ brandId: b.id, drinkId: picked.item.id, temp: picked.temp });
        ctx.go("#/app/pass");
        return;
      }
      if (e.target.closest("[data-skip-order]")) { A.placeOrder({}); ctx.go("#/app/pass"); return; }
      if (e.target.closest("[data-sheet-to-plans]")) { ui.closeSheet(sheet); toPlans(); }
    }

    function onClick(e) {
      const seg = e.target.closest('[data-segmented="menutemp"] .segmented__option');
      if (seg) {
        if (seg.dataset.value === menuTemp) return;
        menuTemp = seg.dataset.value;
        ui.selectSegment(seg.parentElement, menuTemp);
        $("[data-menu]", view).innerHTML = menuHtml().s;
        return;
      }
      const d = e.target.closest("[data-drink]");
      if (d) { openOrder(d, d.dataset.drink); return; }
      if (e.target.closest("[data-to-plans]")) { e.preventDefault(); toPlans(); return; }
      const pl = e.target.closest("[data-brand-plan]");
      if (pl) { LCC.appPlan?.start({ mode: "brand", brandPlanId: pl.dataset.brandPlan }); ctx.go("#/app/plan"); }
    }

    const repaintMine = () => {
      const set = (sel, markup) => { const n = $(sel, view); if (n) n.innerHTML = markup.s; };
      set("[data-brand-cups]", cupsHtml());
      set("[data-brand-plans]", plansHtml());
    };

    return {
      html: html`
        <div class="cafe-detail brand-page">
          <div class="screen-bar" data-screen-bar>
            <button type="button" class="icon-btn" data-back="#/app/cafes" aria-label="Back">${icon("arrowLeft")}</button>
            <span class="screen-bar__title" aria-hidden="true">${b.name}</span>
          </div>
          <div class="app-screen brand">
            <div class="brand__head">
              <span class="monogram" aria-hidden="true">${b.monogram}</span>
              <div class="stack" style="--stack-gap:var(--space-1)">
                <p class="eyebrow">Partner · ${S.branches(b.id).length} branches</p>
                <h1 class="t-h1" data-detail-title>${b.name}</h1>
              </div>
            </div>
            <p class="t-body t-muted">${b.line}</p>
            <div class="card brand-cups" data-brand-cups>${cupsHtml()}</div>

            <section class="app-section" aria-labelledby="menu-h">
              <div class="brand__bar">
                <h2 class="eyebrow" id="menu-h">Drinks</h2>
                ${ui.segmented({ name: "menutemp", label: "Hot or iced drinks", value: menuTemp, options: [{ value: "hot", label: "Hot" }, { value: "iced", label: "Iced" }] })}
              </div>
              <p class="t-small t-muted num">A cup covers any drink up to ${fmt.rs(cover)}. Above that, you pay the difference at the till.</p>
              <div data-menu>${menuHtml()}</div>
              <p class="t-micro t-faint">${b.menuNote}</p>
            </section>

            <section class="app-section" aria-labelledby="branches-h">
              <h2 class="eyebrow app-section__title" id="branches-h">Branches</h2>
              <div data-branches>${branchesHtml()}</div>
            </section>

            <section class="app-section" id="brand-plans" aria-labelledby="plans-h">
              <h2 class="eyebrow app-section__title" id="plans-h">${b.name} plans</h2>
              <div data-brand-plans>${plansHtml()}</div>
            </section>
          </div>
        </div>`.s,
      mount() {
        sheet = document.createElement("div");
        sheet.className = "sheet";
        sheet.id = "order-sheet";
        sheet.setAttribute("role", "dialog");
        sheet.setAttribute("aria-modal", "true");
        sheet.setAttribute("aria-labelledby", "order-title");
        sheet.setAttribute("aria-hidden", "true");
        $(".phone__screen", el).appendChild(sheet);
        sheet.addEventListener("click", onSheetClick);
        view.addEventListener("click", onClick);
        // The bar shows the name once the big title scrolls away
        const bar = $("[data-screen-bar]", view);
        const title = $("[data-detail-title]", view);
        onScroll = () => bar.classList.toggle("is-titled", title.getBoundingClientRect().bottom < bar.getBoundingClientRect().bottom);
        view.addEventListener("scroll", onScroll, { passive: true });
        const onFlavour = () => { const n = $("[data-menu]", view); if (n) n.innerHTML = menuHtml().s; };
        document.addEventListener("lcc:flavour", onFlavour);
        return () => {
          ui.closeSheet(sheet);
          sheet.remove();
          view.removeEventListener("click", onClick);
          view.removeEventListener("scroll", onScroll);
          document.removeEventListener("lcc:flavour", onFlavour);
        };
      },
      on: {
        ledger: repaintMine,
        member: repaintMine,
        plan: repaintMine,
        tick: () => { const n = $("[data-branches]", view); if (n) n.innerHTML = branchesHtml().s; },
      },
    };
  };
})();

</script>
<script>
/* ---- src/app-plan.js ---- */
/* =====================================================================
   Lahore Coffee Club — app-plan.js
   Member app: plan picker (#/app/plan) and simulated payment
   (#/app/plan/pay). Prices always come from store.select.quote(), which
   uses select.customPrice() for My cafés: one source of truth for
   this screen, the landing teaser and #/kit.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, raw, $, $$, icon } = ui;
  const S = store.select;
  const A = store.actions;
  const REG = (LCC.appScreens = LCC.appScreens || {});
  const rules = () => store.getState().rules;

  /* -------------------------------------------------------------------
     Draft: what the member is about to buy. The custom allocation is the
     store's builder, so the kit's builder shows the same numbers.
     ------------------------------------------------------------------- */
  // mode: "explorer" (fixed tiers, one pool), "mycafes" (cups reserved per café)
  // or "brand" (one brand's plan, any of its branches: Double Shot)
  const draft = { started: false, mode: "explorer", tierId: "regular", highlight: null, brandId: "doubleshot", brandPlanId: "ds15" };
  const DEFAULT_ADD = 2; // cups added for a café chosen from its detail page

  const pay = {
    method: "jazzcash",
    phone: "",
    card: { number: "", exp: "", cvc: "" },
    phase: "form", // form | processing | success | failed
    result: null,
    forMember: null, // whose number pre-fills the wallet field
  };
  const onboarding = () => !!LCC.onboarding?.active();

  /** mode: open on "explorer" or "mycafes". keepBuilder: keep the builder as it is
      (the landing teaser hands over its cups) instead of loading the current plan. */
  function start({ addCafe = null, mode = null, keepBuilder = false, brandPlanId = null } = {}) {
    const st = store.getState();
    const cur = S.member().plan;
    draft.started = true;
    draft.mode = mode || (addCafe ? "mycafes" : cur?.type || "explorer");
    draft.tierId = cur?.tierId || "regular";
    draft.brandPlanId = brandPlanId || (cur?.type === "brand" ? cur.planId : "ds15");
    draft.highlight = addCafe;
    if (cur?.type === "mycafes" && !keepBuilder) A.setBuilder(cur.allocation);
    if (addCafe && !st.builder[addCafe]) A.setBuilderCups(addCafe, DEFAULT_ADD);
    pay.phase = "form";
    if (pay.forMember !== S.member().id) {
      pay.forMember = S.member().id;
      pay.phone = formatPhone(String(S.member().phone || "").replace(/^\+92\s?/, "0"));
    }
  }
  LCC.appPlan = { start, draft };

  const draftPlan = () =>
    draft.mode === "brand"
      ? { type: "brand", brandId: draft.brandId, planId: draft.brandPlanId }
      : draft.mode === "explorer"
      ? { type: "explorer", tierId: draft.tierId }
      : { type: "mycafes", allocation: { ...store.getState().builder } };

  const isCurrent = () => S.isCurrentPlan(draftPlan());
  const whyMinimum = () =>
    `Plans start at ${rules().minCupsTotal} cups a month, so every café can count on you as a regular.`;

  /* -------------------------------------------------------------------
     Plan picker
     ------------------------------------------------------------------- */
  REG.plan = (ctx) => {
    const { view } = ctx;
    if (!draft.started) start();
    const m = ctx.member();

    function tiersHtml() {
      const cur = S.member().plan;
      return html`
        <p class="t-small t-muted plan-intro">One pool of cups for any partner café, up to ${rules().explorerCapPerCafe} a month at each. Good for trying new places.</p>
        <fieldset class="tier-list">
          <legend class="sr-only">Explorer plans</legend>
          ${store.getState().tiers.map((t) => html`
            <label class="card tier">
              <input class="sr-only" type="radio" name="tier" value="${t.id}" ${draft.tierId === t.id ? raw("checked") : ""}>
              <span class="tier__head">
                <span class="t-h3">${t.name}</span>
                ${cur?.type === "explorer" && cur.tierId === t.id ? html`<span class="badge badge--accent">Your plan</span>` : ""}
                <span class="tier__price t-h3 num">${fmt.rs(t.price)}</span>
              </span>
              <span class="tier__meta t-small t-muted num">${fmt.cups(t.cups)} a month · ${t.line}</span>
              <span class="t-micro t-faint num">About ${fmt.rs(t.price / t.cups)} a cup, at any partner café</span>
            </label>`)}
        </fieldset>`;
    }

    function builderRowHtml(c) {
      const n = store.getState().builder[c.id] || 0;
      const max = rules().maxCupsPerCafe;
      return html`<li class="row builder-row${draft.highlight === c.id ? " is-new" : ""}" data-builder-row="${c.id}">
        <div class="row__main">
          <div class="row__title">${c.name}</div>
          <div class="row__meta num" data-row-meta>${rowMeta(c, n)}</div>
        </div>
        ${ui.stepper({ id: c.id, value: n, min: 0, max, label: `Cups a month at ${c.name}` })}
      </li>`;
    }

    function rowMeta(c, n) {
      const per = c.price * rules().customDiscount;
      if (n >= rules().maxCupsPerCafe) return `${n} a month, the most at one café`;
      return `${S.area(c.area).name} · ${fmt.rs(per)} a cup, ${fmt.rs(c.price)} at the counter`;
    }

    function brandPlansHtml() {
      const b = S.brand(draft.brandId);
      const cur = S.member().plan;
      return html`
        <p class="t-small t-muted plan-intro">Cups for ${b.name}, at any of its ${S.branches(b.id).length} branches. A cup covers any drink up to ${fmt.rs(b.economics.coverUpTo)}; above that you pay the difference at the till.</p>
        <fieldset class="tier-list">
          <legend class="sr-only">${b.name} plans</legend>
          ${b.plans.map((p) => html`
            <label class="card tier">
              <input class="sr-only" type="radio" name="dsplan" value="${p.id}" ${draft.brandPlanId === p.id ? raw("checked") : ""}>
              <span class="tier__head">
                <span class="t-h3 num">${fmt.cups(p.cups)}</span>
                ${cur?.type === "brand" && cur.planId === p.id ? html`<span class="badge badge--accent">Your plan</span>` : ""}
                <span class="tier__price t-h3 num">${fmt.rs(p.price)}</span>
              </span>
              <span class="t-micro t-faint num">About ${fmt.rs(p.price / p.cups)} a cup, at any ${b.name} branch</span>
            </label>`)}
        </fieldset>`;
    }

    function builderHtml() {
      return html`
        <p class="t-small t-muted plan-intro">Reserve cups at the cafés you love, up to ${rules().maxCupsPerCafe} a month at each. They can only be used there. You pay ${Math.round(rules().customDiscount * 100)}% of the counter price.</p>
        <ul role="list" class="builder-list">${S.clubCafes().map(builderRowHtml)}</ul>`;
    }

    function paintBody() {
      $("[data-plan-body]", view).innerHTML = (draft.mode === "brand" ? brandPlansHtml() : draft.mode === "explorer" ? tiersHtml() : builderHtml()).s;
    }

    function paintSummary(animate = true) {
      const q = S.quote(draftPlan());
      const cupsEl = $("[data-sum-cups]", view);
      const priceEl = $("[data-sum-price]", view);
      if (animate) { ui.animateNumber(cupsEl, q.cups); ui.animateNumber(priceEl, q.price, { format: fmt.rs }); }
      else { cupsEl.textContent = q.cups; cupsEl.dataset.value = q.cups; priceEl.textContent = fmt.rs(q.price); priceEl.dataset.value = q.price; }
      $("[data-sum-cups-word]", view).textContent = q.cups === 1 ? "cup a month" : "cups a month";

      const note = $("[data-sum-note]", view);
      const btn = $("[data-continue]", view);
      let text, warn = false, ok = true;
      if (!q.meetsMinimum) {
        text = `Add ${fmt.cups(q.cupsShort)} to continue. ${whyMinimum()}`;
        warn = true; ok = false;
      } else if (isCurrent()) {
        text = `You’re on this plan. It renews on ${fmt.shortDate(m.renewsAt)}.`;
        ok = false;
      } else if (draft.mode === "brand") {
        text = `About ${fmt.rs(q.perCup)} a cup, at any ${q.typeName} branch`;
      } else {
        text = `You save ${draft.mode === "explorer" ? "about " : ""}${fmt.rs(q.savings)} vs paying at the counter`;
      }
      note.textContent = text;
      note.classList.toggle("is-warn", warn);
      note.classList.toggle("is-save", ok);
      btn.disabled = !ok;
    }

    function onClick(e) {
      const seg = e.target.closest('[data-segmented="plantype"] .segmented__option');
      if (seg) {
        if (draft.mode === seg.dataset.value) return;
        ui.selectSegment(seg.parentElement, seg.dataset.value);
        draft.mode = seg.dataset.value;
        paintBody();
        paintSummary();
        return;
      }
      const step = e.target.closest("[data-step]");
      if (step) {
        const id = step.closest("[data-stepper]").dataset.stepper;
        A.setBuilderCups(id, (store.getState().builder[id] || 0) + Number(step.dataset.step));
        return;
      }
      if (e.target.closest("[data-continue]")) {
        pay.phase = "form";
        ctx.go("#/app/plan/pay");
      }
    }

    function onChange(e) {
      if (e.target.name === "dsplan") { draft.brandPlanId = e.target.value; paintSummary(); return; }
      if (e.target.name !== "tier") return;
      draft.tierId = e.target.value;
      paintSummary();
    }

    return {
      html: html`
        <div class="flow">
          <div class="screen-bar">
            <button type="button" class="icon-btn" data-back="${onboarding() ? "#/app/welcome" : "#/app"}" aria-label="Back">${icon("arrowLeft")}</button>
            ${onboarding() ? html`<span class="t-small t-faint">Step 5 of 6</span>` : ""}
          </div>
          <div class="app-screen flow__body">
            <div class="stack" style="--stack-gap:var(--space-2)">
              <h1 class="t-h2">Choose your plan</h1>
              ${m.plan
                ? html`<p class="t-small t-muted num">You’re on ${S.planLabel(m)}, ${S.balance().left} of ${S.balance().total} cups left. A new plan starts fresh today; unused cups don’t carry over.</p>`
                : html`<p class="t-small t-muted">Two ways to drink well. Your month starts the day you pay, and you can change plans whenever you like.</p>`}
            </div>
            ${ui.segmented({ name: "plantype", label: "Plan type", value: draft.mode, options: [{ value: "explorer", label: "Explorer" }, { value: "mycafes", label: "My cafés" }, { value: "brand", label: S.brand(draft.brandId).name }] })}
            <div data-plan-body></div>
          </div>
          <div class="summary-bar" role="region" aria-label="Plan summary">
            <div class="summary-bar__nums">
              <p class="t-small"><span class="num summary-bar__cups" data-sum-cups>0</span> <span data-sum-cups-word>cups a month</span></p>
              <p class="t-h2 num" data-sum-price aria-live="polite">Rs 0</p>
            </div>
            <p class="t-small t-muted summary-bar__note" data-sum-note aria-live="polite"></p>
            <button type="button" class="btn btn--primary btn--block" data-continue>Continue to payment</button>
          </div>
        </div>`.s,
      mount() {
        paintBody();
        paintSummary(false);
        if (draft.highlight && draft.mode === "mycafes") {
          const row = $(`[data-builder-row="${draft.highlight}"]`, view);
          requestAnimationFrame(() => row?.scrollIntoView({ block: "center", behavior: ui.reducedMotion() ? "auto" : "smooth" }));
        }
        view.addEventListener("click", onClick);
