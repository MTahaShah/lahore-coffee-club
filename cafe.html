/* ---------------------------------------------------------------------
   1. Tokens (light): docs/BRAND.md. The base is black, white and cream in
   both modes. The coffee palette is for small accents only (the brick
   ring, the QR ring, the monogram's bricks, the active tab, the savings
   line, eyebrows, one highlight per screen), never for large surfaces.
   --------------------------------------------------------------------- */
:root {
  color-scheme: light;

  /* Fixed in both modes */
  --black: #0B0B0B;
  --white: #FFFFFF;
  --cream: #FFF7E8;
  --accent: #CFAB71;         /* caramel */
  --accent-deep: #713105;    /* cinnamon */
  --espresso: #341100;
  --mocha: #7F5E35;
  --roast: #4F351C;

  /* Neutrals */
  --bg: #FFF7E8;
  --surface: #FFFFFF;
  --surface-2: #F4EFE6;
  --ink: #0B0B0B;
  --ink-2: #4D4A45;
  --ink-3: #8A857D;
  --ink-4: #B5AFA5;          /* placeholders and decoration only */
  --line: #E6E0D6;
  --line-strong: #D3CCC0;
  --primary: #0B0B0B;        /* buttons, selected states: black on light */
  --primary-hover: #2A2927;
  --on-primary: #FFFFFF;
  --primary-soft: #F4EFE6;   /* selected chips, earned badges (neutral) */
  --accent-text: #713105;    /* the only coffee colour for text on light */
  --danger: #A33D24;         /* validation text, not a status */
  --status-quiet: #4E7D5B;
  --status-moderate: #C9962B;
  --status-packed: #B5503C;
  --bezel: #0B0B0B;
  --scrim: rgba(11, 11, 11, 0.32);
  --shadow-float: none;      /* hairlines, no shadows */

  /* Logos: wordmark and LCC in ink; the ring's bricks keep coffee tones */
  --logo-ink: var(--ink);
  --logo-face: #4F351C;
  --logo-side: #341100;
  --logo-top: #7F5E35;

  /* Type */
  --font-sans: "Glacial Indifference", "Century Gothic", Futura, system-ui, sans-serif;
  --font-urdu: "29LT Bukra", "Noto Sans Arabic", sans-serif;
  --fs-12: 12px;
  --fs-14: 14px;
  --fs-16: 16px;
  --fs-20: 20px;
  --fs-28: 28px;
  --fs-40: 40px;
  --fs-64: 64px;
  --lh-body: 1.5;
  --lh-tight: 1.08;
  --lh-snug: 1.15;
  --measure: 60ch;
  --track-caps: 0.3em;

  /* Spacing (8px grid) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --space-10: 128px;

  /* Shape */
  --radius-card: 12px;
  --radius-pill: 999px;
  --radius-sheet: 20px;
  --radius-sm: 8px;
  --hairline: 1px solid var(--line);
  --tap: 44px;

  /* Motion */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-1: 200ms;
  --dur-2: 260ms;
  --dur-3: 300ms;

  /* Layout */
  --proto-h: 40px;
  --gutter: clamp(16px, 4vw, 48px);
  --container: 1200px;
}

/* ---------------------------------------------------------------------
   2. Tokens (dark): black background, cream text, the same small accents.
   System preference unless forced light; also forced by the toggle, and
   used on surfaces that are always dark (.theme-dark, the pass screen).
   --------------------------------------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B0B0B;
    --surface: #151515;
    --surface-2: #1E1D1B;
    --ink: #FFF7E8;
    --ink-2: #BDB7AD;
    --ink-3: #807B74;
    --ink-4: #5E5A54;
    --line: #2A2927;
    --line-strong: #3A3835;
    --hairline: 1px solid var(--line);
    --primary: #FFF7E8;          /* buttons: cream on dark */
    --primary-hover: #F4EFE6;
    --on-primary: #0B0B0B;
    --primary-soft: #1E1D1B;
    --accent-text: #CFAB71;
    --danger: #E9A08A;
    --status-quiet: #79A784;
    --status-moderate: #D4A548;
    --status-packed: #D27560;
    --bezel: #2A2927;
    --scrim: rgba(0, 0, 0, 0.6);
    /* Logo on dark */
    --logo-ink: var(--ink);
    --logo-face: #CFAB71;
    --logo-side: #7F5E35;
    --logo-top: #4F351C;
}
}

:root[data-theme="dark"], .theme-dark {
  color-scheme: dark;
  --bg: #0B0B0B;
  --surface: #151515;
  --surface-2: #1E1D1B;
  --ink: #FFF7E8;
  --ink-2: #BDB7AD;
  --ink-3: #807B74;
  --ink-4: #5E5A54;
  --line: #2A2927;
  --line-strong: #3A3835;
  --hairline: 1px solid var(--line);
  --primary: #FFF7E8;          /* buttons: cream on dark */
  --primary-hover: #F4EFE6;
  --on-primary: #0B0B0B;
  --primary-soft: #1E1D1B;
  --accent-text: #CFAB71;
  --danger: #E9A08A;
  --status-quiet: #79A784;
  --status-moderate: #D4A548;
  --status-packed: #D27560;
  --bezel: #2A2927;
  --scrim: rgba(0, 0, 0, 0.6);
  /* Logo on dark */
  --logo-ink: var(--ink);
  --logo-face: #CFAB71;
  --logo-side: #7F5E35;
  --logo-top: #4F351C;
}

/* ---------------------------------------------------------------------
   2b. Matcha mode: a second flavour for the member app only. router.js
   sets data-flavour="matcha" on <html> on #/app routes when the member
   picks it (the café view and landing stay coffee). Colour tokens only;
   coffee above stays the default. One muted green accent: #6E8B3D for
   rings and bars, #4E6A25 where it is text (AA on every light surface).
   Status colours are unchanged.
   --------------------------------------------------------------------- */
:root[data-flavour="matcha"] {
  --black: #111611;
  --cream: #F4F2E7;
  --accent: #6E8B3D;         /* ceremonial matcha */
  --accent-deep: #3F5A22;
  --espresso: #1E261B;
  --mocha: #5E7236;
  --roast: #2F4220;

  --bg: #F4F2E7;             /* whisked milk */
  --surface: #FBFAF3;
  --surface-2: #EAE8DA;
  --ink: #1E261B;            /* tea leaf */
  --ink-2: #464F40;
  --ink-3: #5F6758;
  --ink-4: #A9AE9E;          /* placeholders and decoration only */
  --line: #D9DDC9;           /* soft sage */
  --line-strong: #C3C9AF;
  --primary: #1E261B;
  --primary-hover: #333D2E;
  --on-primary: #FBFAF3;
  --primary-soft: #EAE8DA;
  --accent-text: #4E6A25;
  --bezel: #1E261B;
  --scrim: rgba(17, 22, 17, 0.32);
  --logo-face: #3F5A22;
  --logo-side: #26361A;
  --logo-top: #6E8B3D;
}
@media (prefers-color-scheme: dark) {
  :root[data-flavour="matcha"]:not([data-theme="light"]) {
    --bg: #111611;
    --surface: #182018;
    --surface-2: #202A1F;
    --ink: #E8EDDD;            /* foam */
    --ink-2: #B7BFAA;
    --ink-3: #8C957F;
    --ink-4: #586153;
    --line: #263025;
    --line-strong: #354134;
    --primary: #E8EDDD;
    --primary-hover: #D9E0CB;
    --on-primary: #111611;
    --primary-soft: #202A1F;
    --accent: #93B35A;         /* brighter matcha on dark */
    --accent-text: #93B35A;
    --bezel: #263025;
    --scrim: rgba(0, 0, 0, 0.6);
    --logo-face: #93B35A;
    --logo-side: #6E8B3D;
    --logo-top: #3F5A22;
  }
}
:root[data-flavour="matcha"][data-theme="dark"], [data-flavour="matcha"] .theme-dark {
  --bg: #111611;
  --surface: #182018;
  --surface-2: #202A1F;
  --ink: #E8EDDD;
  --ink-2: #B7BFAA;
  --ink-3: #8C957F;
  --ink-4: #586153;
  --line: #263025;
  --line-strong: #354134;
  --primary: #E8EDDD;
  --primary-hover: #D9E0CB;
  --on-primary: #111611;
  --primary-soft: #202A1F;
  --accent: #93B35A;
  --accent-text: #93B35A;
  --bezel: #263025;
  --scrim: rgba(0, 0, 0, 0.6);
  --logo-face: #93B35A;
  --logo-side: #6E8B3D;
  --logo-top: #3F5A22;
}

/* Switching flavour or mode crossfades colours (router.js adds the class
   for 300ms; never with reduced motion). */
:root.theme-fading, :root.theme-fading *, :root.theme-fading *::before, :root.theme-fading *::after {
  transition-property: background-color, border-color, color, fill, stroke, box-shadow, outline-color, transform !important;
  transition-duration: var(--dur-3) !important;
  transition-timing-function: var(--ease) !important;
}

/* ---------------------------------------------------------------------
   3. Reset and base
   --------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg);
}
body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-16);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01" on, "cv11" on;
  padding-top: calc(var(--proto-h) + env(safe-area-inset-top));
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
ul[role="list"], ol[role="list"] { list-style: none; padding: 0; }
::selection { background: var(--primary-soft); color: var(--ink); }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: 4px;
}

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

.skip-link {
  position: fixed;
  top: 8px;
  left: 16px;
  z-index: 100;
  padding: 8px 16px;
  background: var(--ink);
  color: var(--bg);
  border-radius: var(--radius-pill);
  font-size: var(--fs-14);
  transform: translateY(-200%);
  transition: transform var(--dur-1) var(--ease);
}
.skip-link:focus-visible { transform: translateY(0); }

/* ---------------------------------------------------------------------
   4. Typography
   --------------------------------------------------------------------- */
.t-display, .t-h1, .t-h2 {
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: var(--lh-tight);
  text-wrap: balance;
}
.t-display { font-size: var(--fs-64); letter-spacing: -0.015em; line-height: 1.04; }
.t-h1 { font-size: var(--fs-40); }
.t-h2 { font-size: var(--fs-28); line-height: var(--lh-snug); }
.t-h3 {
  font-size: var(--fs-20);
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.3;
}
.t-body { font-size: var(--fs-16); line-height: var(--lh-body); }
.t-small { font-size: var(--fs-14); line-height: 1.45; }
.t-micro { font-size: var(--fs-12); line-height: 1.4; }
.t-muted { color: var(--ink-2); }
.t-faint { color: var(--ink-3); }
.eyebrow {
  font-size: var(--fs-12);
  font-weight: 500;
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--accent-text);   /* accent: small uppercase labels */
  line-height: 1.4;
}
[lang="ur"], .urdu { font-family: var(--font-urdu); }
.num, .tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" on, "lnum" on; }
.measure { max-width: var(--measure); }
/* Logos are inline SVGs (ui.logo); colours come from --logo-* */
.logo { display: block; height: auto; flex: none; }
.logo svg { display: block; width: 100%; height: auto; }
.wordmark { display: inline-block; width: 128px; line-height: 0; text-decoration: none; color: inherit; }

@media (max-width: 640px) {
  .t-display { font-size: 44px; }
  .t-h1 { font-size: 32px; }
}

/* ---------------------------------------------------------------------
   5. Layout helpers
   --------------------------------------------------------------------- */
.container {
  width: 100%;
  max-width: calc(var(--container) + var(--gutter) * 2);
  margin-inline: auto;
  padding-inline: var(--gutter);
}
.stack { display: flex; flex-direction: column; }
.stack > * + * { margin-top: var(--stack-gap, var(--space-4)); }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cluster-gap, var(--space-3)); }
.divider { height: 1px; background: var(--line); border: 0; }

/* ---------------------------------------------------------------------
   6. Components
   --------------------------------------------------------------------- */

/* Button ------------------------------------------------------------- */
.btn {
  --btn-h: 56px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--btn-h);
  padding: 0 var(--space-5);
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  font-size: var(--fs-16);
  font-weight: 500;
  letter-spacing: -0.005em;
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition:
    transform var(--dur-1) var(--ease),
    background-color var(--dur-1) var(--ease),
    border-color var(--dur-1) var(--ease),
    color var(--dur-1) var(--ease),
    opacity var(--dur-1) var(--ease);
}
.btn:active { transform: scale(0.98); }
.btn:focus-visible { border-radius: var(--radius-pill); outline-offset: 3px; }
.btn svg { width: 20px; height: 20px; flex: none; }

.btn--primary { background: var(--primary); color: var(--on-primary); }
.btn--primary:hover { background: var(--primary-hover); }

.btn--secondary { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn--secondary:hover { border-color: var(--ink-3); background: var(--surface); }

.btn--ghost { background: transparent; color: var(--ink); }
.btn--ghost:hover { background: var(--surface-2); }

.btn--link {
  --btn-h: var(--tap);
  padding: 0;
  border-radius: 0;
  color: var(--ink);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
  text-decoration-color: var(--line-strong);
}
.btn--link:hover { text-decoration-color: currentColor; }
.btn--link:active { transform: none; opacity: 0.7; }

.btn--compact { --btn-h: var(--tap); padding: 0 var(--space-4); font-size: var(--fs-14); }
.btn--block { width: 100%; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  border-radius: var(--radius-pill);
  color: var(--ink);
  transition: background-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 22px; height: 22px; }

/* Input -------------------------------------------------------------- */
.field { display: grid; gap: var(--space-2); }
.field__label { font-size: var(--fs-14); font-weight: 500; color: var(--ink); }
.field__hint { font-size: var(--fs-12); color: var(--ink-3); }
.field__error {
  display: none;
  font-size: var(--fs-14);
  color: var(--danger);
  line-height: 1.4;
}
.field[data-invalid="true"] .field__error { display: block; animation: enter var(--dur-2) var(--ease) both; }
.field[data-invalid="true"] .input { border-color: var(--danger); }
.field[data-invalid="true"] .input:focus { box-shadow: 0 0 0 1px var(--danger); }

.input {
  width: 100%;
  height: 56px;
  padding: 0 var(--space-4);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-card);
  font-size: var(--fs-16);   /* 16px prevents iOS zoom on focus */
  color: var(--ink);
  appearance: none;
  -webkit-appearance: none;
  transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}
.input::placeholder { color: var(--ink-4); }
.input:hover { border-color: var(--ink-4); }
.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
textarea.input { height: auto; min-height: 120px; padding: var(--space-4); line-height: var(--lh-body); resize: vertical; }

.select { position: relative; }
.select .input { padding-right: var(--space-7); cursor: pointer; }
.select::after {
  content: "";
  position: absolute;
  right: 22px;
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--ink-2);
  border-bottom: 1.5px solid var(--ink-2);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

/* Card --------------------------------------------------------------- */
.card {
  background: var(--surface);
  border: var(--hairline);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.card--flush { padding: 0; overflow: hidden; }
.card--interactive {
  display: block;
  width: 100%;
  text-align: left;
  cursor: pointer;
  transition: border-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}
.card--interactive:hover { border-color: var(--line-strong); }
.card--interactive:active { transform: scale(0.99); }
.card[aria-pressed="true"], .card[aria-checked="true"], .card.is-selected {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

/* List row ----------------------------------------------------------- */
.row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  min-height: 56px;
  padding: var(--space-3) 0;
  border-bottom: var(--hairline);
}
.row:last-child { border-bottom: 0; }
.row__main { flex: 1; min-width: 0; }
.row__title { font-size: var(--fs-16); font-weight: 500; line-height: 1.3; }
.row__meta { font-size: var(--fs-14); color: var(--ink-3); line-height: 1.4; }
.row__trail { flex: none; font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: var(--fs-14); }

/* Stepper ------------------------------------------------------------ */
.stepper {
  display: inline-flex;
  align-items: center;
  height: var(--tap);
  border: var(--hairline);
  border-radius: var(--radius-pill);
  background: var(--surface);
}
.stepper__btn {
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  border-radius: var(--radius-pill);
  color: var(--ink);
  transition: background-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease), opacity var(--dur-1) var(--ease);
}
.stepper__btn:hover { background: var(--surface-2); }
.stepper__btn:active { transform: scale(0.92); }
.stepper__btn:disabled { opacity: 0.3; pointer-events: none; }
.stepper__btn svg { width: 16px; height: 16px; }
.stepper__value {
  min-width: 28px;
  text-align: center;
  font-size: var(--fs-16);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* Segmented control -------------------------------------------------- */
.segmented {
  --count: 2;
  --index: 0;
  position: relative;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  padding: 4px;
  background: var(--surface-2);
  border-radius: var(--radius-pill);
}
.segmented__thumb {
  position: absolute;
  top: 4px; bottom: 4px; left: 4px;
  width: calc((100% - 8px) / var(--count));
  transform: translateX(calc(var(--index) * 100%));
  background: var(--surface);
  border: var(--hairline);
  border-radius: var(--radius-pill);
  transition: transform var(--dur-2) var(--ease);
}
.segmented__option {
  position: relative;
  z-index: 1;
  min-height: 40px;
  padding: 0 var(--space-4);
  border-radius: var(--radius-pill);
  font-size: var(--fs-14);
  font-weight: 500;
  color: var(--ink-3);
  transition: color var(--dur-1) var(--ease);
}
.segmented__option[aria-selected="true"], .segmented__option[aria-checked="true"] { color: var(--ink); }

/* Chip --------------------------------------------------------------- */
.chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-pill);
  background: transparent;
  font-size: var(--fs-14);
  font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
  transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
}
.chip::before { content: ""; position: absolute; inset: -4px 0; } /* 44px hit area */
.chip:hover { border-color: var(--ink-4); color: var(--ink); }
.chip:active { transform: scale(0.97); }
.chip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.chip svg { width: 14px; height: 14px; }

/* Toggle (switch) ---------------------------------------------------- */
.toggle {
  position: relative;
  flex: none;
  width: 48px;
  height: 28px;
  border-radius: var(--radius-pill);
  background: var(--line-strong);
  transition: background-color var(--dur-2) var(--ease);
}
.toggle::before { content: ""; position: absolute; inset: -8px -2px; } /* 44px hit area */
.toggle::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--surface);
  
  transition: transform var(--dur-2) var(--ease);
}
.toggle[aria-checked="true"] { background: var(--primary); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }

/* Badge -------------------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: var(--fs-12);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.badge--accent { background: var(--primary-soft); color: var(--primary); }

/* Status pill -------------------------------------------------------- */
.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 12px 0 10px;
  border: var(--hairline);
  border-radius: var(--radius-pill);
  background: var(--surface);
  font-size: var(--fs-12);
  line-height: 1;
  white-space: nowrap;
}
/* Cup-level icon (ui.cupIcon) in ink; status is never colour-coded. */
.status__icon { width: 16px; height: 16px; flex: none; color: var(--ink); margin-right: -2px; }
.status__label { font-weight: 500; color: var(--ink); }
.status__time { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.status--bare { height: auto; padding: 0; border: 0; background: none; }

/* Monogram: a partner's initials in a hairline circle (no partner logos) */
.monogram {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  color: var(--ink);
  font-size: var(--fs-14);
  font-weight: 700;
  letter-spacing: 0.3em;
  text-indent: 0.3em;          /* centres tracked text */
}
.status.is-changed .status__icon { animation: status-settle 600ms var(--ease); }
@keyframes status-settle {
  0% { transform: scale(1); }
  40% { transform: scale(1.25); }
  100% { transform: scale(1); }
}

/* Bottom sheet ------------------------------------------------------- */
/* Positioned against its nearest positioned ancestor (the phone frame).
   Add .sheet--viewport to cover the whole window instead. */
.sheet {
  position: absolute;
  inset: 0;
  z-index: 40;
  visibility: hidden;
  pointer-events: none;
  transition: visibility 0s linear var(--dur-3);
}
.sheet--viewport { position: fixed; }
.sheet[data-open="true"] { visibility: visible; pointer-events: auto; transition-delay: 0s; }
.sheet__scrim {
  position: absolute;
  inset: 0;
  background: var(--scrim);
  opacity: 0;
  transition: opacity var(--dur-3) var(--ease);
}
.sheet[data-open="true"] .sheet__scrim { opacity: 1; }
.sheet__panel {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  max-height: 88%;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-top: var(--hairline);
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
  box-shadow: var(--shadow-float);
  transform: translateY(100%);
  transition: transform var(--dur-3) var(--ease);
  will-change: transform;
}
.sheet[data-open="true"] .sheet__panel { transform: translateY(var(--drag, 0px)); }
.sheet.is-dragging .sheet__panel { transition: none; }
.sheet__handle {
  flex: none;
  display: grid;
  place-items: center;
  height: 28px;
  cursor: grab;
  touch-action: none;
}
.sheet__handle::after {
  content: "";
  width: 36px;
  height: 4px;
  border-radius: var(--radius-pill);
  background: var(--line-strong);
}
.sheet__body {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 var(--space-5) calc(var(--space-5) + env(safe-area-inset-bottom));
}
@media (min-width: 720px) {
  .sheet--viewport .sheet__panel { left: 50%; right: auto; width: 480px; margin-left: -240px; }
}

/* Toast -------------------------------------------------------------- */
.toast-region {
  position: fixed;
  left: 50%;
  bottom: calc(var(--space-5) + env(safe-area-inset-bottom));
  z-index: 90;
  display: grid;
  gap: var(--space-2);
  justify-items: center;
  width: max-content;
  max-width: calc(100vw - 32px);
  transform: translateX(-50%);
  pointer-events: none;
}
.toast {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 44px;
  padding: 10px var(--space-4);
  background: var(--ink);
  color: var(--bg);
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-float);
  font-size: var(--fs-14);
  font-weight: 500;
  pointer-events: auto;
  animation: enter var(--dur-2) var(--ease) both;
}
.toast svg { width: 18px; height: 18px; flex: none; }
.toast.is-leaving { animation: leave var(--dur-1) var(--ease) both; }

/* Placeholder (Pass 1 scaffolding only) ------------------------------ */
.placeholder {
  display: grid;
  align-content: center;
  gap: var(--space-2);
  min-height: 160px;
  padding: var(--space-5);
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-card);
  color: var(--ink-3);
  font-size: var(--fs-14);
}

/* ---------------------------------------------------------------------
   7. Motion
   --------------------------------------------------------------------- */
@keyframes enter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes leave {
  from { opacity: 1; transform: none; }
  to { opacity: 0; transform: translateY(4px); }
}
@keyframes check-draw { to { stroke-dashoffset: 0; } }

/* Fade + 8px rise. Set --i on children for a stagger. */
.enter { animation: enter var(--dur-3) var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }

/* Calm check: <svg class="check-draw"><path pathLength="1" d="…"/></svg> */
.check-draw path, .check-draw circle {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: check-draw 520ms var(--ease) forwards;
}
.check-draw path { animation-delay: 260ms; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-delay: 0ms !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

/* =====================================================================
   8. Surface shells
   ===================================================================== */

/* Prototype switcher -------------------------------------------------- */
.proto-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 80;
  height: calc(var(--proto-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(var(--space-4), env(safe-area-inset-right)) 0 max(var(--space-4), env(safe-area-inset-left));
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: var(--space-3);
  background: var(--surface-2);
  border-bottom: var(--hairline);
  font-size: var(--fs-12);
  color: var(--ink-3);
}
.proto-bar__label { font-weight: 400; letter-spacing: var(--track-caps); text-transform: uppercase; }
.proto-bar__nav { display: flex; gap: 2px; }
.proto-bar__link {
  position: relative;
  display: inline-flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border-radius: var(--radius-pill);
  color: var(--ink-2);
  text-decoration: none;
  font-weight: 500;
  white-space: nowrap;
  transition: background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.proto-bar__link::before { content: ""; position: absolute; inset: -8px 0; }
.proto-bar__link:hover { color: var(--ink); }
.proto-bar__link[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.proto-bar__theme {
  justify-self: end;
  height: 28px;
  padding: 0 10px;
  border-radius: var(--radius-pill);
  color: var(--ink-2);
  font-weight: 500;
}
.proto-bar__theme:hover { color: var(--ink); background: var(--surface); }
.proto-bar__end { justify-self: end; display: flex; align-items: center; gap: 2px; }
.proto-demo { position: relative; }
.proto-bar__theme[aria-expanded="true"] { color: var(--ink); background: var(--surface); }
.proto-demo__menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 85;
  display: grid;
  min-width: 220px;
  padding: 6px;
  background: var(--surface);
  border: var(--hairline);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-float);
}
.proto-demo__menu[hidden] { display: none; }
.proto-demo__menu button { min-height: var(--tap); padding: 0 var(--space-3); border-radius: var(--radius-sm); text-align: left; font-size: var(--fs-14); font-weight: 500; color: var(--ink); white-space: nowrap; }
.proto-demo__menu button:hover, .proto-demo__menu button:focus-visible { background: var(--surface-2); }
@media (max-width: 560px) {
  .proto-bar { grid-template-columns: auto 1fr; }
  .proto-bar__label { display: none; }
  .proto-bar__nav { justify-self: start; }
  .proto-bar__link { padding: 0 10px; }
}

/* Route container ---------------------------------------------------- */
#main { display: block; min-height: calc(100dvh - var(--proto-h)); }
#main:focus { outline: none; }
.surface { animation: enter var(--dur-3) var(--ease) both; }

/* Landing shell ------------------------------------------------------ */
.landing-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  height: 80px;
}
.landing-nav__links { display: flex; align-items: center; gap: var(--space-6); }
.landing-nav__link {
  font-size: var(--fs-14);
  color: var(--ink-2);
  text-decoration: none;
  transition: color var(--dur-1) var(--ease);
}
.landing-nav__link:hover { color: var(--ink); }
@media (max-width: 760px) { .landing-nav__link { display: none; } }
.landing-section {
  padding-block: var(--space-9);
  border-top: var(--hairline);
  scroll-margin-top: calc(var(--proto-h) + 16px);
}
.landing-section:first-of-type { border-top: 0; padding-top: var(--space-8); }
.landing-section__head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
  gap: var(--space-5);
  align-items: baseline;
}
@media (max-width: 760px) {
  .landing-section { padding-block: var(--space-8); }
  .landing-section__head { grid-template-columns: 1fr; gap: var(--space-2); }
}

/* Member app shell: phone frame -------------------------------------- */
.stage {
  min-height: calc(100dvh - var(--proto-h));
  display: grid;
  place-items: center;
  padding: var(--space-6) var(--space-4);
}
.phone {
  zoom: var(--phone-scale, 1);
  width: 410px;            /* 390 screen + 2 x 10 bezel */
  height: 864px;           /* 844 screen + 2 x 10 bezel */
  padding: 10px;
  border-radius: 58px;
  background: var(--bezel);
  box-shadow: var(--shadow-float);
}
.phone__screen {
  position: relative;      /* sheets and toasts anchor here */
  isolation: isolate;
  width: 390px;
  height: 844px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 48px;
  background: var(--bg);
}
.phone__status {
  flex: none;
  position: relative;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px 0 40px;
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.phone__island {
  position: absolute;
  left: 50%;
  top: 11px;
  width: 120px;
  height: 34px;
  margin-left: -60px;
  border-radius: var(--radius-pill);
  background: #000;
}
.phone__status-icons { display: flex; gap: 6px; align-items: center; }
.phone__status-icons svg { width: 18px; height: 12px; }
.app-view {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.app-view::-webkit-scrollbar { display: none; }
.app-view__inner { padding: var(--space-5); }

/* On a real phone the frame disappears and the app goes edge to edge */
@media (max-width: 520px) {
  .stage { padding: 0; display: block; }
  .phone { zoom: 1; width: 100%; height: calc(100dvh - var(--proto-h) - env(safe-area-inset-top)); padding: 0; border-radius: 0; background: none; box-shadow: none; }
  .phone__screen { width: 100%; height: 100%; border-radius: 0; }
  .phone__status { display: none; }
}

/* Café partner shell ------------------------------------------------- */
.cafe {
  max-width: 1280px;
  margin-inline: auto;
  padding: var(--space-5) var(--gutter) calc(var(--space-7) + env(safe-area-inset-bottom));
}
.cafe-header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--space-4);
  padding-bottom: var(--space-5);
  border-bottom: var(--hairline);
}
.open-indicator {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 var(--space-4) 0 14px;
  border: var(--hairline);
  border-radius: var(--radius-pill);
  background: var(--surface);
  font-weight: 500;
}
.open-indicator::before {
  content: "";
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--primary);
}
.cafe-grid {
  display: grid;
  gap: var(--space-5);
  margin-top: var(--space-5);
  grid-template-columns: 1fr;
}
@media (min-width: 768px) and (orientation: landscape) {
  .cafe-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
  .cafe-grid__side { display: grid; gap: var(--space-5); }
}
.panel-title { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }

/* Component kit (#/kit) ---------------------------------------------- */
.kit { padding-block: var(--space-7) var(--space-9); }
.kit-grid { display: grid; gap: var(--space-5); grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); margin-top: var(--space-6); }
.kit-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--space-3); }
.kit-swatch { display: grid; gap: 6px; font-size: var(--fs-12); color: var(--ink-3); }
.kit-swatch span:first-child { height: 48px; border-radius: var(--radius-sm); border: var(--hairline); }
.kit-demo-phone { position: relative; height: 320px; overflow: hidden; border-radius: var(--radius-card); border: var(--hairline); background: var(--bg); }

/* Live sync indicator (sync.js) --------------------------------------- */
.sync-pill { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-12); color: var(--ink-3); }
.sync-pill__dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-4); }
.sync-pill[data-state="online"] .sync-pill__dot { background: var(--primary); border-color: var(--primary); }
.sync-pill[data-state="connecting"] .sync-pill__dot { animation: sync-pulse 1.2s var(--ease) infinite alternate; }
@keyframes sync-pulse { to { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .sync-pill__dot { animation: none !important; } }

/* ---- src/cafe.css ---- */
/* =====================================================================
   Lahore Coffee Club — cafe.css
   Café partner view (#/cafe): header, a slim rail (tablet) or segmented
   tabs (phone), and four sections. Black, white and cream; hairlines,
   not boxes; coffee colours only as small accents (BRAND.md).
   ===================================================================== */

.cv {
  max-width: 1280px;
  margin-inline: auto;
  padding: var(--space-5) var(--gutter) calc(var(--space-7) + env(safe-area-inset-bottom));
}

/* Header ---------------------------------------------------------------- */
.cv-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding-bottom: var(--space-5);
  border-bottom: var(--hairline);
}
.cv-brand { display: flex; align-items: center; gap: var(--space-3); }
.cv-brand__ring { width: 40px; }
.cv-name { font-size: var(--fs-28); font-weight: 400; line-height: 1.1; }
.cv-head__aside { display: grid; justify-items: end; gap: var(--space-1); }
.cv-staff {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: var(--tap);
  padding: 0 var(--space-4);
  border: var(--hairline);
  border-radius: var(--radius-pill);
  font-size: var(--fs-14);
  color: var(--ink);
}
.cv-staff:hover { border-color: var(--line-strong); background: var(--surface); }
.cv-staff svg { color: var(--ink-3); }
.cv-state { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--fs-14); color: var(--ink-2); }
.cv-state__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.cv-state__dot[data-paused="true"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }

/* Rail (tablet) / tabs (phone) ----------------------------------------- */
.cv-body { display: grid; grid-template-areas: "nav" "main" "demo"; gap: var(--space-5); margin-top: var(--space-5); }
.cv-nav { grid-area: nav; }
.cv-main { grid-area: main; min-width: 0; }
.cv-main:focus { outline: none; }
.cv-demo { grid-area: demo; }

/* Phone: a segmented control */
.cv-tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 4px;
  background: var(--surface-2);
  border-radius: var(--radius-pill);
}
.cv-tab {
  display: grid;
  place-items: center;
  min-height: 40px;
  padding: 0 var(--space-2);
  border-radius: var(--radius-pill);
  font-size: var(--fs-14);
  color: var(--ink-2);
  transition: background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.cv-tab svg { display: none; }
.cv-tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

@media (min-width: 768px) {
  .cv-body {
    grid-template-columns: 176px minmax(0, 1fr);
    grid-template-rows: auto 1fr;
    grid-template-areas: "nav main" "demo main";
    column-gap: var(--space-7);
    row-gap: var(--space-6);
    margin-top: 0;
  }
  .cv-nav, .cv-demo { padding-right: var(--space-5); border-right: var(--hairline); }
  .cv-nav { padding-top: var(--space-5); }
  .cv-main { padding-top: var(--space-6); }
  .cv-demo { align-self: end; padding-bottom: var(--space-2); }
  .cv-tabs { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 0; background: none; border-radius: 0; }
  .cv-tab {
    position: relative;
    display: flex;
    justify-content: flex-start;
    gap: var(--space-3);
    min-height: 48px;
    padding: 0 var(--space-3);
    border-radius: var(--radius-sm);
    font-size: var(--fs-16);
  }
  .cv-tab svg { display: block; color: var(--ink-3); }
  .cv-tab:hover { background: var(--surface-2); color: var(--ink); }
  .cv-tab[aria-selected="true"] { background: var(--surface-2); box-shadow: none; }
  .cv-tab[aria-selected="true"] svg { color: var(--ink); }
  /* Accent: the active tab indicator */
  .cv-tab[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 2px; border-radius: 2px; background: var(--accent); }
}

/* Demo tools: sync, pairing, which café */
.cv-demo { display: grid; gap: var(--space-3); align-content: start; }
.cv-demo__sync { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.cv-demo .btn { justify-self: start; }
.cv-demo__cafe { display: grid; gap: 6px; }
.cv-demo__cafe .input { height: var(--tap); font-size: var(--fs-14); }
@media (max-width: 767px) {
  .cv-demo { margin-top: var(--space-6); padding-top: var(--space-5); border-top: var(--hairline); }
}

/* Shared --------------------------------------------------------------- */
.cv-title { font-size: var(--fs-28); font-weight: 400; line-height: 1.15; }
.cv-error { min-height: 0; font-size: var(--fs-14); color: var(--danger); }
.cv-error:empty { display: none; }
.cv-list { margin-top: var(--space-2); }
.cv-row {
  display: flex;
  align-items: baseline;
  gap: var(--space-4);
  min-height: 48px;
  padding: var(--space-3) 0;
  border-bottom: var(--hairline);
}
.cv-row:last-child { border-bottom: 0; }
.cv-row__time { min-width: 68px; font-size: var(--fs-14); color: var(--ink-3); }
.cv-row__main { flex: 1; min-width: 0; }
.cv-row__ref { font-size: var(--fs-14); color: var(--ink-3); }
.cv-row .btn--link { height: auto; padding: 0; font-size: var(--fs-14); }
.btn--tall { --btn-h: 64px; font-size: var(--fs-20); }
.btn--tall svg { width: 22px; height: 22px; }

/* Counter -------------------------------------------------------------- */
.cv-counter { display: grid; gap: var(--space-7); }
.cv-redeem { display: grid; gap: var(--space-4); align-content: start; max-width: 520px; }
.cv-side { display: grid; gap: var(--space-6); align-content: start; }
.cv-side > section + section { padding-top: var(--space-5); border-top: var(--hairline); }
.cv-side section { display: grid; gap: var(--space-3); }
@media (min-width: 1100px) {
  .cv-counter { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
  .cv-side { padding-left: var(--space-7); border-left: var(--hairline); }
}

.cv-entry { display: grid; gap: var(--space-4); }
.cv-or { display: flex; align-items: center; gap: var(--space-3); }
.cv-or::before, .cv-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.cv-code { display: grid; gap: var(--space-4); }
.code-input { height: 72px; font-size: var(--fs-28); letter-spacing: 0.32em; font-variant-numeric: tabular-nums; }
.code-input::placeholder { letter-spacing: 0.32em; }

.cv-member { display: grid; gap: var(--space-4); }
.cv-member__club { font-size: var(--fs-14); color: var(--ink-2); letter-spacing: 0.02em; }
.cv-member__name { font-size: var(--fs-40); line-height: 1.05; margin-top: calc(-1 * var(--space-2)); }
.cv-facts { margin: 0 0 var(--space-2); }
.cv-facts > div { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: var(--space-4); padding: var(--space-3) 0; border-top: var(--hairline); }
.cv-facts > div:last-child { border-bottom: var(--hairline); }
.cv-facts dt { font-size: var(--fs-14); color: var(--ink-3); }
.cv-facts dd { margin: 0; }
.cv-member .btn--link { justify-self: start; padding-inline: 0; }

.cv-success { position: relative; display: grid; justify-items: start; gap: var(--space-3); padding-bottom: var(--space-4); }
.cv-success .check-draw { width: 56px; height: 56px; color: var(--ink); }
.cv-success__title { font-size: var(--fs-28); line-height: 1.15; }
.cv-success__ref { font-size: var(--fs-20); color: var(--ink-2); letter-spacing: 0.04em; }
.cv-till { width: 100%; padding: var(--space-3) 0; border-block: var(--hairline); }
.cv-till strong { font-weight: 700; }
.cv-success .btn { margin-top: var(--space-2); }
/* A thin bar that empties over the 6 s before the counter resets */
.cv-success__timer { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--line); transform-origin: left; animation: cv-timer 6s linear both; }
@keyframes cv-timer { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .cv-success__timer { animation: none; } }

.cv-busy {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 4px;
  border: var(--hairline);
  border-radius: var(--radius-pill);
}
.cv-busy__opt {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 var(--space-2);
  border-radius: var(--radius-pill);
  font-size: var(--fs-14);
  color: var(--ink-2);
  transition: background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.cv-busy__opt:hover { color: var(--ink); }
.cv-busy__opt[aria-checked="true"] { background: var(--primary); color: var(--on-primary); }
.cv-busy__icon { width: 16px; height: 16px; flex: none; }
[data-busy-line] strong { font-weight: 700; color: var(--ink); }
@media (max-width: 420px) { .cv-busy__icon { display: none; } }

/* Today and Payouts ---------------------------------------------------- */
.cv-section { display: grid; gap: var(--space-7); }
.cv-section > section { display: grid; gap: var(--space-3); }
.cv-section__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-2) var(--space-4); }
.cv-section__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); }

.cv-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5) var(--space-5); margin: 0; }
@media (min-width: 900px) { .cv-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cv-stats > div { display: grid; align-content: start; gap: var(--space-1); padding-top: var(--space-3); border-top: var(--hairline); }
.cv-stats dt { font-size: var(--fs-14); color: var(--ink-3); }
.cv-stats dd { margin: 0; }
.cv-stats dd:not(.t-small) { font-size: var(--fs-40); line-height: 1.05; font-variant-numeric: tabular-nums; }
.cv-highlight { color: var(--accent-text); }   /* accent: the one highlighted number */

.cv-chart { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 6px; align-items: end; padding-top: var(--space-5); }
.cv-chart__col { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 140px auto; gap: var(--space-2); min-width: 0; }
.cv-chart__bar { position: relative; align-self: end; display: block; height: max(2px, calc(var(--h, 0) * 140px)); border-radius: 3px 3px 0 0; background: var(--line-strong); }
.cv-chart__col.is-now .cv-chart__bar { background: var(--accent); }   /* accent: the current hour */
.cv-chart__n { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -4px); font-size: var(--fs-12); color: var(--ink-3); }
.cv-chart__label { min-height: 1.4em; font-size: var(--fs-12); line-height: 1.4; color: var(--ink-3); white-space: nowrap; overflow: visible; }

.cv-table { width: 100%; border-collapse: collapse; font-size: var(--fs-16); }
.cv-table th, .cv-table td { padding: var(--space-3) var(--space-3) var(--space-3) 0; text-align: left; border-bottom: var(--hairline); vertical-align: baseline; }
.cv-table thead th { font-size: var(--fs-12); font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.cv-table .r { text-align: right; padding-right: 0; }
.cv-table tfoot th, .cv-table tfoot td { border-bottom: 0; color: var(--ink-2); font-weight: 400; }
.cv-table tfoot td { color: var(--ink); }
.cv-paid { font-weight: 700; }
@media (max-width: 520px) {
  .cv-table { font-size: var(--fs-14); }
  .cv-table th, .cv-table td { padding-right: var(--space-2); }
}

/* Settings ------------------------------------------------------------- */
.cv-settings { gap: var(--space-6); }
.cv-set { display: grid; gap: var(--space-3); min-width: 0; margin: 0; padding: var(--space-5) 0 0; border: 0; border-top: var(--hairline); }
.cv-set > legend { float: left; width: 100%; margin-bottom: var(--space-3); padding: 0; }
.cv-set > legend + * { clear: both; }
.cv-checks { display: grid; gap: 2px; }
.cv-check { display: flex; align-items: center; gap: var(--space-3); min-height: var(--tap); cursor: pointer; }
.cv-check input { width: 20px; height: 20px; flex: none; accent-color: var(--primary); }
.cv-inline { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
.cv-inline .select { width: 200px; }
.cv-limit { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3) var(--space-5); padding: var(--space-2) 0; }
.cv-limit + .cv-limit { border-top: var(--hairline); padding-top: var(--space-4); }
.cv-limit__title { font-size: var(--fs-16); }
.cv-hours { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.cv-hours .input { width: 148px; }
.cv-add { display: grid; gap: var(--space-3); margin-top: var(--space-3); }
@media (min-width: 768px) {
  .cv-add { grid-template-columns: minmax(0, 1fr) 160px 140px auto; align-items: end; }
  .cv-add .cv-error { grid-column: 1 / -1; }
}
.cv-foot { padding-top: var(--space-5); border-top: var(--hairline); }

/* Staff PIN sheet ------------------------------------------------------ */
.cv-pin { display: grid; justify-items: center; text-align: center; gap: var(--space-4); padding-bottom: var(--space-6); }
.cv-pin__dots { display: flex; gap: var(--space-4); padding: var(--space-2) 0; }
.cv-pin__dots span { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink-3); transition: background-color var(--dur-1) var(--ease); }
.cv-pin__dots span.is-on { background: var(--ink); box-shadow: none; }
.cv-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); width: min(300px, 100%); }
.cv-pad__key { display: grid; place-items: center; height: 64px; border: var(--hairline); border-radius: var(--radius-pill); font-size: var(--fs-28); font-variant-numeric: tabular-nums; color: var(--ink); }
.cv-pad__key:hover { background: var(--surface-2); }
.cv-pad__key:active { transform: scale(0.96); }

/* Pairing (Pass 4.5) --------------------------------------------------- */
.pair { display: grid; justify-items: center; text-align: center; gap: var(--space-3); padding-bottom: var(--space-6); }
.pair .qr { width: 240px; height: 240px; }
.pair__room { display: grid; gap: 2px; }
.pair__room .num { font-size: var(--fs-40); font-weight: 400; line-height: 1; letter-spacing: 0.08em; }
.pair__url { max-width: 100%; overflow-wrap: anywhere; }
.pair__note { max-width: 40ch; }

/* Brand partner (Double Shot): branch picker, drink and top-up ---------- */
.cv-branch { display: block; margin-top: var(--space-1); }
.cv-branch .input { height: 40px; padding-left: var(--space-3); font-size: var(--fs-14); border-radius: var(--radius-pill); }
.cv-brand .monogram { width: 44px; height: 44px; font-size: var(--fs-12); }
.cv-order { display: grid; gap: var(--space-2); margin-bottom: var(--space-2); }
.cv-order__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.cv-order__head [hidden] { display: none; }
.cv-order .segmented { max-width: 240px; }
.cv-order__cover { font-size: var(--fs-16); }
.cv-topup { font-weight: 700; }
p.cv-topup { font-size: var(--fs-28); line-height: 1.15; }
.cv-success__drink { font-size: var(--fs-20); }
.cv-table tr.is-here td { font-weight: 500; }
.cv-section > .segmented { max-width: 320px; }
/* Big money figures (brand payouts run to six digits) fit two columns on a phone */
@media (max-width: 520px) { .cv-stats dd:not(.t-small) { font-size: var(--fs-28); overflow-wrap: anywhere; } }

/* ---- src/app.css ---- */
/* =====================================================================
   Lahore Coffee Club — app.css
   Member app (#/app): tab bar, Pass, Home, Map, café sheet,
   Cafés, café detail, plan picker and payment.
   Builds on base.css; the phone frame itself lives there.
   ===================================================================== */

.app-screen { padding: var(--space-5) var(--space-5) var(--space-6); }
.app-screen--flush { padding: 0; }
.app-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.app-section { margin-top: var(--space-6); }
.app-section__title { margin-bottom: var(--space-2); }

/* Tab bar ------------------------------------------------------------- */
.tabbar {
  flex: none;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: end;
  padding: 6px var(--space-2) calc(6px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: var(--hairline);
}
.phone__screen .tabbar { padding-bottom: 22px; } /* home indicator inside the desktop frame */
/* Real phones (≤520px): base.css drops the frame and fills the screen, and
   the fixed prototype bar already clears the notch (safe-area-inset-top).
   Here the bottom bars clear the home indicator. The desktop frame is unchanged. */
@media (max-width: 520px) {
  .phone__screen .tabbar { padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
  .phone__screen.is-flow .summary-bar,
  .phone__screen.is-flow .sticky-action { padding-bottom: calc(var(--space-5) + env(safe-area-inset-bottom)); }
}
.tab {
  display: grid;
  justify-items: center;
  gap: 2px;
  min-height: 52px;
  padding-top: 6px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--ink-3);
  transition: color var(--dur-1) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); }
/* Accent: a short caramel bar marks the active tab */
.tab { position: relative; }
.tab[aria-selected="true"]:not(.tab--pass)::before { content: ""; position: absolute; top: -6px; left: 50%; width: 20px; height: 2px; margin-left: -10px; border-radius: 2px; background: var(--accent); }
.tab--pass[aria-selected="true"] .tab__pass { box-shadow: 0 0 0 4px var(--surface), 0 0 0 5.5px var(--accent); }
.tab:active svg { transform: scale(0.94); }
.tab--pass { padding-top: 0; }
.tab__pass {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  margin-top: -20px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: 0 0 0 4px var(--surface);
  transition: transform var(--dur-1) var(--ease);
}
.tab--pass[aria-selected="true"] .tab__pass { background: var(--ink); color: var(--bg); }

/* Pass ---------------------------------------------------------------- */
.pass { display: grid; justify-items: center; text-align: center; gap: var(--space-4); }
/* The pass screen is black in both modes (app.js adds .theme-dark to the
   phone). The QR sits on a cream rounded square inside a caramel brick ring. */
.phone__screen.theme-dark { background: var(--bg); color: var(--ink); }
.theme-dark .pass__card { background: transparent; border: 0; padding-inline: 0; }
.pass-ring { position: relative; display: grid; place-items: center; width: min(100%, 330px); aspect-ratio: 1; }
.pass-ring__bricks, .pass-ring__bricks svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pass-ring .brick-ring { color: var(--accent); --brick-line: color-mix(in srgb, var(--accent) 40%, transparent); }
.pass-ring .qr { position: relative; width: 58%; height: auto; aspect-ratio: 1; }
.pass__card {
  width: 100%;
  display: grid;
  justify-items: center;
  gap: var(--space-4);
  padding: var(--space-5);
  background: var(--surface);
  border: var(--hairline);
  border-radius: var(--radius-card);
}
/* The QR always sits on a light tile so scanners read it in dark mode too */
.qr {
  width: 232px;
  height: 232px;
  padding: 12px;
  border-radius: var(--radius-card);
  background: var(--cream);
  color: var(--black);
  transition: opacity var(--dur-2) var(--ease);
}
.qr svg { width: 100%; height: 100%; shape-rendering: crispEdges; }
.qr.is-rotating { opacity: 0.2; }
.qr--fallback { display: grid; place-items: center; padding: var(--space-5); font-size: var(--fs-14); color: var(--ink-2); border: 1px dashed var(--line-strong); }
.pass__code {
  font-size: 40px;
  font-weight: 500;
  letter-spacing: 0.08em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.pass__code span + span { margin-left: 0.35em; }
.countdown { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--fs-14); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.countdown svg { width: 20px; height: 20px; transform: rotate(-90deg); }
.countdown circle { fill: none; stroke-width: 2; }
.countdown .track { stroke: var(--line); }
.countdown .bar { stroke: var(--ink-2); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.pass__meta { display: flex; justify-content: space-between; width: 100%; padding-top: var(--space-4); border-top: var(--hairline); text-align: left; }
.pass__note { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--fs-14); color: var(--ink-3); }
.pass__note svg { width: 18px; height: 18px; flex: none; }
.pass-success { display: grid; justify-items: center; gap: var(--space-3); padding: var(--space-6) var(--space-2); }
.pass-success .check-draw { width: 72px; height: 72px; color: var(--primary); }

/* Home: progress ring ------------------------------------------------- */
.ring { position: relative; width: 208px; height: 208px; }
.ring__bricks, .ring__bricks svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Brick ring (ui.brickRing): one brick per cup, gap at 3 o'clock.
   Solid = cups left, outlined = used. Flat; colour from `color`. */
.brick-ring { color: var(--accent-text); overflow: visible; }   /* accent: cups-left bricks */
.brick-ring .brick.is-full { fill: currentColor; }
.brick-ring .brick.is-used { fill: none; stroke: var(--brick-line, var(--line-strong)); stroke-width: 1.25; }
.brick-ring__empty { fill: none; stroke: var(--line-strong); stroke-width: 1.25; stroke-dasharray: 3 6; }
/* Bricks light in turn on first paint */
.ring__bricks .brick.is-full { animation: brick-in var(--dur-3) var(--ease) both; animation-delay: calc(var(--i, 0) * 35ms); }
@keyframes brick-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ring__bricks .brick.is-full { animation: none; } }

/* Home header: the horizontal monogram, profile button top right */
.app-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
.app-brand { width: 88px; }
.profile-btn { margin-right: -10px; } /* optically flush with the screen edge */

/* Home: one centred block in the middle of the screen; the header stays left */
.app-view > .enter:has(> .home) { min-height: 100%; display: flex; flex-direction: column; }
.home { flex: 1; display: flex; flex-direction: column; }
.home__center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-5); padding-block: var(--space-7); text-align: center; }
.ring--home { width: 248px; height: 248px; }
.ring--home .ring__num { font-size: 80px; }
.home__lines { display: grid; gap: var(--space-1); }
.home__actions { display: grid; gap: var(--space-3); width: 100%; max-width: 280px; margin-top: var(--space-2); }

/* Profile drawer: slides in from the right (a .sheet, so focus trap,
   Escape and scrim come from ui.js; swipe right to close) */
.sheet--drawer .sheet__panel {
  top: 0; bottom: 0; left: auto; right: 0;
  width: min(320px, 86%);
  max-height: none;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  border-top: 0;
  border-left: var(--hairline);
  border-radius: 0;
  box-shadow: none;
  transform: translateX(100%);
}
.sheet--drawer[data-open="true"] .sheet__panel { transform: translateX(var(--drag, 0px)); }
.drawer__bar {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  min-height: 64px;
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-5);
  background: var(--surface);
  border-bottom: var(--hairline);
}
.drawer__body { padding: 0 var(--space-5) calc(var(--space-6) + env(safe-area-inset-bottom)); }
.drawer__section { display: grid; justify-items: start; gap: var(--space-2); padding-block: var(--space-5); border-bottom: var(--hairline); }
.drawer__section:last-child { border-bottom: 0; }
.drawer__section > ul { width: 100%; }
.drawer__section .eyebrow { margin-bottom: var(--space-1); }
.drawer__appearance { justify-items: stretch; }
.drawer__appearance .segmented + .segmented { margin-top: var(--space-1); }
.ring__center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring__num { font-family: var(--font-sans); font-weight: 400; font-size: var(--fs-64); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }


/* Map ----------------------------------------------------------------- */
.map-head { padding: var(--space-5) var(--space-5) var(--space-3); display: grid; gap: var(--space-4); }
.map { position: relative; width: 100%; aspect-ratio: 360 / 560; overflow: hidden; background: var(--bg); border-block: var(--hairline); }
.map > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map .m-area { fill: var(--surface-2); }
.map .m-road { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-linecap: round; }
.map .m-road--major { stroke-width: 3; stroke: var(--line); }
.map .m-canal { fill: none; stroke: var(--ink-4); stroke-width: 1.5; stroke-dasharray: 1 0; }
.map .m-river { fill: none; stroke: var(--surface-2); stroke-width: 18; stroke-linecap: round; }
.map .m-label { fill: var(--ink-3); font: 500 10px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; }
.map .m-label--water { font-style: italic; text-transform: none; letter-spacing: 0; fill: var(--ink-4); }

.pin {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: var(--tap);
  transform: translate(-22px, -50%);
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.pin--left { flex-direction: row-reverse; transform: translate(calc(-100% + 22px), -50%); }
.pin--below { flex-direction: column; gap: 0; transform: translate(-50%, -22px); }
.pin__dot {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  margin: 6px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  color: var(--ink);
  transition: background-color 250ms var(--ease), color 250ms var(--ease), border-color 250ms var(--ease);
}
.pin__dot svg { width: 18px; height: 18px; }
.pin[data-status="packed"] .pin__dot { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pin__name { padding: 2px 6px; border-radius: 4px; background: color-mix(in srgb, var(--bg) 85%, transparent); }
.pin.is-changed .pin__dot { animation: status-settle 600ms var(--ease); }
.pin:active .pin__dot { transform: scale(0.94); }

.map-foot { padding: var(--space-4) var(--space-5) var(--space-6); display: grid; gap: var(--space-3); }
.legend { display: flex; gap: var(--space-4); font-size: var(--fs-12); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend svg { width: 16px; height: 16px; }

/* Café sheet ---------------------------------------------------------- */
.cafe-sheet { display: grid; gap: var(--space-4); }
.cafe-sheet__facts { display: grid; gap: var(--space-2); font-size: var(--fs-14); color: var(--ink-2); }
.cafe-sheet__facts span { display: inline-flex; align-items: center; gap: var(--space-2); }
.cafe-sheet__facts svg { width: 18px; height: 18px; color: var(--ink-3); }

/* Coming-soon tabs ---------------------------------------------------- */
.soon { display: grid; gap: var(--space-3); padding-top: var(--space-7); }

/* =====================================================================
   Pass 4: Cafés, café detail, plan picker, payment
   ===================================================================== */

/* Focused flows (plan, payment) hide the tab bar */
.phone__screen.is-flow .tabbar { display: none; }
/* Keep focused rows clear of the sticky top bar and summary bar */
.phone__screen.is-flow .app-view { scroll-padding-block: 64px 220px; }
.app-view:has(.sticky-action) { scroll-padding-block: 64px 120px; }

.cafe-sheet__actions { display: grid; gap: var(--space-3); }

/* Shared top bar with a back button; sticks while the screen scrolls */
.screen-bar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 56px;
  padding: var(--space-1) var(--space-3);
  background: var(--bg);
  border-bottom: 1px solid transparent;
  transition: border-color var(--dur-1) var(--ease);
}
.screen-bar__title {
  font-size: var(--fs-16);
  font-weight: 500;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
}
.screen-bar.is-titled { border-bottom-color: var(--line); }
.screen-bar [hidden] { display: none; }
.screen-bar.is-titled .screen-bar__title { opacity: 1; transform: none; }
.screen-bar + .app-screen { padding-top: var(--space-2); }

/* Cafés list ---------------------------------------------------------- */
.cafes { display: grid; gap: var(--space-4); }
.search { position: relative; }
.search > svg { position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search__input { padding-left: 48px; padding-right: 52px; border-radius: var(--radius-pill); -webkit-appearance: none; appearance: none; }
.search__input::-webkit-search-cancel-button { display: none; }
.search__clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.search__clear[hidden] { display: none; }


/* Search sticks to the top while the list scrolls */
.cafes__search { position: sticky; top: 0; z-index: 5; margin: calc(-1 * var(--space-2)) calc(-1 * var(--space-5)) 0; padding: var(--space-2) var(--space-5); background: var(--bg); }
.cafes__tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); }
.cafes__tools .input { height: 48px; border-radius: var(--radius-pill); }
.cafes__filters { --btn-h: 48px; gap: var(--space-2); padding-inline: var(--space-4); }
.cafes__filters svg { width: 18px; height: 18px; }
.cafes__filters.is-on { border-color: var(--primary); }

/* One line per café: name, area, busy (icon and word), open or closed */
.cafe-line {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-2);
  min-height: 56px;
  color: inherit;
  text-decoration: none;
  border-bottom: var(--hairline);
}
.cafe-line__name { font-weight: 500; white-space: nowrap; }
.cafe-line__area { font-size: var(--fs-14); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cafe-line__end { display: inline-flex; align-items: center; gap: var(--space-3); }
.cafe-line__open { min-width: 3.4em; font-size: var(--fs-12); color: var(--ink-2); text-align: right; }
.cafe-line__open.is-closed { color: var(--ink-4); }
/* Matcha mode only: cafés that serve matcha (the one highlight on the list) */
.badge--matcha { background: transparent; border: 1px solid var(--line-strong); color: var(--accent-text); height: 20px; padding: 0 6px; }
.cafe-line:hover .cafe-line__name { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.cafes__more { margin-top: var(--space-4); }
.cafes__more[hidden] { display: none; }
.cafes-empty { display: grid; justify-items: start; gap: var(--space-3); padding: var(--space-6) 0; }

/* Filters sheet */
.filters { display: grid; gap: var(--space-5); }
.filters__row { display: flex; align-items: center; justify-content: space-between; min-height: var(--tap); }
.filters__group { display: grid; gap: var(--space-3); margin: 0; padding: 0; border: 0; min-width: 0; }
.filters__group legend { padding: 0; margin-bottom: var(--space-3); }
.filters__actions { display: grid; grid-template-columns: 1fr 2fr; gap: var(--space-3); padding-top: var(--space-2); }

/* Café detail --------------------------------------------------------- */
.cafe-detail { min-height: 100%; display: flex; flex-direction: column; }
.cafe-detail__body { flex: 1; display: grid; align-content: start; gap: var(--space-5); padding-bottom: var(--space-5); }
.cafe-detail__body .app-section { margin-top: var(--space-2); }
.cafe-detail__status .status { justify-self: start; }
.facts { display: grid; gap: var(--space-2); font-size: var(--fs-14); color: var(--ink-2); }
.facts > div { display: flex; align-items: center; gap: var(--space-3); }
.facts dt { display: grid; place-items: center; color: var(--ink-3); }
.facts dd { margin: 0; }

.visits { display: grid; gap: var(--space-5); }
.visits__item { display: grid; gap: var(--space-2); }
.visits__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.meter { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.meter__seg { height: 6px; border-radius: var(--radius-pill); background: var(--line); }
.meter__seg.is-on { background: var(--primary); }

/* Bottom actions that stay on screen while content scrolls */
.sticky-action, .summary-bar {
  position: sticky;
  bottom: 0;
  z-index: 5;
  display: grid;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-5) var(--space-5);
  background: var(--surface);
  border-top: var(--hairline);
}

/* Plan picker --------------------------------------------------------- */
.flow { min-height: 100%; display: flex; flex-direction: column; }
.flow__body { flex: 1; display: grid; align-content: start; gap: var(--space-5); }
.plan-intro { margin-bottom: var(--space-1); }
.tier-list { display: grid; gap: var(--space-3); border: 0; padding: 0; min-width: 0; }
.tier { display: grid; gap: var(--space-1); cursor: pointer; transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease); }
.tier:hover { border-color: var(--line-strong); }
.tier:active { transform: scale(0.99); }
.tier:has(input:checked) { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.tier:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
.tier__head { display: flex; align-items: center; gap: var(--space-2); }
.tier__price { margin-left: auto; }

.builder-row .row__meta { transition: color var(--dur-1) var(--ease); }
.builder-row.is-new { background: var(--primary-soft); margin-inline: calc(-1 * var(--space-3)); padding-inline: var(--space-3); border-radius: var(--radius-sm); }

.summary-bar { gap: var(--space-2); box-shadow: var(--shadow-float); }
.summary-bar__nums { display: flex; justify-content: space-between; align-items: baseline; }
.summary-bar__cups { font-weight: 500; }
.summary-bar__note { min-height: 2.9em; }
.summary-bar__note.is-warn { color: var(--danger); }
.summary-bar__note.is-save { color: var(--accent-text); }   /* accent: the savings line */
.summary-bar .btn { margin-top: var(--space-1); }

/* Payment ------------------------------------------------------------- */
.pay-summary { display: grid; gap: var(--space-1); }
.pay-summary__row { display: flex; justify-content: space-between; align-items: baseline; }
.pay-form { display: grid; gap: var(--space-5); }
.method-list { display: grid; gap: var(--space-2); border: 0; padding: 0; min-width: 0; }
.method-list legend { margin-bottom: var(--space-2); padding: 0; }
.method {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 64px;
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  border: var(--hairline);
  border-radius: var(--radius-card);
  cursor: pointer;
  transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}
.method:hover { border-color: var(--line-strong); }
.method:has(input:checked) { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.method:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
.method__icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); }
.method__text { flex: 1; display: grid; }
.method__tick { color: var(--primary); opacity: 0; transition: opacity var(--dur-1) var(--ease); }
.method:has(input:checked) .method__tick { opacity: 1; }
.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.field-pair .field + .field { margin-top: 0; }

.proto-note {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-card);
  background: var(--surface-2);
  font-size: var(--fs-14);
  line-height: 1.45;
  color: var(--ink-2);
}
.proto-note svg { flex: none; margin-top: 1px; color: var(--ink-3); }
.proto-note strong { font-weight: 500; color: var(--ink); }

.pay-state { display: grid; justify-items: center; text-align: center; gap: var(--space-3); padding: var(--space-6) var(--space-2) var(--space-5); }
.pay-state .check-draw { width: 72px; height: 72px; color: var(--primary); }
.pay-state__mark { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid var(--line-strong); color: var(--ink-2); }
.pay-state__actions { display: grid; gap: var(--space-3); width: 100%; margin-top: var(--space-3); }
.spinner {
  width: 40px;
  height: 40px;
  margin-bottom: var(--space-2);
  border-radius: 50%;
  border: 2px solid var(--line);
  border-top-color: var(--primary);
  animation: spin 900ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
}

/* Plan types (Pass 7): per-café cups on the pass ----------------------- */
.pass__cafes { width: 100%; display: grid; gap: var(--space-2); text-align: left; }
.pass__cafes ul { display: grid; }
.pass__cafes li { display: flex; justify-content: space-between; gap: var(--space-3); padding-block: 6px; border-top: var(--hairline); font-size: var(--fs-14); }
.pass__cafes li .num { color: var(--ink-2); }
[data-here-line] strong { color: var(--ink); font-weight: 500; }

/* Brand partner page (Double Shot): menu, ordering, branches, plans ------ */
.brand { display: grid; gap: var(--space-4); }
.brand .app-section { margin-top: var(--space-4); display: grid; gap: var(--space-3); }
.brand__head { display: flex; align-items: center; gap: var(--space-4); }
.brand__bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.brand__bar .segmented { width: 168px; flex: none; }
.brand-cups { display: grid; gap: var(--space-2); justify-items: start; }
.brand-cups__line { font-size: var(--fs-20); line-height: 1.25; }
.menu-sec { display: grid; gap: var(--space-1); margin-top: var(--space-3); }
.menu-sec__title { margin-bottom: var(--space-1); }
.menu-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  min-height: 56px;
  padding: var(--space-2) 0;
  text-align: left;
  border-bottom: var(--hairline);
  cursor: pointer;
}
.menu-sec li:last-child .menu-row { border-bottom: 0; }
.menu-row__main { display: grid; gap: 2px; min-width: 0; }
.menu-row:hover .row__title { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.badge--top { background: transparent; border: 1px solid var(--line-strong); color: var(--ink); }
.branch-row { width: 100%; text-align: left; cursor: pointer; border-bottom: var(--hairline); }
li:last-child > .branch-row { border-bottom: 0; }
.branch-row .row__main { display: grid; gap: 2px; }
.brand-plans { display: grid; gap: var(--space-3); }
.brand-plan { display: grid; gap: var(--space-2); }
.brand-plan.is-mine { border-color: var(--primary); }
.brand-plan__head { display: flex; align-items: baseline; gap: var(--space-2); }
.brand-plan__price { margin-left: auto; }
.order-sheet { display: grid; gap: var(--space-4); }
.order-sheet .segmented { width: 100%; }
.order-sheet__cover { font-size: var(--fs-16); }
.order-sheet .btn--link { justify-self: center; }

/* Pass: the drink chosen in the app, above the QR; the brand balance */
.pass-order { display: grid; gap: 2px; justify-items: center; }
.pass-order:empty { display: none; }
.pass-order__drink { font-size: var(--fs-20); font-weight: 500; line-height: 1.2; }
.pass-order__acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 var(--space-4); font-size: var(--fs-14); }
.pass-order__acts .btn--link { --btn-h: 36px; }
.pass__brand { font-size: var(--fs-14); color: var(--ink-2); text-align: center; }

/* ---- src/club.css ---- */
/* =====================================================================
   Lahore Coffee Club — club.css
   Member app (Pass 5): member card, Club tab, gifting, onboarding and
   the card being issued. Builds on base.css and app.css.
   ===================================================================== */

/* Home: plan and gift links under the ring ----------------------------- */
.ring-actions { display: flex; gap: var(--space-4); align-items: center; }
.ring-actions .btn--link { display: inline-flex; align-items: center; gap: 6px; }
.ring-actions .btn--link svg { width: 18px; height: 18px; }

/* Member card -----------------------------------------------------------
   Black with cream type in both modes (a hairline shows its edge on
   black). The one accent: the caramel Founding Member seal. */
.mcard {
  --card-bg: var(--black);
  --card-ink: var(--cream);
  --card-muted: color-mix(in srgb, var(--cream) 66%, transparent);
  --card-line: color-mix(in srgb, var(--cream) 16%, transparent);
  --logo-ink: var(--cream);
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr auto;
  aspect-ratio: 1.586;
  width: 100%;
  padding: 20px 22px 18px;
  border-radius: 16px;
  background: var(--card-bg);
  color: var(--card-ink);
  box-shadow: inset 0 0 0 1px var(--card-line);
}
.mcard--founding .mcard__seal { color: var(--accent); }   /* accent: the seal */
.mcard__rings { position: absolute; right: 0; bottom: 0; width: 70%; height: auto; pointer-events: none; }
.mcard__rings circle { fill: none; stroke: var(--card-line); stroke-width: 0.75; }
.mcard__top { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); }
.mcard__brand { width: 120px; line-height: 0; color: var(--card-ink); }
.mcard__seal { width: 56px; height: 56px; flex: none; margin: -6px -6px 0 0; color: var(--card-ink); }
.mcard__seal circle, .mcard__seal path { fill: none; stroke: currentColor; stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
.mcard__seal text { fill: currentColor; font: 500 6.4px/1 var(--font-sans); letter-spacing: 0.16em; }
.mcard__no { position: relative; align-self: center; font-family: var(--font-sans); font-weight: 400; font-size: 56px; line-height: 1; letter-spacing: -0.02em; }
.mcard__no-label { font-size: var(--fs-20); letter-spacing: 0; color: var(--card-muted); vertical-align: 0.9em; margin-right: 2px; }
.mcard__foot { position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-3); }
.mcard__who, .mcard__status { display: grid; gap: 2px; min-width: 0; }
.mcard__status { text-align: right; }
.mcard__name { font-size: var(--fs-16); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard__meta { font-size: var(--fs-12); color: var(--card-muted); letter-spacing: 0.02em; }
.mcard__level { font-family: var(--font-sans); font-size: var(--fs-20); font-weight: 400; line-height: 1.1; }
.mcard__level--long { font-size: 18px; }
.mcard__meta, .mcard__level { white-space: nowrap; }

/* Issued: the card rises in, then the number and seal settle. Calm, once. */
.mcard.is-issuing { animation: card-rise 900ms var(--ease) both; }
.mcard.is-issuing .mcard__no { animation: card-ink 700ms var(--ease) 650ms both; }
.mcard.is-issuing .mcard__foot { animation: card-ink 600ms var(--ease) 950ms both; }
.mcard.is-issuing .mcard__seal { animation: card-seal 900ms var(--ease) 1200ms both; }
@keyframes card-rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes card-ink { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
