<script>
/* ---- src/sync.js ---- */
/* =====================================================================
   Lahore Coffee Club — sync.js
   Live sync between devices in the same demo "room".

     #/cafe?room=4821        café tablet
     #/app/pass?room=4821    member phone

   Two transports, both carrying the same small messages:
     1. BroadcastChannel  windows on the same computer (always on)
     2. Supabase Realtime Broadcast  other devices, over the internet.
        Broadcast only: no tables, nothing stored. If it can't connect
        the app carries on with (1) and says “Offline, this device only”.

   Messages: { v, id, from, type, data }. `from` is this window's sender
   id, so a window ignores its own messages; `id` de-duplicates a message
   that arrives over both transports. Incoming data goes through
   store.applyRemote(), which never re-sends, so there are no echo loops.

   What travels: café status, and ledger entries (redeem, purchase, expire,
   gift) with the plan header of any member whose plan changed. Entries are
   append-only with stable ids, so applying one twice is harmless.

   Join handshake: a window that joins says “hello”. A café window answers
   with statuses plus this session’s ledger entries and plan changes; any
   other window that has live entries answers with those (newest plan wins).

   Approved exception to “no backend” (see CLAUDE.md).
   // BACKEND: replace Broadcast with Supabase tables + Postgres Changes:
   //   cafe_status (cafe_id, status, updated_at), ledger (insert-only:
   //   purchase/redeem/gift/expire), subscriptions (member_id, plan, cycle,
   //   renews_at). Balances stay derived from the ledger. Rooms go away.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, ui } = LCC;
  const { html } = ui;

  // Publishable key: meant for browser code. Never put a secret key here.
  const SUPABASE_URL = "https://nfgqswdtaemhpmnrries.supabase.co";
  const SUPABASE_KEY = "sb_publishable_iZ_OxDTfGnMoQlWuPswSVA_iuizC6qZ";
  // Where a paired phone goes. Always the deployed site, so pairing works
  // even when the café window runs from this computer.
  const LIVE_URL = "https://lcc-omega.vercel.app/";
  const CONNECT_TIMEOUT_MS = 8000;
  const ROOM_RE = /^[A-Za-z0-9-]{1,32}$/;

  const sender = Math.random().toString(36).slice(2, 10);
  const seen = new Set(); // message ids already applied
  let status = "connecting"; // connecting | online | offline
  let channel = null;      // Supabase channel
  let bc = null;           // BroadcastChannel
  let timeout = null;

  /* -------------------------------------------------------------------
     Room: from the URL, else the last one this browser used, else new
     ------------------------------------------------------------------- */
  function roomFromHash() {
    const q = location.hash.split("?")[1];
    const r = q ? new URLSearchParams(q).get("room") : null;
    return r && ROOM_RE.test(r) ? r : null;
  }
  function remembered() {
    try { const r = localStorage.getItem("lcc-room"); return r && ROOM_RE.test(r) ? r : null; } catch (_) { return null; }
  }
  const room = roomFromHash() || remembered() || String(1000 + Math.floor(Math.random() * 9000));
  try { localStorage.setItem("lcc-room", room); } catch (_) { /* fine without it */ }

  /** Any in-app hash, with this room attached. */
  function withRoom(hash) {
    const [path, q] = String(hash || "#/").split("?");
    const params = new URLSearchParams(q || "");
    params.set("room", room);
    return `${path}?${params}`;
  }
  // Links inside the app drop the query; put the room back without a new history entry
  function ensureRoomInUrl() {
    if (roomFromHash() === room) return;
    history.replaceState(null, "", withRoom(location.hash || "#/"));
  }
  ensureRoomInUrl();
  window.addEventListener("hashchange", ensureRoomInUrl);

  /** Link a phone opens to join this room on the member pass (always the live site). */
  function pairUrl() {
    return `${LIVE_URL}${withRoom("#/app/pass")}`;
  }

  /* -------------------------------------------------------------------
     Sending and receiving
     ------------------------------------------------------------------- */
  const msgId = () => `${sender}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;

  function post(type, data) {
    const msg = { v: 1, id: msgId(), from: sender, type, data };
    seen.add(msg.id);
    if (bc) { try { bc.postMessage(msg); } catch (_) { /* ignore */ } }
    if (channel && status === "online") {
      channel.send({ type: "broadcast", event: "lcc", payload: msg }).catch?.(() => {});
    }
  }

  function receive(msg) {
    if (!msg || msg.v !== 1 || msg.from === sender || seen.has(msg.id)) return;
    seen.add(msg.id);
    if (seen.size > 1000) seen.delete(seen.values().next().value);
    if (msg.type === "hello") return answerHello();
    store.applyRemote(msg.type, msg.data);
  }

  const isCafeDevice = () => LCC.router?.parse().name === "cafe";
  function answerHello() {
    if (isCafeDevice()) post("snapshot", store.roomSnapshot({ statuses: true }));
    else if (store.hasLiveData()) post("snapshot", store.roomSnapshot({ statuses: false }));
  }

  // Everything the store wants shared goes out on both transports
  store.addTransport((type, data) => post(type, data));

  /* -------------------------------------------------------------------
     Transport 1: same computer
     ------------------------------------------------------------------- */
  try {
    if ("BroadcastChannel" in window) {
      bc = new BroadcastChannel(`lahore-coffee-club:${room}`);
      bc.onmessage = ({ data }) => receive(data);
    }
  } catch (_) { bc = null; }

  /* -------------------------------------------------------------------
     Transport 2: Supabase Realtime Broadcast
     ------------------------------------------------------------------- */
  function setStatus(next) {
    if (status === next) return;
    status = next;
    paintPills();
    store.emit("sync", { status, room }, { remote: true });
  }

  function connect() {
    const lib = window.supabase;
    if (!lib || typeof lib.createClient !== "function") { setStatus("offline"); return; }
    try {
      const client = lib.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      });
      // BACKEND: a private channel with RLS on realtime.messages, once members sign in
      channel = client.channel(`lcc-room-${room}`, { config: { broadcast: { self: false, ack: false } } });
      channel.on("broadcast", { event: "lcc" }, ({ payload }) => receive(payload));
      channel.subscribe((s) => {
        if (s === "SUBSCRIBED") {
          clearTimeout(timeout);
          setStatus("online");
          post("hello", {}); // so the café (or a newer member copy) fills this device in
        } else if (s === "CHANNEL_ERROR" || s === "TIMED_OUT" || s === "CLOSED") {
          setStatus("offline"); // supabase-js keeps retrying; SUBSCRIBED flips it back
        }
      });
      timeout = setTimeout(() => { if (status !== "online") setStatus("offline"); }, CONNECT_TIMEOUT_MS);
    } catch (err) {
      console.warn("[LCC] live sync unavailable; this device only", err);
      setStatus("offline");
    }
  }

  window.addEventListener("offline", () => setStatus("offline"));

  // Say hello on this computer straight away; the network hello follows on connect
  post("hello", {});
  connect();

  /* -------------------------------------------------------------------
     Quiet indicator: <span data-sync-pill> updates itself
     ------------------------------------------------------------------- */
  const LABELS = { connecting: "Connecting…", online: "Connected", offline: "Offline, this device only" };
  function pill() {
    return html`<span class="sync-pill" data-sync-pill data-state="${status}" role="status" title="Room ${room}">
      <span class="sync-pill__dot" aria-hidden="true"></span><span data-sync-label>${LABELS[status]}</span>
    </span>`;
  }
  function paintPills() {
    ui.$$("[data-sync-pill]").forEach((el) => {
      el.dataset.state = status;
      ui.$("[data-sync-label]", el).textContent = LABELS[status];
    });
  }

  LCC.sync = { room, sender, withRoom, pairUrl, pill, liveUrl: LIVE_URL, status: () => status };
})();

</script>

                    <div class="sheet__body stack" style="--stack-gap:var(--space-3)">
                      <h3 class="t-h2" id="kit-sheet-title">${kiln.name}</h3>
                      ${ui.statusPill("kiln")}
                      <p class="t-small t-muted">${kiln.blurb}</p>
                      <button class="btn btn--primary btn--block" type="button" data-sheet-close>Directions</button>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>`;

      // Builder
      const cupsEl = $("[data-kit-cups]", el), priceEl = $("[data-kit-price]", el), saveEl = $("[data-kit-savings]", el);
      const paintPrice = (animate) => {
        const p = store.select.customPrice();
        cupsEl.textContent = `${fmt.cups(p.cups)} a month`;
        if (animate) ui.animateNumber(priceEl, p.price, { format: fmt.rs }); else { priceEl.textContent = fmt.rs(p.price); priceEl.dataset.value = p.price; }
        saveEl.textContent = p.meetsMinimum ? `You save ${fmt.rs(p.savings)} vs paying at the counter` : `Add ${fmt.cups(p.cupsShort)} to reach the six-cup minimum`;
      };
      paintPrice(false);

      const onClick = (e) => {
        const step = e.target.closest("[data-step]");
        if (step) {
          const box = step.closest("[data-stepper]");
          const id = box.dataset.stepper;
          store.actions.setBuilderCups(id, (store.getState().builder[id] || 0) + Number(step.dataset.step));
          ui.setStepper(box, store.getState().builder[id] || 0);
        }
        const st = e.target.closest("[data-kit-status]");
        if (st) store.actions.setCafeStatus("kiln", st.dataset.kitStatus);
        const chip = e.target.closest("[data-kit-chip]");
        if (chip) chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed") !== "true");
        const tog = e.target.closest("[data-kit-toggle]");
        if (tog) tog.setAttribute("aria-checked", tog.getAttribute("aria-checked") !== "true");
        const seg = e.target.closest(".segmented__option");
        if (seg) ui.selectSegment(seg.parentElement, seg.dataset.value);
        const t = e.target.closest("[data-kit-toast]");
        if (t) {
          ui.toast(t.dataset.kitToast);
          const check = $("[data-kit-check]", el);
          const clone = check.cloneNode(true); check.replaceWith(clone); // replay draw
        }
      };
      el.addEventListener("click", onClick);

      const form = $("[data-kit-form]", el);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const field = $("#kit-name", el).closest(".field");
        const ok = $("#kit-name", el).value.trim().length > 0;
        field.dataset.invalid = String(!ok);
        $("#kit-name", el).setAttribute("aria-invalid", String(!ok));
        if (ok) ui.toast("Looks good.");
        else $("#kit-name", el).focus();
      });

      const offs = [
        store.on("builder", () => {
          paintPrice(true);
          $$("[data-kit-builder] [data-stepper]", el).forEach((box) => ui.setStepper(box, store.getState().builder[box.dataset.stepper] || 0));
        }),
        store.on("member", () => {
          const a = store.select.member();
          $("[data-kit-ayesha]", el).textContent = `${store.select.balance().left} of ${store.select.balance().total}`;
          $("[data-kit-plan]", el).textContent = planMeta();
        }),
        store.on("redeem", ({ member }) => {
          const a = store.select.member();
          if (member.id === a.id) $("[data-kit-ayesha]", el).textContent = `${store.select.balance().left} of ${store.select.balance().total}`;
        }),
        store.on("cafe:status", ({ cafeId, status }) => {
          if (cafeId !== "kiln") return;
          $$("[data-kit-status]", el).forEach((b) => b.setAttribute("aria-pressed", b.dataset.kitStatus === status));
        }),
      ];
      return () => { el.removeEventListener("click", onClick); offs.forEach((f) => f()); };
    },
  });
})();

</script>
<script>
/* ---- src/cafe.js ---- */
/* =====================================================================
   Lahore Coffee Club — cafe.js
   Café partner view (#/cafe). Used by a busy barista with one hand:
   big targets, little reading. Replaces the Pass 1 shell in router.js.

   Reads and writes the shared store, so a redemption here updates the
   member’s cups everywhere, and a status change here updates the map.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, raw, $, $$, icon } = ui;

  const STATUS_HINTS = { quiet: "Walk right in", moderate: "Short wait", packed: "Expect a queue" };
  const RESET_AFTER_MS = 5000;
  const RECENT_LIMIT = 6;

  LCC.router.register("cafe", {
    title: "Café view",
    mount(el) {
      let cafeId = store.getState().partnerCafeId;
      // Redeem panel state: idle | error | found | success
      let r = freshRedeem();
      let resetTimer = null;
      let scanTimer = null;

      function freshRedeem() {
        return { state: "idle", code: "", message: "", lookup: null, drinkId: null, result: null };
      }
      const cafe = () => store.select.cafe(cafeId);
      const oneCupDrinks = () => cafe().drinks.filter((d) => d.credits === 1);

      /* ---------------------------------------------------------------
         Shell
         --------------------------------------------------------------- */
      function renderAll() {
        const c = cafe();
        const area = store.select.area(c.area);
        const open = store.select.openState(c);
        el.innerHTML = html`
          <div class="surface cafe">
            <header class="cafe-header">
              <div class="stack" style="--stack-gap:var(--space-2)">
                <p class="eyebrow">Partner view</p>
                <h1 class="t-h1">${c.name}</h1>
                <p class="t-small t-muted">${area.name} · ${fmt.date(Date.now())}</p>
              </div>
              <div class="cafe-header__aside">
                <label class="viewing-as">
                  <span class="t-micro t-faint">Viewing as</span>
                  <span class="select">
                    <select class="input" data-viewing>
                      ${store.select.cafes().map((x) => html`<option value="${x.id}" ${x.id === cafeId ? raw("selected") : ""}>${x.name}</option>`)}
                    </select>
                  </span>
                </label>
                <span class="open-indicator" data-open-indicator data-open="${open.open}">${open.label}</span>
              </div>
            </header>
            ${LCC.sync ? pairBar() : ""}

            <div class="cafe-grid">
              <section class="card" aria-labelledby="redeem-h">
                <div class="panel-title"><h2 class="eyebrow" id="redeem-h">Redeem a cup</h2></div>
                <div data-redeem-body></div>
              </section>

              <div class="cafe-grid__side">
                <section class="card" aria-labelledby="busy-h">
                  <div class="panel-title"><h2 class="eyebrow" id="busy-h">How busy are you?</h2></div>
                  ${busyControl()}
                  <p class="t-small t-faint busy-updated" data-busy-updated data-rel-time="${c.statusUpdatedAt}" data-rel-prefix="Updated">Updated ${fmt.ago(c.statusUpdatedAt)}</p>
                </section>

                <section class="card" aria-labelledby="today-h">
                  <div class="panel-title"><h2 class="eyebrow" id="today-h">Today</h2></div>
                  <dl class="today-stats">
                    <div><dt>Redemptions</dt><dd class="t-h1 num" data-stat="redemptions" data-value="0">0</dd></div>
                    <div><dt>New customers</dt><dd class="t-h1 num" data-stat="new" data-value="0">0</dd></div>
                    <div class="today-stats__wide">
                      <dt>Payout today</dt>
                      <dd class="t-h1 num" data-stat="payout" data-value="0">${fmt.rs(0)}</dd>
                      <dd class="t-small t-faint num" data-payout-meta></dd>
                    </div>
                  </dl>
                  <hr class="divider" style="margin-block:var(--space-5) var(--space-3)">
                  <h3 class="eyebrow">This month</h3>
                  <dl class="month-stats" data-month>
                    <div><dt>Cups reserved here</dt><dd class="t-h3 num" data-month-stat="reserved">0</dd><dd class="t-small t-faint num" data-month-stat="reservers"></dd></div>
                    <div><dt>Cups redeemed so far</dt><dd class="t-h3 num" data-month-stat="redeemed">0</dd></div>
                    <div class="month-stats__wide"><dt>Payout so far</dt><dd class="t-h3 num" data-stat="month" data-value="0">${fmt.rs(0)}</dd><dd class="t-small t-faint num" data-month-meta></dd></div>
                  </dl>
                  <hr class="divider" style="margin-block:var(--space-5) var(--space-3)">
                  <h3 class="eyebrow">Recent redemptions</h3>
                  <ol class="recent" role="list" data-recent aria-live="polite"></ol>
                  <p class="t-small t-faint" data-recent-more></p>
                </section>
              </div>
            </div>

            <p class="t-small t-faint" style="margin-top:var(--space-6)">Works on any phone or tablet. No special hardware.</p>
          </div>
          ${LCC.sync ? pairSheet() : ""}`;
        paintRedeem();
        paintToday();
      }

      /* ---------------------------------------------------------------
         Pairing: show a QR of the member pass in this sync room
         --------------------------------------------------------------- */
      function pairBar() {
        return html`<div class="pair-bar">
          ${LCC.sync.pill()}
          <span class="t-small t-faint num">Room ${LCC.sync.room}</span>
          <button type="button" class="btn btn--secondary btn--compact" data-pair>Pair a phone</button>
        </div>`;
      }

      function pairSheet() {
        return html`<div class="sheet sheet--viewport" id="pair-sheet" role="dialog" aria-modal="true" aria-labelledby="pair-title" aria-hidden="true">
          <div class="sheet__scrim" data-sheet-close></div>
          <div class="sheet__panel">
            <div class="sheet__handle" aria-hidden="true"></div>
            <div class="sheet__body pair" data-pair-body></div>
          </div>
        </div>`;
      }

      function openPair() {
        const url = LCC.sync.pairUrl();
        const local = !location.href.startsWith(LCC.sync.liveUrl);
        $("[data-pair-body]", el).innerHTML = html`
          <h2 class="t-h2" id="pair-title">Pair a phone</h2>
          <p class="t-small t-muted">Scan with the phone’s camera. It opens Mumtaz’s pass in this room, and redemptions here show up there live.</p>
          <div class="qr pair__qr" role="img" aria-label="QR code for the pairing link">${raw(ui.qrSvg(url, { fallback: "QR unavailable offline. Type the link below on the phone." }))}</div>
          <p class="pair__room"><span class="t-micro t-faint">Room</span><span class="num">${LCC.sync.room}</span></p>
          <p class="t-micro t-faint pair__url">${url}</p>
          ${local ? html`<p class="t-small t-faint pair__note">The phone opens the live site. It stays in sync with this window while both are online.</p>` : ""}
          <button type="button" class="btn btn--primary btn--block" data-sheet-close>Done</button>`.s;
        ui.openSheet($("#pair-sheet", el));
      }

      /* ---------------------------------------------------------------
         Redeem panel
         --------------------------------------------------------------- */
      function paintRedeem({ focus = false } = {}) {
        const body = $("[data-redeem-body]", el);
        if (!body) return;

        if (r.state === "idle" || r.state === "error") {
          const invalid = r.state === "error";
          body.innerHTML = html`
            <form class="stack" style="--stack-gap:var(--space-4)" data-code-form novalidate>
              <div class="field" data-invalid="${invalid}">
                <label class="field__label" for="member-code">Member code</label>
                <input class="input code-input" id="member-code" name="code" value="${r.code}"
                  inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000"
                  aria-describedby="member-code-hint member-code-err" aria-invalid="${invalid}">
                <p class="field__hint" id="member-code-hint">Six digits, under the QR on the member’s pass.</p>
                <p class="field__error" id="member-code-err" role="alert">${r.message}</p>
              </div>
              <div class="redeem-actions">
                <button type="submit" class="btn btn--primary">Check code</button>
                <button type="button" class="btn btn--secondary" data-sim-scan>Simulate scan</button>
              </div>
            </form>`;
          if (focus) { const input = $("#member-code", body); input.focus(); if (invalid) input.select(); }
          return;
        }

        if (r.state === "found") {
          const { member, usedToday, dailyLimit, here, left } = r.lookup;
          const plan = store.select.memberPlan(member);
          // What they can have HERE, and why: Explorer cap or My cafés reservation
          const hereWhy = here.bonus ? "free, from the club"
            : here.type === "mycafes"
            ? `${here.left} of ${here.reserved} reserved here`
            : `${Math.max(0, here.cap - here.used)} of ${here.cap} left here this month`;
          const name = [member.firstName, member.lastName].filter(Boolean).join(" ");
          // Who they are in the club, so the barista can greet them properly
          const club = member.memberNo != null ? store.select.club(member.id) : null;
          const clubLine = club ? [club.number, club.founding && "Founding Member", club.level.id !== "member" && club.level.name].filter(Boolean).join(" · ") : "";
          const perks = club ? store.select.perksAt(member.id, cafeId) : [];
          body.innerHTML = html`
            <div class="stack enter" style="--stack-gap:var(--space-5)">
              <div class="member-head">
                <div class="stack" style="--stack-gap:var(--space-1)">
                  ${clubLine ? html`<p class="member-club num">${clubLine}</p>` : ""}
                  <p class="t-h2" id="member-name">${name}</p>
                  <p class="t-small t-muted">${plan.type === "explorer" ? `Explorer · ${plan.name}` : "My cafés"} · ${fmt.cups(plan.cups)} a month</p>
                </div>
                <span class="badge badge--accent">Valid pass</span>
              </div>
              ${perks.length ? html`<div class="member-perks" role="note" aria-label="Perks to offer">
                <p class="eyebrow">Perk to offer</p>
                <ul role="list">${perks.map((p) => html`<li>${p.text}<span class="t-faint"> · for ${p.audience}</span></li>`)}</ul>
              </div>` : ""}
              <dl class="member-stats">
                <div class="member-stats__wide"><dt>Can have here</dt><dd class="t-h1 num" data-here>${here.left} <span class="t-small t-muted">${hereWhy}</span></dd></div>
                <div><dt>Cups left in plan</dt><dd class="t-h3 num">${left}</dd></div>
                <div><dt>Here today</dt><dd class="t-h3 num">${usedToday} <span class="t-small t-faint">of ${dailyLimit}</span></dd></div>
              </dl>
              <fieldset style="border:0;padding:0">
                <legend class="field__label" style="margin-bottom:var(--space-3)">Drink</legend>
                <div class="cluster" style="--cluster-gap:var(--space-2)">
                  ${oneCupDrinks().map((d) => html`<button type="button" class="chip" data-drink="${d.id}" aria-pressed="${d.id === r.drinkId}">${d.name}</button>`)}
                </div>
              </fieldset>
              <button type="button" class="btn btn--primary btn--block btn--tall" data-redeem aria-describedby="member-name">Redeem 1 cup</button>
              <button type="button" class="btn btn--link" data-reset style="justify-self:start">Not ${member.firstName}? Enter another code</button>
            </div>`;
          if (focus) $("[data-redeem]", body).focus();
          return;
        }

        if (r.state === "success") {
          const { member, entry, before, here } = r.result;
          const left = store.select.balance(member.id).left;
          const hereLine = entry.bonus ? "That was a free cup from the club." : here.type === "mycafes" ? `${here.left} of ${here.reserved} reserved here are left.` : `${Math.max(0, here.cap - here.used)} of ${here.cap} left here this month.`;
          const drink = store.select.drink(cafeId, entry.drinkId);
          body.innerHTML = html`
            <div class="redeem-success" role="status">
              <svg class="check-draw" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/><path d="M15 24.5l6 6 12-13" pathLength="1"/></svg>
              <p class="t-h2">Cup redeemed.</p>
              <p class="t-body t-muted">${member.firstName} has <span class="num" style="color:var(--ink);font-weight:500" data-cups-left data-value="${before}">${before}</span> ${raw(`<span data-cups-word>${before === 1 ? "cup" : "cups"}</span>`)} left this month.</p>
              <p class="t-small t-muted num" data-success-here>${hereLine}</p>
              <p class="t-small t-faint">${drink ? drink.name : "1 cup"} · ${fmt.time(entry.at)}</p>
              <button type="button" class="btn btn--secondary" data-reset style="margin-top:var(--space-3)">Next customer</button>
            </div>`;
          const cups = $("[data-cups-left]", body);
          const word = $("[data-cups-word]", body);
          setTimeout(() => {
            ui.animateNumber(cups, left, { duration: 600 });
            word.textContent = left === 1 ? "cup" : "cups";
          }, ui.reducedMotion() ? 0 : 450);
          if (focus) $("[data-reset]", body).focus({ preventScroll: true });
        }
      }

      function check(code, { focus = true } = {}) {
        r.code = code;
        const res = store.lookupCode(code, cafeId, 1);
        if (res.ok) {
          r = { ...freshRedeem(), state: "found", code, lookup: res, drinkId: oneCupDrinks()[0]?.id };
        } else {
          r = { ...freshRedeem(), state: "error", code, message: res.message };
        }
        paintRedeem({ focus });
      }

      function redeemNow() {
        const before = r.lookup.left;
        const res = store.actions.redeem({ code: r.code, cafeId, drinkId: r.drinkId });
        if (!res.ok) {
          // e.g. the code expired while the barista was choosing a drink
          r = { ...freshRedeem(), state: "error", code: r.code, message: res.message };
          paintRedeem({ focus: true });
          return;
        }
        r = { ...freshRedeem(), state: "success", result: { member: res.member, entry: res.entry, before, here: res.here } };
        paintRedeem({ focus: true });
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => reset({ focus: el.contains(document.activeElement) }), RESET_AFTER_MS);
      }

      function reset({ focus = true } = {}) {
        clearTimeout(resetTimer);
        clearTimeout(scanTimer);
        r = freshRedeem();
        paintRedeem({ focus });
      }

      function simulateScan(btn) {
        // BACKEND: a real scan decodes the QR payload (LCC1:<member>:<code>) on device
        btn.disabled = true;
        btn.textContent = "Scanning…";
        clearTimeout(scanTimer);
        scanTimer = setTimeout(() => check(store.select.pass(store.getState().memberId).code), 600);
      }

      /* ---------------------------------------------------------------
         Busy status
         --------------------------------------------------------------- */
      function busyControl() {
        const current = cafe().status;
        const index = store.statuses.indexOf(current);
        return html`
          <div class="busy" role="radiogroup" aria-labelledby="busy-h" style="--index:${index}" data-busy>
            <span class="busy__thumb" aria-hidden="true"></span>
            ${store.statuses.map((s) => html`
              <button type="button" role="radio" class="busy__option" data-busy-option="${s}"
                aria-checked="${s === current}" tabindex="${s === current ? 0 : -1}">
                ${ui.cupIcon(s, { size: 32, cls: "busy__icon" })}
                <span class="busy__label">${fmt.statusLabel(s)}</span>
                <span class="busy__hint">${STATUS_HINTS[s]}</span>
              </button>`)}
          </div>`;
      }

      function paintBusy() {
        const group = $("[data-busy]", el);
        if (!group) return;
        const c = cafe();
        group.style.setProperty("--index", store.statuses.indexOf(c.status));
        $$("[data-busy-option]", group).forEach((b) => {
          const on = b.dataset.busyOption === c.status;
          b.setAttribute("aria-checked", on);
          b.tabIndex = on ? 0 : -1;
        });
        const upd = $("[data-busy-updated]", el);
        upd.dataset.relTime = c.statusUpdatedAt;
        upd.textContent = `Updated ${fmt.ago(c.statusUpdatedAt)}`;
      }

      function setBusy(status) {
        // store.actions.setCafeStatus carries the // BACKEND: PATCH /cafes/:id/status seam
        store.actions.setCafeStatus(cafeId, status);
      }

      /* ---------------------------------------------------------------
         Today
         --------------------------------------------------------------- */
      function paintToday(newEntryId) {
        // BACKEND: GET /cafes/:id/summary?date=today
        const s = store.select.cafeSummary(cafeId);
        ui.animateNumber($('[data-stat="redemptions"]', el), s.redemptionsToday);
        ui.animateNumber($('[data-stat="new"]', el), s.newCustomersToday);
        ui.animateNumber($('[data-stat="payout"]', el), s.payoutToday, { format: fmt.rs, duration: 700 });
        ui.animateNumber($('[data-stat="month"]', el), s.payoutMonth, { format: fmt.rs, duration: 700 });
        $("[data-payout-meta]", el).textContent = `${fmt.cups(s.cupsToday)} × ${fmt.rs(s.payoutPerCup)}, your rate per cup`;
        // BACKEND: the monthly statement (reserved cups from subscriptions, redeemed cups from the ledger)
        $('[data-month-stat="reserved"]', el).textContent = fmt.num(s.reservedCups);
        $('[data-month-stat="reservers"]', el).textContent = s.reservedMembers ? `by ${s.reservedMembers} My cafés ${s.reservedMembers === 1 ? "member" : "members"}` : "No My cafés members yet";
        $('[data-month-stat="redeemed"]', el).textContent = fmt.num(s.monthCups);
        $("[data-month-meta]", el).textContent = `${fmt.cups(s.monthCups)} × ${fmt.rs(s.payoutPerCup)}, paid on the 1st`;

        const list = $("[data-recent]", el);
        const shown = s.today.slice(0, RECENT_LIMIT);
        list.innerHTML = shown.length
          ? html`${shown.map((e) => {
              const m = store.select.member(e.memberId);
              const d = store.select.drink(cafeId, e.drinkId);
              return html`<li class="row${e.id === newEntryId ? " enter" : ""}">
                <span class="row__trail num">${fmt.time(e.at)}</span>
                <div class="row__main">
                  <div class="row__title">${d ? d.name : "Coffee"}</div>
                  <div class="row__meta">${m ? m.firstName : "Member"}${e.firstVisit ? " · first visit" : ""}</div>
                </div>
                <span class="badge">${fmt.cups(e.credits)}</span>
              </li>`;
            })}`.s
          : html`<li class="row"><div class="row__main row__meta">No cups redeemed yet today.</div></li>`.s;
        const more = s.today.length - shown.length;
        $("[data-recent-more]", el).textContent = more > 0 ? `And ${more} earlier today.` : "";
      }

      function paintOpen() {
        const ind = $("[data-open-indicator]", el);
        if (!ind) return;
        const open = store.select.openState(cafe());
        ind.dataset.open = open.open;
        ind.textContent = open.label;
      }

      /* ---------------------------------------------------------------
         Events
         --------------------------------------------------------------- */
      const onClick = (e) => {
        const t = e.target;
        const opt = t.closest("[data-busy-option]");
        if (opt) return setBusy(opt.dataset.busyOption);
        if (t.closest("[data-sim-scan]")) return simulateScan(t.closest("[data-sim-scan]"));
        if (t.closest("[data-redeem]")) return redeemNow();
        if (t.closest("[data-reset]")) return reset();
        if (t.closest("[data-pair]")) return openPair();
        const drink = t.closest("[data-drink]");
        if (drink) {
          r.drinkId = drink.dataset.drink;
          $$("[data-drink]", el).forEach((b) => b.setAttribute("aria-pressed", b === drink));
        }
      };

      const onInput = (e) => {
        if (e.target.id !== "member-code") return;
        const input = e.target;
        const digits = input.value.replace(/\D/g, "").slice(0, 6);
        if (input.value !== digits) input.value = digits;
        r.code = digits;
        // Clear the error as soon as they start correcting
        const field = input.closest(".field");
        if (field.dataset.invalid === "true") { field.dataset.invalid = "false"; input.setAttribute("aria-invalid", "false"); r.state = "idle"; }
        if (digits.length === 6) check(digits);
      };

      const onSubmit = (e) => {
        if (!e.target.matches("[data-code-form]")) return;
        e.preventDefault();
        const code = $("#member-code", el).value.replace(/\D/g, "");
        if (code.length !== 6) {
          r = { ...freshRedeem(), state: "error", code, message: code.length ? `That’s ${code.length} digit${code.length === 1 ? "" : "s"}. Member codes have six.` : "Enter the six-digit code from the member’s pass." };
          paintRedeem({ focus: true });
          return;
        }
        check(code);
      };

      const onChange = (e) => {
        if (e.target.matches("[data-viewing]")) store.actions.setPartnerCafe(e.target.value);
      };

      // Radio group keys: arrows move and select, Home/End jump
      const onKeydown = (e) => {
        const opt = e.target.closest?.("[data-busy-option]");
        if (!opt) return;
        const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
        const list = store.statuses;
        let i = list.indexOf(opt.dataset.busyOption);
        if (e.key in keys) i = (i + keys[e.key] + list.length) % list.length;
        else if (e.key === "Home") i = 0;
        else if (e.key === "End") i = list.length - 1;
        else return;
        e.preventDefault();
        setBusy(list[i]);
        $(`[data-busy-option="${list[i]}"]`, el).focus();
      };

      el.addEventListener("click", onClick);
      el.addEventListener("input", onInput);
      el.addEventListener("submit", onSubmit);
      el.addEventListener("change", onChange);
      el.addEventListener("keydown", onKeydown);

      const offs = [
        store.on("cafe:status", ({ cafeId: id }) => { if (id === cafeId) paintBusy(); }),
        store.on("redeem", ({ entry }) => {
          if (entry.cafeId !== cafeId) return;
          paintToday(entry.id);
          // A redemption from another window for the member on screen: refresh their numbers
          if (r.state === "found" && r.lookup.member.id === entry.memberId) check(r.code, { focus: false });
        }),
        store.on("cafe:viewing", ({ cafeId: id }) => {
          cafeId = id;
          clearTimeout(resetTimer); clearTimeout(scanTimer);
          r = freshRedeem();
          renderAll();
          $("[data-viewing]", el)?.focus();
        }),
        store.on("tick", paintOpen),
        // A plan bought or switched (here or on a phone) changes reserved cups
        store.on("plan", () => { paintToday(); if (r.state === "found") check(r.code, { focus: false }); }),
        // A device that joined the room was filled in by another café window
        store.on("snapshot", () => { renderAll(); }),
      ];

      renderAll();

      return () => {
        clearTimeout(resetTimer);
        clearTimeout(scanTimer);
        offs.forEach((off) => off());
        el.removeEventListener("click", onClick);
        el.removeEventListener("input", onInput);
        el.removeEventListener("submit", onSubmit);
        el.removeEventListener("change", onChange);
        el.removeEventListener("keydown", onKeydown);
      };
    },
  });
})();

</script>
<script>
/* ---- src/app.js ---- */
/* =====================================================================
   Lahore Coffee Club — app.js
   Member app (#/app). Replaces the Pass 1 shell in router.js.

   Routes:  #/app (Home) · #/app/cafes · #/app/cafes/:id · #/app/pass
            #/app/map · #/app/club · #/app/gift · #/app/plan
            #/app/plan/pay · #/app/welcome · #/app/welcome/card
   This file owns the shell, tabs, Home, Pass and Map. Cafés live in
   app-cafes.js, the plan picker and payment in app-plan.js, the Club
   and gifting in app-club.js, onboarding in app-welcome.js; they add
   screen factories to LCC.appScreens and get a small ctx object.

   Everything reads the shared store, so a redemption or status change
   in the café view (same window or another one) shows up here live.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, raw, $, $$, icon } = ui;
  const S = store.select;
  // Screens added by app-cafes.js / app-plan.js: name -> (ctx, arg) => screen
  const REG = (LCC.appScreens = LCC.appScreens || {});

  const TABS = [
    { id: "home",    label: "Home",    icon: "home" },
    { id: "cafes",   label: "Cafés",   icon: "store" },
    { id: "pass",    label: "Pass",    icon: "qr" },
    { id: "map",     label: "Map",     icon: "map" },
    { id: "club",    label: "Club",    icon: "award" },
  ];
  const tabFromPath = (path) => (TABS.some((t) => t.id === path[0]) ? path[0] : "home");
  const hrefFor = (id) => (id === "home" ? "#/app" : `#/app/${id}`);

  /* -------------------------------------------------------------------
     Map geometry. data.js stores café/area positions on a 1000 x 800
     landscape grid; the phone map is a portrait 360 x 560 schematic.
     ------------------------------------------------------------------- */
  const MAP_W = 360, MAP_H = 560;
  const project = (x, y) => ({ x: 24 + (x - 260) * 0.58, y: 60 + (y - 250) * 1.1 });
  // Where each pin's name sits, so names stay inside the frame and don't collide (default: right)
  const LABEL_SIDE = { slowpour: "left", maple: "left", grind: "left", quiethours: "left", ember: "below", thirdfloor: "below" };
  const AREA_LABELS = {
    gulberg: [236, 196], liberty: [92, 286], fortress: [292, 70],
    dha: [300, 514], "model-town": [196, 512], "johar-town": [58, 530],
  };
  const USUAL_HOUR = 18;

  function mapSvg() {
    const areas = store.getState().areas;
    return html`<svg viewBox="0 0 ${MAP_W} ${MAP_H}" aria-hidden="true" focusable="false">
      ${areas.map((a) => { const p = project(a.x, a.y); return html`<ellipse class="m-area" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" rx="64" ry="54"/>`; })}
      <path class="m-river" d="M-20 78 C 50 52, 110 22, 190 -16"/>
      <path class="m-road m-road--major" d="M40 140 L 360 296"/>
      <path class="m-road m-road--major" d="M0 392 C 110 548, 250 572, 360 476"/>
      <path class="m-road" d="M150 0 L 112 560"/>
      <path class="m-road" d="M0 336 L 360 226"/>
      <path class="m-road" d="M262 0 L 236 560"/>
      <path class="m-canal" d="M336 0 C 284 112, 222 150, 206 262 S 122 424, 66 560"/>
      <text class="m-label m-label--water" x="34" y="44">Ravi</text>
      <text class="m-label m-label--water" x="150" y="372" transform="rotate(-58 150 372)">Canal</text>
      ${areas.map((a) => { const [x, y] = AREA_LABELS[a.id] || [0, 0]; return html`<text class="m-label" x="${x}" y="${y}" text-anchor="middle">${a.name}</text>`; })}
    </svg>`;
  }

  // The landing page's busy-map teaser draws the same map
  LCC.memberMap = { svg: mapSvg, project, labelSide: LABEL_SIDE, width: MAP_W, height: MAP_H };

  /* -------------------------------------------------------------------
     Surface
     ------------------------------------------------------------------- */
  let api = null; // set while mounted, so router.update can reach it

  LCC.router.register("app", {
    title: "Member app",
    update(path, opts) { if (api) api.show(path, opts); },
    mount(el, path) {
      const member = () => S.member();
      let active = { key: null, tab: null, cleanup: null, on: {} };
      // Screens visited in this app session, so Back knows whether history.back() stays in the app
      const trail = [];
      let replacing = false;
      let mapMode = "now";

      // Fit the 844px frame on short laptop screens
      const fit = () => {
        const scale = Math.min(1, Math.max(0.6, (window.innerHeight - 88) / 864));
        document.documentElement.style.setProperty("--phone-scale", scale.toFixed(3));
      };
      fit();
      window.addEventListener("resize", fit);

      el.innerHTML = html`
        <div class="surface stage">
          <div class="phone">
            <div class="phone__screen">
              <div class="phone__status" aria-hidden="true">
                <span>9:41</span>
                <span class="phone__island"></span>
                <span class="phone__status-icons">
                  <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                  <svg viewBox="0 0 26 12" style="width:26px"><rect x="0.75" y="0.75" width="21.5" height="10.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.6" fill="currentColor"/><rect x="23.5" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
                </span>
              </div>
              <div class="app-view" id="app-view" role="tabpanel" tabindex="-1"></div>
              <div class="tabbar" role="tablist" aria-label="Sections">
                ${TABS.map((t) => html`
                  <button type="button" role="tab" class="tab${t.id === "pass" ? " tab--pass" : ""}" id="tab-${t.id}" data-tab="${t.id}"
                    aria-controls="app-view" aria-selected="false" tabindex="-1">
                    ${t.id === "pass" ? html`<span class="tab__pass">${icon(t.icon)}</span>` : icon(t.icon)}
                    <span>${t.label}</span>
                  </button>`)}
              </div>
              <div class="sheet" id="cafe-sheet" role="dialog" aria-modal="true" aria-labelledby="cafe-sheet-title" aria-hidden="true">
                <div class="sheet__scrim" data-sheet-close></div>
                <div class="sheet__panel">
                  <div class="sheet__handle" aria-hidden="true"></div>
                  <div class="sheet__body" data-sheet-body></div>
                </div>
              </div>
              <div class="toast-region" style="position:absolute;bottom:104px" role="status" aria-live="polite"></div>
            </div>
          </div>
        </div>`;

      const view = $("#app-view", el);

      /* ---------------- Routing inside the app ---------------- */
      function resolve(path) {
        const [a = "home", b] = path;
        if (a === "cafes" && b && S.cafe(b) && REG.cafeDetail) return { key: `cafes/${b}`, tab: "cafes", make: () => REG.cafeDetail(ctx, b) };
        if (a === "cafes" && REG.cafes) return { key: "cafes", tab: "cafes", make: () => REG.cafes(ctx) };
        if (a === "plan" && b === "pay" && REG.pay) return { key: "plan/pay", tab: "home", flow: true, make: () => REG.pay(ctx) };
        if (a === "plan" && REG.plan) return { key: "plan", tab: "home", flow: true, make: () => REG.plan(ctx) };
        if (a === "club" && REG.club) return { key: "club", tab: "club", make: () => REG.club(ctx) };
        if (a === "rewards") return { key: "rewards", tab: "club", make: () => ({ redirect: "#/app/club" }) };
        if (a === "gift" && REG.gift) return { key: "gift", tab: "home", flow: true, make: () => REG.gift(ctx) };
        if (a === "welcome" && b === "card" && REG.issued) return { key: "welcome/card", tab: "home", flow: true, make: () => REG.issued(ctx) };
        if (a === "welcome" && REG.welcome) return { key: "welcome", tab: "home", flow: true, make: () => REG.welcome(ctx) };
        const tab = tabFromPath(path);
        return { key: tab, tab, make: SCREENS[tab] };
      }

      function show(path, { force = false } = {}) {
        const r = resolve(Array.isArray(path) ? path : [path]);
        if (active.key === r.key && !force) return;
        const screen = r.make();
        if (screen.redirect) { history.replaceState(null, "", LCC.sync ? LCC.sync.withRoom(screen.redirect) : screen.redirect); LCC.router.render(); return; }
        if (active.key !== r.key) {
          if (replacing && trail.length) trail[trail.length - 1] = r.key;
          else if (trail[trail.length - 2] === r.key) trail.pop();
          else trail.push(r.key);
        }
        replacing = false;
        if (typeof active.cleanup === "function") active.cleanup();
        ui.closeSheet($("#cafe-sheet", el));
        $$("[data-tab]", el).forEach((btn) => {
          const on = btn.dataset.tab === r.tab;
          btn.setAttribute("aria-selected", on);
          btn.tabIndex = on ? 0 : -1;
        });
        // Plan and payment are a focused flow: no tab bar
        $(".phone__screen", el).classList.toggle("is-flow", !!r.flow);
        view.setAttribute("aria-labelledby", `tab-${r.tab}`);
        view.scrollTop = 0;
        view.innerHTML = `<div class="enter">${screen.html}</div>`;
        active = { key: r.key, tab: r.tab, cleanup: screen.mount ? screen.mount() : null, on: screen.on || {} };
      }

      /** Navigate inside the app. replace: swap the history entry (after payment, redirects). */
      function go(hash, { replace = false } = {}) {
        const to = LCC.sync ? LCC.sync.withRoom(hash) : hash; // keep the sync room in the URL
        if (replace) { replacing = true; history.replaceState(null, "", to); LCC.router.render(); }
        else location.hash = to;
      }
      /** Back button: step back if we got here inside the app, otherwise go to the fallback. */
      function back(fallback) {
        if (trail.length > 1) history.back();
        else go(fallback, { replace: true });
      }
      const ctx = { el, view, go, back, member, openCafe: (id) => openCafe(id), toast: ui.toast, rerender: () => show(LCC.router.parse().path, { force: true }) };

      /* ---------------- Café sheet ---------------- */
      function openCafe(cafeId) {
        const c = S.cafe(cafeId);
        const open = S.openState(c);
        const usual = S.usualStatus(c, USUAL_HOUR).status;
        $("[data-sheet-body]", el).innerHTML = html`
          <div class="cafe-sheet">
            <div class="stack" style="--stack-gap:var(--space-1)">
              <h2 class="t-h2" id="cafe-sheet-title">${c.name}</h2>
              <p class="t-small t-muted">${S.area(c.area).name} · ${c.distanceKm} km · ${fmt.rs(c.price)} a cup at the counter</p>
            </div>
            <div>${ui.statusPill(c.id)}</div>
            <div class="cafe-sheet__facts">
              <span>${icon("clock")} ${c.hours.label} · ${open.open ? "open now" : "closed now"}</span>
              <span>${ui.cupIcon(usual, { size: 18, cls: "" })} Usually ${fmt.statusLabel(usual).toLowerCase()} at 6 pm</span>
            </div>
            <p class="t-small t-muted">${c.blurb}</p>
            <div>
              <h3 class="eyebrow">Signature drinks</h3>
              <ul role="list">
                ${c.drinks.map((d) => html`<li class="row"><div class="row__main"><div class="row__title">${d.name}</div></div><span class="badge">${fmt.cups(d.credits)}</span></li>`)}
              </ul>
            </div>
            <div class="cafe-sheet__actions">
              <button type="button" class="btn btn--primary btn--block" data-directions="${c.id}">Directions</button>
              <a class="btn btn--secondary btn--block" href="#/app/cafes/${c.id}">More about ${c.name}</a>
            </div>
          </div>`;
        ui.openSheet($("#cafe-sheet", el));
      }

      /* ---------------- Screens ---------------- */
      const SCREENS = {
        home: homeScreen,
        pass: passScreen,
        map: mapScreen,
      };

      /* Home ------------------------------------------------------------ */
      const RING_C = 2 * Math.PI * 96;
      function homeScreen() {
        const m = member();
        const near = S.cafes().slice().sort((a, b) => a.distanceKm - b.distanceKm).slice(0, 4);
        return {
          html: html`
            <div class="app-screen">
              <div class="app-head">
                <div>
                  <p class="t-small t-muted">${fmt.date(Date.now())}</p>
                  <h1 class="t-h2">Salaam, ${m.firstName}.</h1>
                </div>
                <span class="avatar" role="img" aria-label="${m.firstName} ${m.lastName || ""}">${m.initials || m.firstName[0]}</span>
              </div>

              <div class="ring-wrap">
                <div class="ring" data-ring role="img" aria-label="${S.balance().left} of ${S.balance().total} cups left this month">
                  <svg viewBox="0 0 208 208" aria-hidden="true">
                    <circle class="track" cx="104" cy="104" r="96"/>
                    <circle class="bar" cx="104" cy="104" r="96" stroke-dasharray="${RING_C.toFixed(2)}" stroke-dashoffset="${RING_C.toFixed(2)}"/>
                  </svg>
                  <div class="ring__center" aria-hidden="true">
                    <span class="ring__num" data-ring-num data-value="0">0</span>
                    <span class="t-small t-muted">of <span class="num" data-ring-total>${S.balance().total}</span> cups left</span>
                  </div>
                </div>
                <p class="t-small t-muted" data-plan-line>${planLine()}</p>
                <div class="ring-actions">
                  <button type="button" class="btn btn--link" data-start-plan>${m.plan ? "Change plan" : "Choose a plan"}</button>
                  <a class="btn btn--link" href="#/app/gift">${icon("gift", { size: 18 })}Send a gift</a>
                </div>
              </div>

              <section class="app-section" aria-labelledby="near-h">
                <h2 class="eyebrow app-section__title" id="near-h">Near you</h2>
                <ul role="list">
                  ${near.map((c) => html`<li>
                    <button type="button" class="row near-row" data-open-cafe="${c.id}" aria-label="${c.name}, ${S.area(c.area).name}. Open details">
                      <span class="row__main">
                        <span class="row__title">${c.name}</span>
                        <span class="row__meta num">${S.area(c.area).name} · ${fmt.rs(c.price)} a cup · ${c.distanceKm} km</span>
                        ${ui.statusPill(c.id)}
                      </span>
                      <span class="row__trail" aria-hidden="true">${icon("chevronRight", { size: 20 })}</span>
                    </button>
                  </li>`)}
                </ul>
              </section>

              <section class="app-section" aria-labelledby="recent-h">
                <h2 class="eyebrow app-section__title" id="recent-h">Recent activity</h2>
                <ul role="list" data-recent aria-live="polite">${recentRows()}</ul>
              </section>
            </div>`.s,
          mount() {
            requestAnimationFrame(() => paintRing());
          },
          on: {
            // Redemptions, gifts and free cups, from this window or another device
            ledger: ({ entries }) => {
              const mine = entries.filter((e) => e.memberId === member().id);
              if (!mine.length) return;
              paintRing();
              $("[data-recent]", view).innerHTML = recentRows(mine[mine.length - 1].id).s;
            },
            member: () => { paintRing(); const l = $("[data-plan-line]", view); if (l) l.textContent = planLine(); },
          },
        };
      }

      function planLine() {
        const m = member();
        const p = S.memberPlan(m);
        if (!p.type) return "No plan yet";
        const bonus = S.balance().total - (p.type === "explorer" ? S.tier(m.plan.tierId).cups : Object.values(m.plan.allocation).reduce((a, b) => a + b, 0));
        return `${p.type === "explorer" ? `Explorer · ${p.name}` : "My cafés"} plan${bonus > 0 ? `, plus ${bonus} free` : ""} · renews on ${fmt.shortDate(m.renewsAt)}`;
      }

      const REWARD_LINES = { "passport-5": "fifth café", "passport-all": "every café", invite: "a friend joined", invited: "invited by a friend" };
      function recentRows(newId) {
        const rows = S.activity().slice(0, 3);
        if (!rows.length) return html`<li class="row"><div class="row__main row__meta">No cups used yet. Your first one is waiting.</div></li>`;
        return html`${rows.map((r) => {
          const c = S.cafe(r.cafeId);
          if (r.type !== "redeem") {
            const title = r.type === "gift" ? `Gift to ${r.toName || "a friend"}` : `Free cup: ${REWARD_LINES[r.reason] || "from the club"}`;
            const where = r.type === "gift" ? (c ? `For ${c.name}` : "For any partner café") : "Any partner café";
            return html`<li class="row${r.id === newId ? " enter" : ""}">
              <div class="row__main">
                <div class="row__title">${title}</div>
                <div class="row__meta">${where} · <span data-rel-time="${r.at}">${fmt.ago(r.at)}</span></div>
              </div>
              <span class="badge${r.type === "reward" ? " badge--accent" : ""}">${r.type === "reward" ? "+" : "−"}${fmt.cups(Math.abs(r.cups))}</span>
            </li>`;
          }
          const d = S.drink(r.cafeId, r.drinkId);
          return html`<li class="row${r.id === newId ? " enter" : ""}">
            <div class="row__main">
              <div class="row__title">${d ? d.name : "Coffee"}</div>
              <div class="row__meta">${c.name} · <span data-rel-time="${r.at}">${fmt.ago(r.at)}</span></div>
            </div>
            <span class="badge">${fmt.cups(r.credits)}</span>
          </li>`;
        })}`;
      }

      function paintRing() {
        const ring = $("[data-ring]", view);
        if (!ring) return;
        // Total cups across the plan, either type; read from the ledger
        const b = S.balance();
        const frac = b.total ? Math.max(0, Math.min(1, b.left / b.total)) : 0;
        $(".bar", ring).setAttribute("stroke-dashoffset", (RING_C * (1 - frac)).toFixed(2));
        ui.animateNumber($("[data-ring-num]", ring), b.left, { duration: 700 });
        $("[data-ring-total]", ring).textContent = b.total;
        ring.setAttribute("aria-label", `${b.left} of ${b.total} cups left this month`);
      }

      /* Pass ------------------------------------------------------------ */
      const CD_C = 2 * Math.PI * 8;
      function passScreen() {
        const m = member();
        let timer = null, backTimer = null, lastCode = null;
        return {
          html: html`
            <div class="app-screen pass">
              <div class="stack" style="--stack-gap:var(--space-1)">
                <p class="eyebrow">Your pass</p>
                <h1 class="t-h2">${[m.firstName, m.lastName].filter(Boolean).join(" ")}</h1>
              </div>
              <div class="pass__card" data-pass-card></div>
              <p class="pass__note">${icon("sun")} Turn your brightness up if the scanner struggles.</p>
              ${LCC.sync ? LCC.sync.pill() : ""}
            </div>`.s,
          mount() {
            paintQrCard();
            timer = setInterval(tickCountdown, 250);
            return () => { clearInterval(timer); clearTimeout(backTimer); };
          },
          on: {
            pass: () => rotate(),
            redeem: ({ entry, member: who }) => { if (who.id === member().id) showSuccess(entry); },
            member: () => paintMeta(),
            ledger: () => paintMeta(),
          },
        };

        function paintQrCard() {
          const m2 = member();
          const plan = S.memberPlan(m2);
          const card = $("[data-pass-card]", view);
          card.innerHTML = html`
            <div class="qr" data-qr role="img" aria-label="QR code for your pass"></div>
            <div class="countdown" aria-hidden="true">
              <svg viewBox="0 0 20 20"><circle class="track" cx="10" cy="10" r="8"/><circle class="bar" data-cd-bar cx="10" cy="10" r="8" stroke-dasharray="${CD_C.toFixed(2)}"/></svg>
              <span data-cd-text></span>
            </div>
            <p class="pass__code" data-code></p>
            <p class="t-small t-muted">Show this to the barista, or read them the code.</p>
            <div class="pass__meta">
              <div><p class="t-micro t-faint">Cups left</p><p class="t-h3 num"><span data-pass-cups>${S.balance().left}</span> of <span data-pass-total>${S.balance().total}</span></p></div>
              <div style="text-align:right"><p class="t-micro t-faint" data-pass-type>${plan.typeName}</p><p class="t-h3" data-pass-plan>${plan.name}</p></div>
            </div>
            <div class="pass__cafes" data-pass-cafes>${passCafes()}</div>`.s;
          lastCode = null;
          paintCode();
          tickCountdown();
        }

        /** Explorer: cafés used this month (“Kiln & Bean 2 of 2”).
            My cafés: each café's balance (“Kiln & Bean 3 of 6”).        */
        function passCafes() {
          const b = S.balance();
          const cap = store.getState().rules.explorerCapPerCafe;
          if (b.type === "mycafes") {
            return html`<p class="t-micro t-faint">Reserved at</p>
              <ul role="list">${Object.entries(b.perCafe).filter(([, x]) => x.reserved).map(([id, x]) => html`<li><span>${S.cafe(id).name}</span> <span class="num">${x.left} of ${x.reserved}</span></li>`)}</ul>`;
          }
          const used = Object.entries(b.usedAt);
          return html`<p class="t-micro t-faint">Used this month · up to ${cap} at each café</p>
            ${used.length
              ? html`<ul role="list">${used.map(([id, n]) => html`<li><span>${S.cafe(id).name}</span> <span class="num">${n} of ${cap}</span></li>`)}</ul>`
              : html`<p class="t-small t-muted">No cups used yet. Your first one is waiting.</p>`}`;
        }

        // Plan change, redemption elsewhere or gift while the pass is open
        function paintMeta() {
          const m2 = member();
          const b = S.balance();
          const p = S.memberPlan(m2);
          const set = (sel, v) => { const n = $(sel, view); if (n) n.textContent = v; };
          set("[data-pass-cups]", b.left);
          set("[data-pass-total]", b.total);
          set("[data-pass-plan]", p.name);
          set("[data-pass-type]", p.typeName);
          const list = $("[data-pass-cafes]", view);
          if (list) list.innerHTML = passCafes().s;
        }

        function paintCode() {
          const p = S.pass();
          if (p.code === lastCode) return;
          lastCode = p.code;
          const qrEl = $("[data-qr]", view);
          if (qrEl) qrEl.innerHTML = ui.qrSvg(p.payload);
          const codeEl = $("[data-code]", view);
          if (codeEl) {
            codeEl.innerHTML = html`<span>${p.code.slice(0, 3)}</span><span>${p.code.slice(3)}</span>`.s;
            codeEl.setAttribute("aria-label", `Code ${p.code.split("").join(" ")}`);
          }
        }

        function rotate() {
          const qrEl = $("[data-qr]", view);
          if (!qrEl) return;
          qrEl.classList.add("is-rotating");
          setTimeout(() => { paintCode(); qrEl.classList.remove("is-rotating"); }, ui.reducedMotion() ? 0 : 180);
        }

        function tickCountdown() {
          const text = $("[data-cd-text]", view);
          if (!text) return;
          const p = S.pass();
          if (p.code !== lastCode) rotate(); // safety net if the rotation event was missed
          text.textContent = `Refreshes in ${fmt.countdown(p.secondsLeft)}`;
          $("[data-cd-bar]", view).setAttribute("stroke-dashoffset", (CD_C * (1 - p.secondsLeft / p.period)).toFixed(2));
        }

        function showSuccess(entry) {
          const card = $("[data-pass-card]", view);
          if (!card) return;
          const m2 = member();
          const cafe = S.cafe(entry.cafeId);
          const drink = S.drink(entry.cafeId, entry.drinkId);
          const b = S.balance();
          const before = b.left + entry.credits;
          const here = S.cafeBalance(m2.id, entry.cafeId);
          const hereLine = entry.bonus ? "That was a free cup from the club"
            : here.type === "mycafes"
            ? `${here.left} of ${here.reserved} left at ${cafe.name}`
            : here.left > 0 ? `${here.left} more at ${cafe.name} this month` : `That’s your ${here.cap} at ${cafe.name} this month`;
          card.innerHTML = html`
            <div class="pass-success" role="status">
              <svg class="check-draw" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/><path d="M15 24.5l6 6 12-13" pathLength="1"/></svg>
              <p class="t-h2">Enjoy your coffee at ${cafe.name}.</p>
              <p class="t-body t-muted">${drink ? drink.name : "1 cup"} · <span class="num" style="color:var(--ink);font-weight:500" data-success-cups data-value="${before}">${before}</span> of ${b.total} cups left</p>
              <p class="t-small t-faint num" data-success-here>${hereLine}</p>
              <button type="button" class="btn btn--secondary" data-pass-back style="margin-top:var(--space-3)">Back to my pass</button>
            </div>`.s;
          setTimeout(() => ui.animateNumber($("[data-success-cups]", view), b.left, { duration: 600 }), ui.reducedMotion() ? 0 : 450);
          clearTimeout(backTimer);
          backTimer = setTimeout(paintQrCard, 8000);
        }
      }

      /* Map ------------------------------------------------------------- */
      function pinStatus(c) {
        return mapMode === "now" ? c.status : S.usualStatus(c, USUAL_HOUR).status;
      }
      function pinLabel(c, status) {
        return mapMode === "now"
          ? `${c.name}, ${fmt.statusLabel(status)}, ${fmt.updated(c.statusUpdatedAt)}`
          : `${c.name}, usually ${fmt.statusLabel(status).toLowerCase()} at 6 pm`;
      }
      function pinHtml(c) {
        const p = project(c.x, c.y);
        const status = pinStatus(c);
        return html`<button type="button" class="pin${LABEL_SIDE[c.id] ? ` pin--${LABEL_SIDE[c.id]}` : ""}" data-pin="${c.id}" data-status="${status}"
            style="left:${(p.x / MAP_W * 100).toFixed(2)}%;top:${(p.y / MAP_H * 100).toFixed(2)}%" aria-label="${pinLabel(c, status)}">
            <span class="pin__dot">${ui.cupIcon(status, { size: 18, cls: "pin__icon" })}</span>
            <span class="pin__name" aria-hidden="true">${c.name}</span>
          </button>`;
      }
      function mapNote() {
        return mapMode === "now"
          ? html`Live from each café. Tap a pin for details.`
          : html`How busy each café usually is at 6 pm, from past weeks.`;
      }

      function mapScreen() {
        return {
          html: html`
            <div class="app-screen--flush">
              <div class="map-head">
                <h1 class="t-h2">Know before you go.</h1>
                ${ui.segmented({ name: "mapmode", label: "Map view", value: mapMode, options: [{ value: "now", label: "Now" }, { value: "usual", label: "Usually at 6 pm" }] })}
              </div>
              <div class="map" data-map>
                ${mapSvg()}
                <div data-pins>${S.cafes().map(pinHtml)}</div>
              </div>
              <div class="map-foot">
                <div class="legend" aria-hidden="true">
                  ${store.statuses.map((s) => html`<span>${ui.cupIcon(s, { size: 16, cls: "" })}${fmt.statusLabel(s)}</span>`)}
                </div>
                <p class="t-small t-muted" data-map-note aria-live="polite">${mapNote()}</p>
              </div>
            </div>`.s,
          on: {
            "cafe:status": ({ cafeId }) => {
              const c = S.cafe(cafeId);
              if (mapMode !== "now") return;
              const pin = $(`[data-pin="${cafeId}"]`, view);
              if (pin) {
                pin.dataset.status = c.status;
                $(".pin__icon", pin).outerHTML = ui.cupIcon(c.status, { size: 18, cls: "pin__icon" }).s;
                pin.setAttribute("aria-label", pinLabel(c, c.status));
                pin.classList.remove("is-changed"); void pin.offsetWidth; pin.classList.add("is-changed");
              }
              $("[data-map-note]", view).innerHTML = html`${c.name} is now ${fmt.statusLabel(c.status).toLowerCase()} · <span data-rel-time="${c.statusUpdatedAt}" data-rel-prefix="updated">${fmt.updated(c.statusUpdatedAt)}</span>`.s;
            },
            tick: () => {
              if (mapMode !== "now") return;
              $$("[data-pin]", view).forEach((pin) => { const c = S.cafe(pin.dataset.pin); pin.setAttribute("aria-label", pinLabel(c, c.status)); });
            },
          },
        };
      }

      function setMapMode(mode) {
        mapMode = mode;
        const pins = $("[data-pins]", view);
        if (!pins) return;
        pins.innerHTML = html`${S.cafes().map(pinHtml)}`.s;
        $("[data-map-note]", view).innerHTML = mapNote().s;
      }

      /* ---------------- Events ---------------- */
      const onClick = (e) => {
        const t = e.target;
        const tab = t.closest("[data-tab]");
        if (tab) { location.hash = hrefFor(tab.dataset.tab); return; }
        const cafeBtn = t.closest("[data-open-cafe], [data-pin]");
        if (cafeBtn) { openCafe(cafeBtn.dataset.openCafe || cafeBtn.dataset.pin); return; }
        const seg = t.closest('[data-segmented="mapmode"] .segmented__option');
        if (seg) { ui.selectSegment(seg.parentElement, seg.dataset.value); setMapMode(seg.dataset.value); return; }
        if (t.closest("[data-pass-back]")) { active.cleanup?.(); active.cleanup = null; show(["pass"], { force: true }); return; }
        const start = t.closest("[data-start-plan]");
        if (start) { LCC.appPlan?.start({ addCafe: start.dataset.startPlan || null }); go("#/app/plan"); return; }
        const backBtn = t.closest("[data-back]");
        if (backBtn) { back(backBtn.dataset.back); return; }
        const dir = t.closest("[data-directions]");
        if (dir) {
          // BACKEND: deep link to the phone's maps app with the café's coordinates
          ui.toast(`Directions to ${S.cafe(dir.dataset.directions).name} open in your maps app.`, { iconName: "pin" });
        }
      };

      // Tabs: arrows move and activate, Home/End jump
      const onKeydown = (e) => {
        const tab = e.target.closest?.("[data-tab]");
        if (!tab) return;
        const ids = TABS.map((t) => t.id);
        let i = ids.indexOf(tab.dataset.tab);
        if (e.key === "ArrowRight") i = (i + 1) % ids.length;
        else if (e.key === "ArrowLeft") i = (i - 1 + ids.length) % ids.length;
        else if (e.key === "Home") i = 0;
        else if (e.key === "End") i = ids.length - 1;
        else return;
        e.preventDefault();
        $(`[data-tab="${ids[i]}"]`, el).focus();
        location.hash = hrefFor(ids[i]);
      };

      el.addEventListener("click", onClick);
      el.addEventListener("keydown", onKeydown);

      // Store events go to whichever screen is showing
      const dispatch = (type) => (payload) => active.on?.[type]?.(payload);
      const offs = ["redeem", "ledger", "member", "plan", "builder", "cafe:status", "pass", "tick", "rsvp"].map((type) => store.on(type, dispatch(type)));

      // Club milestones: a free cup, a new badge, a new status. Same words on every device.
      const REWARD_TOASTS = {
        "passport-5": "Fifth café on your passport. A free cup is on us.",
        "passport-all": "Every partner café on your passport. A free cup is on us.",
        invite: "A friend joined with your code. A free cup is on us.",
      };
      const earnedNow = () => { const c = S.club(); return { level: c.level.id, badges: c.badges.filter((b) => b.earned).map((b) => b.id) }; };
      let earned = earnedNow();
      offs.push(store.on("ledger", ({ entries, catchUp }) => {
        const mine = entries.filter((e) => e.memberId === member().id);
        if (!mine.length) return;
        const before = earned;
        earned = earnedNow();
        if (catchUp) return; // a join snapshot: no replayed news
        mine.filter((e) => e.type === "reward" && REWARD_TOASTS[e.reason]).forEach((e) => ui.toast(REWARD_TOASTS[e.reason], { iconName: "gift", duration: 4200 }));
        const club = S.club();
        const news = earned.badges.filter((id) => !before.badges.includes(id)).map((id) => `Badge earned: ${club.badges.find((x) => x.id === id).name}.`);
        if (earned.level !== before.level) news.push(`You’re a ${club.level.name} now.`);
        // After the “cup redeemed” and free-cup notes, not before
        if (news.length) setTimeout(() => news.forEach((t) => ui.toast(t, { iconName: "award", duration: 4200 })), 700);
      }));
      // Presenter switched member (new member, or back to Mumtaz): redraw
      offs.push(store.on("session", () => {
        earned = earnedNow();
        show(LCC.router.parse().path, { force: true });
      }));
      // A cup redeemed while Mumtaz is on another tab still deserves a word
      offs.push(store.on("redeem", ({ entry, member: who }) => {
        if (who.id !== member().id || active.key === "pass") return;
        ui.toast(`Cup redeemed at ${S.cafe(entry.cafeId).name}. ${fmt.cups(S.balance(who.id).left)} left.`);
      }));

      // Another device filled this one in (join handshake): redraw, unless mid-purchase
      offs.push(store.on("snapshot", () => {
        if (!$(".phone__screen", el).classList.contains("is-flow")) show(LCC.router.parse().path, { force: true });
      }));

      api = { show };
      show(path);

      return () => {
        if (typeof active.cleanup === "function") active.cleanup();
        offs.forEach((off) => off());
        el.removeEventListener("click", onClick);
        el.removeEventListener("keydown", onKeydown);
        window.removeEventListener("resize", fit);
        api = null;
      };
    },
  });
})();

</script>
<script>
/* ---- src/app-cafes.js ---- */
/* =====================================================================
   Lahore Coffee Club — app-cafes.js
   Member app: Cafés tab (#/app/cafes) and café detail (#/app/cafes/:id).
   Registers screen factories on LCC.appScreens; app.js mounts them.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, $, $$, icon } = ui;
  const S = store.select;
  const REG = (LCC.appScreens = LCC.appScreens || {});
  const USUAL_HOUR = 18;
  const EXPLORER_GOAL = 5;

  // Search and filters survive a trip into a café and back
  const filters = { query: "", areaId: null, openNow: false, quietNow: false };
  let listScroll = 0;

  /** A short badge for list rows: what this member's plan means here. */
  function hereBadge(cafeId) {
    const here = S.cafeBalance(S.member().id, cafeId);
    if (here.type === "mycafes") return here.reserved ? html`<span class="badge badge--accent">${here.left} of ${here.reserved} reserved</span>` : "";
    return here.used >= here.cap ? html`<span class="badge">${here.cap} of ${here.cap} this month</span>` : "";
  }

  /* -------------------------------------------------------------------
     Cafés list
     ------------------------------------------------------------------- */
  REG.cafes = (ctx) => {
    const { view } = ctx;
    const areas = store.getState().areas;

    function chip(label, attrs, pressed) {
      return html`<button type="button" class="chip" ${ui.raw(attrs)} aria-pressed="${pressed}">${label}</button>`;
    }

    function rowHtml(c, i) {
      const open = S.openState(c);
      return html`<li class="enter" style="--i:${Math.min(i, 8)}">
        <a class="row cafe-row" href="#/app/cafes/${c.id}">
          <span class="row__main">
            <span class="row__title">${c.name}</span>
            <span class="row__meta num">${S.area(c.area).name} · ${fmt.rs(c.price)} a cup${open.open ? "" : " · Closed now"}</span>
            <span class="cafe-row__pills">
              ${ui.statusPill(c.id)}
              ${hereBadge(c.id)}
            </span>
          </span>
          <span class="row__trail" aria-hidden="true">${icon("chevronRight", { size: 20 })}</span>
        </a>
      </li>`;
    }

    function emptyHtml() {
      // e.g. “Nothing open and quiet in DHA right now.” / “Nothing in Liberty matches “mocha”.”
      const adj = [filters.openNow && "open", filters.quietNow && "quiet"].filter(Boolean).join(" and ");
      const where = filters.areaId ? ` in ${S.area(filters.areaId).name}` : "";
      const q = filters.query.trim();
      const line = `Nothing${adj ? ` ${adj}` : ""}${where}${q ? ` matches “${q}”` : ""}${adj ? " right now" : ""}.`;
      return html`<li class="cafes-empty enter">
        <p class="t-h3">${line}</p>
        <p class="t-small t-muted">Lahore has more good coffee than this list. Try fewer filters, or a drink like “latte”.</p>
        <button type="button" class="btn btn--secondary btn--compact" data-clear-filters>Clear filters</button>
      </li>`;
    }

    function paintList() {
      const list = $("[data-cafe-list]", view);
      if (!list) return;
      const results = S.searchCafes(filters);
      list.innerHTML = results.length ? html`${results.map(rowHtml)}`.s : emptyHtml().s;
      const any = filters.query || filters.areaId || filters.openNow || filters.quietNow;
      $("[data-cafe-count]", view).textContent = any ? `${results.length} of ${S.cafes().length} cafés` : `${S.cafes().length} partner cafés`;
      $$("[data-filter]", view).forEach((b) => b.setAttribute("aria-pressed", String(!!filters[b.dataset.filter])));
      $$("[data-area]", view).forEach((b) => b.setAttribute("aria-pressed", String(filters.areaId === b.dataset.area)));
      $("[data-clear-search]", view).hidden = !filters.query;
    }

    function onInput(e) {
      if (!e.target.matches("[data-cafe-q]")) return;
      filters.query = e.target.value;
      paintList();
    }

    function onClick(e) {
      const t = e.target;
      const f = t.closest("[data-filter]");
      if (f) { filters[f.dataset.filter] = !filters[f.dataset.filter]; paintList(); return; }
      const a = t.closest("[data-area]");
      if (a) { filters.areaId = filters.areaId === a.dataset.area ? null : a.dataset.area; paintList(); return; }
      if (t.closest("[data-clear-search]")) { filters.query = ""; $("[data-cafe-q]", view).value = ""; paintList(); $("[data-cafe-q]", view).focus(); return; }
      if (t.closest("[data-clear-filters]")) {
        Object.assign(filters, { query: "", areaId: null, openNow: false, quietNow: false });
        $("[data-cafe-q]", view).value = "";
        paintList();
        $("[data-cafe-q]", view).focus();
      }
    }

    return {
      html: html`
        <div class="app-screen cafes">
          <h1 class="t-h2">Cafés</h1>
          <div class="search">
            <label class="sr-only" for="cafe-q">Search by café, area or drink</label>
            ${icon("search", { size: 20 })}
            <input class="input search__input" id="cafe-q" type="search" data-cafe-q placeholder="Café, area or drink" autocomplete="off" enterkeyhint="search" value="${filters.query}">
            <button type="button" class="icon-btn search__clear" data-clear-search aria-label="Clear search" hidden>${icon("close", { size: 18 })}</button>
          </div>
          <div class="chip-row" role="group" aria-label="Filters">
            ${chip("Open now", 'data-filter="openNow"', filters.openNow)}
            ${chip("Quiet now", 'data-filter="quietNow"', filters.quietNow)}
            <span class="chip-row__rule" aria-hidden="true"></span>
            ${areas.map((a) => chip(a.name, `data-area="${a.id}"`, filters.areaId === a.id))}
          </div>
          <p class="t-small t-faint" data-cafe-count aria-live="polite"></p>
          <ul role="list" class="cafe-list" data-cafe-list></ul>
        </div>`.s,
      mount() {
        paintList();
        view.scrollTop = listScroll;
        view.addEventListener("input", onInput);
        view.addEventListener("click", onClick);
        return () => {
          listScroll = view.scrollTop;
          view.removeEventListener("input", onInput);
          view.removeEventListener("click", onClick);
        };
      },
      on: {
        // Pills update themselves; the list only changes when a filter depends on it
        "cafe:status": () => { if (filters.quietNow) paintList(); },
        tick: () => { if (filters.openNow) paintList(); },
        plan: () => paintList(),
        ledger: () => paintList(),
      },
    };
  };

  /* -------------------------------------------------------------------
     Café detail
     ------------------------------------------------------------------- */
  REG.cafeDetail = (ctx, cafeId) => {
    const { view } = ctx;
    const c = S.cafe(cafeId);
    const area = S.area(c.area);

    function visitsHtml() {
      const m = ctx.member();
      const total = (m.visits || {})[c.id] || 0;
      const loyal = S.loyalty(c.id);
      // Same source as the Club tab's passport and Explorer badge: the ledger
      const tried = S.club(m.id).passport.stamps.filter((x) => x.visited).map((x) => x.cafe.id);
      const beenHere = tried.includes(c.id);
      let explorer;
      if (tried.length >= EXPLORER_GOAL) explorer = "You’ve earned Explorer: five cafés tried.";
      else if (beenHere) explorer = `One of the ${tried.length} cafés you’ve tried. ${EXPLORER_GOAL - tried.length} more for the Explorer badge.`;
      else explorer = `New to you. A cup here makes ${tried.length + 1} of ${EXPLORER_GOAL} cafés for the Explorer badge.`;
      const exploredNow = Math.min(EXPLORER_GOAL, tried.length);
      return html`
        <div class="visits">
          <div class="visits__item">
            <div class="visits__head">
              <span class="row__title">${total ? `${total} ${total === 1 ? "visit" : "visits"} here` : "You haven’t been yet"}</span>
              <span class="t-small t-muted num">${loyal.visits} of ${loyal.goal} to a free cup</span>
            </div>
