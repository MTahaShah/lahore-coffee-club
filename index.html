/* ---- src/base.css ---- */
/* =====================================================================
   Lahore Coffee Club — base.css
   Tokens, light/dark themes, reset, typography, and reusable components.
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. Tokens (light)
   --------------------------------------------------------------------- */
:root {
  color-scheme: light;

  /* Color */
  --bg: #F6F1EA;
  --surface: #FBF8F3;
  --surface-2: #EFE8DD;
  --ink: #1C1612;
  --ink-2: #5E554C;
  --ink-3: #70655A;          /* tertiary text; nudged from #968B7F for AA */
  --ink-4: #968B7F;          /* placeholders, disabled, decoration only */
  --line: #E3DACD;
  --line-strong: #D2C7B7;
  --accent: #2F4A3A;
  --accent-hover: #263E30;
  --accent-soft: #E4EAE2;
  --on-accent: #F6F1EA;
  --danger: #9E4330;          /* validation text, not a status */
  --status-quiet: #4E7D5B;
  --status-moderate: #C9962B;
  --status-packed: #B5503C;
  --bezel: #1C1612;
  --scrim: rgba(28, 22, 18, 0.32);
  --shadow-float: 0 24px 48px -24px rgba(28, 22, 18, 0.22), 0 2px 6px -2px rgba(28, 22, 18, 0.06);

  /* Type */
  --font-serif: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-sans: "Inter Tight", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-12: 12px;
  --fs-14: 14px;
  --fs-16: 16px;
  --fs-20: 20px;
  --fs-28: 28px;
  --fs-40: 40px;
  --fs-64: 64px;
  --lh-body: 1.5;
  --lh-tight: 1.08;
  --lh-snug: 1.15;
  --measure: 60ch;

  /* Spacing (8px grid) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --space-10: 128px;

  /* Shape */
  --radius-card: 12px;
  --radius-pill: 999px;
  --radius-sheet: 20px;
  --radius-sm: 8px;
  --hairline: 1px solid var(--line);
  --tap: 44px;

  /* Motion */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-1: 200ms;
  --dur-2: 260ms;
  --dur-3: 320ms;

  /* Layout */
  --proto-h: 40px;
  --gutter: clamp(16px, 4vw, 48px);
  --container: 1200px;
}

/* ---------------------------------------------------------------------
   2. Tokens (dark): system preference, unless forced light
   --------------------------------------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14100D;
    --surface: #1B1612;
    --surface-2: #241E19;
    --ink: #F2EBE0;
    --ink-2: #C2B7A9;
    --ink-3: #9A8F82;
    --ink-4: #6E655B;
    --line: #2C251F;
    --line-strong: #3B332B;
    --accent: #9DBFA6;
    --accent-hover: #B0CDB7;
    --accent-soft: #1F2A23;
    --on-accent: #12100D;
    --danger: #E08A74;
    --status-quiet: #79A784;
    --status-moderate: #D4A548;
    --status-packed: #D27560;
    --bezel: #2A231E;
    --scrim: rgba(0, 0, 0, 0.55);
    --shadow-float: 0 24px 48px -24px rgba(0, 0, 0, 0.6), 0 2px 6px -2px rgba(0, 0, 0, 0.3);
  }
}

/* Same dark tokens, forced by the theme toggle */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14100D;
  --surface: #1B1612;
  --surface-2: #241E19;
  --ink: #F2EBE0;
  --ink-2: #C2B7A9;
  --ink-3: #9A8F82;
  --ink-4: #6E655B;
  --line: #2C251F;
  --line-strong: #3B332B;
  --accent: #9DBFA6;
  --accent-hover: #B0CDB7;
  --accent-soft: #1F2A23;
  --on-accent: #12100D;
  --danger: #E08A74;
  --status-quiet: #79A784;
  --status-moderate: #D4A548;
  --status-packed: #D27560;
  --bezel: #2A231E;
  --scrim: rgba(0, 0, 0, 0.55);
  --shadow-float: 0 24px 48px -24px rgba(0, 0, 0, 0.6), 0 2px 6px -2px rgba(0, 0, 0, 0.3);
}

/* ---------------------------------------------------------------------
   3. Reset and base
   --------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg);
}
body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-16);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01" on, "cv11" on;
  padding-top: calc(var(--proto-h) + env(safe-area-inset-top));
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
ul[role="list"], ol[role="list"] { list-style: none; padding: 0; }
::selection { background: var(--accent-soft); color: var(--ink); }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

.skip-link {
  position: fixed;
  top: 8px;
  left: 16px;
  z-index: 100;
  padding: 8px 16px;
  background: var(--ink);
  color: var(--bg);
  border-radius: var(--radius-pill);
  font-size: var(--fs-14);
  transform: translateY(-200%);
  transition: transform var(--dur-1) var(--ease);
}
.skip-link:focus-visible { transform: translateY(0); }

/* ---------------------------------------------------------------------
   4. Typography
   --------------------------------------------------------------------- */
.t-display, .t-h1, .t-h2 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-optical-sizing: auto;
  letter-spacing: -0.02em;
  line-height: var(--lh-tight);
  text-wrap: balance;
}
.t-display { font-size: var(--fs-64); letter-spacing: -0.03em; line-height: 1.04; }
.t-h1 { font-size: var(--fs-40); }
.t-h2 { font-size: var(--fs-28); font-weight: 350; line-height: var(--lh-snug); }
.t-h3 {
  font-size: var(--fs-20);
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.3;
}
.t-body { font-size: var(--fs-16); line-height: var(--lh-body); }
.t-small { font-size: var(--fs-14); line-height: 1.45; }
.t-micro { font-size: var(--fs-12); line-height: 1.4; }
.t-muted { color: var(--ink-2); }
.t-faint { color: var(--ink-3); }
.eyebrow {
  font-size: var(--fs-12);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  line-height: 1.4;
}
.num, .tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" on, "lnum" on; }
.measure { max-width: var(--measure); }
.wordmark {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: var(--fs-20);
  letter-spacing: -0.015em;
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
}

@media (max-width: 640px) {
  .t-display { font-size: 44px; }
  .t-h1 { font-size: 32px; }
}

/* ---------------------------------------------------------------------
   5. Layout helpers
   --------------------------------------------------------------------- */
.container {
  width: 100%;
  max-width: calc(var(--container) + var(--gutter) * 2);
  margin-inline: auto;
  padding-inline: var(--gutter);
}
.stack { display: flex; flex-direction: column; }
.stack > * + * { margin-top: var(--stack-gap, var(--space-4)); }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cluster-gap, var(--space-3)); }
.divider { height: 1px; background: var(--line); border: 0; }

/* ---------------------------------------------------------------------
   6. Components
   --------------------------------------------------------------------- */

/* Button ------------------------------------------------------------- */
.btn {
  --btn-h: 56px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--btn-h);
  padding: 0 var(--space-5);
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  font-size: var(--fs-16);
  font-weight: 500;
  letter-spacing: -0.005em;
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition:
    transform var(--dur-1) var(--ease),
    background-color var(--dur-1) var(--ease),
    border-color var(--dur-1) var(--ease),
    color var(--dur-1) var(--ease),
    opacity var(--dur-1) var(--ease);
}
.btn:active { transform: scale(0.98); }
.btn:focus-visible { border-radius: var(--radius-pill); outline-offset: 3px; }
.btn svg { width: 20px; height: 20px; flex: none; }

.btn--primary { background: var(--accent); color: var(--on-accent); }
.btn--primary:hover { background: var(--accent-hover); }

.btn--secondary { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn--secondary:hover { border-color: var(--ink-3); background: var(--surface); }

.btn--ghost { background: transparent; color: var(--ink); }
.btn--ghost:hover { background: var(--surface-2); }

.btn--link {
  --btn-h: var(--tap);
  padding: 0;
  border-radius: 0;
  color: var(--ink);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
  text-decoration-color: var(--line-strong);
}
.btn--link:hover { text-decoration-color: currentColor; }
.btn--link:active { transform: none; opacity: 0.7; }

.btn--compact { --btn-h: var(--tap); padding: 0 var(--space-4); font-size: var(--fs-14); }
.btn--block { width: 100%; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  border-radius: var(--radius-pill);
  color: var(--ink);
  transition: background-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 22px; height: 22px; }

/* Input -------------------------------------------------------------- */
.field { display: grid; gap: var(--space-2); }
.field__label { font-size: var(--fs-14); font-weight: 500; color: var(--ink); }
.field__hint { font-size: var(--fs-12); color: var(--ink-3); }
.field__error {
  display: none;
  font-size: var(--fs-14);
  color: var(--danger);
  line-height: 1.4;
}
.field[data-invalid="true"] .field__error { display: block; animation: enter var(--dur-2) var(--ease) both; }
.field[data-invalid="true"] .input { border-color: var(--danger); }
.field[data-invalid="true"] .input:focus { box-shadow: 0 0 0 1px var(--danger); }

.input {
  width: 100%;
  height: 56px;
  padding: 0 var(--space-4);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-card);
  font-size: var(--fs-16);   /* 16px prevents iOS zoom on focus */
  color: var(--ink);
  appearance: none;
  -webkit-appearance: none;
  transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}
.input::placeholder { color: var(--ink-4); }
.input:hover { border-color: var(--ink-4); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
textarea.input { height: auto; min-height: 120px; padding: var(--space-4); line-height: var(--lh-body); resize: vertical; }

.select { position: relative; }
.select .input { padding-right: var(--space-7); cursor: pointer; }
.select::after {
  content: "";
  position: absolute;
  right: 22px;
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--ink-2);
  border-bottom: 1.5px solid var(--ink-2);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

/* Card --------------------------------------------------------------- */
.card {
  background: var(--surface);
  border: var(--hairline);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.card--flush { padding: 0; overflow: hidden; }
.card--interactive {
  display: block;
  width: 100%;
  text-align: left;
  cursor: pointer;
  transition: border-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}
.card--interactive:hover { border-color: var(--line-strong); }
.card--interactive:active { transform: scale(0.99); }
.card[aria-pressed="true"], .card[aria-checked="true"], .card.is-selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

/* List row ----------------------------------------------------------- */
.row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  min-height: 56px;
  padding: var(--space-3) 0;
  border-bottom: var(--hairline);
}
.row:last-child { border-bottom: 0; }
.row__main { flex: 1; min-width: 0; }
.row__title { font-size: var(--fs-16); font-weight: 500; line-height: 1.3; }
.row__meta { font-size: var(--fs-14); color: var(--ink-3); line-height: 1.4; }
.row__trail { flex: none; font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: var(--fs-14); }

/* Stepper ------------------------------------------------------------ */
.stepper {
  display: inline-flex;
  align-items: center;
  height: var(--tap);
  border: var(--hairline);
  border-radius: var(--radius-pill);
  background: var(--surface);
}
.stepper__btn {
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  border-radius: var(--radius-pill);
  color: var(--ink);
  transition: background-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease), opacity var(--dur-1) var(--ease);
}
.stepper__btn:hover { background: var(--surface-2); }
.stepper__btn:active { transform: scale(0.92); }
.stepper__btn:disabled { opacity: 0.3; pointer-events: none; }
.stepper__btn svg { width: 16px; height: 16px; }
.stepper__value {
  min-width: 28px;
  text-align: center;
  font-size: var(--fs-16);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* Segmented control -------------------------------------------------- */
.segmented {
  --count: 2;
  --index: 0;
  position: relative;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  padding: 4px;
  background: var(--surface-2);
  border-radius: var(--radius-pill);
}
.segmented__thumb {
  position: absolute;
  top: 4px; bottom: 4px; left: 4px;
  width: calc((100% - 8px) / var(--count));
  transform: translateX(calc(var(--index) * 100%));
  background: var(--surface);
  border: var(--hairline);
  border-radius: var(--radius-pill);
  transition: transform var(--dur-2) var(--ease);
}
.segmented__option {
  position: relative;
  z-index: 1;
  min-height: 40px;
  padding: 0 var(--space-4);
  border-radius: var(--radius-pill);
  font-size: var(--fs-14);
  font-weight: 500;
  color: var(--ink-3);
  transition: color var(--dur-1) var(--ease);
}
.segmented__option[aria-selected="true"], .segmented__option[aria-checked="true"] { color: var(--ink); }

/* Chip --------------------------------------------------------------- */
.chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-pill);
  background: transparent;
  font-size: var(--fs-14);
  font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
  transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
}
.chip::before { content: ""; position: absolute; inset: -4px 0; } /* 44px hit area */
.chip:hover { border-color: var(--ink-4); color: var(--ink); }
.chip:active { transform: scale(0.97); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip svg { width: 14px; height: 14px; }

/* Toggle (switch) ---------------------------------------------------- */
.toggle {
  position: relative;
  flex: none;
  width: 48px;
  height: 28px;
  border-radius: var(--radius-pill);
  background: var(--line-strong);
  transition: background-color var(--dur-2) var(--ease);
}
.toggle::before { content: ""; position: absolute; inset: -8px -2px; } /* 44px hit area */
.toggle::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(28, 22, 18, 0.2);
  transition: transform var(--dur-2) var(--ease);
}
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }

/* Badge -------------------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: var(--fs-12);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.badge--accent { background: var(--accent-soft); color: var(--accent); }

/* Status pill -------------------------------------------------------- */
.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 12px 0 10px;
  border: var(--hairline);
  border-radius: var(--radius-pill);
  background: var(--surface);
  font-size: var(--fs-12);
  line-height: 1;
  white-space: nowrap;
}
/* Cup-level icon (ui.cupIcon) in ink; status is never colour-coded. */
.status__icon { width: 16px; height: 16px; flex: none; color: var(--ink); margin-right: -2px; }
.status__label { font-weight: 500; color: var(--ink); }
.status__time { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.status--bare { height: auto; padding: 0; border: 0; background: none; }
.status.is-changed .status__icon { animation: status-settle 600ms var(--ease); }
@keyframes status-settle {
  0% { transform: scale(1); }
  40% { transform: scale(1.25); }
  100% { transform: scale(1); }
}

/* Bottom sheet ------------------------------------------------------- */
/* Positioned against its nearest positioned ancestor (the phone frame).
   Add .sheet--viewport to cover the whole window instead. */
.sheet {
  position: absolute;
  inset: 0;
  z-index: 40;
  visibility: hidden;
  pointer-events: none;
  transition: visibility 0s linear var(--dur-3);
}
.sheet--viewport { position: fixed; }
.sheet[data-open="true"] { visibility: visible; pointer-events: auto; transition-delay: 0s; }
.sheet__scrim {
  position: absolute;
  inset: 0;
  background: var(--scrim);
  opacity: 0;
  transition: opacity var(--dur-3) var(--ease);
}
.sheet[data-open="true"] .sheet__scrim { opacity: 1; }
.sheet__panel {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  max-height: 88%;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-top: var(--hairline);
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
  box-shadow: var(--shadow-float);
  transform: translateY(100%);
  transition: transform var(--dur-3) var(--ease);
  will-change: transform;
}
.sheet[data-open="true"] .sheet__panel { transform: translateY(var(--drag, 0px)); }
.sheet.is-dragging .sheet__panel { transition: none; }
.sheet__handle {
  flex: none;
  display: grid;
  place-items: center;
  height: 28px;
  cursor: grab;
  touch-action: none;
}
.sheet__handle::after {
  content: "";
  width: 36px;
  height: 4px;
  border-radius: var(--radius-pill);
  background: var(--line-strong);
}
.sheet__body {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 var(--space-5) calc(var(--space-5) + env(safe-area-inset-bottom));
}
@media (min-width: 720px) {
  .sheet--viewport .sheet__panel { left: 50%; right: auto; width: 480px; margin-left: -240px; }
}

/* Toast -------------------------------------------------------------- */
.toast-region {
  position: fixed;
  left: 50%;
  bottom: calc(var(--space-5) + env(safe-area-inset-bottom));
  z-index: 90;
  display: grid;
  gap: var(--space-2);
  justify-items: center;
  width: max-content;
  max-width: calc(100vw - 32px);
  transform: translateX(-50%);
  pointer-events: none;
}
.toast {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 44px;
  padding: 10px var(--space-4);
  background: var(--ink);
  color: var(--bg);
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-float);
  font-size: var(--fs-14);
  font-weight: 500;
  pointer-events: auto;
  animation: enter var(--dur-2) var(--ease) both;
}
.toast svg { width: 18px; height: 18px; flex: none; }
.toast.is-leaving { animation: leave var(--dur-1) var(--ease) both; }

/* Placeholder (Pass 1 scaffolding only) ------------------------------ */
.placeholder {
  display: grid;
  align-content: center;
  gap: var(--space-2);
  min-height: 160px;
  padding: var(--space-5);
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-card);
  color: var(--ink-3);
  font-size: var(--fs-14);
}

/* ---------------------------------------------------------------------
   7. Motion
   --------------------------------------------------------------------- */
@keyframes enter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes leave {
  from { opacity: 1; transform: none; }
  to { opacity: 0; transform: translateY(4px); }
}
@keyframes check-draw { to { stroke-dashoffset: 0; } }

/* Fade + 8px rise. Set --i on children for a stagger. */
.enter { animation: enter var(--dur-3) var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }

/* Calm check: <svg class="check-draw"><path pathLength="1" d="…"/></svg> */
.check-draw path, .check-draw circle {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: check-draw 520ms var(--ease) forwards;
}
.check-draw path { animation-delay: 260ms; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-delay: 0ms !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

/* =====================================================================
   8. Surface shells
   ===================================================================== */

/* Prototype switcher -------------------------------------------------- */
.proto-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 80;
  height: calc(var(--proto-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(var(--space-4), env(safe-area-inset-right)) 0 max(var(--space-4), env(safe-area-inset-left));
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: var(--space-3);
  background: var(--surface-2);
  border-bottom: var(--hairline);
  font-size: var(--fs-12);
  color: var(--ink-3);
}
.proto-bar__label { font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
.proto-bar__nav { display: flex; gap: 2px; }
.proto-bar__link {
  position: relative;
  display: inline-flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border-radius: var(--radius-pill);
  color: var(--ink-2);
  text-decoration: none;
  font-weight: 500;
  white-space: nowrap;
  transition: background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.proto-bar__link::before { content: ""; position: absolute; inset: -8px 0; }
.proto-bar__link:hover { color: var(--ink); }
.proto-bar__link[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.proto-bar__theme {
  justify-self: end;
  height: 28px;
  padding: 0 10px;
  border-radius: var(--radius-pill);
  color: var(--ink-2);
  font-weight: 500;
}
.proto-bar__theme:hover { color: var(--ink); background: var(--surface); }
.proto-bar__end { justify-self: end; display: flex; align-items: center; gap: 2px; }
.proto-demo { position: relative; }
.proto-bar__theme[aria-expanded="true"] { color: var(--ink); background: var(--surface); }
.proto-demo__menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 85;
  display: grid;
  min-width: 220px;
  padding: 6px;
  background: var(--surface);
  border: var(--hairline);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-float);
}
.proto-demo__menu[hidden] { display: none; }
.proto-demo__menu button { min-height: var(--tap); padding: 0 var(--space-3); border-radius: var(--radius-sm); text-align: left; font-size: var(--fs-14); font-weight: 500; color: var(--ink); white-space: nowrap; }
.proto-demo__menu button:hover, .proto-demo__menu button:focus-visible { background: var(--surface-2); }
@media (max-width: 560px) {
  .proto-bar { grid-template-columns: auto 1fr; }
  .proto-bar__label { display: none; }
  .proto-bar__nav { justify-self: start; }
  .proto-bar__link { padding: 0 10px; }
}

/* Route container ---------------------------------------------------- */
#main { display: block; min-height: calc(100dvh - var(--proto-h)); }
#main:focus { outline: none; }
.surface { animation: enter var(--dur-3) var(--ease) both; }

/* Landing shell ------------------------------------------------------ */
.landing-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  height: 80px;
}
.landing-nav__links { display: flex; align-items: center; gap: var(--space-6); }
.landing-nav__link {
  font-size: var(--fs-14);
  color: var(--ink-2);
  text-decoration: none;
  transition: color var(--dur-1) var(--ease);
}
.landing-nav__link:hover { color: var(--ink); }
@media (max-width: 760px) { .landing-nav__link { display: none; } }
.landing-section {
  padding-block: var(--space-9);
  border-top: var(--hairline);
  scroll-margin-top: calc(var(--proto-h) + 16px);
}
.landing-section:first-of-type { border-top: 0; padding-top: var(--space-8); }
.landing-section__head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
  gap: var(--space-5);
  align-items: baseline;
}
@media (max-width: 760px) {
  .landing-section { padding-block: var(--space-8); }
  .landing-section__head { grid-template-columns: 1fr; gap: var(--space-2); }
}

/* Member app shell: phone frame -------------------------------------- */
.stage {
  min-height: calc(100dvh - var(--proto-h));
  display: grid;
  place-items: center;
  padding: var(--space-6) var(--space-4);
}
.phone {
  zoom: var(--phone-scale, 1);
  width: 410px;            /* 390 screen + 2 x 10 bezel */
  height: 864px;           /* 844 screen + 2 x 10 bezel */
  padding: 10px;
  border-radius: 58px;
  background: var(--bezel);
  box-shadow: var(--shadow-float);
}
.phone__screen {
  position: relative;      /* sheets and toasts anchor here */
  isolation: isolate;
  width: 390px;
  height: 844px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 48px;
  background: var(--bg);
}
.phone__status {
  flex: none;
  position: relative;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px 0 40px;
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.phone__island {
  position: absolute;
  left: 50%;
  top: 11px;
  width: 120px;
  height: 34px;
  margin-left: -60px;
  border-radius: var(--radius-pill);
  background: #000;
}
.phone__status-icons { display: flex; gap: 6px; align-items: center; }
.phone__status-icons svg { width: 18px; height: 12px; }
.app-view {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.app-view::-webkit-scrollbar { display: none; }
.app-view__inner { padding: var(--space-5); }

/* On a real phone the frame disappears and the app goes edge to edge */
@media (max-width: 520px) {
  .stage { padding: 0; display: block; }
  .phone { zoom: 1; width: 100%; height: calc(100dvh - var(--proto-h) - env(safe-area-inset-top)); padding: 0; border-radius: 0; background: none; box-shadow: none; }
  .phone__screen { width: 100%; height: 100%; border-radius: 0; }
  .phone__status { display: none; }
}

/* Café partner shell ------------------------------------------------- */
.cafe {
  max-width: 1280px;
  margin-inline: auto;
  padding: var(--space-5) var(--gutter) calc(var(--space-7) + env(safe-area-inset-bottom));
}
.cafe-header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--space-4);
  padding-bottom: var(--space-5);
  border-bottom: var(--hairline);
}
.open-indicator {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 var(--space-4) 0 14px;
  border: var(--hairline);
  border-radius: var(--radius-pill);
  background: var(--surface);
  font-weight: 500;
}
.open-indicator::before {
  content: "";
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
}
.cafe-grid {
  display: grid;
  gap: var(--space-5);
  margin-top: var(--space-5);
  grid-template-columns: 1fr;
}
@media (min-width: 768px) and (orientation: landscape) {
  .cafe-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
  .cafe-grid__side { display: grid; gap: var(--space-5); }
}
.panel-title { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }

/* Component kit (#/kit) ---------------------------------------------- */
.kit { padding-block: var(--space-7) var(--space-9); }
.kit-grid { display: grid; gap: var(--space-5); grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); margin-top: var(--space-6); }
.kit-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--space-3); }
.kit-swatch { display: grid; gap: 6px; font-size: var(--fs-12); color: var(--ink-3); }
.kit-swatch span:first-child { height: 48px; border-radius: var(--radius-sm); border: var(--hairline); }
.kit-demo-phone { position: relative; height: 320px; overflow: hidden; border-radius: var(--radius-card); border: var(--hairline); background: var(--bg); }

/* Live sync indicator (sync.js) --------------------------------------- */
.sync-pill { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-12); color: var(--ink-3); }
.sync-pill__dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-4); }
.sync-pill[data-state="online"] .sync-pill__dot { background: var(--accent); border-color: var(--accent); }
.sync-pill[data-state="connecting"] .sync-pill__dot { animation: sync-pulse 1.2s var(--ease) infinite alternate; }
@keyframes sync-pulse { to { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .sync-pill__dot { animation: none !important; } }

/* ---- src/cafe.css ---- */
/* =====================================================================
   Lahore Coffee Club — cafe.css
   Café partner view (#/cafe). Layout and the few new elements only;
   everything else comes from base.css components.
   ===================================================================== */

.cafe-grid__side { display: grid; gap: var(--space-5); }

/* Header -------------------------------------------------------------- */
.cafe-header__aside {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--space-3);
}
.viewing-as { display: grid; gap: 6px; }
.viewing-as .input { height: var(--tap); min-width: 200px; font-size: var(--fs-14); }
.viewing-as .select::after { right: 18px; }
.open-indicator[data-open="false"]::before {
  background: transparent;
  border: 1.5px solid var(--ink-3);
}

/* Redeem panel -------------------------------------------------------- */
.code-input {
  height: 72px;
  font-size: var(--fs-28);
  letter-spacing: 0.32em;
  font-variant-numeric: tabular-nums;
}
.code-input::placeholder { letter-spacing: 0.32em; }
.redeem-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}
@media (max-width: 420px) { .redeem-actions { grid-template-columns: 1fr; } }

.member-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-4);
}
.member-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  padding-block: var(--space-4);
  border-block: var(--hairline);
}
.member-stats dt, .today-stats dt { font-size: var(--fs-14); color: var(--ink-3); }
.member-stats dd, .today-stats dd { margin: 0; }
.btn--tall { --btn-h: 72px; font-size: var(--fs-20); }

.redeem-success {
  display: grid;
  justify-items: start;
  gap: var(--space-3);
  padding-block: var(--space-4);
}
.redeem-success .check-draw { width: 64px; height: 64px; color: var(--accent); }

/* Busy status: one segmented control, three tall segments ------------- */
.busy {
  --index: 0;
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  padding: 4px;
  background: var(--surface-2);
  border-radius: var(--radius-card);
}
.busy__thumb {
  position: absolute;
  top: 4px; bottom: 4px; left: 4px;
  width: calc((100% - 8px) / 3);
  transform: translateX(calc(var(--index) * 100%));
  background: var(--ink);
  border-radius: var(--radius-sm);
  transition: transform 250ms var(--ease);
}
.busy__option {
  position: relative;
  z-index: 1;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 6px;
  min-height: 128px;
  padding: var(--space-4) var(--space-2);
  border-radius: var(--radius-sm);
  color: var(--ink);
  text-align: center;
  transition: color 250ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.busy__option:active { transform: scale(0.98); }
.busy__option[aria-checked="true"] { color: var(--bg); }
.busy__icon { width: 32px; height: 32px; }
.busy__label { font-size: var(--fs-16); font-weight: 500; line-height: 1.2; }
.busy__hint { font-size: var(--fs-12); line-height: 1.3; color: var(--ink-3); transition: color 250ms var(--ease); }
.busy__option[aria-checked="true"] .busy__hint { color: var(--bg); opacity: 0.8; }
.busy-updated { margin-top: var(--space-3); }

/* Today panel --------------------------------------------------------- */
.today-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-5) var(--space-4);
}
.today-stats__wide { grid-column: 1 / -1; }
.recent { margin-top: var(--space-2); }
.recent .row__trail:first-child { min-width: 72px; color: var(--ink-3); }

/* Pairing and live sync (Pass 4.5) ------------------------------------ */
.pair-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); margin-bottom: var(--space-5); }
.pair-bar .btn { margin-left: auto; }
.pair { display: grid; justify-items: center; text-align: center; gap: var(--space-3); padding-bottom: var(--space-6); }
.pair .qr { width: 240px; height: 240px; }
.pair__room { display: grid; gap: 2px; }
.pair__room .num { font-family: var(--font-serif); font-size: var(--fs-40); font-weight: 300; line-height: 1; letter-spacing: 0.08em; }
.pair__url { max-width: 100%; overflow-wrap: anywhere; }
.pair__note { max-width: 40ch; }

/* Plan types (Pass 7) -------------------------------------------------- */
.member-stats__wide { grid-column: 1 / -1; }
.member-stats__wide dd .t-small { margin-left: var(--space-2); font-family: var(--font-sans); }
.month-stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin: var(--space-3) 0 0; }
.month-stats dt { font-size: var(--fs-14); color: var(--ink-3); }
.month-stats dd { margin: 0; }
.month-stats__wide { grid-column: 1 / -1; }

/* The club (Pass 5): who the member is, and what to offer them -------- */
.member-club { font-size: var(--fs-14); font-weight: 500; letter-spacing: 0.02em; color: var(--accent); }
.member-perks { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-radius: var(--radius-card); background: var(--accent-soft); }
.member-perks li { font-size: var(--fs-16); font-weight: 500; }
.member-perks li + li { margin-top: var(--space-1); }

/* ---- src/app.css ---- */
/* =====================================================================
   Lahore Coffee Club — app.css
   Member app (#/app): tab bar, Pass, Home, Map, café sheet,
   Cafés, café detail, plan picker and payment.
   Builds on base.css; the phone frame itself lives there.
   ===================================================================== */

.app-screen { padding: var(--space-5) var(--space-5) var(--space-6); }
.app-screen--flush { padding: 0; }
.app-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.app-section { margin-top: var(--space-6); }
.app-section__title { margin-bottom: var(--space-2); }

.avatar {
  display: grid;
  place-items: center;
  width: var(--tap);
  height: var(--tap);
  border-radius: 50%;
  background: var(--surface-2);
  border: var(--hairline);
  font-size: var(--fs-14);
  font-weight: 500;
  color: var(--ink-2);
}

/* Tab bar ------------------------------------------------------------- */
.tabbar {
  flex: none;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: end;
  padding: 6px var(--space-2) calc(6px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: var(--hairline);
}
.phone__screen .tabbar { padding-bottom: 22px; } /* home indicator inside the desktop frame */
@media (max-width: 520px) {
  .phone__screen .tabbar { padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
}
.tab {
  display: grid;
  justify-items: center;
  gap: 2px;
  min-height: 52px;
  padding-top: 6px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--ink-3);
  transition: color var(--dur-1) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab:active svg { transform: scale(0.94); }
.tab--pass { padding-top: 0; }
.tab__pass {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  margin-top: -20px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: 0 0 0 4px var(--surface);
  transition: transform var(--dur-1) var(--ease);
}
.tab--pass[aria-selected="true"] .tab__pass { background: var(--ink); color: var(--bg); }

/* Pass ---------------------------------------------------------------- */
.pass { display: grid; justify-items: center; text-align: center; gap: var(--space-4); }
.pass__card {
  width: 100%;
  display: grid;
  justify-items: center;
  gap: var(--space-4);
  padding: var(--space-5);
  background: var(--surface);
  border: var(--hairline);
  border-radius: var(--radius-card);
}
/* The QR always sits on a light tile so scanners read it in dark mode too */
.qr {
  width: 232px;
  height: 232px;
  padding: 12px;
  border-radius: var(--radius-card);
  background: #FBF8F3;
  color: #1C1612;
  transition: opacity var(--dur-2) var(--ease);
}
.qr svg { width: 100%; height: 100%; shape-rendering: crispEdges; }
.qr.is-rotating { opacity: 0.2; }
.qr--fallback { display: grid; place-items: center; padding: var(--space-5); font-size: var(--fs-14); color: #5E554C; border: 1px dashed #D2C7B7; }
.pass__code {
  font-size: 40px;
  font-weight: 500;
  letter-spacing: 0.08em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.pass__code span + span { margin-left: 0.35em; }
.countdown { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--fs-14); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.countdown svg { width: 20px; height: 20px; transform: rotate(-90deg); }
.countdown circle { fill: none; stroke-width: 2; }
.countdown .track { stroke: var(--line); }
.countdown .bar { stroke: var(--ink-2); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.pass__meta { display: flex; justify-content: space-between; width: 100%; padding-top: var(--space-4); border-top: var(--hairline); text-align: left; }
.pass__note { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--fs-14); color: var(--ink-3); }
.pass__note svg { width: 18px; height: 18px; flex: none; }
.pass-success { display: grid; justify-items: center; gap: var(--space-3); padding: var(--space-6) var(--space-2); }
.pass-success .check-draw { width: 72px; height: 72px; color: var(--accent); }

/* Home: progress ring ------------------------------------------------- */
.ring-wrap { display: grid; justify-items: center; gap: var(--space-3); margin-top: var(--space-5); }
.ring { position: relative; width: 208px; height: 208px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 700ms var(--ease); }
.ring__center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring__num { font-family: var(--font-serif); font-weight: 300; font-size: var(--fs-64); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

.near-row { width: 100%; text-align: left; cursor: pointer; border-bottom: var(--hairline); }
li:last-child > .near-row { border-bottom: 0; }
.near-row:hover .row__title { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.near-row .row__main { display: grid; gap: 6px; }
.near-row .status { justify-self: start; }

/* Map ----------------------------------------------------------------- */
.map-head { padding: var(--space-5) var(--space-5) var(--space-3); display: grid; gap: var(--space-4); }
.map { position: relative; width: 100%; aspect-ratio: 360 / 560; overflow: hidden; background: var(--bg); border-block: var(--hairline); }
.map > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map .m-area { fill: var(--surface-2); }
.map .m-road { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-linecap: round; }
.map .m-road--major { stroke-width: 3; stroke: var(--line); }
.map .m-canal { fill: none; stroke: var(--ink-4); stroke-width: 1.5; stroke-dasharray: 1 0; }
.map .m-river { fill: none; stroke: var(--surface-2); stroke-width: 18; stroke-linecap: round; }
.map .m-label { fill: var(--ink-3); font: 500 10px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; }
.map .m-label--water { font-style: italic; text-transform: none; letter-spacing: 0; fill: var(--ink-4); }

.pin {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: var(--tap);
  transform: translate(-22px, -50%);
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.pin--left { flex-direction: row-reverse; transform: translate(calc(-100% + 22px), -50%); }
.pin--below { flex-direction: column; gap: 0; transform: translate(-50%, -22px); }
.pin__dot {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  margin: 6px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  color: var(--ink);
  transition: background-color 250ms var(--ease), color 250ms var(--ease), border-color 250ms var(--ease);
}
.pin__dot svg { width: 18px; height: 18px; }
.pin[data-status="packed"] .pin__dot { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pin__name { padding: 2px 6px; border-radius: 4px; background: color-mix(in srgb, var(--bg) 85%, transparent); }
.pin.is-changed .pin__dot { animation: status-settle 600ms var(--ease); }
.pin:active .pin__dot { transform: scale(0.94); }

.map-foot { padding: var(--space-4) var(--space-5) var(--space-6); display: grid; gap: var(--space-3); }
.legend { display: flex; gap: var(--space-4); font-size: var(--fs-12); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend svg { width: 16px; height: 16px; }

/* Café sheet ---------------------------------------------------------- */
.cafe-sheet { display: grid; gap: var(--space-4); }
.cafe-sheet__facts { display: grid; gap: var(--space-2); font-size: var(--fs-14); color: var(--ink-2); }
.cafe-sheet__facts span { display: inline-flex; align-items: center; gap: var(--space-2); }
.cafe-sheet__facts svg { width: 18px; height: 18px; color: var(--ink-3); }

/* Coming-soon tabs ---------------------------------------------------- */
.soon { display: grid; gap: var(--space-3); padding-top: var(--space-7); }

/* =====================================================================
   Pass 4: Cafés, café detail, plan picker, payment
   ===================================================================== */

/* Focused flows (plan, payment) hide the tab bar */
.phone__screen.is-flow .tabbar { display: none; }
/* Keep focused rows clear of the sticky top bar and summary bar */
.phone__screen.is-flow .app-view { scroll-padding-block: 64px 220px; }
.app-view:has(.sticky-action) { scroll-padding-block: 64px 120px; }

.cafe-sheet__actions { display: grid; gap: var(--space-3); }

/* Shared top bar with a back button; sticks while the screen scrolls */
.screen-bar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 56px;
  padding: var(--space-1) var(--space-3);
  background: var(--bg);
  border-bottom: 1px solid transparent;
  transition: border-color var(--dur-1) var(--ease);
}
.screen-bar__title {
  font-size: var(--fs-16);
  font-weight: 500;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
}
.screen-bar.is-titled { border-bottom-color: var(--line); }
.screen-bar [hidden] { display: none; }
.screen-bar.is-titled .screen-bar__title { opacity: 1; transform: none; }
.screen-bar + .app-screen { padding-top: var(--space-2); }

/* Cafés list ---------------------------------------------------------- */
.cafes { display: grid; gap: var(--space-4); }
.search { position: relative; }
.search > svg { position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search__input { padding-left: 48px; padding-right: 52px; border-radius: var(--radius-pill); -webkit-appearance: none; appearance: none; }
.search__input::-webkit-search-cancel-button { display: none; }
.search__clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.search__clear[hidden] { display: none; }

.chip-row {
  display: flex;
  gap: var(--space-2);
  margin-inline: calc(-1 * var(--space-5));
  padding: 4px var(--space-5);
  overflow-x: auto;
  scrollbar-width: none;
}
.chip-row::-webkit-scrollbar { display: none; }
.chip-row .chip { flex: none; }
.chip-row__rule { flex: none; width: 1px; margin-block: 8px; background: var(--line-strong); }

.cafe-list { margin-top: calc(-1 * var(--space-2)); }
.cafe-row { width: 100%; text-decoration: none; color: inherit; border-bottom: var(--hairline); }
.cafe-list li:last-child > .cafe-row { border-bottom: 0; }
.cafe-row .row__main { display: grid; gap: 6px; }
.cafe-row:hover .row__title { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.cafe-row__pills { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.cafes-empty { display: grid; justify-items: start; gap: var(--space-3); padding: var(--space-6) 0; }

/* Café detail --------------------------------------------------------- */
.cafe-detail { min-height: 100%; display: flex; flex-direction: column; }
.cafe-detail__body { flex: 1; display: grid; align-content: start; gap: var(--space-5); padding-bottom: var(--space-5); }
.cafe-detail__body .app-section { margin-top: var(--space-2); }
.cafe-detail__status .status { justify-self: start; }
.facts { display: grid; gap: var(--space-2); font-size: var(--fs-14); color: var(--ink-2); }
.facts > div { display: flex; align-items: center; gap: var(--space-3); }
.facts dt { display: grid; place-items: center; color: var(--ink-3); }
.facts dd { margin: 0; }

.visits { display: grid; gap: var(--space-5); }
.visits__item { display: grid; gap: var(--space-2); }
.visits__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.meter { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.meter__seg { height: 6px; border-radius: var(--radius-pill); background: var(--line); }
.meter__seg.is-on { background: var(--accent); }

/* Bottom actions that stay on screen while content scrolls */
.sticky-action, .summary-bar {
  position: sticky;
  bottom: 0;
  z-index: 5;
  display: grid;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-5) var(--space-5);
  background: var(--surface);
  border-top: var(--hairline);
}

/* Plan picker --------------------------------------------------------- */
.flow { min-height: 100%; display: flex; flex-direction: column; }
.flow__body { flex: 1; display: grid; align-content: start; gap: var(--space-5); }
.plan-intro { margin-bottom: var(--space-1); }
.tier-list { display: grid; gap: var(--space-3); border: 0; padding: 0; min-width: 0; }
.tier { display: grid; gap: var(--space-1); cursor: pointer; transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease); }
.tier:hover { border-color: var(--line-strong); }
.tier:active { transform: scale(0.99); }
.tier:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tier:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.tier__head { display: flex; align-items: center; gap: var(--space-2); }
.tier__price { margin-left: auto; }

.builder-row .row__meta { transition: color var(--dur-1) var(--ease); }
.builder-row.is-new { background: var(--accent-soft); margin-inline: calc(-1 * var(--space-3)); padding-inline: var(--space-3); border-radius: var(--radius-sm); }

.summary-bar { gap: var(--space-2); box-shadow: var(--shadow-float); }
.summary-bar__nums { display: flex; justify-content: space-between; align-items: baseline; }
.summary-bar__cups { font-weight: 500; }
.summary-bar__note { min-height: 2.9em; }
.summary-bar__note.is-warn { color: var(--danger); }
.summary-bar .btn { margin-top: var(--space-1); }

/* Payment ------------------------------------------------------------- */
.pay-summary { display: grid; gap: var(--space-1); }
.pay-summary__row { display: flex; justify-content: space-between; align-items: baseline; }
.pay-form { display: grid; gap: var(--space-5); }
.method-list { display: grid; gap: var(--space-2); border: 0; padding: 0; min-width: 0; }
.method-list legend { margin-bottom: var(--space-2); padding: 0; }
.method {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 64px;
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  border: var(--hairline);
  border-radius: var(--radius-card);
  cursor: pointer;
  transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}
.method:hover { border-color: var(--line-strong); }
.method:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.method:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.method__icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); }
.method__text { flex: 1; display: grid; }
.method__tick { color: var(--accent); opacity: 0; transition: opacity var(--dur-1) var(--ease); }
.method:has(input:checked) .method__tick { opacity: 1; }
.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.field-pair .field + .field { margin-top: 0; }

.proto-note {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-card);
  background: var(--surface-2);
  font-size: var(--fs-14);
  line-height: 1.45;
  color: var(--ink-2);
}
.proto-note svg { flex: none; margin-top: 1px; color: var(--ink-3); }
.proto-note strong { font-weight: 500; color: var(--ink); }

.pay-state { display: grid; justify-items: center; text-align: center; gap: var(--space-3); padding: var(--space-6) var(--space-2) var(--space-5); }
.pay-state .check-draw { width: 72px; height: 72px; color: var(--accent); }
.pay-state__mark { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid var(--line-strong); color: var(--ink-2); }
.pay-state__actions { display: grid; gap: var(--space-3); width: 100%; margin-top: var(--space-3); }
.spinner {
  width: 40px;
  height: 40px;
  margin-bottom: var(--space-2);
  border-radius: 50%;
  border: 2px solid var(--line);
  border-top-color: var(--accent);
  animation: spin 900ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
}

/* Plan types (Pass 7): per-café cups on the pass ----------------------- */
.pass__cafes { width: 100%; display: grid; gap: var(--space-2); text-align: left; }
.pass__cafes ul { display: grid; }
.pass__cafes li { display: flex; justify-content: space-between; gap: var(--space-3); padding-block: 6px; border-top: var(--hairline); font-size: var(--fs-14); }
.pass__cafes li .num { color: var(--ink-2); }
[data-here-line] strong { color: var(--ink); font-weight: 500; }

/* ---- src/club.css ---- */
/* =====================================================================
   Lahore Coffee Club — club.css
   Member app (Pass 5): member card, Club tab, gifting, onboarding and
   the card being issued. Builds on base.css and app.css.
   ===================================================================== */

/* Home: plan and gift links under the ring ----------------------------- */
.ring-actions { display: flex; gap: var(--space-4); align-items: center; }
.ring-actions .btn--link { display: inline-flex; align-items: center; gap: 6px; }
.ring-actions .btn--link svg { width: 18px; height: 18px; }

/* Member card -----------------------------------------------------------
   Fixed colours (like the QR tile): the card looks the same in both
   themes. Espresso for members, the deep green for Founding Members. */
.mcard {
  --card-bg: #2A221C;
  --card-ink: #F6F1EA;
  --card-muted: rgba(246, 241, 234, 0.66);
  --card-line: rgba(246, 241, 234, 0.16);
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr auto;
  aspect-ratio: 1.586;
  width: 100%;
  padding: 20px 22px 18px;
  border-radius: 16px;
  background: var(--card-bg);
  color: var(--card-ink);
  box-shadow: inset 0 0 0 1px var(--card-line), var(--shadow-float);
}
.mcard--founding { --card-bg: #2F4A3A; }
.mcard__rings { position: absolute; right: 0; bottom: 0; width: 70%; height: auto; pointer-events: none; }
.mcard__rings circle { fill: none; stroke: var(--card-line); stroke-width: 0.75; }
.mcard__top { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); }
.mcard__brand { font-family: var(--font-serif); font-size: var(--fs-16); font-weight: 400; letter-spacing: -0.005em; line-height: 1.2; }
.mcard__seal { width: 56px; height: 56px; flex: none; margin: -6px -6px 0 0; color: var(--card-ink); }
.mcard__seal circle, .mcard__seal path { fill: none; stroke: currentColor; stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
.mcard__seal text { fill: currentColor; font: 500 6.4px/1 var(--font-sans); letter-spacing: 0.16em; }
.mcard__no { position: relative; align-self: center; font-family: var(--font-serif); font-weight: 300; font-size: 56px; line-height: 1; letter-spacing: -0.02em; }
.mcard__no-label { font-size: var(--fs-20); letter-spacing: 0; color: var(--card-muted); vertical-align: 0.9em; margin-right: 2px; }
.mcard__foot { position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-3); }
.mcard__who, .mcard__status { display: grid; gap: 2px; min-width: 0; }
.mcard__status { text-align: right; }
.mcard__name { font-size: var(--fs-16); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard__meta { font-size: var(--fs-12); color: var(--card-muted); letter-spacing: 0.02em; }
.mcard__level { font-family: var(--font-serif); font-size: var(--fs-20); font-weight: 400; line-height: 1.1; }
.mcard__level--long { font-size: 18px; }
.mcard__meta, .mcard__level { white-space: nowrap; }

/* Issued: the card rises in, then the number and seal settle. Calm, once. */
.mcard.is-issuing { animation: card-rise 900ms var(--ease) both; }
.mcard.is-issuing .mcard__no { animation: card-ink 700ms var(--ease) 650ms both; }
.mcard.is-issuing .mcard__foot { animation: card-ink 600ms var(--ease) 950ms both; }
.mcard.is-issuing .mcard__seal { animation: card-seal 900ms var(--ease) 1200ms both; }
@keyframes card-rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes card-ink { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes card-seal { from { opacity: 0; transform: rotate(-24deg) scale(0.9); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .mcard.is-issuing, .mcard.is-issuing .mcard__no, .mcard.is-issuing .mcard__foot, .mcard.is-issuing .mcard__seal { animation: none; }
}

/* Club tab --------------------------------------------------------------- */
.club { display: grid; gap: var(--space-5); }
.club > .app-section { margin-top: var(--space-3); }

.pbar { height: 4px; border-radius: var(--radius-pill); background: var(--line); overflow: hidden; }
.pbar span { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(var(--p, 0)); background: var(--accent); border-radius: inherit; transition: transform 600ms var(--ease); }

.ladder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); }
.ladder__step { position: relative; display: grid; gap: 2px; padding-top: 20px; }
.ladder__step::before { content: ""; position: absolute; top: 5px; left: 12px; right: calc(-1 * var(--space-2)); height: 1px; background: var(--line-strong); }
.ladder__step:last-child::before { display: none; }
.ladder__step.is-reached:not(.is-current)::before { background: var(--accent); }
.ladder__dot { position: absolute; top: 0; left: 0; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--bg); }
.ladder__step.is-reached .ladder__dot { border-color: var(--accent); background: var(--accent); }
.ladder__step.is-current .ladder__dot { box-shadow: 0 0 0 4px var(--accent-soft); }
.ladder__name { font-size: var(--fs-14); font-weight: 500; color: var(--ink-3); }
.ladder__step.is-reached .ladder__name { color: var(--ink); }
.ladder__line { font-size: var(--fs-12); line-height: 1.35; color: var(--ink-3); }
.club-next { display: grid; gap: var(--space-2); margin-top: var(--space-4); padding-top: var(--space-4); border-top: var(--hairline); }
.club-next strong { font-weight: 500; }
.club-next__row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-3); }
.club-next__row .num { min-width: 96px; text-align: right; }

/* Passport: a stamp per café */
.passport__head { display: grid; gap: 2px; margin-bottom: var(--space-4); }
.passport__count { color: var(--accent); }
.passport { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3) var(--space-2); }
.stamp { position: relative; display: grid; place-content: center; justify-items: center; gap: 2px; aspect-ratio: 1; padding: 6px; text-align: center; }
.stamp__ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed var(--line-strong); }
.stamp__name { position: relative; font-size: 11px; font-weight: 500; line-height: 1.15; color: var(--ink-3); letter-spacing: 0.01em; }
.stamp__date { position: relative; font-size: 10px; line-height: 1.2; color: var(--ink-4); }
.stamp.is-stamped { transform: rotate(var(--tilt, 0deg)); }
.stamp.is-stamped .stamp__ring { border: 1.5px solid var(--accent); box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 3.75px var(--accent); }
.stamp.is-stamped .stamp__name { color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }
.stamp.is-stamped .stamp__date { color: var(--ink-2); }

/* Badges */
.badge-mark { display: grid; place-items: center; width: var(--tap); height: var(--tap); flex: none; border-radius: 50%; border: 1px dashed var(--line-strong); color: var(--ink-4); }
.badge-mark svg { width: 24px; height: 24px; }
.badge-row.is-earned .badge-mark { border: 1.5px solid var(--accent); color: var(--accent); background: var(--accent-soft); }
.badge-row:not(.is-earned) .row__title { color: var(--ink-2); }

.perk-row .row__title { font-weight: 400; }
.perk-row.is-yours .row__title { font-weight: 500; }
.perk-row:not(.is-yours) .row__title { color: var(--ink-2); }
.perk-row + .t-micro, [data-club="perks"] > .t-micro { margin-top: var(--space-2); }

/* Gatherings */
.gather { display: grid; gap: var(--space-3); }
.gather__when { display: flex; align-items: center; gap: var(--space-2); color: var(--ink-2); }
.gather__when svg { flex: none; color: var(--ink-3); }
.gather__seats { display: grid; gap: var(--space-2); padding-block: var(--space-2); }
.gather__seats strong { font-weight: 500; }
.gather__action { display: grid; gap: var(--space-2); justify-items: start; }
.gather__action .btn--block { justify-self: stretch; }
.gather__action .btn--link { padding-inline: 0; }
.gather__going { display: flex; align-items: center; gap: var(--space-2); font-weight: 500; color: var(--accent); }
.gather__going svg { flex: none; }
.gather-past .row__title { font-weight: 400; color: var(--ink-2); }

/* Invite and gift links */
.invite { display: grid; gap: var(--space-4); }

.gift-msg { min-height: 88px; }
.gift-card {

  padding: 20px 22px;

  background: #2A221C;
  color: #F6F1EA;
  box-shadow: inset 0 0 0 1px rgba(246, 241, 234, 0.16);
}
.gift-card__top { display: flex; justify-content: space-between; align-items: baseline; color: rgba(246, 241, 234, 0.66); }
.gift-card__top .mcard__brand { color: #F6F1EA; }
.gift-card__cups { margin-top: var(--space-3); font-family: var(--font-serif); font-size: var(--fs-28); font-weight: 300; line-height: 1.15; }
.gift-card__to { font-size: var(--fs-14); }
.gift-card__msg { font-family: var(--font-serif); font-style: italic; font-size: var(--fs-16); line-height: 1.4; overflow-wrap: anywhere; }
.gift-card__msg[hidden] { display: none; }
.gift-card__foot { display: flex; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-2); padding-top: var(--space-3); border-top: 1px solid rgba(246, 241, 234, 0.16); font-size: var(--fs-12); color: rgba(246, 241, 234, 0.66); }
.gift-code { font-family: var(--font-serif); font-size: var(--fs-40); font-weight: 300; letter-spacing: 0.12em; line-height: 1; margin-block: var(--space-2); }

/* Onboarding ------------------------------------------------------------- */

.welcome-intro .btn { margin-top: var(--space-5); }
.welcome-invite { display: flex; gap: var(--space-2); align-items: flex-start; padding: var(--space-3) var(--space-4); border-radius: var(--radius-card); background: var(--accent-soft); color: var(--accent); font-size: var(--fs-14); font-weight: 500; }
.welcome-invite svg { flex: none; margin-top: 1px; }
.ob-form { display: grid; gap: var(--space-4); }
.ob-form > h1 { margin-top: var(--space-2); }
.ob-form > p.t-small { margin-top: calc(-1 * var(--space-2)); }
.ob-form > .btn { margin-top: var(--space-3); }
.ob-form .btn--link { height: auto; padding: 0; font-size: inherit; }
.ob-code { letter-spacing: 0.5em; text-align: center; }
.area-pick { display: flex; flex-wrap: wrap; gap: var(--space-2); border: 0; padding: 0; margin: 0; min-width: 0; }
.area-chip { cursor: pointer; }
.area-chip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.area-chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

.issued { min-height: 100%; display: grid; align-content: center; gap: var(--space-5); padding-block: var(--space-6); }
.issued__eyebrow { animation: card-ink 600ms var(--ease) both; }
.issued__text { display: grid; gap: var(--space-2); animation: card-ink 600ms var(--ease) 1300ms both; }
.issued__actions { display: grid; gap: var(--space-3); animation: card-ink 600ms var(--ease) 1500ms both; }

.badge-row .row__main, .perk-row .row__main, .gather-past .row__main, .gift-link .row__main { display: grid; gap: 2px; }
[data-gift-body] [role="status"]:focus { outline: none; }

/* ---- src/landing.css ---- */
/* =====================================================================

   ===================================================================== */

.lp { padding-bottom: 0; }

.lp-section { display: grid; gap: var(--space-6); }

.lp-steps { display: grid; }

      busyByHour: [0.15, 0.3, 0.45, 0.5, 0.55, 0.5, 0.55, 0.6, 0.7, 0.8, 0.9, 0.95, 0.85, 0.7, 0.5, 0.3],
      avgDailyCups: 7,
    },
    {
      id: "noon",
      name: "Noon Café",
      area: "gulberg",
      price: 450,
      payoutPerCup: 330,
      tags: ["Pastries", "Breakfast"],
      status: "quiet",
      statusUpdatedAt: minsAgo(22),
      hours: { open: "7:00", close: "20:00", label: "7 am – 8 pm" },
      blurb: "Early opener on MM Alam. Eggs, toast, a proper cappuccino.",
      distanceKm: 1.1,
      x: 575, y: 395,
      drinks: [
        { id: "noon-capp",   name: "Cappuccino",           price: 450, credits: 1 },
        { id: "noon-latte",  name: "Rose latte",           price: 500, credits: 1 },
        { id: "noon-iced",   name: "Iced long black",      price: 450, credits: 1 },
      ],
      busyByHour: [0.6, 0.75, 0.6, 0.45, 0.5, 0.55, 0.4, 0.3, 0.3, 0.35, 0.3, 0.2, 0.1, 0, 0, 0],
      avgDailyCups: 6,
    },
    {
      id: "grind",
      name: "Grind & Grain",
      area: "dha",
      price: 550,
      payoutPerCup: 400,
      tags: ["Pastries", "Roastery"],
      status: "moderate",
      statusUpdatedAt: minsAgo(14),
      hours: { open: "8:00", close: "23:00", label: "8 am – 11 pm" },
      blurb: "Bakery first, coffee a very close second. Sourdough from 9.",
      distanceKm: 7.2,
      x: 735, y: 600,
      drinks: [
        { id: "gg-latte",    name: "Grain latte",          price: 550, credits: 1 },
        { id: "gg-macch",    name: "Macchiato",            price: 450, credits: 1 },
        { id: "gg-dirty",    name: "Dirty chai",           price: 600, credits: 1 },
      ],
      busyByHour: [0.25, 0.5, 0.65, 0.6, 0.5, 0.55, 0.6, 0.5, 0.5, 0.6, 0.7, 0.7, 0.55, 0.4, 0.25, 0.1],
      avgDailyCups: 5,
    },
  ];

  /* Members --------------------------------------------------------------
     Two plan types:
       explorer  one pool of cups for any café, at most 2 a cycle at each
       mycafes   cups reserved per café, usable only there
     Nobody stores a cups-left number: balances come from the ledger below.

     Mumtaz is the demo member. The others exist so the café view (Kiln &
     Bean) can show a realistic month and every rule:
       Bilal  — Explorer, already 2 cups at Kiln & Bean this month (cap)
       Sana   — My cafés: Kiln & Bean 6, Maple Roastery 4 (3 + 3 left)
       Omar   — Explorer Starter, first visit to Kiln & Bean today
       Zara   — My cafés, 2 cups at Kiln & Bean today (daily limit)
       Hamza  — Explorer Starter, no cups left                          */
  const cycleStart = startOfDay(now) - 9 * DAY; // seeded members’ month started 9 days ago
  const cycleOf = (id) => `c_${id}_seed`;

  const mumtaz = {
    id: "m_ayesha",            // internal id kept from an earlier name
    firstName: "Mumtaz",
    lastName: "Begum",
    initials: "MB",
    pronoun: "her",
    phone: "+92 300 1234567",
    area: "gulberg",
    plan: { type: "explorer", tierId: "regular" },
    cycle: cycleOf("m_ayesha"),
    cycleStartedAt: daysAgo(18),
    renewsAt: daysAgo(-12),
    payment: { method: "JazzCash", last4: "4567" },
    // BACKEND: member numbers come from a database sequence, issued once at sign-up
    memberNo: 42,
    // visits and cafesTried are filled in from the ledger below
  };

  const demo = (id, firstName, pronoun, plan, staticCode, visits, memberNo) => ({
    id, firstName, pronoun, plan, staticCode, visits, memberNo,
    cycle: cycleOf(id), cycleStartedAt: cycleStart, renewsAt: cycleStart + 30 * DAY,
  });
  const demoMembers = [
    demo("m_bilal", "Bilal", "him",  { type: "explorer", tierId: "regular" },  "615028", { kiln: 6, slowpour: 2, noon: 2, maple: 2, ember: 1 }, 117),
    demo("m_sana",  "Sana",  "her",  { type: "mycafes", allocation: { kiln: 6, maple: 4 } }, "207341", { kiln: 5, maple: 2 }, 203),
    demo("m_omar",  "Omar",  "him",  { type: "explorer", tierId: "starter" },  "558190", { kiln: 1, noon: 2, slowpour: 2, thirdfloor: 1 }, 356),
    demo("m_zara",  "Zara",  "her",  { type: "mycafes", allocation: { kiln: 6, ember: 4 } }, "482913", { kiln: 4, ember: 2 }, 418),
    demo("m_hamza", "Hamza", "him",  { type: "explorer", tierId: "starter" },  "730215", { kiln: 2, noon: 2, slowpour: 2, grind: 2 }, 529),
  ];

  // Small seeded PRNG. Seeded by date, so every open window builds the same month.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const startOfToday = startOfDay(now);
  const today = new Date(startOfToday);
  const rand = mulberry32(today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate());
  const pick = (list) => list[Math.floor(rand() * list.length)];

  /* Background regulars: they fill each café’s month. No codes, so they
     can’t be redeemed in the demo; they appear in the café view’s lists
     and totals. A mix of plans gives every café some reserved cups.   */
  const REGULAR_NAMES = ["Fatima", "Usman", "Hira", "Ali", "Mahnoor", "Saad", "Iqra", "Danish", "Noor", "Ahmed", "Rida", "Faraz", "Amna", "Hassan", "Areeba", "Hamid", "Maryam", "Taimur", "Sara", "Bilquis"];
  const INITIALS = "ABCDFGHJKMNRSTWZ";
  const REGULAR_COUNT = 80;
  // Popularity weights for My cafés reservations
  const POPULAR = ["kiln", "kiln", "slowpour", "slowpour", "ember", "ember", "noon", "noon", "maple", "grind", "quiethours", "thirdfloor"];
  const regulars = Array.from({ length: REGULAR_COUNT }, (_, i) => {
    const firstName = REGULAR_NAMES[i % REGULAR_NAMES.length];
    const id = `m_r${i}_${firstName.toLowerCase()}`;
    let plan;
    if (rand() < 0.55) {
      const u = rand();
      plan = { type: "explorer", tierId: u < 0.3 ? "starter" : u < 0.8 ? "regular" : "enthusiast" };
    } else {
      const allocation = {};
      const n = 1 + Math.floor(rand() * 3);
      while (Object.keys(allocation).length < n) allocation[pick(POPULAR)] = 2 + Math.floor(rand() * 5);
      let total = Object.values(allocation).reduce((a, b) => a + b, 0);
      const first = Object.keys(allocation)[0];
      if (total < rules.minCupsTotal) allocation[first] += rules.minCupsTotal - total;
      plan = { type: "mycafes", allocation };
    }
    return {
      id, firstName, lastName: `${INITIALS[i % INITIALS.length]}.`, pronoun: "them", plan, background: true, visits: {},
      cycle: cycleOf(id), cycleStartedAt: cycleStart, renewsAt: cycleStart + 30 * DAY,
    };
  });

  const members = [mumtaz, ...demoMembers, ...regulars];

  /* Ledger ----------------------------------------------------------------
     Append-only. Every change to a member’s cups is one entry:
       { id, type: purchase|redeem|gift|expire, memberId, cafeId|null,
         cups (signed: purchase +, everything else −), at, cycle }
     Redeem entries also carry drinkId, credits and firstVisit, so the
     café’s redemption list is read straight from the ledger.
     // BACKEND: this becomes a Supabase table (ledger), insert-only.   */
  const ledger = [];
  let seq = 0;
  const tierCups = (id) => tiers.find((t) => t.id === id).cups;
  function purchase(m) {
    const at = m.cycleStartedAt;
    if (m.plan.type === "explorer") ledger.push({ id: `s${seq++}`, type: "purchase", memberId: m.id, cafeId: null, cups: tierCups(m.plan.tierId), at, cycle: m.cycle });
    else Object.entries(m.plan.allocation).forEach(([cafeId, n]) => ledger.push({ id: `s${seq++}`, type: "purchase", memberId: m.id, cafeId, cups: n, at, cycle: m.cycle }));
  }
  members.forEach(purchase);

  const cafeById = Object.fromEntries(cafes.map((c) => [c.id, c]));
  const drinkCredits = (cafeId, drinkId) => cafeById[cafeId].drinks.find((d) => d.id === drinkId).credits;
  function redeem(m, cafeId, drinkId, at, firstVisit = false) {
    const credits = drinkCredits(cafeId, drinkId);
    ledger.push({ id: `s${seq++}`, type: "redeem", memberId: m.id, cafeId, cups: -credits, credits, drinkId, firstVisit, at, cycle: m.cycle });
  }

  /* Mumtaz’s earlier months --------------------------------------------
     She joined three months before this cycle on My cafés (Kiln & Bean 6,
     Noon Café 4, Slow Pour 3), used 12 of 13 cups each month, then
     switched to Explorer Regular when this cycle began. The Club tab
     (status, passport, badges) reads all of it from the ledger.        */
  const clockAgo = (d, h, m = 0) => startOfToday - d * DAY + (h * 60 + m) * MIN;
  const monthsBefore = (ts, n) => { const d = new Date(ts); d.setMonth(d.getMonth() - n); return d.getTime(); };
  (function mumtazHistory() {
    const plan = { kiln: 6, noon: 4, slowpour: 3 };
    // [day in cycle, café, drink, hour, minute]; two Noon cups a month before 9 am
    const MONTH = [
      [1, "kiln", "kiln-flat", 10, 30], [3, "noon", "noon-capp", 8, 10], [5, "kiln", "kiln-cort", 13, 15],
      [7, "slowpour", "sp-v60", 18, 20], [9, "kiln", "kiln-flat", 16, 40], [11, "noon", "noon-latte", 8, 35],
      [13, "kiln", "kiln-cort", 11, 5], [15, "noon", "noon-capp", 12, 30], [18, "slowpour", "sp-gibraltar", 19, 0],
      [21, "kiln", "kiln-flat", 15, 20], [24, "noon", "noon-iced", 14, 45], [27, "kiln", "kiln-cort", 10, 50],
    ];
    for (let k = 3; k >= 1; k--) {
      const start = startOfDay(monthsBefore(mumtaz.cycleStartedAt, k));
      const end = k === 1 ? mumtaz.cycleStartedAt : startOfDay(monthsBefore(mumtaz.cycleStartedAt, k - 1));
      const cycle = `c_m_ayesha_past${k}`;
      Object.entries(plan).forEach(([cafeId, n]) => ledger.push({ id: `s${seq++}`, type: "purchase", memberId: mumtaz.id, cafeId, cups: n, at: start + 9 * 60 * MIN, cycle }));
      MONTH.forEach(([day, cafeId, drinkId, h, m]) => {
        ledger.push({ id: `s${seq++}`, type: "redeem", memberId: mumtaz.id, cafeId, cups: -1, credits: drinkCredits(cafeId, drinkId), drinkId, firstVisit: k === 3 && day <= 7, at: start + day * DAY + (h * 60 + m) * MIN, cycle });
      });
      // The plan ended with one Slow Pour cup unused
      ledger.push({ id: `s${seq++}`, type: "expire", memberId: mumtaz.id, cafeId: "slowpour", cups: -1, at: end, cycle });
    }
    mumtaz.memberSince = startOfDay(monthsBefore(mumtaz.cycleStartedAt, 3));
  })();

  /* Hand-written history: earlier this cycle, before today ----------- */
  const before = (k, n) => startOfToday - Math.round(((n - k) / (n + 1)) * 8 * DAY) - 3 * 60 * MIN; // spread over the last 8 days
  const byId = Object.fromEntries(members.map((m) => [m.id, m]));
  const HISTORY = {
    m_ayesha: [["noon", "noon-capp", clockAgo(14, 8, 20)], ["slowpour", "sp-v60", clockAgo(10, 17, 40)], ["grind", "gg-latte", clockAgo(6, 11, 10)], ["slowpour", "sp-gibraltar", clockAgo(2, 19, 5)]],
    m_bilal:  [["kiln", "kiln-cort"], ["slowpour", "sp-v60"], ["slowpour", "sp-gibraltar"], ["noon", "noon-capp"], ["noon", "noon-iced"], ["maple", "maple-latte"], ["maple", "maple-espresso"], ["ember", "ember-latte"]],
    m_sana:   [["kiln", "kiln-flat"], ["kiln", "kiln-cort"], ["maple", "maple-latte"]],
    m_omar:   [["noon", "noon-capp"], ["noon", "noon-latte"], ["slowpour", "sp-v60"], ["slowpour", "sp-gibraltar"], ["thirdfloor", "tf-spanish"]],
    m_zara:   [["ember", "ember-latte"], ["ember", "ember-mocha"], ["kiln", "kiln-flat"]],
    m_hamza:  [["kiln", "kiln-flat"], ["kiln", "kiln-cort"], ["noon", "noon-capp"], ["noon", "noon-latte"], ["slowpour", "sp-v60"], ["slowpour", "sp-gibraltar"], ["grind", "gg-latte"], ["grind", "gg-macch"]],
  };
  Object.entries(HISTORY).forEach(([id, rows]) => rows.forEach(([cafeId, drinkId, at], k) => redeem(byId[id], cafeId, drinkId, at || before(k, rows.length))));

  /* Today’s hand-written rows at Kiln & Bean (the café view’s demo café).
     Mumtaz: 1 of 2 at Kiln & Bean this month. Zara: daily limit.       */
  const handToday = {
    kiln: [
      { memberId: "m_ayesha", drinkId: "kiln-flat" },
      { memberId: "m_zara",   drinkId: "kiln-flat" },
      { memberId: "m_zara",   drinkId: "kiln-cort" },
      { memberId: "m_omar",   drinkId: "kiln-cort", firstVisit: true },
      { memberId: "m_bilal",  drinkId: "kiln-flat" },
      { memberId: "m_sana",   drinkId: "kiln-flat" },
    ],
  };

  /** n timestamps across a day’s open hours, weighted by busyByHour.
      Today: only the hours that have passed (counts stay fixed, so the
      demo looks the same at any hour; early on they bunch up).        */
  function dayTimes(cafe, dayStart, n, isToday) {
    const at = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return dayStart + (h * 60 + (m || 0)) * MIN; };
    let start = at(cafe.hours.open);
    let close = at(cafe.hours.close);
    if (close <= start) close += DAY;
    let end = isToday ? Math.min(now - 2 * MIN, close) : close;
    if (isToday && end - start < 60 * MIN) { start = Math.max(dayStart, now - 3 * 60 * MIN); end = now - 2 * MIN; }
    if (end <= start) start = end - 30 * MIN;
    const slots = [];
    let total = 0;
    for (let t = start; t < end; ) {
      const next = new Date(t); next.setMinutes(60, 0, 0);
      const stop = Math.min(end, next.getTime());
      const w = Math.max(0.08, cafe.busyByHour[new Date(t).getHours() - 8] ?? 0.1) * (stop - t);
      slots.push({ t, stop, w }); total += w; t = stop;
    }
    return Array.from({ length: n }, () => {
      let u = rand() * total;
      const slot = slots.find((s) => (u -= s.w) <= 0) || slots[slots.length - 1];
      return Math.round(slot.t + rand() * (slot.stop - slot.t));
    }).sort((a, b) => a - b);
  }

  /* Regulars’ month so far, generated under the real rules: balance,
     2 a day per café, Explorer 2 a cycle per café, My cafés only where
     reserved.                                                         */
  (function generateMonth() {
    const left = {};      // memberId -> pool left (explorer) or { cafeId: left } (mycafes)
    const usedHere = {};  // memberId -> { cafeId: cups this cycle }
    regulars.forEach((m) => {
      left[m.id] = m.plan.type === "explorer" ? tierCups(m.plan.tierId) : { ...m.plan.allocation };
      usedHere[m.id] = {};
    });
    const canUse = (m, cafeId, credits, today) => {
      if ((today[m.id]?.[cafeId] || 0) + credits > rules.dailyLimitPerCafe) return false;
      if (m.plan.type === "mycafes") return (left[m.id][cafeId] || 0) >= credits;
      return left[m.id] >= credits && (usedHere[m.id][cafeId] || 0) + credits <= rules.explorerCapPerCafe;
    };
    const use = (m, cafeId, credits, today) => {
