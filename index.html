            ${meter(loyal.visits, loyal.goal, `${loyal.visits} of ${loyal.goal} visits to a free cup`)}
            ${loyal.freeCupsEarned ? html`<p class="t-micro t-faint">${fmt.cups(loyal.freeCupsEarned)} on the house so far.</p>` : ""}
          </div>
          <div class="visits__item">
            <div class="visits__head">
              <span class="row__title">Explorer</span>
              <span class="t-small t-muted num">${exploredNow} of ${EXPLORER_GOAL} cafés</span>
            </div>
            ${meter(exploredNow, EXPLORER_GOAL, `${exploredNow} of ${EXPLORER_GOAL} cafés tried`)}
            <p class="t-small t-muted">${explorer}</p>
          </div>
        </div>`;
    }

    function meter(value, goal, label) {
      return html`<div class="meter" role="img" aria-label="${label}">
        ${Array.from({ length: goal }, (_, i) => html`<span class="meter__seg${i < value ? " is-on" : ""}"></span>`)}
      </div>`;
    }

    /** What the member can use here, from the ledger, and the next step. */
    function actionHtml() {
      const here = S.cafeBalance(ctx.member().id, c.id);
      if (here.type === "mycafes") {
        return here.reserved
          ? html`<p class="t-small t-muted num" data-here-line><strong>${fmt.cups(here.left)} reserved here</strong>, of ${here.reserved} this month.</p>
              <button type="button" class="btn btn--secondary btn--block" data-start-plan="${c.id}">Change my cups</button>`
          : html`<p class="t-small t-muted" data-here-line><strong>Not in your plan.</strong> Add it?</p>
              <button type="button" class="btn btn--primary btn--block" data-start-plan="${c.id}">Add to my plan</button>`;
      }
      const line = here.left > 0
        ? html`<strong>You can have ${here.left === 1 ? "1 more" : `${here.left} more`} here this month</strong> on your Explorer plan.`
        : here.used >= here.cap
          ? html`<strong>You’ve had your ${here.cap} here this month.</strong> Every other partner café is still open to you.`
          : html`<strong>No cups left this month.</strong> Your plan renews on ${fmt.shortDate(ctx.member().renewsAt)}.`;
      return html`<p class="t-small t-muted num" data-here-line>${line}</p>
        <button type="button" class="btn btn--secondary btn--block" data-start-plan="${c.id}">Reserve cups here with My cafés</button>`;
    }

    function paintOpen() {
      const n = $("[data-open-state]", view);
      if (n) n.textContent = S.openState(c).label;
    }

    let onScroll = null;
    return {
      html: html`
        <div class="cafe-detail">
          <div class="screen-bar" data-screen-bar>
            <button type="button" class="icon-btn" data-back="#/app/cafes" aria-label="Back">${icon("arrowLeft")}</button>
            <span class="screen-bar__title" aria-hidden="true">${c.name}</span>
          </div>
          <div class="app-screen cafe-detail__body">
            <div class="stack" style="--stack-gap:var(--space-2)">
              <p class="eyebrow">${area.name} · ${c.distanceKm} km</p>
              <h1 class="t-h1" data-detail-title>${c.name}</h1>
              <p class="t-body t-muted">${c.blurb}</p>
            </div>
            <div class="cafe-detail__status">${ui.statusPill(c.id)}</div>

            <dl class="facts">
              <div><dt>${icon("clock", { size: 18 })}<span class="sr-only">Hours</span></dt><dd>${c.hours.label}<span class="t-faint"> · <span data-open-state>${S.openState(c).label}</span></span></dd></div>
              <div><dt>${ui.cupIcon(S.usualStatus(c, USUAL_HOUR).status, { size: 18, cls: "" })}<span class="sr-only">Typical</span></dt><dd>Usually ${fmt.statusLabel(S.usualStatus(c, USUAL_HOUR).status).toLowerCase()} at 6 pm</dd></div>
              <div><dt>${icon("store", { size: 18 })}<span class="sr-only">Price</span></dt><dd class="num">${fmt.rs(c.price)} a cup at the counter</dd></div>
            </dl>
            <div class="cluster" style="--cluster-gap:var(--space-2)">${c.tags.map((t) => html`<span class="badge">${t}</span>`)}</div>

            <section class="app-section" aria-labelledby="drinks-h">
              <h2 class="eyebrow app-section__title" id="drinks-h">Signature drinks</h2>
              <ul role="list">
                ${c.drinks.map((d) => html`<li class="row">
                  <div class="row__main"><div class="row__title">${d.name}</div><div class="row__meta num">${fmt.rs(d.price)} at the counter</div></div>
                  <span class="badge${d.credits > 1 ? " badge--accent" : ""}">Uses ${fmt.cups(d.credits)}</span>
                </li>`)}
              </ul>
            </section>

            <section class="app-section" aria-labelledby="visits-h">
              <h2 class="eyebrow app-section__title" id="visits-h">Your visits</h2>
              <div data-visits>${visitsHtml()}</div>
            </section>
          </div>
          <div class="sticky-action" data-detail-action>${actionHtml()}</div>
        </div>`.s,
      mount() {
        // The bar shows the name once the big title scrolls away
        const bar = $("[data-screen-bar]", view);
        const title = $("[data-detail-title]", view);
        onScroll = () => bar.classList.toggle("is-titled", title.getBoundingClientRect().bottom < bar.getBoundingClientRect().bottom);
        view.addEventListener("scroll", onScroll, { passive: true });
        return () => view.removeEventListener("scroll", onScroll);
      },
      on: {
        redeem: ({ entry }) => { if (entry.memberId === ctx.member().id) $("[data-visits]", view).innerHTML = visitsHtml().s; },
        plan: () => { $("[data-detail-action]", view).innerHTML = actionHtml().s; },
        ledger: () => { $("[data-detail-action]", view).innerHTML = actionHtml().s; },
        tick: paintOpen,
      },
    };
  };
})();

</script>
<script>
/* ---- src/app-plan.js ---- */
/* =====================================================================
   Lahore Coffee Club — app-plan.js
   Member app: plan picker (#/app/plan) and simulated payment
   (#/app/plan/pay). Prices always come from store.select.quote(), which
   uses select.customPrice() for My cafés: one source of truth for
   this screen, the landing teaser and #/kit.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, raw, $, $$, icon } = ui;
  const S = store.select;
  const A = store.actions;
  const REG = (LCC.appScreens = LCC.appScreens || {});
  const rules = () => store.getState().rules;

  /* -------------------------------------------------------------------
     Draft: what the member is about to buy. The custom allocation is the
     store's builder, so the kit's builder shows the same numbers.
     ------------------------------------------------------------------- */
  // mode: "explorer" (fixed tiers, one pool) or "mycafes" (cups reserved per café)
  const draft = { started: false, mode: "explorer", tierId: "regular", highlight: null };
  const DEFAULT_ADD = 2; // cups added for a café chosen from its detail page

  const pay = {
    method: "jazzcash",
    phone: "",
    card: { number: "", exp: "", cvc: "" },
    phase: "form", // form | processing | success | failed
    result: null,
    forMember: null, // whose number pre-fills the wallet field
  };
  const onboarding = () => !!LCC.onboarding?.active();

  /** mode: open on "explorer" or "mycafes". keepBuilder: keep the builder as it is
      (the landing teaser hands over its cups) instead of loading the current plan. */
  function start({ addCafe = null, mode = null, keepBuilder = false } = {}) {
    const st = store.getState();
    const cur = S.member().plan;
    draft.started = true;
    draft.mode = mode || (addCafe ? "mycafes" : cur?.type || "explorer");
    draft.tierId = cur?.tierId || "regular";
    draft.highlight = addCafe;
    if (cur?.type === "mycafes" && !keepBuilder) A.setBuilder(cur.allocation);
    if (addCafe && !st.builder[addCafe]) A.setBuilderCups(addCafe, DEFAULT_ADD);
    pay.phase = "form";
    if (pay.forMember !== S.member().id) {
      pay.forMember = S.member().id;
      pay.phone = formatPhone(String(S.member().phone || "").replace(/^\+92\s?/, "0"));
    }
  }
  LCC.appPlan = { start, draft };

  const draftPlan = () =>
    draft.mode === "explorer"
      ? { type: "explorer", tierId: draft.tierId }
      : { type: "mycafes", allocation: { ...store.getState().builder } };

  const isCurrent = () => S.isCurrentPlan(draftPlan());
  const whyMinimum = () =>
    `Plans start at ${rules().minCupsTotal} cups a month, so every café can count on you as a regular.`;

  /* -------------------------------------------------------------------
     Plan picker
     ------------------------------------------------------------------- */
  REG.plan = (ctx) => {
    const { view } = ctx;
    if (!draft.started) start();
    const m = ctx.member();

    function tiersHtml() {
      const cur = S.member().plan;
      return html`
        <p class="t-small t-muted plan-intro">One pool of cups for any partner café, up to ${rules().explorerCapPerCafe} a month at each. Good for trying new places.</p>
        <fieldset class="tier-list">
          <legend class="sr-only">Explorer plans</legend>
          ${store.getState().tiers.map((t) => html`
            <label class="card tier">
              <input class="sr-only" type="radio" name="tier" value="${t.id}" ${draft.tierId === t.id ? raw("checked") : ""}>
              <span class="tier__head">
                <span class="t-h3">${t.name}</span>
                ${cur?.type === "explorer" && cur.tierId === t.id ? html`<span class="badge badge--accent">Your plan</span>` : ""}
                <span class="tier__price t-h3 num">${fmt.rs(t.price)}</span>
              </span>
              <span class="tier__meta t-small t-muted num">${fmt.cups(t.cups)} a month · ${t.line}</span>
              <span class="t-micro t-faint num">About ${fmt.rs(t.price / t.cups)} a cup, at any partner café</span>
            </label>`)}
        </fieldset>`;
    }

    function builderRowHtml(c) {
      const n = store.getState().builder[c.id] || 0;
      const max = rules().maxCupsPerCafe;
      return html`<li class="row builder-row${draft.highlight === c.id ? " is-new" : ""}" data-builder-row="${c.id}">
        <div class="row__main">
          <div class="row__title">${c.name}</div>
          <div class="row__meta num" data-row-meta>${rowMeta(c, n)}</div>
        </div>
        ${ui.stepper({ id: c.id, value: n, min: 0, max, label: `Cups a month at ${c.name}` })}
      </li>`;
    }

    function rowMeta(c, n) {
      const per = c.price * rules().customDiscount;
      if (n >= rules().maxCupsPerCafe) return `${n} a month, the most at one café`;
      return `${S.area(c.area).name} · ${fmt.rs(per)} a cup, ${fmt.rs(c.price)} at the counter`;
    }

    function builderHtml() {
      return html`
        <p class="t-small t-muted plan-intro">Reserve cups at the cafés you love, up to ${rules().maxCupsPerCafe} a month at each. They can only be used there. You pay ${Math.round(rules().customDiscount * 100)}% of the counter price.</p>
        <ul role="list" class="builder-list">${S.cafes().map(builderRowHtml)}</ul>`;
    }

    function paintBody() {
      $("[data-plan-body]", view).innerHTML = (draft.mode === "explorer" ? tiersHtml() : builderHtml()).s;
    }

    function paintSummary(animate = true) {
      const q = S.quote(draftPlan());
      const cupsEl = $("[data-sum-cups]", view);
      const priceEl = $("[data-sum-price]", view);
      if (animate) { ui.animateNumber(cupsEl, q.cups); ui.animateNumber(priceEl, q.price, { format: fmt.rs }); }
      else { cupsEl.textContent = q.cups; cupsEl.dataset.value = q.cups; priceEl.textContent = fmt.rs(q.price); priceEl.dataset.value = q.price; }
      $("[data-sum-cups-word]", view).textContent = q.cups === 1 ? "cup a month" : "cups a month";

      const note = $("[data-sum-note]", view);
      const btn = $("[data-continue]", view);
      let text, warn = false, ok = true;
      if (!q.meetsMinimum) {
        text = `Add ${fmt.cups(q.cupsShort)} to continue. ${whyMinimum()}`;
        warn = true; ok = false;
      } else if (isCurrent()) {
        text = `You’re on this plan. It renews on ${fmt.shortDate(m.renewsAt)}.`;
        ok = false;
      } else {
        text = `You save ${draft.mode === "explorer" ? "about " : ""}${fmt.rs(q.savings)} vs paying at the counter`;
      }
      note.textContent = text;
      note.classList.toggle("is-warn", warn);
      btn.disabled = !ok;
    }

    function onClick(e) {
      const seg = e.target.closest('[data-segmented="plantype"] .segmented__option');
      if (seg) {
        if (draft.mode === seg.dataset.value) return;
        ui.selectSegment(seg.parentElement, seg.dataset.value);
        draft.mode = seg.dataset.value;
        paintBody();
        paintSummary();
        return;
      }
      const step = e.target.closest("[data-step]");
      if (step) {
        const id = step.closest("[data-stepper]").dataset.stepper;
        A.setBuilderCups(id, (store.getState().builder[id] || 0) + Number(step.dataset.step));
        return;
      }
      if (e.target.closest("[data-continue]")) {
        pay.phase = "form";
        ctx.go("#/app/plan/pay");
      }
    }

    function onChange(e) {
      if (e.target.name !== "tier") return;
      draft.tierId = e.target.value;
      paintSummary();
    }

    return {
      html: html`
        <div class="flow">
          <div class="screen-bar">
            <button type="button" class="icon-btn" data-back="${onboarding() ? "#/app/welcome" : "#/app"}" aria-label="Back">${icon("arrowLeft")}</button>
            ${onboarding() ? html`<span class="t-small t-faint">Step 5 of 6</span>` : ""}
          </div>
          <div class="app-screen flow__body">
            <div class="stack" style="--stack-gap:var(--space-2)">
              <h1 class="t-h2">Choose your plan</h1>
              ${m.plan
                ? html`<p class="t-small t-muted num">You’re on ${S.memberPlan(m).type === "explorer" ? `Explorer ${S.memberPlan(m).name}` : "My cafés"}, ${S.balance().left} of ${S.balance().total} cups left. A new plan starts fresh today; unused cups don’t carry over.</p>`
                : html`<p class="t-small t-muted">Two ways to drink well. Your month starts the day you pay, and you can change plans whenever you like.</p>`}
            </div>
            ${ui.segmented({ name: "plantype", label: "Plan type", value: draft.mode, options: [{ value: "explorer", label: "Explorer" }, { value: "mycafes", label: "My cafés" }] })}
            <div data-plan-body></div>
          </div>
          <div class="summary-bar" role="region" aria-label="Plan summary">
            <div class="summary-bar__nums">
              <p class="t-small"><span class="num summary-bar__cups" data-sum-cups>0</span> <span data-sum-cups-word>cups a month</span></p>
              <p class="t-h2 num" data-sum-price aria-live="polite">Rs 0</p>
            </div>
            <p class="t-small t-muted summary-bar__note" data-sum-note aria-live="polite"></p>
            <button type="button" class="btn btn--primary btn--block" data-continue>Continue to payment</button>
          </div>
        </div>`.s,
      mount() {
        paintBody();
        paintSummary(false);
        if (draft.highlight && draft.mode === "mycafes") {
          const row = $(`[data-builder-row="${draft.highlight}"]`, view);
          requestAnimationFrame(() => row?.scrollIntoView({ block: "center", behavior: ui.reducedMotion() ? "auto" : "smooth" }));
        }
        view.addEventListener("click", onClick);
        view.addEventListener("change", onChange);
        return () => { view.removeEventListener("click", onClick); view.removeEventListener("change", onChange); };
      },
      on: {
        builder: () => {
          if (draft.mode !== "mycafes") return;
          const b = store.getState().builder;
          $$("[data-builder-row]", view).forEach((row) => {
            const id = row.dataset.builderRow;
            ui.setStepper($("[data-stepper]", row), b[id] || 0);
            $("[data-row-meta]", row).textContent = rowMeta(S.cafe(id), b[id] || 0);
          });
          paintSummary();
        },
      },
    };
  };

  /* -------------------------------------------------------------------
     Payment (simulated)
     ------------------------------------------------------------------- */
  const METHODS = [
    { id: "jazzcash",  label: "JazzCash",  line: "Mobile wallet",  icon: "wallet" },
    { id: "easypaisa", label: "Easypaisa", line: "Mobile wallet",  icon: "wallet" },
    { id: "card",      label: "Card",      line: "Debit or credit", icon: "card" },
  ];
  const methodLabel = (id) => METHODS.find((x) => x.id === id).label;

  /* Formatting and checks: format only, no real validation ------------ */
  const digits = (s) => String(s).replace(/\D/g, "");
  function formatPhone(s) { const d = digits(s).slice(0, 11); return d.length > 4 ? `${d.slice(0, 4)} ${d.slice(4)}` : d; }
  function formatCard(s) { return digits(s).slice(0, 16).replace(/(\d{4})(?=\d)/g, "$1 "); }
  /** “0828” -> “08/28”. Typing “4” gives “04/”. While deleting, the slash isn’t re-added. */
  function formatExp(s, deleting = false) {
    let d = digits(s).slice(0, 4);
    if (!deleting && d.length === 1 && Number(d) > 1) d = `0${d}`;
    if (d.length > 2 || (d.length === 2 && !deleting)) return `${d.slice(0, 2)}/${d.slice(2)}`;
    return d;
  }
  const CHECKS = {
    phone: (v) => (/^03\d{9}$/.test(digits(v)) ? "" : "Enter an 11-digit number starting with 03, like 0300 1234567."),
    number: (v) => (digits(v).length === 16 ? "" : "Enter the 16 digits on the front of your card."),
    exp(v) {
      const mt = /^(\d{2})\/(\d{2})$/.exec(v.trim());
      if (!mt || +mt[1] < 1 || +mt[1] > 12) return "Use MM/YY, like 08/28.";
      const now = new Date();
      const y = 2000 + +mt[2], mo = +mt[1];
      if (y < now.getFullYear() || (y === now.getFullYear() && mo < now.getMonth() + 1)) return "That card has expired. Try another one.";
      return "";
    },
    cvc: (v) => (/^\d{3,4}$/.test(v.trim()) ? "" : "The 3 digits on the back of your card."),
  };

  REG.pay = (ctx) => {
    const { view } = ctx;
    if (!draft.started) return { redirect: "#/app/plan" };
    const plan = draftPlan();
    const q = S.quote(plan);
    if (!q.meetsMinimum) return { redirect: "#/app/plan" };
    let alive = true;
    const renewal = store.addMonths(Date.now(), 1);
    const longDate = (ts) => new Date(ts).toLocaleDateString("en-GB", { day: "numeric", month: "long" });

    function field({ id, label, value, placeholder, inputmode = "numeric", autocomplete, hint }) {
      return html`<div class="field" data-field="${id}">
        <label class="field__label" for="pay-${id}">${label}</label>
        <input class="input num" id="pay-${id}" name="${id}" value="${value}" placeholder="${placeholder}" inputmode="${inputmode}" autocomplete="${autocomplete}" aria-describedby="pay-${id}-err${hint ? ` pay-${id}-hint` : ""}">
        ${hint ? html`<p class="field__hint" id="pay-${id}-hint">${hint}</p>` : ""}
        <p class="field__error" id="pay-${id}-err"></p>
      </div>`;
    }

    function fieldsHtml() {
      if (pay.method === "card") {
        return html`
          ${field({ id: "number", label: "Card number", value: pay.card.number, placeholder: "1234 5678 9012 3456", autocomplete: "cc-number" })}
          <div class="field-pair">
            ${field({ id: "exp", label: "Expiry", value: pay.card.exp, placeholder: "MM/YY", autocomplete: "cc-exp" })}
            ${field({ id: "cvc", label: "CVC", value: pay.card.cvc, placeholder: "123", autocomplete: "cc-csc" })}
          </div>`;
      }
      return field({
        id: "phone", label: `${methodLabel(pay.method)} mobile number`, value: pay.phone, placeholder: "03XX XXXXXXX", inputmode: "tel", autocomplete: "tel-national",
        hint: `You’ll approve the payment in the ${methodLabel(pay.method)} app.`,
      });
    }

    function formHtml() {
      return html`
        <form class="pay-form" data-pay-form novalidate>
          <fieldset class="method-list">
            <legend class="field__label">Pay with</legend>
            ${METHODS.map((x) => html`
              <label class="method">
                <input class="sr-only" type="radio" name="method" value="${x.id}" ${pay.method === x.id ? raw("checked") : ""}>
                <span class="method__icon">${icon(x.icon, { size: 22 })}</span>
                <span class="method__text"><span class="row__title">${x.label}</span><span class="row__meta">${x.line}</span></span>
                <span class="method__tick" aria-hidden="true">${icon("check", { size: 18 })}</span>
              </label>`)}
          </fieldset>
          <div class="stack" style="--stack-gap:var(--space-4)" data-pay-fields>${fieldsHtml()}</div>
          <div class="proto-note">
            ${icon("info", { size: 18 })}
            <p><strong>Prototype: no payment is taken.</strong></p>
          </div>
          <button type="submit" class="btn btn--primary btn--block num">Pay ${fmt.rs(q.price)}</button>
        </form>`;
    }

    function stateHtml() {
      if (pay.phase === "processing") {
        const who = pay.method === "card" ? "Checking your card" : `Waiting for ${methodLabel(pay.method)}`;
        const line = pay.method === "card" ? "This takes a few seconds." : `Approve the request sent to ${pay.phone}.`;
        return html`<div class="pay-state" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <p class="t-h3">${who}</p>
          <p class="t-small t-muted num">${line}</p>
        </div>`;
      }
      if (pay.phase === "success") {
        const mem = ctx.member();
        const title = plan.type === "explorer" ? `You’re on Explorer ${q.name}.` : "Your cafés are set.";
        return html`<div class="pay-state" role="status">
          <svg class="check-draw" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/><path d="M15 24.5l6 6 12-13" pathLength="1"/></svg>
          <h2 class="t-h2">${title}</h2>
          <p class="t-body t-muted num">${fmt.cups(S.balance(mem.id).total)}, fresh from today. Renews on ${longDate(mem.renewsAt)}.</p>
          <div class="pay-state__actions">
            <button type="button" class="btn btn--primary btn--block" data-done="#/app/pass">Show my pass</button>
            <button type="button" class="btn btn--secondary btn--block" data-done="#/app">Back to home</button>
          </div>
        </div>`;
      }
      if (pay.phase === "failed") {
        return html`<div class="pay-state" role="alert">
          <span class="pay-state__mark" aria-hidden="true">${icon("info", { size: 28 })}</span>
          <h2 class="t-h2">Payment didn’t go through.</h2>
          <p class="t-body t-muted">${methodLabel(pay.method)} couldn’t confirm it, and nothing was taken. Check the number, or try another way to pay.</p>
          <div class="pay-state__actions">
            <button type="button" class="btn btn--primary btn--block" data-try-again>Try again</button>
          </div>
        </div>`;
      }
      return formHtml();
    }

    function paint() {
      $("[data-pay-body]", view).innerHTML = stateHtml().s;
      const back = $("[data-pay-back]", view);
      back.disabled = pay.phase === "processing";
      back.hidden = pay.phase === "success";
      if (pay.phase !== "form") $("[data-pay-body]", view).querySelector("button, [role]")?.focus?.({ preventScroll: true });
    }

    function showError(id, msg) {
      const f = $(`[data-field="${id}"]`, view);
      if (!f) return;
      f.dataset.invalid = String(!!msg);
      $(".field__error", f).textContent = msg;
      $("input", f).setAttribute("aria-invalid", String(!!msg));
    }

    const fieldIds = () => (pay.method === "card" ? ["number", "exp", "cvc"] : ["phone"]);
    const valueOf = (id) => (id === "phone" ? pay.phone : pay.card[id]);

    function onInput(e) {
      const inp = e.target;
      if (!inp.matches("[data-pay-fields] input")) return;
      const id = inp.name;
      const deleting = (e.inputType || "").startsWith("delete");
      let v = inp.value;
      if (id === "phone") v = formatPhone(v);
      else if (id === "number") v = formatCard(v);
      else if (id === "exp") v = formatExp(v, deleting);
      else if (id === "cvc") v = digits(v).slice(0, 4);
      if (v !== inp.value) inp.value = v;
      if (id === "phone") pay.phone = v; else pay.card[id] = v;
      // Clear an error as soon as the value is fixed
      if (inp.closest(".field").dataset.invalid === "true") showError(id, CHECKS[id](v));
    }

    function onFocusOut(e) {
      const inp = e.target;
      if (!inp.matches?.("[data-pay-fields] input") || !inp.value) return;
      showError(inp.name, CHECKS[inp.name](inp.value));
    }

    function onChange(e) {
      if (e.target.name !== "method") return;
      pay.method = e.target.value;
      $("[data-pay-fields]", view).innerHTML = fieldsHtml().s;
    }

    function onSubmit(e) {
      if (!e.target.matches("[data-pay-form]")) return;
      e.preventDefault();
      const bad = fieldIds().map((id) => [id, CHECKS[id](valueOf(id))]).filter(([, msg]) => msg);
      fieldIds().forEach((id) => showError(id, CHECKS[id](valueOf(id))));
      if (bad.length) { $(`#pay-${bad[0][0]}`, view).focus(); return; }
      pay.phase = "processing";
      paint();
      const account = pay.method === "card" ? pay.card.number : pay.phone;
      A.checkout({ plan, method: pay.method, account }).then((res) => {
        pay.phase = res.ok ? "success" : "failed";
        pay.result = res;
        if (res.ok) { draft.started = false; draft.highlight = null; }
        // A new member's first plan: their card is issued next
        if (res.ok && alive && onboarding()) { pay.phase = "form"; ctx.go("#/app/welcome/card", { replace: true }); return; }
        if (alive) paint();
        else if (res.ok) ctx.toast(`You’re on ${q.name}. ${fmt.cups(q.cups)} to enjoy.`);
      });
    }

    function onClick(e) {
      if (e.target.closest("[data-try-again]")) {
        pay.phase = "form";
        paint();
        $("[data-pay-fields] input", view)?.focus();
        return;
      }
      const done = e.target.closest("[data-done]");
      if (done) { pay.phase = "form"; ctx.go(done.dataset.done, { replace: true }); }
    }

    return {
      html: html`
        <div class="flow">
          <div class="screen-bar">
            <button type="button" class="icon-btn" data-back="#/app/plan" data-pay-back aria-label="Back">${icon("arrowLeft")}</button>
            ${onboarding() ? html`<span class="t-small t-faint">Step 6 of 6</span>` : ""}
          </div>
          <div class="app-screen flow__body">
            <h1 class="t-h2">Payment</h1>
            <div class="card pay-summary">
              <div class="pay-summary__row">
                <span class="t-h3">${plan.type === "explorer" ? `Explorer ${q.name}` : "My cafés"}</span>
                <span class="t-h3 num">${fmt.rs(q.price)}</span>
              </div>
              <p class="t-small t-muted num">${fmt.cups(q.cups)} a month, starting today. Renews on ${longDate(renewal)}.</p>
              ${plan.type === "mycafes" ? html`<p class="t-micro t-faint">${Object.entries(plan.allocation).map(([id, n]) => `${S.cafe(id).name} ${n}`).join(" · ")}</p>` : ""}
            </div>
            <div data-pay-body></div>
          </div>
        </div>`.s,
      mount() {
        paint();
        view.addEventListener("input", onInput);
        view.addEventListener("focusout", onFocusOut);
        view.addEventListener("change", onChange);
        view.addEventListener("submit", onSubmit);
        view.addEventListener("click", onClick);
        return () => {
          alive = false;
          view.removeEventListener("input", onInput);
          view.removeEventListener("focusout", onFocusOut);
          view.removeEventListener("change", onChange);
          view.removeEventListener("submit", onSubmit);
          view.removeEventListener("click", onClick);
        };
      },
    };
  };
})();

</script>
<script>
/* ---- src/app-club.js ---- */
/* =====================================================================
   Lahore Coffee Club — app-club.js
   Member app: the Club tab (#/app/club) and gifting (#/app/gift).

   Everything on the Club tab is earned by use and read from the ledger
   through store.select.club(): status, passport, badges and perks. The
   member card is shared with onboarding (LCC.memberCard).
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, raw, $, $$, icon } = ui;
  const S = store.select;
  const A = store.actions;
  const REG = (LCC.appScreens = LCC.appScreens || {});
  const rules = () => store.getState().rules;
  const LIVE_URL = () => (LCC.sync ? LCC.sync.liveUrl : "https://lcc-omega.vercel.app/");

  const digits = (s) => String(s).replace(/\D/g, "");
  const formatPhone = (s) => { const d = digits(s).slice(0, 11); return d.length > 4 ? `${d.slice(0, 4)} ${d.slice(4)}` : d; };
  /** 0300 1234567 -> 923001234567, for wa.me links. */
  const waNumber = (s) => `92${digits(s).replace(/^0/, "")}`;
  const waLink = (text, phone) => `https://wa.me/${phone ? waNumber(phone) : ""}?text=${encodeURIComponent(text)}`;
  const shortName = (c) => c.name.replace(/ Coffee Co\.$| Roastery$/, "");
  const fullName = (m) => [m.firstName, m.lastName].filter(Boolean).join(" ");

  /* -------------------------------------------------------------------
     Member card (Club tab, café-free; onboarding issues it)
     ------------------------------------------------------------------- */
  // A seal with its words set on a circle. Thin lines, no fill.
  function seal() {
    return html`<svg class="mcard__seal" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <defs><path id="seal-ring" d="M32 32 m-23 0 a23 23 0 1 1 46 0 a23 23 0 1 1 -46 0"/></defs>
      <circle cx="32" cy="32" r="30.5"/>
      <circle cx="32" cy="32" r="16"/>
      <text><textPath href="#seal-ring" startOffset="0" textLength="140" lengthAdjust="spacing">FOUNDING MEMBER · LAHORE · </textPath></text>
      <path d="M25.5 29h12v3.6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5V29zM37.5 30.5h1.2a2.1 2.1 0 0 1 0 4.2h-1.4"/>
    </svg>`;
  }

  function memberCard(memberId, { issuing = false } = {}) {
    const c = S.club(memberId);
    const m = c.member;
    const label = `Lahore Coffee Club member card. ${c.number}, ${fullName(m)}, member since ${fmt.monthYear(c.since)}, ${c.level.name}${c.founding ? ", Founding Member" : ""}`;
    return html`<div class="mcard${c.founding ? " mcard--founding" : ""}${issuing ? " is-issuing" : ""}" role="img" aria-label="${label}">
      <svg class="mcard__rings" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <circle cx="200" cy="200" r="60"/><circle cx="200" cy="200" r="92"/><circle cx="200" cy="200" r="124"/><circle cx="200" cy="200" r="156"/>
      </svg>
      <div class="mcard__top">
        <span class="mcard__brand">Lahore Coffee Club</span>
        ${c.founding ? seal() : ""}
      </div>
      <p class="mcard__no"><span class="mcard__no-label">No.</span> <span class="num" data-card-no>${String(c.memberNo).padStart(4, "0")}</span></p>
      <div class="mcard__foot">
        <div class="mcard__who">
          <span class="mcard__name">${fullName(m)}</span>
          <span class="mcard__meta">Since ${fmt.monthYear(c.since)}</span>
        </div>
        <div class="mcard__status">
          ${c.founding && c.level.id !== "member" ? html`<span class="mcard__meta">Founding Member</span>` : ""}
          <span class="mcard__level${c.founding && c.level.id === "member" ? " mcard__level--long" : ""}">${c.founding && c.level.id === "member" ? "Founding Member" : c.level.name}</span>
        </div>
      </div>
    </div>`;
  }
  LCC.memberCard = memberCard;

  /* -------------------------------------------------------------------
     Badge marks: 24px grid, 1.5px stroke, like the icon set
     ------------------------------------------------------------------- */
  const MARKS = {
    "first-cup": '<path d="M6 10h11v4.5a4.5 4.5 0 0 1-4.5 4.5h-2A4.5 4.5 0 0 1 6 14.5V10zM17 11.5h1.2a2.3 2.3 0 0 1 0 4.6H17M9.5 4.5c0 1.2 1 1.6 1 3M13 4.5c0 1.2 1 1.6 1 3"/>',
    founding: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5" stroke-dasharray="1.6 1.9"/>',
    explorer: '<circle cx="12" cy="12" r="8"/><path d="M14.9 9.1l-1.7 4.1-4.1 1.7 1.7-4.1z"/>',
    "all-lahore": '<path d="M12 3.5v1.5M10.6 5h2.8l-.4 3.5h-2zM10 8.5h4l1 11H9zM6 19.5h12M11 13.5h2"/>',
    morning: '<path d="M4 17h16M7.5 17a4.5 4.5 0 0 1 9 0M12 8.5v2M6.6 11.6l1.3 1.1M17.4 11.6l-1.3 1.1M8.5 20h7"/>',
    gulberg: '<path d="M12 20s5.5-5 5.5-9.5a5.5 5.5 0 0 0-11 0C6.5 15 12 20 12 20z"/><path d="M12 8v5M10 10.5h4"/>',
  };
  const mark = (id) => raw(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${MARKS[id] || ""}</svg>`);

  const bar = (have, goal, label) => html`<div class="pbar" role="progressbar" aria-label="${label}" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${Math.min(have, goal)}"><span style="--p:${Math.min(1, have / goal).toFixed(3)}"></span></div>`;

  /* -------------------------------------------------------------------
     Club tab
     ------------------------------------------------------------------- */
  REG.club = (ctx) => {
    const { view } = ctx;

    function statusHtml(c) {
      const levels = c.levels;
      const at = levels.findIndex((l) => l.id === c.level.id);
      return html`
        <ol class="ladder" role="list" aria-label="Status levels">
          ${levels.map((l, i) => html`<li class="ladder__step${i <= at ? " is-reached" : ""}${i === at ? " is-current" : ""}" ${i === at ? raw('aria-current="step"') : ""}>
            <span class="ladder__dot" aria-hidden="true"></span>
            <span class="ladder__name">${l.name}</span>
            <span class="ladder__line">${l.line}</span>
          </li>`)}
        </ol>
        ${c.next
          ? html`<div class="club-next">
              <p class="t-small"><strong>${c.next.name}</strong> <span class="t-muted">${c.next.line}</span></p>
              ${c.next.needs.map((n) => html`<div class="club-next__row">
                ${bar(n.have, n.goal, `${n.label} towards ${c.next.name}`)}
                <span class="t-small t-muted num">${n.label}</span>
              </div>`)}
            </div>`
          : html`<p class="t-small t-muted">The top of the club. Every perk is yours.</p>`}`;
    }

    function passportHtml(c) {
      const p = c.passport;
      const tilt = [-5, 3, -2, 6, -4, 2, -6, 4];
      const rewardLine = p.nextReward
        ? `A free cup at ${p.nextReward === p.total ? `all ${p.total}` : p.nextReward} cafés. ${p.nextReward - p.count === 1 ? "One more to go." : `${p.nextReward - p.count} more to go.`}`
        : `Every partner café, visited. Both free cups are yours.`;
      return html`
        <div class="passport__head">
          <p class="t-h3 num"><span class="passport__count">${p.count}</span> of ${p.total} cafés</p>
          <p class="t-small t-muted">${rewardLine}</p>
        </div>
        <ul class="passport" role="list">
          ${p.stamps.map((s, i) => html`<li class="stamp${s.visited ? " is-stamped" : ""}" style="--tilt:${tilt[i % tilt.length]}deg">
            <span class="stamp__ring" aria-hidden="true"></span>
            <span class="stamp__name">${shortName(s.cafe)}</span>
            <span class="stamp__date num">${s.visited ? fmt.shortDate(s.firstAt) : "Not yet"}</span>
            <span class="sr-only">${s.visited ? `, first cup ${fmt.longDate(s.firstAt)}` : ", not visited yet"}</span>
          </li>`)}
        </ul>`;
    }

    function badgesHtml(c) {
      return html`<ul role="list" class="badge-list">
        ${c.badges.map((b) => html`<li class="row badge-row${b.earned ? " is-earned" : ""}">
          <span class="badge-mark">${mark(b.id)}</span>
          <span class="row__main">
            <span class="row__title">${b.name}</span>
            <span class="row__meta">${b.how}</span>
          </span>
          ${b.earned
            ? html`<span class="badge badge--accent">Earned</span>`
            : html`<span class="row__trail num" aria-label="${b.have} of ${b.goal}">${b.have} of ${b.goal}</span>`}
        </li>`)}
      </ul>`;
    }

    function perksHtml(c) {
      const order = ["founding", "local", "connoisseur"];
      const perks = c.perks.slice().sort((a, b) => (b.unlocked - a.unlocked) || (order.indexOf(a.for) - order.indexOf(b.for)));
      return html`<ul role="list">
        ${perks.map((p) => html`<li class="row perk-row${p.unlocked ? " is-yours" : ""}">
          <span class="row__main">
            <span class="row__title">${p.text}</span>
            <span class="row__meta">From ${p.cafe.name} · for ${p.audience}</span>
          </span>
          ${p.unlocked ? html`<span class="badge badge--accent">Yours</span>` : html`<span class="badge">${p.for === "founding" ? "Founding" : p.audience.slice(0, -1)}</span>`}
        </li>`)}
      </ul>
      <p class="t-micro t-faint">Paid for by each café, not by your plan. Show your pass and the barista will see what’s yours.</p>`;
    }

    function gatheringHtml() {
      const { next, past } = S.gatherings();
      const g = next && S.gathering(next.id);
      const when = (x) => `${fmt.date(x.at)} · ${fmt.time(x.at)}`;
      let action = "";
      if (g) {
        if (g.going) {
          action = html`<p class="gather__going">${icon("check", { size: 18 })}<span>You’re going. See you at ${g.cafe.name}.</span></p>
            <button type="button" class="btn btn--link" data-rsvp="no">Can’t make it? Give up your seat</button>`;
        } else if (g.left <= 0) {
          action = html`<p class="t-small t-muted">Every seat is taken. The next one is announced here first.</p>`;
        } else if (g.canRsvp) {
          action = html`<button type="button" class="btn btn--primary btn--block" data-rsvp="yes">${g.priority && !g.openToAll ? "Priority RSVP" : "RSVP"}</button>
            ${g.priority && !g.openToAll ? html`<p class="t-micro t-faint">Founding Members and Connoisseurs book first. Opens to every member on ${fmt.longDate(g.opensAt)}.</p>` : ""}`;
        } else {
          action = html`<button type="button" class="btn btn--secondary btn--block" disabled>RSVP opens ${fmt.longDate(g.opensAt)}</button>
            <p class="t-micro t-faint">Founding Members and Connoisseurs book first.</p>`;
        }
      }
      return html`
        ${g ? html`<article class="card gather" aria-labelledby="gather-title">
          <p class="eyebrow">Next gathering</p>
          <h3 class="t-h3" id="gather-title">${g.kind}: ${g.title.charAt(0).toLowerCase() + g.title.slice(1)}</h3>
          <p class="t-small t-muted gather__when">${icon("calendar", { size: 18 })}<span>${when(g)} · ${g.area.name}</span></p>
          <p class="t-small t-muted">${g.line}</p>
          <div class="gather__seats">
            ${bar(g.taken, g.seats, `${g.taken} of ${g.seats} seats taken`)}
            <p class="t-small num" aria-live="polite"><strong data-seats-left>${g.left}</strong> of ${g.seats} seats left</p>
          </div>
          <div class="gather__action">${action}</div>
        </article>` : html`<p class="t-small t-muted">The next gathering is announced here first.</p>`}
        ${past.slice(0, 1).map((p) => html`<div class="row gather-past">
          <span class="row__main">
            <span class="row__title">${p.kind}: ${p.title.charAt(0).toLowerCase() + p.title.slice(1)}</span>
            <span class="row__meta">${fmt.date(p.at)} · ${p.came} members came</span>
          </span>
          <span class="badge">Past</span>
        </div>`)}`;
    }

    function inviteHtml(c) {
      const url = `${LIVE_URL()}#/app/welcome?invite=${c.inviteCode}`;
      const msg = `I’m a member of Lahore Coffee Club: one monthly pass for independent cafés across Lahore. Join with my code ${c.inviteCode} and we both get a free cup.\n${url}`;
      return html`<div class="card invite">
        <div class="stack" style="--stack-gap:var(--space-1)">
          <h3 class="t-h3">Invite a friend</h3>
          <p class="t-small t-muted">When they join with your code, you both get a free cup.</p>
        </div>
        <div class="invite__code">
          <span class="t-micro t-faint">Your code</span>
          <span class="invite__value num" data-invite-code>${c.inviteCode}</span>
          <button type="button" class="icon-btn" data-copy="${c.inviteCode}" aria-label="Copy your invite code">${icon("copy", { size: 20 })}</button>
        </div>
        <a class="btn btn--secondary btn--block" href="${waLink(msg)}" target="_blank" rel="noopener">${icon("share")}Share on WhatsApp</a>
      </div>`;
    }

    function bodyHtml() {
      const c = S.club();
      return html`
        <div class="app-screen club">
          <div class="stack" style="--stack-gap:var(--space-1)">
            <p class="eyebrow">The club</p>
            <h1 class="t-h2">${c.founding ? "One of the first 500." : `Member ${c.number}.`}</h1>
          </div>
          <div data-club-card>${memberCard(c.member.id)}</div>

          <section class="app-section" aria-labelledby="status-h">
            <h2 class="eyebrow app-section__title" id="status-h">Your status</h2>
            <div data-club="status">${statusHtml(c)}</div>
          </section>

          <section class="app-section" aria-labelledby="passport-h">
            <h2 class="eyebrow app-section__title" id="passport-h">Lahore coffee passport</h2>
            <div data-club="passport">${passportHtml(c)}</div>
          </section>

          <section class="app-section" aria-labelledby="gather-h">
            <h2 class="eyebrow app-section__title" id="gather-h">Gatherings</h2>
            <div class="stack" style="--stack-gap:var(--space-3)" data-club="gathering">${gatheringHtml()}</div>
          </section>

          <section class="app-section" aria-labelledby="perks-h">
            <h2 class="eyebrow app-section__title" id="perks-h">Perks from cafés</h2>
            <div data-club="perks">${perksHtml(c)}</div>
          </section>

          <section class="app-section" aria-labelledby="badges-h">
            <h2 class="eyebrow app-section__title" id="badges-h">Badges</h2>
            <div data-club="badges">${badgesHtml(c)}</div>
          </section>

          <section class="app-section stack" style="--stack-gap:var(--space-3)" aria-label="Share the club">
            ${inviteHtml(c)}
            <a class="row gift-link" href="#/app/gift">
              <span class="badge-mark">${icon("gift", { size: 22 })}</span>
              <span class="row__main"><span class="row__title">Send a gift</span><span class="row__meta">Give a friend up to ${rules().giftMaxCups} cups from your month</span></span>
              <span class="row__trail" aria-hidden="true">${icon("chevronRight", { size: 20 })}</span>
            </a>
          </section>
        </div>`;
    }

    function repaint() {
      const c = S.club();
      const set = (key, markup) => { const n = $(`[data-club="${key}"]`, view); if (n) n.innerHTML = markup.s; };
      set("status", statusHtml(c));
      set("passport", passportHtml(c));
      set("badges", badgesHtml(c));
      set("perks", perksHtml(c));
      const card = $("[data-club-card]", view);
      if (card) card.innerHTML = memberCard(c.member.id).s;
    }
    const repaintGathering = () => { const n = $('[data-club="gathering"]', view); if (n) n.innerHTML = gatheringHtml().s; };

    function onClick(e) {
      const r = e.target.closest("[data-rsvp]");
      if (r) {
        const g = S.gatherings().next;
        const going = r.dataset.rsvp === "yes";
        const res = A.rsvp(g.id, going);
        if (!res.ok) { ctx.toast(res.message || "That didn’t work. Try again.", { iconName: "info" }); return; }
        ctx.toast(going ? `You’re going. ${fmt.longDate(g.at)}, ${fmt.time(g.at)}.` : "Seat given up. Thanks for letting us know.", { iconName: going ? "calendar" : "check" });
        requestAnimationFrame(() => $("[data-rsvp], .gather__going", view)?.focus?.());
        return;
      }
      const copy = e.target.closest("[data-copy]");
      if (copy) {
        const done = () => ctx.toast(`Copied ${copy.dataset.copy}.`, { iconName: "copy" });
        try { navigator.clipboard.writeText(copy.dataset.copy).then(done, () => ctx.toast(`Your code is ${copy.dataset.copy}.`, { iconName: "copy" })); }
        catch (_) { ctx.toast(`Your code is ${copy.dataset.copy}.`, { iconName: "copy" }); }
      }
    }

    return {
      html: bodyHtml().s,
      mount() {
        view.addEventListener("click", onClick);
        return () => view.removeEventListener("click", onClick);
      },
      on: {
        ledger: ({ entries }) => { if (entries.some((e) => e.memberId === S.member().id)) repaint(); },
        member: repaint,
        rsvp: repaintGathering,
        tick: repaintGathering, // priority window can open while the tab is showing
      },
    };
  };

  /* -------------------------------------------------------------------
     Gifting (#/app/gift)
     ------------------------------------------------------------------- */
  const gift = { cups: 1, cafeId: null, name: "", phone: "", message: "", phase: "form", result: null, forMember: null };

  const GIFT_CHECKS = {
    name: (v) => (String(v).trim() ? "" : "Add your friend’s name."),
    phone: (v) => (/^03\d{9}$/.test(digits(v)) ? "" : "Enter an 11-digit WhatsApp number starting with 03, like 0300 1234567."),
  };

  /** Where gift cups can come from: the Explorer pool, or one café's reserved cups. */
  function sources() {
    const m = S.member();
    if (!m.plan) return [];
    if (m.plan.type === "explorer") return [{ id: null, label: "Your Explorer pool", left: S.poolBalance(), line: "They can use it at any partner café." }];
    const b = S.balance();
    return Object.entries(b.perCafe).filter(([, x]) => x.reserved).map(([id, x]) => ({ id, label: S.cafe(id).name, left: x.left, line: `Reserved cups stay at ${S.cafe(id).name}. They can only use them there.` }));
  }

  function giftMessage(g, from) {
    const where = g.cafeId ? `at ${S.cafe(g.cafeId).name}` : "at any partner café";
    return [
      `${from.firstName} sent you ${fmt.cups(g.cups)} of coffee from Lahore Coffee Club, to use ${where}.`,
      g.message ? `“${g.message}”` : null,
      `Gift code: ${g.code}`,
      `It keeps for ${rules().giftExpiryDays} days, until ${fmt.longDate(g.expiresAt)}.`,
      LIVE_URL(),
    ].filter(Boolean).join("\n");
  }

  REG.gift = (ctx) => {
    const { view } = ctx;
    const m = ctx.member();
    if (gift.forMember !== m.id) Object.assign(gift, { cups: 1, cafeId: null, name: "", phone: "", message: "", phase: "form", result: null, forMember: m.id });
    if (gift.phase === "sent" && !gift.result) gift.phase = "form";

    const source = () => {
      const list = sources();
      return list.find((x) => x.id === gift.cafeId) || list.find((x) => x.left > 0) || list[0] || null;
    };
    const maxCups = () => Math.max(0, Math.min(rules().giftMaxCups, source()?.left || 0));

    function sourceHtml() {
      const list = sources();
      const cur = source();
      if (list.length === 1) {
        return html`<p class="t-small t-muted num gift-source">From ${list[0].label.charAt(0).toLowerCase() + list[0].label.slice(1)}, ${fmt.cups(list[0].left)} left. ${list[0].line}</p>`;
      }
      return html`<fieldset class="method-list">
        <legend class="field__label">Cups from</legend>
        ${list.map((x) => html`<label class="method${x.left ? "" : " is-empty"}">
          <input class="sr-only" type="radio" name="gift-source" value="${x.id}" ${cur && cur.id === x.id ? raw("checked") : ""} ${x.left ? "" : raw("disabled")}>
          <span class="method__text"><span class="row__title">${x.label}</span><span class="row__meta num">${x.left ? `${fmt.cups(x.left)} left to give` : "None left this month"}</span></span>
          <span class="method__tick" aria-hidden="true">${icon("check", { size: 18 })}</span>
        </label>`)}
        <p class="t-micro t-faint">${cur ? cur.line : ""}</p>
      </fieldset>`;
    }

    function previewHtml() {
      const cur = source();
      const where = cur && cur.id ? S.cafe(cur.id).name : "Any partner café";
      const expires = Date.now() + rules().giftExpiryDays * 24 * 60 * 60 * 1000;
      return html`<div class="gift-card" aria-label="Gift preview">
        <div class="gift-card__top"><span class="mcard__brand">Lahore Coffee Club</span><span class="t-micro">A gift</span></div>
        <p class="gift-card__cups"><span class="num" data-preview-cups>${gift.cups}</span> <span data-preview-word>${gift.cups === 1 ? "cup" : "cups"}</span> of coffee</p>
        <p class="gift-card__to">For <span data-preview-name>${gift.name.trim() || "your friend"}</span>, from ${m.firstName}</p>
        <p class="gift-card__msg" data-preview-msg ${gift.message.trim() ? "" : raw("hidden")}>“${gift.message.trim()}”</p>
        <div class="gift-card__foot"><span>${where}</span><span class="num">Keeps until ${fmt.longDate(expires)}</span></div>
      </div>`;
    }

    function formHtml() {
      const cur = source();
      const max = maxCups();
      if (!cur || max <= 0) {
        return html`<div class="pay-state">
          <span class="pay-state__mark" aria-hidden="true">${icon("gift", { size: 28 })}</span>
          <h2 class="t-h3">No cups to give right now.</h2>
          <p class="t-small t-muted">${m.plan ? `Gifts come out of this month’s cups. Yours renew on ${fmt.longDate(m.renewsAt)}.` : "Choose a plan first, then you can share it."}</p>
          <a class="btn btn--secondary btn--block" href="#/app">Back to home</a>
        </div>`;
      }
      gift.cups = Math.min(Math.max(1, gift.cups), max);
      const msgMax = rules().giftMessageMax;
      return html`<form class="pay-form" data-gift-form novalidate>
        ${sourceHtml()}
        <div class="field">
          <span class="field__label" id="gift-cups-label">How many cups</span>
          <div class="gift-cups">
            ${ui.stepper({ id: "gift", value: gift.cups, min: 1, max, label: "Cups to gift" })}
            <span class="t-small t-muted num">Up to ${max}</span>
          </div>
        </div>
        <div class="field" data-field="name">
          <label class="field__label" for="gift-name">Friend’s name</label>
          <input class="input" id="gift-name" name="name" value="${gift.name}" autocomplete="off" aria-describedby="gift-name-err">
          <p class="field__error" id="gift-name-err"></p>
        </div>
        <div class="field" data-field="phone">
          <label class="field__label" for="gift-phone">Their WhatsApp number</label>
          <input class="input num" id="gift-phone" name="phone" value="${gift.phone}" inputmode="tel" autocomplete="off" placeholder="03XX XXXXXXX" aria-describedby="gift-phone-err">
          <p class="field__error" id="gift-phone-err"></p>
        </div>
        <div class="field">
          <label class="field__label" for="gift-msg">A short message <span class="t-faint" style="font-weight:400">(optional)</span></label>
          <textarea class="input gift-msg" id="gift-msg" name="message" maxlength="${msgMax}" rows="3" aria-describedby="gift-msg-count" placeholder="Your first flat white is on me.">${gift.message}</textarea>
          <p class="field__hint num" id="gift-msg-count" data-msg-count>${gift.message.length} of ${msgMax}</p>
        </div>
        <div data-gift-preview>${previewHtml()}</div>
        <p class="t-small t-muted">Gifts expire in ${rules().giftExpiryDays} days. The cups come off your month as soon as you send.</p>
        <button type="submit" class="btn btn--primary btn--block">Send on WhatsApp</button>
      </form>`;
    }

    function sentHtml() {
      const g = gift.result;
      return html`<div class="pay-state" role="status">
        <svg class="check-draw" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/><path d="M15 24.5l6 6 12-13" pathLength="1"/></svg>
        <h2 class="t-h2">${fmt.cups(g.cups)} for ${g.toName}.</h2>
        <p class="t-body t-muted">WhatsApp should have opened with the gift and its code. Press send there.</p>
        <p class="gift-code num" aria-label="Gift code ${g.code.split("").join(" ")}">${g.code}</p>
        <p class="t-small t-faint num">Keeps until ${fmt.longDate(g.expiresAt)}. ${S.balance().left} of ${S.balance().total} cups left for you this month.</p>
        <div class="pay-state__actions">
          <a class="btn btn--secondary btn--block" href="${waLink(giftMessage(g, m), g.toPhone)}" target="_blank" rel="noopener">Open WhatsApp again</a>
          <button type="button" class="btn btn--primary btn--block" data-gift-done>Back to home</button>
        </div>
      </div>`;
    }

    function paint() {
      $("[data-gift-body]", view).innerHTML = (gift.phase === "sent" ? sentHtml() : formHtml()).s;
    }
    function paintPreview() {
      const p = $("[data-gift-preview]", view);
      if (p) p.innerHTML = previewHtml().s;
    }

    function showError(id, msg) {
      const f = $(`[data-field="${id}"]`, view);
      if (!f) return;
      f.dataset.invalid = String(!!msg);
      $(".field__error", f).textContent = msg;
      $("input", f).setAttribute("aria-invalid", String(!!msg));
    }

    function onInput(e) {
      const t = e.target;
      if (t.name === "phone") { const v = formatPhone(t.value); if (v !== t.value) t.value = v; gift.phone = v; }
      else if (t.name === "name") gift.name = t.value;
      else if (t.name === "message") { gift.message = t.value; $("[data-msg-count]", view).textContent = `${t.value.length} of ${rules().giftMessageMax}`; }
      else return;
      if (GIFT_CHECKS[t.name] && t.closest(".field").dataset.invalid === "true") showError(t.name, GIFT_CHECKS[t.name](t.value));
      paintPreview();
    }
    function onFocusOut(e) {
      const t = e.target;
      if (GIFT_CHECKS[t.name] && t.value) showError(t.name, GIFT_CHECKS[t.name](t.value));
    }
    function onChange(e) {
      if (e.target.name !== "gift-source") return;
      gift.cafeId = e.target.value || null;
      paint();
    }
    function onClick(e) {
      const step = e.target.closest("[data-stepper=gift] [data-step]");
      if (step) {
        gift.cups = Math.max(1, Math.min(maxCups(), gift.cups + Number(step.dataset.step)));
        ui.setStepper(step.closest("[data-stepper]"), gift.cups);
        paintPreview();
        return;
      }
      if (e.target.closest("[data-gift-done]")) {
        Object.assign(gift, { phase: "form", result: null, name: "", phone: "", message: "", cups: 1 });
        ctx.go("#/app", { replace: true });
      }
    }
    function onSubmit(e) {
      if (!e.target.matches("[data-gift-form]")) return;
      e.preventDefault();
      const bad = Object.keys(GIFT_CHECKS).filter((id) => GIFT_CHECKS[id](gift[id]));
      Object.keys(GIFT_CHECKS).forEach((id) => showError(id, GIFT_CHECKS[id](gift[id])));
      if (bad.length) { $(`#gift-${bad[0]}`, view).focus(); return; }
      const cur = source();
      const res = A.sendGift({ toName: gift.name, toPhone: formatPhone(gift.phone), cups: gift.cups, cafeId: cur.id, message: gift.message });
      if (!res.ok) { ctx.toast(res.message, { iconName: "info" }); paint(); return; }
      window.open(waLink(giftMessage(res.gift, m), res.gift.toPhone), "_blank", "noopener");
      gift.phase = "sent";
      gift.result = res.gift;
      paint();
      $("[data-gift-body] [role=status]", view)?.setAttribute("tabindex", "-1");
      $("[data-gift-body] [role=status]", view)?.focus({ preventScroll: true });
    }

    return {
      html: html`
        <div class="flow">
          <div class="screen-bar">
            <button type="button" class="icon-btn" data-back="#/app" aria-label="Back">${icon("arrowLeft")}</button>
          </div>
          <div class="app-screen flow__body">
            <div class="stack" style="--stack-gap:var(--space-2)">
              <h1 class="t-h2">Send a gift</h1>
              <p class="t-small t-muted">Give a friend a few cups from your month. They get it on WhatsApp.</p>
            </div>
            <div data-gift-body></div>
          </div>
        </div>`.s,
      mount() {
        paint();
        view.addEventListener("input", onInput);
        view.addEventListener("focusout", onFocusOut);
        view.addEventListener("change", onChange);
        view.addEventListener("click", onClick);
        view.addEventListener("submit", onSubmit);
        return () => {
          view.removeEventListener("input", onInput);
          view.removeEventListener("focusout", onFocusOut);
          view.removeEventListener("change", onChange);
          view.removeEventListener("click", onClick);
          view.removeEventListener("submit", onSubmit);
        };
      },
      on: {
        // A redemption elsewhere can change how many cups are left to give
        ledger: ({ entries }) => {
          if (gift.phase !== "form" || !entries.some((e) => e.memberId === m.id)) return;
          const max = maxCups();
          const st = $("[data-stepper=gift]", view);
          if (!st || max <= 0) { paint(); return; }
          st.dataset.max = max;
          gift.cups = Math.min(gift.cups, max);
          ui.setStepper(st, gift.cups);
        },
      },
    };
  };

  LCC.appClub = { waLink, formatPhone };
})();

</script>
<script>
/* ---- src/app-welcome.js ---- */
/* =====================================================================
   Lahore Coffee Club — app-welcome.js
   First-run flow (#/app/welcome), then the plan picker and payment
   from app-plan.js, ending on the member card being issued
   (#/app/welcome/card).

     intro -> phone -> code (any 4 digits) -> name -> area
           -> #/app/plan -> #/app/plan/pay -> #/app/welcome/card

   The new member is created when the area step is done (they get the
   next member number then). Mumtaz stays exactly as she was; the
   presenter switcher's "Back to Mumtaz’s demo" returns to her.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, raw, $, icon } = ui;
  const S = store.select;
  const A = store.actions;
  const REG = (LCC.appScreens = LCC.appScreens || {});

  const STEPS = ["intro", "phone", "code", "name", "area"];
  const fresh = () => ({ step: "intro", phone: "", code: "", name: "", area: "", invite: "", memberId: null, issued: false, inviteClaimed: false });
  let ob = fresh();

  const digits = (s) => String(s).replace(/\D/g, "");
  const formatPhone = (s) => { const d = digits(s).slice(0, 11); return d.length > 4 ? `${d.slice(0, 4)} ${d.slice(4)}` : d; };
  const inviteFromUrl = () => { const q = location.hash.split("?")[1]; return q ? (new URLSearchParams(q).get("invite") || "").toUpperCase() : ""; };

  /** True while a new member is between "Get started" and their card. */
  const active = () => !!ob.memberId && !ob.issued && S.member().id === ob.memberId;
  LCC.onboarding = {
    active,
    /** Presenter: start over as a brand-new member. */
    restart() { ob = fresh(); ob.invite = inviteFromUrl(); },
    /** Presenter: forget the flow (Back to Mumtaz’s demo). */
    reset() { ob = fresh(); },
  };

  const CHECKS = {
    phone: (v) => (/^03\d{9}$/.test(digits(v)) ? "" : "Enter an 11-digit mobile number starting with 03, like 0300 1234567."),
    code: (v) => (/^\d{4}$/.test(digits(v)) ? "" : "Enter the four digits from the text message."),
    name: (v) => (String(v).trim().length >= 2 ? "" : "Add the name you’d like on your card."),
    area: (v) => (v ? "" : "Choose the area you’re in most."),
    invite: (v) => (!String(v).trim() || S.inviter(v) ? "" : "That code doesn’t match a member. Check it, or leave it empty."),
  };

  /* -------------------------------------------------------------------
     Steps
     ------------------------------------------------------------------- */
  REG.welcome = (ctx) => {
    const { view } = ctx;
    // Arriving fresh (an invite link, or the switcher) after a finished flow: start over
    if (ob.issued) ob = fresh();
    if (!ob.invite) ob.invite = inviteFromUrl();
    // Came back from the plan picker: stay on the last step
    if (ob.memberId && ob.step === "intro") ob.step = "area";

    const stepNo = () => STEPS.indexOf(ob.step); // 1..4 after intro; plan is 5, payment 6

    function field({ id, label, value, type = "text", inputmode, autocomplete, placeholder, hint, cls = "" }) {
      return html`<div class="field" data-field="${id}">
        <label class="field__label" for="ob-${id}">${label}</label>
        <input class="input ${cls}" id="ob-${id}" name="${id}" type="${type}" value="${value}" ${inputmode ? raw(`inputmode="${inputmode}"`) : ""} autocomplete="${autocomplete || "off"}" ${placeholder ? raw(`placeholder="${ui.esc(placeholder)}"`) : ""} aria-describedby="ob-${id}-err${hint ? ` ob-${id}-hint` : ""}">
        ${hint ? html`<p class="field__hint" id="ob-${id}-hint">${hint}</p>` : ""}
        <p class="field__error" id="ob-${id}-err"></p>
      </div>`;
    }

    function stepHtml() {
      const inviter = ob.invite && S.inviter(ob.invite);
      if (ob.step === "intro") {
        return html`<div class="welcome-intro enter">
          <p class="eyebrow">Lahore Coffee Club</p>
          <h1 class="t-display welcome-intro__title">A membership for the city’s best cafés.</h1>
          <p class="t-body t-muted">One monthly pass, eight independent cafés, and a club that meets once a month.</p>
          ${inviter ? html`<p class="welcome-invite">${icon("gift", { size: 18 })}<span>${inviter.firstName} invited you. You’ll both get a free cup when you join.</span></p>` : ""}
          <button type="button" class="btn btn--primary btn--block" data-ob-next>Get started</button>
        </div>`;
      }
      if (ob.step === "phone") {
        return html`<form class="ob-form enter" data-ob-form novalidate>
          <h1 class="t-h2">Your mobile number</h1>
          <p class="t-small t-muted">We’ll text you a code to check it’s you. Your pass lives on this number.</p>
          ${field({ id: "phone", label: "Mobile number", value: ob.phone, type: "tel", inputmode: "tel", autocomplete: "tel-national", placeholder: "03XX XXXXXXX", cls: "num" })}
          <button type="submit" class="btn btn--primary btn--block">Send code</button>
        </form>`;
      }
      if (ob.step === "code") {
        return html`<form class="ob-form enter" data-ob-form novalidate>
          <h1 class="t-h2">Enter the code</h1>
          <p class="t-small t-muted num">Sent by text to ${ob.phone}. <button type="button" class="btn btn--link" data-ob-goto="phone">Change number</button></p>
          ${field({ id: "code", label: "Four-digit code", value: ob.code, inputmode: "numeric", autocomplete: "one-time-code", placeholder: "0000", cls: "code-input ob-code" })}
          <div class="proto-note">${icon("info", { size: 18 })}<p><strong>Prototype: any code works.</strong> No text is sent.</p></div>
          <button type="submit" class="btn btn--primary btn--block">Continue</button>
        </form>`;
      }
      if (ob.step === "name") {
        return html`<form class="ob-form enter" data-ob-form novalidate>
          <h1 class="t-h2">What should we call you?</h1>
          <p class="t-small t-muted">This goes on your member card, and baristas see your first name.</p>
          ${field({ id: "name", label: "Your name", value: ob.name, autocomplete: "name", placeholder: "Ayesha Khan" })}
          ${field({ id: "invite", label: "Invite code (optional)", value: ob.invite, autocomplete: "off", hint: "From a member who invited you. You both get a free cup.", cls: "num" })}
          <button type="submit" class="btn btn--primary btn--block">Continue</button>
        </form>`;
      }
      // area
      const areas = [...store.getState().areas.map((a) => ({ id: a.id, name: a.name })), { id: "elsewhere", name: "Somewhere else" }];
      return html`<form class="ob-form enter" data-ob-form novalidate>
        <h1 class="t-h2">Where do you drink coffee most?</h1>
        <p class="t-small t-muted">We’ll show the cafés near you first.</p>
        <fieldset class="area-pick" data-field="area">
          <legend class="sr-only">Favourite area</legend>
          ${areas.map((a) => html`<label class="chip area-chip">
            <input class="sr-only" type="radio" name="area" value="${a.id}" ${ob.area === a.id ? raw("checked") : ""}>
            <span>${a.name}</span>
          </label>`)}
          <p class="field__error" id="ob-area-err" role="alert"></p>
        </fieldset>
        <button type="submit" class="btn btn--primary btn--block">Choose a plan</button>
      </form>`;
    }

    function paint({ focus = true } = {}) {
      const n = stepNo();
      $("[data-ob-body]", view).innerHTML = stepHtml().s;
      $("[data-ob-progress]", view).innerHTML = n > 0 ? html`<span class="t-small t-faint">Step ${n} of 6</span>`.s : "";
      view.scrollTop = 0;
      if (focus) requestAnimationFrame(() => ($("[data-ob-body] input:not([type=radio])", view) || $("[data-ob-body] h1", view))?.focus?.({ preventScroll: true }));
    }

    function showError(id, msg) {
      const f = $(`[data-field="${id}"]`, view);
      if (!f) return;
      f.dataset.invalid = String(!!msg);
      const err = $(".field__error", f);
      if (err) err.textContent = msg;
      $("input", f)?.setAttribute("aria-invalid", String(!!msg));
    }

    const go = (step) => { ob.step = step; paint(); };

    function next() {
      if (ob.step === "intro") return go("phone");
      if (ob.step === "phone") {
        const msg = CHECKS.phone(ob.phone);
        showError("phone", msg);
        if (msg) return $("#ob-phone", view).focus();
        // BACKEND: POST /auth/otp { phone } (sends the text)
        return go("code");
      }
      if (ob.step === "code") {
        const msg = CHECKS.code(ob.code);
        showError("code", msg);
        if (msg) return $("#ob-code", view).focus();
        // BACKEND: POST /auth/verify { phone, code } -> session. Prototype: any 4 digits pass
        return go("name");
      }
      if (ob.step === "name") {
        const bad = ["name", "invite"].find((id) => CHECKS[id](ob[id]));
        ["name", "invite"].forEach((id) => showError(id, CHECKS[id](ob[id])));
        if (bad) return $(`#ob-${bad}`, view).focus();
        return go("area");
      }
      if (ob.step === "area") {
        const msg = CHECKS.area(ob.area);
        showError("area", msg);
        if (msg) return;
        const [firstName, ...rest] = ob.name.trim().split(/\s+/);
        const profile = { firstName, lastName: rest.join(" "), phone: `+92 ${digits(ob.phone).slice(1, 4)} ${digits(ob.phone).slice(4)}`, area: ob.area };
        // Went back a step after creating the member: update them, don't make another
        if (ob.memberId && S.member().id === ob.memberId) A.updateNewMember(ob.memberId, profile);
        else ob.memberId = A.beginNewMember(profile).id;
        LCC.appPlan.start({ mode: "explorer" });
        ctx.go("#/app/plan");
      }
    }

    function onInput(e) {
      const t = e.target;
      if (t.name === "phone") { const v = formatPhone(t.value); if (v !== t.value) t.value = v; ob.phone = v; }
      else if (t.name === "code") {
        const v = digits(t.value).slice(0, 4);
        if (v !== t.value) t.value = v;
        ob.code = v;
        if (v.length === 4) { showError("code", ""); next(); return; }
      } else if (t.name === "name") ob.name = t.value;
      else if (t.name === "invite") ob.invite = t.value.toUpperCase().replace(/\s+/g, "");
      else if (t.name === "area") { ob.area = t.value; showError("area", ""); return; }
      else return;
      if (CHECKS[t.name] && t.closest(".field")?.dataset.invalid === "true") showError(t.name, CHECKS[t.name](ob[t.name]));
    }
    function onFocusOut(e) {
      const t = e.target;
      if (t.name && t.name !== "area" && t.value && CHECKS[t.name]) showError(t.name, CHECKS[t.name](ob[t.name]));
    }
    function onSubmit(e) {
      if (!e.target.matches("[data-ob-form]")) return;
      e.preventDefault();
      next();
    }
    function onClick(e) {
      if (e.target.closest("[data-ob-next]")) return next();
      const to = e.target.closest("[data-ob-goto]");
      if (to) return go(to.dataset.obGoto);
      if (e.target.closest("[data-ob-back]")) {
        const i = STEPS.indexOf(ob.step);
        if (i > 0) go(STEPS[i - 1]);
        else ctx.back("#/app");
      }
    }

    return {
      html: html`
        <div class="flow welcome">
          <div class="screen-bar">
            <button type="button" class="icon-btn" data-ob-back aria-label="Back">${icon("arrowLeft")}</button>
            <span data-ob-progress></span>
          </div>
          <div class="app-screen flow__body" data-ob-body></div>
        </div>`.s,
      mount() {
        paint({ focus: false });
        view.addEventListener("input", onInput);
        view.addEventListener("change", onInput);
        view.addEventListener("focusout", onFocusOut);
        view.addEventListener("submit", onSubmit);
        view.addEventListener("click", onClick);
        return () => {
          view.removeEventListener("input", onInput);
          view.removeEventListener("change", onInput);
          view.removeEventListener("focusout", onFocusOut);
          view.removeEventListener("submit", onSubmit);
          view.removeEventListener("click", onClick);
        };
      },
    };
  };

  /* -------------------------------------------------------------------
     The card is issued (#/app/welcome/card)
     ------------------------------------------------------------------- */
  REG.issued = (ctx) => {
    const m = ctx.member();
    if (!m.live || !m.plan) return { redirect: "#/app" };
    // Done: the tab bar comes back from here on
    const first = !ob.issued;
    ob.issued = true;
    if (first && ob.invite && !ob.inviteClaimed) { A.claimInvite(ob.invite); ob.inviteClaimed = true; }
    const c = S.club(m.id);
    const p = S.memberPlan(m);
    const inviter = ob.invite && S.inviter(ob.invite);
    return {
      html: html`
        <div class="app-screen issued">
          <p class="eyebrow issued__eyebrow">Welcome to the club</p>
          <div class="issued__card">${LCC.memberCard(m.id, { issuing: true })}</div>
          <div class="issued__text">
            <h1 class="t-h2">You’re member <span class="num">${c.number}</span>.</h1>
            <p class="t-body t-muted">${c.founding
              ? `That makes you one of our Founding Members, the first ${store.getState().club.foundingLimit}. It stays on your card for good.`
              : "Your number is yours for as long as you’re a member."}</p>
            <p class="t-small t-muted num">${p.type === "explorer" ? `Explorer ${p.name}` : "My cafés"} · ${fmt.cups(S.balance(m.id).total)} this month${inviter ? `, including a free one from ${inviter.firstName}’s invite` : ""}.</p>
          </div>
          <div class="issued__actions">
            <button type="button" class="btn btn--primary btn--block" data-issued-go="#/app/pass">Show my pass</button>
            <button type="button" class="btn btn--secondary btn--block" data-issued-go="#/app/club">See the club</button>
          </div>
        </div>`.s,
      mount() {
        const onClick = (e) => { const b = e.target.closest("[data-issued-go]"); if (b) ctx.go(b.dataset.issuedGo, { replace: true }); };
        ctx.view.addEventListener("click", onClick);
        return () => ctx.view.removeEventListener("click", onClick);
      },
    };
  };
})();

</script>
<script>
/* ---- src/landing.js ---- */
/* =====================================================================
   Lahore Coffee Club — landing.js
   Landing page (#/). Replaces the Pass 1 shell in router.js.

   Live pieces read the shared store: the Build-your-own teaser prices
   with select.customPrice() (the same function the app uses), and the
   busy map shows current café statuses, updating as cafés change them.

(function () {
  "use strict";

  /* -------------------------------------------------------------------
     Forms: fields, checks and the WhatsApp message

    area: (v) => (v ? "" : "Choose an area."),

  const FORMS = {
    partner: {
      fields: [
        { id: "cafe", label: "Café name", autocomplete: "organization", check: CHECKS.required("your café’s name") },
        { id: "owner", label: "Owner’s name", autocomplete: "name", check: CHECKS.required("the owner’s name") },
        { id: "area", label: "Area", type: "area", check: CHECKS.area },
        { id: "phone", label: "WhatsApp number", type: "phone", check: CHECKS.phone },

      save: (v) => {
        // BACKEND: POST /partners { cafe, owner, area, phone }
        store.actions.requestPartnerCall(v);

    waitlist: {
      fields: [
        { id: "name", label: "Your name", autocomplete: "name", check: CHECKS.required("your name") },
        { id: "phone", label: "WhatsApp number", type: "phone", check: CHECKS.phone },
        { id: "area", label: "Area", type: "area", check: CHECKS.area },
        { id: "fav", label: "Favourite café", hint: "Optional. Any café in Lahore, member or not.", autocomplete: "off" },
      ],
      message: (v) => `Waitlist: ${v.name.trim()}, ${v.area}, ${formatPhone(v.phone)}${v.fav.trim() ? `, favourite café: ${v.fav.trim()}` : ""}`,
      save: (v) => {

  function fieldHtml(form, f) {
    const id = `${form}-${f.id}`;
    const describedBy = [f.hint && `${id}-hint`, `${id}-err`].filter(Boolean).join(" ");
    let control;
    if (f.type === "area") {
      control = html`<span class="select"><select class="input" id="${id}" name="${f.id}" aria-describedby="${describedBy}">

        ${store.getState().areas.map((a) => html`<option>${a.name}</option>`)}
        <option>Somewhere else</option>
      </select></span>`;
    } else if (f.type === "phone") {
      control = html`<input class="input num" id="${id}" name="${f.id}" inputmode="tel" autocomplete="tel-national" placeholder="03XX XXXXXXX" aria-describedby="${describedBy}">`;
    } else {
      control = html`<input class="input" id="${id}" name="${f.id}" autocomplete="${f.autocomplete || "on"}" aria-describedby="${describedBy}">`;
    }
    return html`<div class="field" data-field="${f.id}">
      <label class="field__label" for="${id}">${f.label}</label>

  }

  function busyMapHtml() {

      <ul role="list" class="lp-map__list" aria-label="How busy each café is now">
        ${S.cafes().map((c) => html`<li class="row"><div class="row__main"><div class="row__title">${c.name}</div><div class="row__meta">${S.area(c.area).name}</div></div>${ui.statusPill(c.id, { time: false })}</li>`)}

  function sliderHtml(id, label, fmtValue) {
    const o = ESTIMATOR[id];
    return html`<div class="lp-slider">
      <div class="lp-slider__top">
        <label class="field__label" for="est-${id}">${label}</label>

  const EST_FMT = {
    members: (n) => `${n} members`,
    visits: (n) => `${n} ${n === 1 ? "visit" : "visits"} each`,
    rate: (n) => `${fmt.rs(n)} a cup`,
  };

  const FAQ = [
    ["How does redeeming a cup work?", "Open the Pass tab and show the QR code at the counter, or read out the six-digit code. The barista enters it on their screen and the cup comes off your month. The code changes every 30 seconds, so a screenshot won’t work."],
    ["What happens to cups I don’t use?", "They don’t roll over. Each month starts fresh on your renewal date, so pick a plan that matches how much coffee you actually drink. You can change plans whenever you like."],
    ["Can I cancel?", "Yes, from the app, at any time. You won’t be charged again, and you keep your cups until the end of the month you’ve paid for."],
    ["Which cafés are part of it?", "This prototype shows eight independent cafés across Gulberg, Liberty, Fortress, DHA, Model Town and Johar Town. They’re examples while we sign up our first partners."],
    ["How are cafés paid?", "Once a month, for every cup redeemed at their counter, at the rate per cup they set when they join. Members pay us, and we pay the café."],
    ["How do I pay?", "JazzCash, Easypaisa, or a debit or credit card. You pay once a month, on the day you joined."],
    ["Is it live yet?", "Not yet. This is a working prototype: the prices and cafés are for demonstration, and no payment is taken. Join the waitlist and we’ll message you on WhatsApp when the club opens."],
  ];

  /* -------------------------------------------------------------------
     Surface
     ------------------------------------------------------------------- */
  LCC.router.register("", {
    title: null,
    mount(el) {
      const est = { members: ESTIMATOR.members.value, visits: ESTIMATOR.visits.value, rate: ESTIMATOR.rate.value };
      const scrollLink = (id, label, cls) => html`<a class="${cls}" href="#/" data-scroll="${id}">${label}</a>`;

      el.innerHTML = html`
        <div class="surface landing lp">
          <header class="container landing-nav">
            <a class="wordmark" href="#/">Lahore Coffee Club</a>
            <nav class="landing-nav__links" aria-label="Main">
              ${scrollLink("how", "How it works", "landing-nav__link")}
              ${scrollLink("plans", "Plans", "landing-nav__link")}
              ${scrollLink("partner", "For cafés", "landing-nav__link")}
              ${scrollLink("join", "Join the waitlist", "btn btn--primary btn--compact")}
            </nav>
          </header>

          <div class="container">
            <section class="lp-hero" aria-labelledby="hero-h">
              <h1 class="t-display lp-hero__title" id="hero-h">Every café you love. One monthly pass.</h1>

                ${scrollLink("partner", "I run a café", "btn btn--secondary")}
