    { id: "m_bilal", firstName: "Bilal", cupsTotal: 16, cupsLeft: 7,  staticCode: "615028", visits: { kiln: 6 } },
    { id: "m_sana",  firstName: "Sana",  cupsTotal: 30, cupsLeft: 19, staticCode: "207341", visits: { kiln: 2 } },
    { id: "m_omar",  firstName: "Omar",  cupsTotal: 8,  cupsLeft: 2,  staticCode: "558190", visits: { kiln: 1 } },
    { id: "m_zara",  firstName: "Zara",  cupsTotal: 16, cupsLeft: 9,  staticCode: "482913", visits: { kiln: 4 } },
    { id: "m_hamza", firstName: "Hamza", cupsTotal: 8,  cupsLeft: 0,  staticCode: "730215", visits: { kiln: 2 } },
  ];

  /* Regulars: background members who fill out each café’s day. They have
     no codes, so they can’t be redeemed in the demo; they only appear in
     the café view’s lists and totals.                                  */
  const regulars = ["Fatima", "Usman", "Hira", "Ali", "Mahnoor", "Saad", "Iqra", "Danish", "Noor", "Ahmed", "Rida", "Faraz", "Amna", "Hassan"]
    .map((n) => ({ id: `m_${n.toLowerCase()}`, firstName: n, cupsTotal: 16, cupsLeft: 8, background: true, visits: {} }));

  const members = [ayesha, ...demoMembers, ...regulars];

  /* Redemption log ------------------------------------------------------
     History: Mumtaz’s earlier cups this cycle. With her one cup at Kiln &
     Bean today that makes 5 used (16 − 11).
     Today: generated below, about avgDailyCups per café.               */
  const history = [
    { id: "r1", at: daysAgo(14, 30), cafeId: "kiln",     memberId: "m_ayesha", drinkId: "kiln-flat", credits: 1, firstVisit: false },
    { id: "r2", at: daysAgo(10, 90), cafeId: "slowpour", memberId: "m_ayesha", drinkId: "sp-v60",    credits: 1, firstVisit: true  },
    { id: "r3", at: daysAgo(6, 40),  cafeId: "noon",     memberId: "m_ayesha", drinkId: "noon-capp", credits: 1, firstVisit: true  },
    { id: "r4", at: daysAgo(2, 15),  cafeId: "kiln",     memberId: "m_ayesha", drinkId: "kiln-cort", credits: 1, firstVisit: false },
  ];

  /* Today’s hand-written rows. They set up the café-view demo cases:
     Mumtaz has 1 cup left of her daily limit here, Zara has none.     */
  const handToday = {
    kiln: [
      { memberId: "m_ayesha", drinkId: "kiln-flat" },
      { memberId: "m_zara",   drinkId: "kiln-flat" },
      { memberId: "m_zara",   drinkId: "kiln-cort" },
      { memberId: "m_omar",   drinkId: "kiln-cort", firstVisit: true },
      { memberId: "m_bilal",  drinkId: "kiln-flat" },
      { memberId: "m_sana",   drinkId: "kiln-pour", firstVisit: true },
    ],
  };

  // Small seeded PRNG. Seeded by date, so every open window builds the same day.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const midnight = new Date(now); midnight.setHours(0, 0, 0, 0);
  const startOfToday = midnight.getTime();
  const rand = mulberry32(midnight.getFullYear() * 10000 + (midnight.getMonth() + 1) * 100 + midnight.getDate());
  const pick = (list) => list[Math.floor(rand() * list.length)];

  /** n timestamps across today’s open hours so far, weighted by busyByHour.
      Counts stay fixed so the demo looks the same at any hour; early in the
      day they bunch into the hours that have passed.                     */
  function todayTimes(cafe, n) {
    const at = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return startOfToday + (h * 60 + (m || 0)) * MIN; };
    let start = at(cafe.hours.open);
    let close = at(cafe.hours.close);
    if (close <= start) close += DAY;
    let end = Math.min(now - 2 * MIN, close);
    if (end - start < 60 * MIN) { start = Math.max(startOfToday, now - 3 * 60 * MIN); end = now - 2 * MIN; }
    if (end <= start) start = end - 30 * MIN;

    const slots = [];
    let total = 0;
    for (let t = start; t < end; ) {
      const next = new Date(t); next.setMinutes(60, 0, 0);
      const stop = Math.min(end, next.getTime());
      const w = Math.max(0.08, cafe.busyByHour[new Date(t).getHours() - 8] ?? 0.1) * (stop - t);
      slots.push({ t, stop, w }); total += w; t = stop;
    }
    return Array.from({ length: n }, () => {
      let u = rand() * total;
      const slot = slots.find((s) => (u -= s.w) <= 0) || slots[slots.length - 1];
      return Math.round(slot.t + rand() * (slot.stop - slot.t));
    }).sort((a, b) => a - b);
  }

  function seedToday() {
    const out = [];
    cafes.forEach((cafe) => {
      const specs = (handToday[cafe.id] || []).map((s) => ({ firstVisit: false, ...s }));
      const credits = (s) => cafe.drinks.find((d) => d.id === s.drinkId).credits;
      const cups = () => specs.reduce((n, s) => n + credits(s), 0);
      const perMember = {};
      const oneCup = cafe.drinks.filter((d) => d.credits === 1);
      const twoCup = cafe.drinks.filter((d) => d.credits > 1);
      let guard = 0;
      while (cups() < cafe.avgDailyCups && guard++ < 200) {
        const m = pick(regulars);
        if ((perMember[m.id] || 0) >= rules.dailyLimitPerCafe) continue;
        perMember[m.id] = (perMember[m.id] || 0) + 1;
        const drink = twoCup.length && rand() < 0.08 ? pick(twoCup) : pick(oneCup);
        specs.push({ memberId: m.id, drinkId: drink.id, firstVisit: perMember[m.id] === 1 && rand() < 0.12 });
      }
      // Shuffle, then lay the rows over the day in time order
      for (let i = specs.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [specs[i], specs[j]] = [specs[j], specs[i]]; }
      const times = todayTimes(cafe, specs.length);
      specs.forEach((s, i) => out.push({ id: `t-${cafe.id}-${i}`, at: times[i], cafeId: cafe.id, credits: credits(s), ...s }));
    });
    return out;
  }

  const redemptions = [...history, ...seedToday()];

  /* Rewards ------------------------------------------------------------- */
  const badges = [
    { id: "first-cup",  name: "First cup",     line: "Your first redemption.",           earned: true  },
    { id: "four-weeks", name: "Four weeks",    line: "A cup every week for a month.",    earned: true  },
    { id: "explorer",   name: "Explorer",      line: "Try five different cafés.",        earned: false, progress: 3, goal: 5 },
    { id: "early",      name: "Early riser",   line: "Three cups before 9 am.",          earned: false, progress: 1, goal: 3 },
    { id: "generous",   name: "Generous",      line: "Send your first gift.",            earned: false, progress: 0, goal: 1 },
  ];

  LCC.data = {
    seededAt: now,
    rules,
    tiers,
    areas,
    cafes,
    members,
    memberId: ayesha.id,
    partnerCafeId: "kiln",       // the café shown in the partner view
    redemptions,
    badges,
    // Builder default for the “Build your own” plan
    builderDraft: { kiln: 4, slowpour: 2, noon: 2 },
  };
})();

</script>
<script>
/* ---- src/state.js ---- */
/* =====================================================================
   Lahore Coffee Club — state.js
   One in-memory store shared by every surface, with pub-sub.

   Usage:
     const { store } = LCC;
     const off = store.on("cafe:status", ({ cafeId }) => …);  // one event
     const off = store.subscribe((type, payload) => …);        // every event
     store.actions.setCafeStatus("kiln", "packed");
     store.select.cafe("kiln").status;

   Events: cafe:status, cafe:viewing, redeem, pass, member, plan, builder,
           gift, waitlist, partner, snapshot, tick (every 30s, for relative times)

   No storage. Café status, redemptions and the demo member’s plan/cups
   are handed to "transports" (store.addTransport); sync.js registers two:
   BroadcastChannel (same computer) and Supabase Realtime (other devices).
   Incoming messages come back through store.applyRemote(), which uses the
   same internals as local actions but never re-sends (no echo loops).
   ===================================================================== */
(function () {
  "use strict";
  const LCC = (window.LCC = window.LCC || {});
  const seed = LCC.data;
  if (!seed) throw new Error("state.js: data.js must load first");

  const clone = (v) => (typeof structuredClone === "function" ? structuredClone(v) : JSON.parse(JSON.stringify(v)));
  const byId = (list) => Object.fromEntries(list.map((x) => [x.id, x]));
  const MIN = 60 * 1000;
  const STATUSES = ["quiet", "moderate", "packed"];

  /* -------------------------------------------------------------------
     State
     ------------------------------------------------------------------- */
  const state = {
    rules: clone(seed.rules),
    tiers: clone(seed.tiers),
    areas: clone(seed.areas),
    cafeOrder: seed.cafes.map((c) => c.id),
    cafes: byId(clone(seed.cafes)),
    members: byId(clone(seed.members)),
    memberId: seed.memberId,
    partnerCafeId: seed.partnerCafeId,
    plan: { type: "fixed", tierId: "regular", allocation: null },
    builder: clone(seed.builderDraft),
    redemptions: clone(seed.redemptions),
    badges: clone(seed.badges),
    gifts: [],
    waitlist: [],
    partnerRequests: [],
  };

  /* -------------------------------------------------------------------
     Pub-sub
     ------------------------------------------------------------------- */
  const listeners = new Map(); // type -> Set<fn>

  function on(type, fn) {
    if (!listeners.has(type)) listeners.set(type, new Set());
    listeners.get(type).add(fn);
    return () => listeners.get(type).delete(fn);
  }
  const subscribe = (fn) => on("*", fn);

  function emit(type, payload = {}, { remote = false } = {}) {
    const call = (fn, ...args) => {
      try { fn(...args); } catch (err) { console.error(`[LCC] listener for “${type}” failed`, err); }
    };
    (listeners.get(type) || []).forEach((fn) => call(fn, payload, type));
    (listeners.get("*") || []).forEach((fn) => call(fn, type, payload));
    if (!remote) outgoing(type, payload);
  }

  /* -------------------------------------------------------------------
     Sync seam: what leaves this device, and how remote messages apply
     ------------------------------------------------------------------- */
  const transports = new Set(); // fn(type, data)
  function addTransport(fn) { transports.add(fn); return () => transports.delete(fn); }

  function send(type, data) {
    transports.forEach((fn) => { try { fn(type, data); } catch (err) { console.warn("[LCC] sync send failed", err); } });
  }

  /** Local events worth sharing, reduced to plain data. */
  function outgoing(type, payload) {
    if (type === "cafe:status") send(type, { cafeId: payload.cafeId, status: payload.status, at: payload.at });
    else if (type === "redeem") send(type, { entry: payload.entry });
    else if (type === "member" && payload.member?.id === state.memberId) {
      payload.member.syncAt = Date.now();
      send("member", { snapshot: memberSnapshot() });
    }
  }

  /** The demo member’s plan and cups. syncAt decides which copy is newer. */
  function memberSnapshot() {
    const m = state.members[state.memberId];
    return {
      at: m.syncAt || 0,
      plan: clone(state.plan),
      member: clone({
        planId: m.planId, cupsTotal: m.cupsTotal, cupsLeft: m.cupsLeft, renewsAt: m.renewsAt,
        cycleStartedAt: m.cycleStartedAt, payment: m.payment, visits: m.visits, cafesTried: m.cafesTried,
      }),
    };
  }

  /** Newest wins; equal stamps (both still on the seed) leave things alone. */
  function applyMemberSnapshot(snap) {
    const m = state.members[state.memberId];
    if (!snap || !snap.member || (snap.at || 0) <= (m.syncAt || 0)) return false;
    Object.assign(m, clone(snap.member));
    m.syncAt = snap.at;
    if (snap.plan) state.plan = clone(snap.plan);
    emit("plan", { plan: state.plan }, { remote: true });
    emit("member", { member: m }, { remote: true });
    return true;
  }

  /** What a café device sends to a device that just joined the room. */
  function roomSnapshot() {
    // BACKEND: this becomes reads of cafe_status, redemptions (today) and subscriptions
    const since = startOfToday();
    return {
      statuses: Object.fromEntries(state.cafeOrder.map((id) => [id, { status: state.cafes[id].status, at: state.cafes[id].statusUpdatedAt }])),
      // Seeded rows have the same ids on every device; only live ones need sending
      redemptions: state.redemptions.filter((r) => r.at >= since && r.live),
      member: memberSnapshot(),
    };
  }

  function applyRoomSnapshot(snap) {
    if (!snap) return;
    Object.entries(snap.statuses || {}).forEach(([cafeId, { status, at }]) => {
      const c = state.cafes[cafeId];
      if (c && (c.status !== status || c.statusUpdatedAt !== at)) applyStatus({ cafeId, status, at }, { remote: true });
    });
    // Cups and visits come with the member snapshot, so these rows only join the log
    (snap.redemptions || []).forEach((entry) => {
      if (!state.redemptions.some((r) => r.id === entry.id)) state.redemptions.push(entry);
    });
    applyMemberSnapshot(snap.member);
    emit("snapshot", {}, { remote: true });
  }

  /** Entry point for messages from another window or device. */
  function applyRemote(type, data) {
    if (!data) return;
    if (type === "cafe:status") applyStatus(data, { remote: true });
    else if (type === "redeem" && data.entry) commitRedemption(data.entry, { remote: true });
    else if (type === "member") applyMemberSnapshot(data.snapshot);
    else if (type === "snapshot") applyRoomSnapshot(data);
  }

  /* -------------------------------------------------------------------
     Helpers
     ------------------------------------------------------------------- */
  const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const uid = (p) => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const roundTo = (n, step) => Math.round(n / step) * step;
  /** Same day next month; clamps 31 Jan to 28/29 Feb. */
  function addMonths(ts, n) {
    const d = new Date(ts);
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    return d.getTime();
  }

  // Small, stable hash so every open window derives the same pass code.
  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }

  /* -------------------------------------------------------------------
     Selectors (read-only views of state)
     ------------------------------------------------------------------- */
  const select = {
    state: () => state,
    member: (id = state.memberId) => state.members[id],
    cafe: (id) => state.cafes[id],
    cafes: () => state.cafeOrder.map((id) => state.cafes[id]),
    tier: (id) => state.tiers.find((t) => t.id === id),
    area: (id) => state.areas.find((a) => a.id === id),
    drink: (cafeId, drinkId) => (state.cafes[cafeId]?.drinks || []).find((d) => d.id === drinkId),
    partnerCafe: () => state.cafes[state.partnerCafeId],

    /** Mumtaz’s activity, newest first. */
    activity(memberId = state.memberId) {
      return state.redemptions.filter((r) => r.memberId === memberId).sort((a, b) => b.at - a.at);
    },

    usedToday(memberId, cafeId) {
      const since = startOfToday();
      return state.redemptions
        .filter((r) => r.memberId === memberId && r.cafeId === cafeId && r.at >= since)
        .reduce((n, r) => n + r.credits, 0);
    },

    /** What the café dashboard shows for today and this month. */
    cafeSummary(cafeId = state.partnerCafeId) {
      const cafe = state.cafes[cafeId];
      const since = startOfToday();
      const today = state.redemptions.filter((r) => r.cafeId === cafeId && r.at >= since).sort((a, b) => b.at - a.at);
      // Paid per cup, so a two-cup drink counts twice.
      const cupsToday = today.reduce((n, r) => n + r.credits, 0);
      // Month to date: a typical day for each earlier day this month, plus today.
      const daysBefore = new Date().getDate() - 1;
      const monthCups = daysBefore * cafe.avgDailyCups + cupsToday;
      return {
        today,
        redemptionsToday: today.length,
        cupsToday,
        newCustomersToday: today.filter((r) => r.firstVisit).length,
        payoutPerCup: cafe.payoutPerCup,
        payoutToday: cupsToday * cafe.payoutPerCup,
        monthCups,
        payoutMonth: monthCups * cafe.payoutPerCup,
      };
    },

    /** Build-your-own pricing. Spec §6. */
    customPrice(allocation = state.builder) {
      const { customDiscount, roundTo: step, minCupsTotal } = state.rules;
      let cups = 0;
      let counter = 0;
      Object.entries(allocation).forEach(([cafeId, n]) => {
        const cafe = state.cafes[cafeId];
        if (!cafe || !n) return;
        cups += n;
        counter += n * cafe.price;
      });
      const price = roundTo(counter * customDiscount, step);
      return {
        cups,
        price,
        counter,
        savings: Math.max(0, counter - price),
        meetsMinimum: cups >= minCupsTotal,
        cupsShort: Math.max(0, minCupsTotal - cups),
      };
    },

    /** Savings for a fixed tier vs. the average list price across cafés. */
    tierSavings(tierId) {
      const tier = select.tier(tierId);
      const avg = select.cafes().reduce((n, c) => n + c.price, 0) / state.cafeOrder.length;
      return Math.max(0, roundTo(tier.cups * avg - tier.price, state.rules.roundTo));
    },

    /** Current rotating pass for a member. */
    pass(memberId = state.memberId, at = Date.now()) {
      const period = state.rules.passRotateSeconds * 1000;
      const win = Math.floor(at / period);
      const code = String(fnv1a(`${memberId}:${win}`) % 1000000).padStart(6, "0");
      const expiresAt = (win + 1) * period;
      return {
        code,
        payload: `LCC1:${memberId}:${code}`, // what the QR encodes
        expiresAt,
        secondsLeft: Math.max(0, Math.ceil((expiresAt - at) / 1000)),
        period: state.rules.passRotateSeconds,
      };
    },

    /** Plan name for any member. Demo members carry no planId, so match by cups. */
    memberPlan(member) {
      if (member.planId === "custom") return { name: "Build your own", cups: member.cupsTotal };
      const tier = (member.planId && select.tier(member.planId)) || state.tiers.find((t) => t.cups === member.cupsTotal);
      return tier ? { name: tier.name, cups: tier.cups } : { name: "Build your own", cups: member.cupsTotal };
    },

    /** Open or closed right now, from the café’s hours. Handles closing after midnight. */
    openState(cafe, at = Date.now()) {
      const toMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + (m || 0); };
      const open = toMin(cafe.hours.open);
      let close = toMin(cafe.hours.close);
      if (close <= open) close += 1440;
      const d = new Date(at);
      let nowMin = d.getHours() * 60 + d.getMinutes();
      if (nowMin < open && nowMin + 1440 < close) nowMin += 1440; // early hours, still open from yesterday
      const isOpen = nowMin >= open && nowMin < close;
      return {
        open: isOpen,
        label: isOpen ? `Open until ${fmt.clock(close)}` : `Closed, opens at ${fmt.clock(open)}`,
      };
    },

    /** Typical status at an hour, from busyByHour (8:00–23:00). Used by the map’s “Usually at 6 pm”. */
    usualStatus(cafe, hour = 18) {
      const v = cafe.busyByHour[hour - 8] ?? 0;
      return { level: v, status: v >= 0.7 ? "packed" : v >= 0.4 ? "moderate" : "quiet" };
    },

    /** Cafés tab: text search (name, area, drink) combined with filters.
        Every filter narrows the list (AND); area is a single choice.    */
    searchCafes({ query = "", areaId = null, openNow = false, quietNow = false } = {}, at = Date.now()) {
      // BACKEND: GET /cafes?q=:query&area=:areaId&open=1&status=quiet
      const norm = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
      const words = norm(query).split(/\s+/).filter(Boolean);
      return select.cafes().filter((c) => {
        if (areaId && c.area !== areaId) return false;
        if (openNow && !select.openState(c, at).open) return false;
        if (quietNow && c.status !== "quiet") return false;
        if (!words.length) return true;
        const hay = norm([c.name, select.area(c.area).name, ...c.drinks.map((d) => d.name)].join(" "));
        return words.every((w) => hay.includes(w));
      });
    },

    /** Price and cups for a plan the member might buy.
        plan: { type: "fixed", tierId } | { type: "custom", allocation } */
    quote(plan) {
      // BACKEND: POST /plans/quote { plan } -> { name, cups, price, savings }
      if (plan.type === "fixed") {
        const t = select.tier(plan.tierId);
        return { name: t.name, cups: t.cups, price: t.price, savings: select.tierSavings(t.id), meetsMinimum: true, cupsShort: 0 };
      }
      return { name: "Build your own", ...select.customPrice(plan.allocation || state.builder) };
    },

    /** Is this the plan the member is on now? */
    isCurrentPlan(plan) {
      const cur = state.plan;
      if (plan.type !== cur.type) return false;
      if (plan.type === "fixed") return plan.tierId === cur.tierId;
      const a = plan.allocation || state.builder, b = cur.allocation || {};
      const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
      return [...keys].every((k) => (a[k] || 0) === (b[k] || 0));
    },

    loyalty(cafeId, memberId = state.memberId) {
      const goal = 5;
      const visits = state.members[memberId]?.visits?.[cafeId] || 0;
      return { visits: visits % goal, goal, freeCupsEarned: Math.floor(visits / goal) };
    },
  };

  /* -------------------------------------------------------------------
     Code lookup and redemption (café view)
     ------------------------------------------------------------------- */
  const MESSAGES = {
    "not-found": () => "That code didn’t match a member. Check the six digits and try again.",
    "expired": (m) => `That code has expired. Ask ${m.firstName} for the new one on the pass screen.`,
    "no-cups": (m) => `${m.firstName} has no cups left this month. They can top up in the app.`,
    "not-enough": (m, need) => `That drink uses ${need} cups and ${m.firstName} has ${m.cupsLeft} left. Try a one-cup drink.`,
    "daily-limit": (m, _n, limit) => `${m.firstName} has had ${limit} cups here today, the daily limit. It resets tomorrow.`,
  };

  /** Returns { member, expired } or null. */
  function findMemberByCode(raw) {
    const code = String(raw || "").replace(/\D/g, "");
    if (code.length !== 6) return null;
    const now = Date.now();
    const period = state.rules.passRotateSeconds * 1000;
    const EXPIRED_LOOKBACK = 20; // windows (10 min) checked to tell “expired” from “wrong”
    for (const m of Object.values(state.members)) {
      if (m.staticCode === code) return { member: m, expired: false };
      if (m.staticCode || m.background) continue;
      // Accept the current and previous window, so a code read out at
      // 0:01 still works a moment later.
      if (select.pass(m.id, now).code === code || select.pass(m.id, now - period).code === code) return { member: m, expired: false };
      for (let i = 2; i <= EXPIRED_LOOKBACK; i++) {
        if (select.pass(m.id, now - i * period).code === code) return { member: m, expired: true };
      }
    }
    return null;
  }

  /** Check a code before redeeming. Never mutates. */
  function lookupCode(code, cafeId = state.partnerCafeId, credits = 1) {
    // BACKEND: GET /passes/:code?cafe=:cafeId
    const found = findMemberByCode(code);
    if (!found) return { ok: false, reason: "not-found", message: MESSAGES["not-found"]() };
    if (found.expired) return { ok: false, reason: "expired", member: found.member, message: MESSAGES.expired(found.member) };
    const member = found.member;
    const limit = state.rules.dailyLimitPerCafe;
    const usedToday = select.usedToday(member.id, cafeId);
    const base = { member, cupsLeft: member.cupsLeft, usedToday, dailyLimit: limit };
    if (member.cupsLeft <= 0) return { ...base, ok: false, reason: "no-cups", message: MESSAGES["no-cups"](member) };
    if (usedToday >= limit) return { ...base, ok: false, reason: "daily-limit", message: MESSAGES["daily-limit"](member, 0, limit) };
    if (member.cupsLeft < credits) return { ...base, ok: false, reason: "not-enough", message: MESSAGES["not-enough"](member, credits) };
    return { ...base, ok: true };
  }

  function commitRedemption(entry, { remote = false } = {}) {
    if (state.redemptions.some((r) => r.id === entry.id)) return; // idempotent across windows and transports
    const member = state.members[entry.memberId];
    if (!member) return;
    member.cupsLeft = Math.max(0, member.cupsLeft - entry.credits);
    member.syncAt = Math.max(member.syncAt || 0, entry.at); // a cup used counts as a change to the member
    member.visits = member.visits || {};
    member.visits[entry.cafeId] = (member.visits[entry.cafeId] || 0) + 1;
    if (member.cafesTried && !member.cafesTried.includes(entry.cafeId)) member.cafesTried.push(entry.cafeId);
    state.redemptions.push(entry);
    emit("redeem", { entry, member }, { remote });
  }

  /* -------------------------------------------------------------------
     Actions (the only things that write to state)
     ------------------------------------------------------------------- */
  function applyStatus({ cafeId, status, at }, opts) {
    const cafe = state.cafes[cafeId];
    if (!cafe || !STATUSES.includes(status)) return;
    cafe.status = status;
    cafe.statusUpdatedAt = at;
    emit("cafe:status", { cafeId, status, at }, opts);
  }

  const actions = {
    setCafeStatus(cafeId, status) {
      // BACKEND: PATCH /cafes/:cafeId/status { status }
      applyStatus({ cafeId, status, at: Date.now() });
    },

    /** Redeem by code (café view). Returns the lookup result plus the entry. */
    redeem({ code, cafeId = state.partnerCafeId, drinkId }) {
      const cafe = state.cafes[cafeId];
      const drink = select.drink(cafeId, drinkId) || cafe.drinks[0];
      const check = lookupCode(code, cafeId, drink.credits);
      if (!check.ok) return check;
      const member = check.member;
      // BACKEND: POST /redeem { code, cafeId, drinkId } -> { entry, member }
      const entry = {
        id: uid("r"),
        at: Date.now(),
        cafeId,
        memberId: member.id,
        drinkId: drink.id,
        credits: drink.credits,
        firstVisit: !(member.visits && member.visits[cafeId] > 0),
        live: true, // made in this session, not seeded
      };
      commitRedemption(entry);
      return { ...check, ok: true, entry, cupsLeft: member.cupsLeft };
    },

    /** Which café the partner view is showing (demo picker). */
    setPartnerCafe(cafeId) {
      if (!state.cafes[cafeId] || state.partnerCafeId === cafeId) return;
      state.partnerCafeId = cafeId;
      emit("cafe:viewing", { cafeId });
    },

    /** Switch plan now: cups start fresh and the month restarts today. */
    choosePlan(plan, { payment } = {}) {
      // plan: { type: "fixed", tierId } | { type: "custom", allocation }
      // BACKEND: POST /subscriptions { plan, paymentId }
      const member = select.member();
      const now = Date.now();
      member.cycleStartedAt = now;
      member.renewsAt = addMonths(now, 1);
      if (payment) member.payment = payment;
      if (plan.type === "fixed") {
        const tier = select.tier(plan.tierId);
        state.plan = { type: "fixed", tierId: tier.id, allocation: null };
        member.planId = tier.id;
        member.cupsTotal = tier.cups;
        member.cupsLeft = tier.cups;
      } else {
        const allocation = clone(plan.allocation || state.builder);
        const { cups } = select.customPrice(allocation);
        state.plan = { type: "custom", tierId: null, allocation };
        member.planId = "custom";
        member.cupsTotal = cups;
        member.cupsLeft = cups;
      }
      emit("plan", { plan: state.plan });
      emit("member", { member });
    },

    /** Simulated payment, then the plan applies. Resolves { ok, message? }.
        A wallet number ending in 0000 fails, so the error path can be shown. */
    checkout({ plan, method, account = "" }) {
      const q = select.quote(plan);
      if (!q.meetsMinimum) return Promise.resolve({ ok: false, reason: "minimum", message: `Plans start at ${state.rules.minCupsTotal} cups.` });
      const digits = String(account).replace(/\D/g, "");
      // BACKEND: POST /payments { method, account, amount: q.price } -> wallet or card provider
      return new Promise((resolve) => {
        setTimeout(() => {
          if (method !== "card" && digits.endsWith("0000")) {
            resolve({ ok: false, reason: "declined", message: "The payment didn’t go through. Nothing was taken." });
            return;
          }
          const labels = { jazzcash: "JazzCash", easypaisa: "Easypaisa", card: "Card" };
          actions.choosePlan(plan, { payment: { method: labels[method] || method, last4: digits.slice(-4) } });
          resolve({ ok: true, quote: q, member: select.member() });
        }, 1600);
      });
    },

    setBuilderCups(cafeId, cups) {
      if (!state.cafes[cafeId]) return;
      const n = Math.max(0, Math.min(state.rules.maxCupsPerCafe, Math.round(cups)));
      if (n === 0) delete state.builder[cafeId];
      else state.builder[cafeId] = n;
      emit("builder", { cafeId, cups: n, price: select.customPrice() });
    },

    /** Replace the whole builder draft (e.g. start from the current plan). */
    setBuilder(allocation) {
      const max = state.rules.maxCupsPerCafe;
      state.builder = {};
      Object.entries(allocation || {}).forEach(([id, n]) => {
        const v = Math.max(0, Math.min(max, Math.round(n)));
        if (state.cafes[id] && v) state.builder[id] = v;
      });
      emit("builder", { price: select.customPrice() });
    },

    updateMember(patch) {
      // BACKEND: PATCH /me
      Object.assign(select.member(), patch);
      emit("member", { member: select.member() });
    },

    sendGift({ toName, toPhone, cups, cafeId = null, message = "" }) {
      const member = select.member();
      const n = Math.max(1, Math.min(state.rules.giftMaxCups, cups | 0));
      if (member.cupsLeft < n) return { ok: false, message: `You have ${member.cupsLeft} cups left, so you can gift up to ${member.cupsLeft}.` };
      // BACKEND: POST /gifts
      const sentAt = Date.now();
      const gift = {
        id: uid("g"),
        fromId: member.id,
        toName, toPhone, cups: n, cafeId, message,
        sentAt,
        expiresAt: sentAt + state.rules.giftExpiryDays * 24 * 60 * MIN,
        link: `lahorecoffee.club/g/${Math.random().toString(36).slice(2, 8)}`,
      };
      member.cupsLeft -= n;
      state.gifts.push(gift);
      emit("gift", { gift });
      emit("member", { member });
      return { ok: true, gift };
    },

    joinWaitlist(entry) {
      // BACKEND: POST /waitlist
      const record = { id: uid("w"), at: Date.now(), ...entry };
      state.waitlist.push(record);
      console.log("[LCC] waitlist", record, `(${state.waitlist.length} total)`);
      emit("waitlist", { entry: record });
      return record;
    },

    requestPartnerCall(entry) {
      // BACKEND: POST /partners/requests
      const record = { id: uid("p"), at: Date.now(), ...entry };
      state.partnerRequests.push(record);
      console.log("[LCC] partner request", record);
      emit("partner", { entry: record });
      return record;
    },
  };

  /* -------------------------------------------------------------------
     Clocks: relative-time tick and pass rotation
     ------------------------------------------------------------------- */
  setInterval(() => emit("tick", { at: Date.now() }), 30 * 1000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") emit("tick", { at: Date.now() });
  });

  (function schedulePassRotation() {
    const { expiresAt } = select.pass();
    setTimeout(() => {
      emit("pass", select.pass());
      schedulePassRotation();
    }, Math.max(50, expiresAt - Date.now() + 20));
  })();

  /* -------------------------------------------------------------------
     Formatting (shared copy rules: sentence case, typographic marks)
     ------------------------------------------------------------------- */
  const NBSP = " ";
  const intNum = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
  const fmt = {
    rs: (n) => `Rs${NBSP}${intNum.format(Math.round(n))}`,
    num: (n) => intNum.format(n),
    cups: (n) => `${n} ${n === 1 ? "cup" : "cups"}`,
    statusLabel: (s) => ({ quiet: "Quiet", moderate: "Moderate", packed: "Packed" }[s] || s),
    ago(ts, now = Date.now()) {
      const m = Math.floor((now - ts) / MIN);
      if (m < 1) return "just now";
      if (m < 60) return `${m}${NBSP}min ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}${NBSP}hr ago`;
      const d = Math.floor(h / 24);
      return d === 1 ? "yesterday" : `${d} days ago`;
    },
    updated: (ts) => `updated ${fmt.ago(ts)}`,
    time: (ts) =>
      new Date(ts).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(/\s?([AP])M/, (_, x) => `${NBSP}${x.toLowerCase()}m`),
    date: (ts) => new Date(ts).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }),
    shortDate: (ts) => new Date(ts).toLocaleDateString("en-GB", { day: "numeric", month: "short" }),
    /** Minutes after midnight -> “11 pm”, “7:30 am”, “midnight”. Wraps past 24h. */
    clock(mins) {
      const m = ((mins % 1440) + 1440) % 1440;
      if (m === 0) return "midnight";
      if (m === 720) return "noon";
      const h = Math.floor(m / 60), mm = m % 60;
      const h12 = h % 12 || 12;
      return `${h12}${mm ? `:${String(mm).padStart(2, "0")}` : ""}${NBSP}${h < 12 ? "am" : "pm"}`;
    },
    countdown: (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`,
  };

  LCC.fmt = fmt;
  LCC.store = {
    on, subscribe, emit, select, actions, lookupCode, addMonths, statuses: STATUSES, getState: () => state,
    addTransport, applyRemote, roomSnapshot, memberSnapshot,
  };
})();

</script>
<script>
/* ---- src/ui.js ---- */
/* =====================================================================
   Lahore Coffee Club — ui.js
   Small DOM helpers behind the components in base.css: safe templating,
   icons, toast, bottom sheet, number animation, and live bindings that
   keep status pills and “X min ago” text in sync with the store.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = (window.LCC = window.LCC || {});
  const { store, fmt } = LCC;

  /* Templating ---------------------------------------------------------- */
  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
  class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
  const raw = (s) => new Raw(s);
  /** html`<p>${userText}</p>` escapes values; wrap trusted markup in raw(). */
  function html(strings, ...values) {
    let out = strings[0];
    values.forEach((v, i) => {
      const val = Array.isArray(v) ? v.map((x) => (x instanceof Raw ? x.s : esc(x))).join("") : v instanceof Raw ? v.s : esc(v);
      out += val + strings[i + 1];
    });
    return raw(out);
  }
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Icons: 24px grid, 1.5px stroke, round caps. Extended in later passes. */
  const ICON_PATHS = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    minus: '<path d="M5 12h14"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    chevronRight: '<path d="M9.5 6l6 6-6 6"/>',
    chevronDown: '<path d="M6 9.5l6 6 6-6"/>',
    arrowLeft: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    // Tab bar
    home: '<path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1v-8.5z"/>',
    store: '<path d="M4 9.5L5.5 4h13L20 9.5M4 9.5h16M4 9.5a2.67 2.67 0 0 0 5.33 0 2.67 2.67 0 0 0 5.34 0A2.67 2.67 0 0 0 20 9.5M5.5 12.5V20h13v-7.5M10 20v-4.5h4V20"/>',
    qr: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2.5v2.5H14zM17.5 17.5H20V20h-2.5zM14 20h1M20 14v1"/>',
    map: '<path d="M9 5L4 7v12l5-2 6 2 5-2V5l-5 2-6-2zM9 5v12M15 7v12"/>',
    award: '<circle cx="12" cy="9" r="5"/><path d="M9 13.2L7.5 20l4.5-2.5 4.5 2.5-1.5-6.8"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    pin: '<path d="M12 20.5s6-5.6 6-10.5a6 6 0 0 0-12 0c0 4.9 6 10.5 6 10.5z"/><circle cx="12" cy="10" r="2"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
    wallet: '<path d="M4 7.5A1.5 1.5 0 0 1 5.5 6H18v3"/><rect x="4" y="9" width="16" height="10" rx="1.5"/><path d="M16 14h.01"/>',
    card: '<rect x="3.5" y="6" width="17" height="12" rx="1.5"/><path d="M3.5 10h17M7 15h3"/>',
    sun: '<circle cx="12" cy="12" r="3.5"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/>',
  };
  function icon(name, { size = 24, label } = {}) {
    const a11y = label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true" focusable="false"';
    return raw(
      `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ${a11y}>${ICON_PATHS[name] || ""}</svg>`
    );
  }

  /* Cup-level icon: how full the café is ---------------------------------
     Outline cup = quiet, half full = moderate, full = packed. Fill uses
     currentColor, so it inverts inside a selected (ink) segment.        */
  const CUP_BODY = "M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5V8z";
  const CUP_FILL = {
    quiet: "",
    moderate: '<path d="M5 13.25h12V14a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5v-.75z" fill="currentColor" stroke="none"/>',
    packed: `<path d="${CUP_BODY}" fill="currentColor" stroke="none"/>`,
  };
  function cupIcon(status, { size = 16, cls = "status__icon" } = {}) {
    return raw(
      `<svg class="${cls}" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">` +
        `${CUP_FILL[status] || ""}<path d="${CUP_BODY}"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/></svg>`
    );
  }

  /* Status pill --------------------------------------------------------- */
  /** Renders a pill bound to a café; it updates itself on store changes. */
  function statusPill(cafeId, { bare = false, time = true } = {}) {
    const cafe = store.select.cafe(cafeId);
    return html`<span class="status${bare ? " status--bare" : ""}" data-status="${cafe.status}" data-live-status="${cafeId}" data-live-time="${time ? "1" : "0"}">
      ${cupIcon(cafe.status)}
      <span class="status__label">${fmt.statusLabel(cafe.status)}</span>
      ${time ? html`<span class="status__time" data-rel-time="${cafe.statusUpdatedAt}" data-rel-prefix="updated">${fmt.updated(cafe.statusUpdatedAt)}</span>` : ""}
    </span>`;
  }

  function refreshStatusPills(cafeId, { flash = false } = {}) {
    const cafe = store.select.cafe(cafeId);
    $$(`[data-live-status="${cafeId}"]`).forEach((el) => {
      el.dataset.status = cafe.status;
      const ic = el.querySelector(".status__icon");
      if (ic) ic.outerHTML = cupIcon(cafe.status).s;
      const label = el.querySelector(".status__label");
      if (label) label.textContent = fmt.statusLabel(cafe.status);
      const t = el.querySelector("[data-rel-time]");
      if (t) { t.dataset.relTime = cafe.statusUpdatedAt; t.textContent = fmt.updated(cafe.statusUpdatedAt); }
      if (flash) { el.classList.remove("is-changed"); void el.offsetWidth; el.classList.add("is-changed"); }
    });
  }

  function refreshRelativeTimes() {
    $$("[data-rel-time]").forEach((el) => {
      const ts = Number(el.dataset.relTime);
      const prefix = el.dataset.relPrefix;
      el.textContent = prefix ? `${prefix} ${fmt.ago(ts)}` : fmt.ago(ts);
    });
  }

  store.on("cafe:status", ({ cafeId }) => refreshStatusPills(cafeId, { flash: true }));
  store.on("tick", refreshRelativeTimes);

  /* Number animation ---------------------------------------------------- */
  const running = new WeakMap();
  /** Count from the element’s current value to `to`. */
  function animateNumber(el, to, { format = fmt.num, duration = 420 } = {}) {
    if (!el) return;
    const from = Number(el.dataset.value ?? to);
    el.dataset.value = to;
    if (from === to || reducedMotion()) { el.textContent = format(to); return; }
    cancelAnimationFrame(running.get(el));
    const t0 = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const step = (now) => {
      const p = Math.min(1, (now - t0) / duration);
      el.textContent = format(Math.round(from + (to - from) * ease(p)));
      if (p < 1) running.set(el, requestAnimationFrame(step));
    };
    running.set(el, requestAnimationFrame(step));
  }

  /* Toast --------------------------------------------------------------- */
  function toast(message, { iconName = "check", duration = 2800, region } = {}) {
    const host = region || $(".phone__screen .toast-region") || $("#toast-region");
    if (!host) return;
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `${iconName ? icon(iconName, { size: 18 }) : ""}<span>${esc(message)}</span>`;
    host.appendChild(el);
    setTimeout(() => {
      el.classList.add("is-leaving");
      el.addEventListener("animationend", () => el.remove(), { once: true });
      setTimeout(() => el.remove(), 400);
    }, duration);
  }

  /* Bottom sheet -------------------------------------------------------
     Markup:
       <div class="sheet" id="x" role="dialog" aria-modal="true" aria-labelledby="x-title" aria-hidden="true">
         <div class="sheet__scrim" data-sheet-close></div>
         <div class="sheet__panel">
           <div class="sheet__handle" aria-hidden="true"></div>
           <div class="sheet__body">…</div>
         </div>
       </div>
     Opens with focus moved inside, closes on scrim, Escape, or drag down.  */
  const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])';
  const openSheets = [];

  function openSheet(sheet, { onClose } = {}) {
    if (!sheet || sheet.dataset.open === "true") return;
    sheet._returnFocus = document.activeElement;
    sheet._onClose = onClose;
    sheet.dataset.open = "true";
    sheet.setAttribute("aria-hidden", "false");
    openSheets.push(sheet);
    bindDrag(sheet);
    requestAnimationFrame(() => {
      const target = sheet.querySelector("[autofocus]") || sheet.querySelector(FOCUSABLE) || sheet.querySelector(".sheet__panel");
      if (target) { if (!target.hasAttribute("tabindex") && target.classList.contains("sheet__panel")) target.tabIndex = -1; target.focus({ preventScroll: true }); }
    });
  }

  function closeSheet(sheet) {
    if (!sheet || sheet.dataset.open !== "true") return;
    sheet.dataset.open = "false";
    sheet.setAttribute("aria-hidden", "true");
    sheet.style.removeProperty("--drag");
    const i = openSheets.indexOf(sheet);
    if (i > -1) openSheets.splice(i, 1);
    const back = sheet._returnFocus;
    if (back && document.contains(back)) back.focus({ preventScroll: true });
    if (typeof sheet._onClose === "function") sheet._onClose();
  }

  function bindDrag(sheet) {
    if (sheet._dragBound) return;
    sheet._dragBound = true;
    const handle = sheet.querySelector(".sheet__handle");
    if (!handle) return;
    let startY = 0, dy = 0, t0 = 0, active = false;
    handle.addEventListener("pointerdown", (e) => {
      active = true; startY = e.clientY; dy = 0; t0 = performance.now();
      sheet.classList.add("is-dragging");
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener("pointermove", (e) => {
      if (!active) return;
      dy = Math.max(0, e.clientY - startY);
      sheet.style.setProperty("--drag", `${dy}px`);
    });
    const end = () => {
      if (!active) return;
      active = false;
      sheet.classList.remove("is-dragging");
      const velocity = dy / Math.max(1, performance.now() - t0);
      if (dy > 96 || velocity > 0.6) closeSheet(sheet);
      else sheet.style.setProperty("--drag", "0px");
    };
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  }

  document.addEventListener("click", (e) => {
    const closer = e.target.closest("[data-sheet-close]");
    if (closer) closeSheet(closer.closest(".sheet"));
    const opener = e.target.closest("[data-sheet-open]");
    if (opener) openSheet(document.getElementById(opener.dataset.sheetOpen));
  });

  document.addEventListener("keydown", (e) => {
    const top = openSheets[openSheets.length - 1];
    if (!top) return;
    if (e.key === "Escape") { e.preventDefault(); closeSheet(top); return; }
    if (e.key === "Tab") {
      const items = $$(FOCUSABLE, top).filter((el) => el.offsetParent !== null);
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* QR code (qrcode-generator from cdnjs) -----------------------------
     Returns SVG markup, or a fallback note when the library didn't load. */
  function qrSvg(payload, { fallback = "QR unavailable offline. Read the code below to the barista." } = {}) {
    if (typeof window.qrcode !== "function") return html`<div class="qr--fallback" style="height:100%">${fallback}</div>`.s;
    try {
      const qr = window.qrcode(0, "M");
      qr.addData(payload);
      qr.make();
      const n = qr.getModuleCount();
      let d = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
      return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" aria-hidden="true" focusable="false"><path d="${d}" fill="currentColor"/></svg>`;
    } catch (err) {
      console.warn("[LCC] QR render failed", err);
      return html`<div class="qr--fallback" style="height:100%">${fallback}</div>`.s;
    }
  }

  /* Stepper ------------------------------------------------------------- */
  function stepper({ id, value = 0, min = 0, max = 10, label }) {
    return html`<div class="stepper" role="group" aria-label="${label}" data-stepper="${id}" data-min="${min}" data-max="${max}">
      <button type="button" class="stepper__btn" data-step="-1" aria-label="One fewer" ${value <= min ? raw("disabled") : ""}>${icon("minus")}</button>
      <output class="stepper__value" aria-live="polite">${value}</output>
      <button type="button" class="stepper__btn" data-step="1" aria-label="One more" ${value >= max ? raw("disabled") : ""}>${icon("plus")}</button>
    </div>`;
  }
  /** Sync a rendered stepper with a new value. */
  function setStepper(el, value) {
    const min = Number(el.dataset.min), max = Number(el.dataset.max);
    el.querySelector(".stepper__value").textContent = value;
    el.querySelector('[data-step="-1"]').disabled = value <= min;
    el.querySelector('[data-step="1"]').disabled = value >= max;
  }

  /* Segmented control --------------------------------------------------- */
  function segmented({ name, options, value, label }) {
    const index = Math.max(0, options.findIndex((o) => o.value === value));
    return html`<div class="segmented" role="tablist" aria-label="${label}" data-segmented="${name}" style="--count:${options.length};--index:${index}">
      <span class="segmented__thumb" aria-hidden="true"></span>
      ${options.map((o) => html`<button type="button" role="tab" class="segmented__option" data-value="${o.value}" aria-selected="${o.value === value}" tabindex="${o.value === value ? 0 : -1}">${o.label}</button>`)}
    </div>`;
  }
  function selectSegment(group, value) {
    const opts = $$(".segmented__option", group);
    opts.forEach((o, i) => {
      const on = o.dataset.value === value;
      o.setAttribute("aria-selected", on);
      o.tabIndex = on ? 0 : -1;
      if (on) group.style.setProperty("--index", i);
    });
  }
  // Arrow keys move between segments (tablist pattern)
  document.addEventListener("keydown", (e) => {
    const opt = e.target.closest?.(".segmented__option");
    if (!opt || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
    const opts = $$(".segmented__option", opt.parentElement);
    const next = opts[(opts.indexOf(opt) + (e.key === "ArrowRight" ? 1 : -1) + opts.length) % opts.length];
    next.focus(); next.click();
  });

  LCC.ui = {
    html, raw, esc, $, $$, icon,
    cupIcon, statusPill, refreshStatusPills, refreshRelativeTimes,
    animateNumber, toast, openSheet, closeSheet, qrSvg,
    stepper, setStepper, segmented, selectSegment,
    reducedMotion,
  };
})();

<script>
/* ---- src/router.js ---- */
/* =====================================================================
   Lahore Coffee Club — router.js
   Hash routes:
     #/            landing
     #/app[/…]     member app (phone frame); sub-paths go to the app
     #/cafe[/…]    café partner view
     #/kit         component sheet (not in the switcher; for review)

   Surfaces register as:
     LCC.router.register("app", {
       title: "Member app",
       mount(el, path) { …; return cleanup },   // called on entering
       update(path) { … },                       // sub-path change only
     });
   The shells below are the Pass 1 defaults; later passes replace them.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = (window.LCC = window.LCC || {});
  const { store, fmt, ui } = LCC;
  const { html, raw, $, icon } = ui;

  const surfaces = {};
  let current = { name: null, cleanup: null };

  function register(name, def) {
    surfaces[name] = def;
    // Re-render if the surface being replaced is on screen
    if (current.name === name) { current.name = null; render(); }
  }

  function parse() {
    // “#/cafe?room=4821” -> cafe. The query belongs to sync.js.
    const clean = location.hash.replace(/^#\/?/, "").replace(/\?.*$/, "").replace(/\/+$/, "");
    const [name = "", ...path] = clean.split("/");
    return { name, path };
  }

  function navigate(to) {
    if (location.hash !== to) location.hash = to;
    else render();
  }

  function render() {
    const { name, path } = parse();
    if (!surfaces[name]) { history.replaceState(null, "", "#/"); return render(); }
    const main = $("#main");
    const def = surfaces[name];

    if (current.name === name && def.update) {
      def.update(path);
    } else {
      if (typeof current.cleanup === "function") current.cleanup();
      const firstLoad = current.name === null && !main.childElementCount;
      main.innerHTML = "";
      main.dataset.surface = name || "landing";
      current = { name, cleanup: def.mount(main, path) || null };
      window.scrollTo(0, 0);
      if (!firstLoad) main.focus({ preventScroll: true });
    }
    document.title = def.title ? `${def.title} · Lahore Coffee Club` : "Lahore Coffee Club";
    renderProtoBar(name);
  }

  /* -------------------------------------------------------------------
     Prototype switcher
     ------------------------------------------------------------------- */
  const SWITCH = [
    { name: "", href: "#/", label: "Landing" },
    { name: "app", href: "#/app", label: "Member app" },
    { name: "cafe", href: "#/cafe", label: "Café view" },

  const THEMES = ["auto", "light", "dark"];

  function renderProtoBar(active) {
    const bar = $("#proto-bar");
    bar.className = "proto-bar";
    bar.setAttribute("aria-label", "Prototype navigation");
    bar.innerHTML = html`

      <button type="button" class="proto-bar__theme" data-theme-toggle aria-label="Colour theme: ${theme}. Change theme">
        ${theme === "auto" ? "Auto" : theme === "light" ? "Light" : "Dark"}
      </button>`;
  }

  function cycleTheme() {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    const root = document.documentElement;
    if (theme === "auto") root.removeAttribute("data-theme");
    else root.dataset.theme = theme;
    renderProtoBar(parse().name);
    $("[data-theme-toggle]")?.focus();
  }

  /* -------------------------------------------------------------------
     Global behaviour
     ------------------------------------------------------------------- */
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-theme-toggle]")) return cycleTheme();

    // In-page scroll links (hash is taken by the router)
    const scroller = e.target.closest("[data-scroll]");
    if (scroller) {
      e.preventDefault();
      const target = document.getElementById(scroller.dataset.scroll);
      if (target) {
        target.scrollIntoView({ behavior: ui.reducedMotion() ? "auto" : "smooth", block: "start" });
        target.setAttribute("tabindex", "-1");
        target.focus({ preventScroll: true });

    const skip = e.target.closest(".skip-link");
    if (skip) { e.preventDefault(); $("#main").focus(); }
  });

  // Fit the 844px phone into shorter laptop screens without changing its layout
  function fitPhone() {
    const available = window.innerHeight - 40 /* proto bar */ - 48 /* breathing room */;
    const scale = Math.min(1, Math.max(0.6, available / 864));
    document.documentElement.style.setProperty("--phone-scale", scale.toFixed(3));
  }
  window.addEventListener("resize", fitPhone);

  /* -------------------------------------------------------------------
     Pass 1 shells
     ------------------------------------------------------------------- */
  const LANDING_SECTIONS = [
    { id: "how", label: "How it works" },
    { id: "plans", label: "Plans" },
    { id: "map", label: "Busy map" },
    { id: "gifting", label: "Gifting and loyalty" },
    { id: "partner", label: "For cafés" },
    { id: "join", label: "Join the waitlist" },
    { id: "faq", label: "Questions" },

  register("", {
    title: null,
    mount(el) {
      el.innerHTML = html`
        <div class="surface landing">
          <header class="container landing-nav">
            <a class="wordmark" href="#/">Lahore Coffee Club</a>

              <a class="landing-nav__link" href="#/" data-scroll="how">How it works</a>

                <div class="landing-section__head">
                  <p class="eyebrow num">${String(i + 1).padStart(2, "0")}</p>

  register("app", {
    title: "Member app",
    mount(el) {

        <div class="surface stage">

                <span>9:41</span>
                <span class="phone__island"></span>
                <span class="phone__status-icons">
                  <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                  <svg viewBox="0 0 26 12" style="width:26px"><rect x="0.75" y="0.75" width="21.5" height="10.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.6" fill="currentColor"/><rect x="23.5" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
                </span>
              </div>
              <div class="app-view" id="app-view">
                <div class="app-view__inner stack" style="--stack-gap:var(--space-4)">
                  <p class="eyebrow">Member app</p>
                  <h1 class="t-h2">Salaam, ${m.firstName}.</h1>
                  <div class="placeholder">
                    <span>Built in Passes 3 to 5.</span>
                    <span>Store check: <span class="num" data-bind="cups">${m.cupsLeft} of ${m.cupsTotal}</span> cups left. Kiln &amp; Bean is ${ui.statusPill("kiln", { bare: true })}</span>
                  </div>
                </div>
              </div>
              <div class="toast-region" style="position:absolute" role="status" aria-live="polite"></div>
            </div>
          </div>
        </div>`;
      const cups = $('[data-bind="cups"]', el);
      const off = store.on("member", ({ member }) => { cups.textContent = `${member.cupsLeft} of ${member.cupsTotal}`; });
      const off2 = store.on("redeem", ({ member }) => { if (member.id === m.id) cups.textContent = `${member.cupsLeft} of ${member.cupsTotal}`; });
      return () => { off(); off2(); };

  register("cafe", {

    mount(el) {

            </div>
            <span class="open-indicator">Open <span class="t-faint t-small" style="font-weight:400">until ${cafe.hours.label.split("–")[1].trim()}</span></span>
          </header>
          <div class="cafe-grid">
            <section class="card" aria-labelledby="redeem-h">
              <div class="panel-title"><h2 class="eyebrow" id="redeem-h">Redeem a cup</h2></div>
              <div class="placeholder" style="min-height:360px">Code entry, numpad, and QR scan. Built in Pass 2.</div>
            </section>
            <div class="cafe-grid__side">
              <section class="card" aria-labelledby="busy-h">
                <div class="panel-title"><h2 class="eyebrow" id="busy-h">How busy are you?</h2>${ui.statusPill(cafe.id)}</div>
                <div class="placeholder">Quiet, Moderate, Packed. Built in Pass 2.</div>
              </section>
              <section class="card" aria-labelledby="today-h">
                <div class="panel-title"><h2 class="eyebrow" id="today-h">Today</h2></div>
                <div class="placeholder">Redemptions, new customers, payout. Built in Pass 2.</div>
              </section>
            </div>
          </div>
          <p class="t-small t-faint" style="margin-top:var(--space-6)">Works on any phone or tablet. No special hardware.</p>
        </div>`;
    },
  });

  /* Boot ---------------------------------------------------------------- */
  window.addEventListener("hashchange", render);
  LCC.router = { register, navigate, render, parse };

  // Defer first render so later scripts (kit.js, screens) can register first
  document.addEventListener("DOMContentLoaded", render);
})();

</script>
<script>
/* ---- src/sync.js ---- */
/* =====================================================================
   Lahore Coffee Club — sync.js
   Live sync between devices in the same demo "room".

     #/cafe?room=4821        café tablet
     #/app/pass?room=4821    member phone

   Two transports, both carrying the same small messages:
     1. BroadcastChannel  windows on the same computer (always on)
     2. Supabase Realtime Broadcast  other devices, over the internet.
        Broadcast only: no tables, nothing stored. If it can't connect
        the app carries on with (1) and says “Offline, this device only”.

   Messages: { v, id, from, type, data }. `from` is this window's sender
   id, so a window ignores its own messages; `id` de-duplicates a message
   that arrives over both transports. Incoming data goes through
   store.applyRemote(), which never re-sends, so there are no echo loops.

   Join handshake: a window that joins says “hello”. A café window answers
   with a snapshot (statuses, today’s live redemptions, the member’s cups
   and plan). Any window whose member data changed answers with that, and
   the newest copy wins.

   Approved exception to “no backend” (see CLAUDE.md).
   // BACKEND: replace Broadcast with Supabase tables + Postgres Changes:
   //   cafe_status (cafe_id, status, updated_at), redemptions (…),
   //   subscriptions (member_id, plan, cups_left, renews_at). Rooms go away.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, ui } = LCC;
  const { html } = ui;

  // Publishable key: meant for browser code. Never put a secret key here.
  const SUPABASE_URL = "https://nfgqswdtaemhpmnrries.supabase.co";
  const SUPABASE_KEY = "sb_publishable_iZ_OxDTfGnMoQlWuPswSVA_iuizC6qZ";
  // Where a paired phone goes. Always the deployed site, so pairing works
  // even when the café window runs from this computer.
  const LIVE_URL = "https://lcc-omega.vercel.app/";
  const CONNECT_TIMEOUT_MS = 8000;
  const ROOM_RE = /^[A-Za-z0-9-]{1,32}$/;

  const sender = Math.random().toString(36).slice(2, 10);
  const seen = new Set(); // message ids already applied
  let status = "connecting"; // connecting | online | offline
  let channel = null;      // Supabase channel
  let bc = null;           // BroadcastChannel
  let timeout = null;

  /* -------------------------------------------------------------------
     Room: from the URL, else the last one this browser used, else new
     ------------------------------------------------------------------- */
  function roomFromHash() {
    const q = location.hash.split("?")[1];
    const r = q ? new URLSearchParams(q).get("room") : null;
    return r && ROOM_RE.test(r) ? r : null;
  }
  function remembered() {
    try { const r = localStorage.getItem("lcc-room"); return r && ROOM_RE.test(r) ? r : null; } catch (_) { return null; }
  }
  const room = roomFromHash() || remembered() || String(1000 + Math.floor(Math.random() * 9000));
  try { localStorage.setItem("lcc-room", room); } catch (_) { /* fine without it */ }

  /** Any in-app hash, with this room attached. */
  function withRoom(hash) {
    const [path, q] = String(hash || "#/").split("?");
    const params = new URLSearchParams(q || "");
    params.set("room", room);
    return `${path}?${params}`;
  }
  // Links inside the app drop the query; put the room back without a new history entry
  function ensureRoomInUrl() {
    if (roomFromHash() === room) return;
    history.replaceState(null, "", withRoom(location.hash || "#/"));
  }
  ensureRoomInUrl();
  window.addEventListener("hashchange", ensureRoomInUrl);

  /** Link a phone opens to join this room on the member pass (always the live site). */
  function pairUrl() {
    return `${LIVE_URL}${withRoom("#/app/pass")}`;
  }

  /* -------------------------------------------------------------------
     Sending and receiving
     ------------------------------------------------------------------- */
  const msgId = () => `${sender}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;

  function post(type, data) {
    const msg = { v: 1, id: msgId(), from: sender, type, data };
    seen.add(msg.id);
    if (bc) { try { bc.postMessage(msg); } catch (_) { /* ignore */ } }
    if (channel && status === "online") {
      channel.send({ type: "broadcast", event: "lcc", payload: msg }).catch?.(() => {});
    }
  }

  function receive(msg) {
    if (!msg || msg.v !== 1 || msg.from === sender || seen.has(msg.id)) return;
    seen.add(msg.id);
    if (seen.size > 1000) seen.delete(seen.values().next().value);
    if (msg.type === "hello") return answerHello();
    store.applyRemote(msg.type, msg.data);
  }

  const isCafeDevice = () => LCC.router?.parse().name === "cafe";
  function answerHello() {
    if (isCafeDevice()) post("snapshot", store.roomSnapshot());
    else {
      const snap = store.memberSnapshot();
      if (snap.at > 0) post("member", { snapshot: snap }); // only if something changed here
    }
  }

  // Everything the store wants shared goes out on both transports
  store.addTransport((type, data) => post(type, data));

  /* -------------------------------------------------------------------
     Transport 1: same computer
     ------------------------------------------------------------------- */
  try {
    if ("BroadcastChannel" in window) {
      bc = new BroadcastChannel(`lahore-coffee-club:${room}`);
      bc.onmessage = ({ data }) => receive(data);
    }
  } catch (_) { bc = null; }

  /* -------------------------------------------------------------------
     Transport 2: Supabase Realtime Broadcast
     ------------------------------------------------------------------- */
  function setStatus(next) {
    if (status === next) return;
    status = next;
    paintPills();
    store.emit("sync", { status, room }, { remote: true });
  }

  function connect() {
    const lib = window.supabase;
    if (!lib || typeof lib.createClient !== "function") { setStatus("offline"); return; }
    try {
      const client = lib.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      });
      // BACKEND: a private channel with RLS on realtime.messages, once members sign in
      channel = client.channel(`lcc-room-${room}`, { config: { broadcast: { self: false, ack: false } } });
      channel.on("broadcast", { event: "lcc" }, ({ payload }) => receive(payload));
      channel.subscribe((s) => {
        if (s === "SUBSCRIBED") {
          clearTimeout(timeout);
          setStatus("online");
          post("hello", {}); // so the café (or a newer member copy) fills this device in
        } else if (s === "CHANNEL_ERROR" || s === "TIMED_OUT" || s === "CLOSED") {
          setStatus("offline"); // supabase-js keeps retrying; SUBSCRIBED flips it back
        }
      });
      timeout = setTimeout(() => { if (status !== "online") setStatus("offline"); }, CONNECT_TIMEOUT_MS);
    } catch (err) {
      console.warn("[LCC] live sync unavailable; this device only", err);
      setStatus("offline");
    }
  }

  window.addEventListener("offline", () => setStatus("offline"));

  // Say hello on this computer straight away; the network hello follows on connect
  post("hello", {});
  connect();

  /* -------------------------------------------------------------------
     Quiet indicator: <span data-sync-pill> updates itself
     ------------------------------------------------------------------- */
  const LABELS = { connecting: "Connecting…", online: "Connected", offline: "Offline, this device only" };
  function pill() {
    return html`<span class="sync-pill" data-sync-pill data-state="${status}" role="status" title="Room ${room}">
      <span class="sync-pill__dot" aria-hidden="true"></span><span data-sync-label>${LABELS[status]}</span>
    </span>`;
  }
  function paintPills() {
    ui.$$("[data-sync-pill]").forEach((el) => {
      el.dataset.state = status;
      ui.$("[data-sync-label]", el).textContent = LABELS[status];
    });
  }

  LCC.sync = { room, sender, withRoom, pairUrl, pill, liveUrl: LIVE_URL, status: () => status };
})();

</script>

              <div class="cluster">
                <button class="btn btn--secondary btn--compact" type="button">Partner with us</button>
                <button class="btn btn--link" type="button">How we pay you</button>
                <button class="btn btn--primary btn--compact" type="button" disabled>Disabled</button>
              </div>
            </section>

            <section class="card">
              <h2 class="eyebrow" style="margin-bottom:var(--space-4)">Inputs</h2>
              <form class="stack" style="--stack-gap:var(--space-4)" data-kit-form novalidate>
                <div class="field">
                  <label class="field__label" for="kit-name">Your name</label>
                  <input class="input" id="kit-name" name="name" autocomplete="given-name" placeholder="Mumtaz" aria-describedby="kit-name-err">
                  <p class="field__error" id="kit-name-err">We’ll need a name to save your spot.</p>
                </div>
                <div class="field">
                  <label class="field__label" for="kit-area">Area</label>
                  <div class="select">
                    <select class="input" id="kit-area">
                      ${store.getState().areas.map((a) => html`<option>${a.name}</option>`)}
                    </select>
                  </div>
                </div>
                <button class="btn btn--primary" type="submit">Check validation</button>
              </form>
            </section>

            <section class="card stack" style="--stack-gap:var(--space-4)">
              <h2 class="eyebrow">Chips, segmented, toggle</h2>
              <div class="cluster" style="--cluster-gap:var(--space-2)">
                ${["Area", "Quiet now", "Roastery", "Pastries"].map((c, i) => html`<button type="button" class="chip" aria-pressed="${i === 1}" data-kit-chip>${c}</button>`)}
              </div>
              ${ui.segmented({ name: "plan", label: "Plan type", value: "fixed", options: [{ value: "fixed", label: "Fixed" }, { value: "custom", label: "Build your own" }] })}
              <div class="row">
                <div class="row__main"><div class="row__title">Renewal reminders</div><div class="row__meta">Two days before, on WhatsApp</div></div>
                <button type="button" class="toggle" role="switch" aria-checked="true" aria-label="Renewal reminders" data-kit-toggle></button>
              </div>
              <div class="cluster"><span class="badge">3 of 5 visits</span><span class="badge badge--accent">Your plan</span></div>
            </section>

            <section class="card">
              <div class="panel-title"><h2 class="eyebrow">Stepper · live builder price</h2></div>
              <div data-kit-builder>
                ${cafes.slice(0, 4).map((c) => html`
                  <div class="row">
                    <div class="row__main"><div class="row__title">${c.name}</div><div class="row__meta num">${fmt.rs(c.price)} at the counter</div></div>
                    ${ui.stepper({ id: c.id, value: store.getState().builder[c.id] || 0, max: store.getState().rules.maxCupsPerCafe, label: `Cups per month at ${c.name}` })}
                  </div>`)}
              </div>
              <hr class="divider" style="margin-block:var(--space-4)">
              <div style="display:flex;justify-content:space-between;align-items:baseline">
                <span class="t-small t-muted"><span class="num" data-kit-cups></span></span>
                <span class="t-h2 num" data-kit-price></span>
              </div>
              <p class="t-small t-faint num" data-kit-savings style="text-align:right"></p>
            </section>

            <section class="card">
              <div class="panel-title"><h2 class="eyebrow">Status · shared store</h2></div>
              <p class="t-small t-muted" style="margin-bottom:var(--space-3)">Change Kiln &amp; Bean here, then open the member app or café view. Open two windows to see it mirror across them.</p>
              <div class="cluster" style="--cluster-gap:var(--space-2);margin-bottom:var(--space-4)" role="group" aria-label="Set Kiln & Bean status">
                ${store.statuses.map((s) => html`<button type="button" class="chip" aria-pressed="${kiln.status === s}" data-kit-status="${s}">${fmt.statusLabel(s)}</button>`)}
              </div>
              <div class="row"><div class="row__main"><div class="row__title">Mumtaz</div><div class="row__meta" data-kit-plan>${planMeta()}</div></div><span class="row__trail num" data-kit-ayesha>${store.select.member().cupsLeft} of ${store.select.member().cupsTotal}</span></div>
              ${cafes.map((c) => html`<div class="row"><div class="row__main"><div class="row__title">${c.name}</div><div class="row__meta">${store.select.area(c.area).name}</div></div>${ui.statusPill(c.id)}</div>`)}
            </section>

            <section class="card">
              <div class="panel-title"><h2 class="eyebrow">Bottom sheet, toast, check</h2></div>
              <div class="kit-demo-phone">
                <div style="padding:var(--space-5)" class="stack">
                  <button class="btn btn--secondary btn--block" type="button" data-sheet-open="kit-sheet">Open café sheet</button>
                  <button class="btn btn--ghost btn--block" type="button" data-kit-toast="Cup redeemed. 10 left.">Show toast</button>
                  <svg class="check-draw" data-kit-check viewBox="0 0 48 48" width="48" height="48" style="color:var(--accent);margin:var(--space-2) auto 0" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/><path d="M15 24.5l6 6 12-13" pathLength="1"/></svg>
                </div>
                <div class="sheet" id="kit-sheet" role="dialog" aria-modal="true" aria-labelledby="kit-sheet-title" aria-hidden="true">
                  <div class="sheet__scrim" data-sheet-close></div>
                  <div class="sheet__panel">
                    <div class="sheet__handle" aria-hidden="true"></div>
                    <div class="sheet__body stack" style="--stack-gap:var(--space-3)">
                      <h3 class="t-h2" id="kit-sheet-title">${kiln.name}</h3>
                      ${ui.statusPill("kiln")}
                      <p class="t-small t-muted">${kiln.blurb}</p>
                      <button class="btn btn--primary btn--block" type="button" data-sheet-close>Directions</button>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>`;

      // Builder
      const cupsEl = $("[data-kit-cups]", el), priceEl = $("[data-kit-price]", el), saveEl = $("[data-kit-savings]", el);
      const paintPrice = (animate) => {
        const p = store.select.customPrice();
        cupsEl.textContent = `${fmt.cups(p.cups)} a month`;
        if (animate) ui.animateNumber(priceEl, p.price, { format: fmt.rs }); else { priceEl.textContent = fmt.rs(p.price); priceEl.dataset.value = p.price; }
        saveEl.textContent = p.meetsMinimum ? `You save ${fmt.rs(p.savings)} vs paying at the counter` : `Add ${fmt.cups(p.cupsShort)} to reach the six-cup minimum`;
      };
      paintPrice(false);

      const onClick = (e) => {
        const step = e.target.closest("[data-step]");
        if (step) {
          const box = step.closest("[data-stepper]");
          const id = box.dataset.stepper;
          store.actions.setBuilderCups(id, (store.getState().builder[id] || 0) + Number(step.dataset.step));
          ui.setStepper(box, store.getState().builder[id] || 0);
        }
        const st = e.target.closest("[data-kit-status]");
        if (st) store.actions.setCafeStatus("kiln", st.dataset.kitStatus);
        const chip = e.target.closest("[data-kit-chip]");
        if (chip) chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed") !== "true");
        const tog = e.target.closest("[data-kit-toggle]");
        if (tog) tog.setAttribute("aria-checked", tog.getAttribute("aria-checked") !== "true");
        const seg = e.target.closest(".segmented__option");
        if (seg) ui.selectSegment(seg.parentElement, seg.dataset.value);
        const t = e.target.closest("[data-kit-toast]");
        if (t) {
          ui.toast(t.dataset.kitToast);
          const check = $("[data-kit-check]", el);
          const clone = check.cloneNode(true); check.replaceWith(clone); // replay draw
        }
      };
      el.addEventListener("click", onClick);

      const form = $("[data-kit-form]", el);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const field = $("#kit-name", el).closest(".field");
        const ok = $("#kit-name", el).value.trim().length > 0;
        field.dataset.invalid = String(!ok);
        $("#kit-name", el).setAttribute("aria-invalid", String(!ok));
        if (ok) ui.toast("Looks good.");
        else $("#kit-name", el).focus();
      });

      const offs = [
        store.on("builder", () => {
          paintPrice(true);
          $$("[data-kit-builder] [data-stepper]", el).forEach((box) => ui.setStepper(box, store.getState().builder[box.dataset.stepper] || 0));
        }),
        store.on("member", () => {
          const a = store.select.member();
          $("[data-kit-ayesha]", el).textContent = `${a.cupsLeft} of ${a.cupsTotal}`;
          $("[data-kit-plan]", el).textContent = planMeta();
        }),
        store.on("redeem", ({ member }) => {
          const a = store.select.member();
          if (member.id === a.id) $("[data-kit-ayesha]", el).textContent = `${a.cupsLeft} of ${a.cupsTotal}`;
        }),
        store.on("cafe:status", ({ cafeId, status }) => {
          if (cafeId !== "kiln") return;
          $$("[data-kit-status]", el).forEach((b) => b.setAttribute("aria-pressed", b.dataset.kitStatus === status));
        }),
      ];
      return () => { el.removeEventListener("click", onClick); offs.forEach((f) => f()); };
    },
  });
})();

</script>
<script>
/* ---- src/cafe.js ---- */
/* =====================================================================
   Lahore Coffee Club — cafe.js
   Café partner view (#/cafe). Used by a busy barista with one hand:
   big targets, little reading. Replaces the Pass 1 shell in router.js.

   Reads and writes the shared store, so a redemption here updates the
   member’s cups everywhere, and a status change here updates the map.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, raw, $, $$, icon } = ui;

  const STATUS_HINTS = { quiet: "Walk right in", moderate: "Short wait", packed: "Expect a queue" };
  const RESET_AFTER_MS = 5000;
  const RECENT_LIMIT = 6;

  LCC.router.register("cafe", {
    title: "Café view",
    mount(el) {
      let cafeId = store.getState().partnerCafeId;
      // Redeem panel state: idle | error | found | success
      let r = freshRedeem();
      let resetTimer = null;
      let scanTimer = null;

      function freshRedeem() {
        return { state: "idle", code: "", message: "", lookup: null, drinkId: null, result: null };
      }
      const cafe = () => store.select.cafe(cafeId);
      const oneCupDrinks = () => cafe().drinks.filter((d) => d.credits === 1);

      /* ---------------------------------------------------------------
         Shell
         --------------------------------------------------------------- */
      function renderAll() {
        const c = cafe();
        const area = store.select.area(c.area);
        const open = store.select.openState(c);
        el.innerHTML = html`
          <div class="surface cafe">
            <header class="cafe-header">
              <div class="stack" style="--stack-gap:var(--space-2)">
                <p class="eyebrow">Partner view</p>
                <h1 class="t-h1">${c.name}</h1>
                <p class="t-small t-muted">${area.name} · ${fmt.date(Date.now())}</p>
              </div>
              <div class="cafe-header__aside">
                <label class="viewing-as">
                  <span class="t-micro t-faint">Viewing as</span>
                  <span class="select">
                    <select class="input" data-viewing>
                      ${store.select.cafes().map((x) => html`<option value="${x.id}" ${x.id === cafeId ? raw("selected") : ""}>${x.name}</option>`)}
                    </select>
                  </span>
                </label>
                <span class="open-indicator" data-open-indicator data-open="${open.open}">${open.label}</span>
