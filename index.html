                <span class="phone__status-icons">
                  <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                  <svg viewBox="0 0 26 12" style="width:26px"><rect x="0.75" y="0.75" width="21.5" height="10.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.6" fill="currentColor"/><rect x="23.5" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
                </span>
              </div>
              <div class="app-view" id="app-view">
                <div class="app-view__inner stack" style="--stack-gap:var(--space-4)">
                  <p class="eyebrow">Member app</p>
                  <h1 class="t-h2">Salaam, ${m.firstName}.</h1>
                  <div class="placeholder">
                    <span>Built in Passes 3 to 5.</span>
                    <span>Store check: <span class="num" data-bind="cups">${m.cupsLeft} of ${m.cupsTotal}</span> cups left. Kiln &amp; Bean is ${ui.statusPill("kiln", { bare: true })}</span>
                  </div>
                </div>
              </div>
              <div class="toast-region" style="position:absolute" role="status" aria-live="polite"></div>
            </div>
          </div>
        </div>`;
      const cups = $('[data-bind="cups"]', el);
      const off = store.on("member", ({ member }) => { cups.textContent = `${member.cupsLeft} of ${member.cupsTotal}`; });
      const off2 = store.on("redeem", ({ member }) => { if (member.id === m.id) cups.textContent = `${member.cupsLeft} of ${member.cupsTotal}`; });
      return () => { off(); off2(); };
    },
  });

  register("cafe", {
    title: "Café view",
    mount(el) {
      const cafe = store.select.partnerCafe();
      const area = store.select.area(cafe.area);
      el.innerHTML = html`
        <div class="surface cafe">
          <header class="cafe-header">
            <div class="stack" style="--stack-gap:var(--space-2)">
              <p class="eyebrow">Partner view · ${area.name}</p>
              <h1 class="t-h1">${cafe.name}</h1>
              <p class="t-small t-muted">${fmt.date(Date.now())}</p>
            </div>
            <span class="open-indicator">Open <span class="t-faint t-small" style="font-weight:400">until ${cafe.hours.label.split("–")[1].trim()}</span></span>
          </header>
          <div class="cafe-grid">
            <section class="card" aria-labelledby="redeem-h">
              <div class="panel-title"><h2 class="eyebrow" id="redeem-h">Redeem a cup</h2></div>
              <div class="placeholder" style="min-height:360px">Code entry, numpad, and QR scan. Built in Pass 2.</div>
            </section>
            <div class="cafe-grid__side">
              <section class="card" aria-labelledby="busy-h">
                <div class="panel-title"><h2 class="eyebrow" id="busy-h">How busy are you?</h2>${ui.statusPill(cafe.id)}</div>
                <div class="placeholder">Quiet, Moderate, Packed. Built in Pass 2.</div>
              </section>
              <section class="card" aria-labelledby="today-h">
                <div class="panel-title"><h2 class="eyebrow" id="today-h">Today</h2></div>
                <div class="placeholder">Redemptions, new customers, payout. Built in Pass 2.</div>
              </section>
            </div>
          </div>
          <p class="t-small t-faint" style="margin-top:var(--space-6)">Works on any phone or tablet. No special hardware.</p>
        </div>`;
    },
  });

  /* Boot ---------------------------------------------------------------- */
  window.addEventListener("hashchange", render);
  LCC.router = { register, navigate, render, parse };

  // Defer first render so later scripts (kit.js, screens) can register first
  document.addEventListener("DOMContentLoaded", render);
})();

</script>
<script>
/* ---- src/kit.js ---- */
/* =====================================================================
   Lahore Coffee Club — kit.js
   #/kit: every Pass 1 component on one page, wired to the real store,
   so the design system can be reviewed before screens are built.
   Not linked from the switcher.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, raw, $, $$ } = ui;

  const swatches = ["--bg", "--surface", "--surface-2", "--ink", "--ink-2", "--ink-3", "--line", "--accent", "--accent-soft", "--status-quiet", "--status-moderate", "--status-packed"];

  LCC.router.register("kit", {
    title: "Component kit",
    mount(el) {
      const cafes = store.select.cafes();
      const kiln = store.select.cafe("kiln");
      el.innerHTML = html`
        <div class="surface container kit">
          <p class="eyebrow">Pass 1 · design system</p>
          <h1 class="t-display" style="margin-top:var(--space-3)">Every café you love.<br>One monthly pass.</h1>
          <p class="t-body t-muted measure" style="margin-top:var(--space-4)">Pick your places, pick your cups. Pay once, drink well all month.</p>

          <div class="kit-grid">
            <section class="card stack" style="--stack-gap:var(--space-4)">
              <h2 class="eyebrow">Colour</h2>
              <div class="kit-swatches">
                ${swatches.map((s) => html`<div class="kit-swatch"><span style="background:var(${s})"></span><span>${s.slice(2)}</span></div>`)}
              </div>
            </section>

            <section class="card stack" style="--stack-gap:var(--space-3)">
              <h2 class="eyebrow">Type</h2>
              <p class="t-h1">Fraunces 40</p>
              <p class="t-h2">Fraunces 28, for titles</p>
              <p class="t-h3">Inter Tight 20, medium</p>
              <p class="t-body">Body 16. We send you regulars. You serve them coffee.</p>
              <p class="t-small t-muted">Small 14, secondary ink.</p>
              <p class="t-micro t-faint num">Micro 12 · Rs 6,500 · 11 of 16</p>
            </section>

            <section class="card stack" style="--stack-gap:var(--space-3)">
              <h2 class="eyebrow">Buttons</h2>
              <button class="btn btn--primary btn--block" type="button" data-kit-toast="You’re on the list.">Join the waitlist</button>
              <button class="btn btn--secondary btn--block" type="button">See the app</button>
              <div class="cluster">
                <button class="btn btn--secondary btn--compact" type="button">Partner with us</button>
                <button class="btn btn--link" type="button">How we pay you</button>
                <button class="btn btn--primary btn--compact" type="button" disabled>Disabled</button>
              </div>
            </section>

            <section class="card">
              <h2 class="eyebrow" style="margin-bottom:var(--space-4)">Inputs</h2>
              <form class="stack" style="--stack-gap:var(--space-4)" data-kit-form novalidate>
                <div class="field">
                  <label class="field__label" for="kit-name">Your name</label>
                  <input class="input" id="kit-name" name="name" autocomplete="given-name" placeholder="Ayesha" aria-describedby="kit-name-err">
                  <p class="field__error" id="kit-name-err">We’ll need a name to save your spot.</p>
                </div>
                <div class="field">
                  <label class="field__label" for="kit-area">Area</label>
                  <div class="select">
                    <select class="input" id="kit-area">
                      ${store.getState().areas.map((a) => html`<option>${a.name}</option>`)}
                    </select>
                  </div>
                </div>
                <button class="btn btn--primary" type="submit">Check validation</button>
              </form>
            </section>

            <section class="card stack" style="--stack-gap:var(--space-4)">
              <h2 class="eyebrow">Chips, segmented, toggle</h2>
              <div class="cluster" style="--cluster-gap:var(--space-2)">
                ${["Area", "Quiet now", "Roastery", "Pastries"].map((c, i) => html`<button type="button" class="chip" aria-pressed="${i === 1}" data-kit-chip>${c}</button>`)}
              </div>
              ${ui.segmented({ name: "plan", label: "Plan type", value: "fixed", options: [{ value: "fixed", label: "Fixed" }, { value: "custom", label: "Build your own" }] })}
              <div class="row">
                <div class="row__main"><div class="row__title">Renewal reminders</div><div class="row__meta">Two days before, on WhatsApp</div></div>
                <button type="button" class="toggle" role="switch" aria-checked="true" aria-label="Renewal reminders" data-kit-toggle></button>
              </div>
              <div class="cluster"><span class="badge">3 of 5 visits</span><span class="badge badge--accent">Your plan</span></div>
            </section>

            <section class="card">
              <div class="panel-title"><h2 class="eyebrow">Stepper · live builder price</h2></div>
              <div data-kit-builder>
                ${cafes.slice(0, 4).map((c) => html`
                  <div class="row">
                    <div class="row__main"><div class="row__title">${c.name}</div><div class="row__meta num">${fmt.rs(c.price)} at the counter</div></div>
                    ${ui.stepper({ id: c.id, value: store.getState().builder[c.id] || 0, max: store.getState().rules.maxCupsPerCafe, label: `Cups per month at ${c.name}` })}
                  </div>`)}
              </div>
              <hr class="divider" style="margin-block:var(--space-4)">
              <div style="display:flex;justify-content:space-between;align-items:baseline">
                <span class="t-small t-muted"><span class="num" data-kit-cups></span></span>
                <span class="t-h2 num" data-kit-price></span>
              </div>
              <p class="t-small t-faint num" data-kit-savings style="text-align:right"></p>
            </section>

            <section class="card">
              <div class="panel-title"><h2 class="eyebrow">Status · shared store</h2></div>
              <p class="t-small t-muted" style="margin-bottom:var(--space-3)">Change Kiln &amp; Bean here, then open the member app or café view. Open two windows to see it mirror across them.</p>
              <div class="cluster" style="--cluster-gap:var(--space-2);margin-bottom:var(--space-4)" role="group" aria-label="Set Kiln & Bean status">
                ${store.statuses.map((s) => html`<button type="button" class="chip" aria-pressed="${kiln.status === s}" data-kit-status="${s}">${fmt.statusLabel(s)}</button>`)}
              </div>
              <div class="row"><div class="row__main"><div class="row__title">Ayesha</div><div class="row__meta">Cups left this month</div></div><span class="row__trail num" data-kit-ayesha>${store.select.member().cupsLeft} of ${store.select.member().cupsTotal}</span></div>
              ${cafes.map((c) => html`<div class="row"><div class="row__main"><div class="row__title">${c.name}</div><div class="row__meta">${store.select.area(c.area).name}</div></div>${ui.statusPill(c.id)}</div>`)}
            </section>

            <section class="card">
              <div class="panel-title"><h2 class="eyebrow">Bottom sheet, toast, check</h2></div>
              <div class="kit-demo-phone">
                <div style="padding:var(--space-5)" class="stack">
                  <button class="btn btn--secondary btn--block" type="button" data-sheet-open="kit-sheet">Open café sheet</button>
                  <button class="btn btn--ghost btn--block" type="button" data-kit-toast="Cup redeemed. 10 left.">Show toast</button>
                  <svg class="check-draw" data-kit-check viewBox="0 0 48 48" width="48" height="48" style="color:var(--accent);margin:var(--space-2) auto 0" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/><path d="M15 24.5l6 6 12-13" pathLength="1"/></svg>
                </div>
                <div class="sheet" id="kit-sheet" role="dialog" aria-modal="true" aria-labelledby="kit-sheet-title" aria-hidden="true">
                  <div class="sheet__scrim" data-sheet-close></div>
                  <div class="sheet__panel">
                    <div class="sheet__handle" aria-hidden="true"></div>
                    <div class="sheet__body stack" style="--stack-gap:var(--space-3)">
                      <h3 class="t-h2" id="kit-sheet-title">${kiln.name}</h3>
                      ${ui.statusPill("kiln")}
                      <p class="t-small t-muted">${kiln.blurb}</p>
                      <button class="btn btn--primary btn--block" type="button" data-sheet-close>Directions</button>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>`;

      // Builder
      const cupsEl = $("[data-kit-cups]", el), priceEl = $("[data-kit-price]", el), saveEl = $("[data-kit-savings]", el);
      const paintPrice = (animate) => {
        const p = store.select.customPrice();
        cupsEl.textContent = `${fmt.cups(p.cups)} a month`;
        if (animate) ui.animateNumber(priceEl, p.price, { format: fmt.rs }); else { priceEl.textContent = fmt.rs(p.price); priceEl.dataset.value = p.price; }
        saveEl.textContent = p.meetsMinimum ? `You save ${fmt.rs(p.savings)} vs paying at the counter` : `Add ${fmt.cups(p.cupsShort)} to reach the six-cup minimum`;
      };
      paintPrice(false);

      const onClick = (e) => {
        const step = e.target.closest("[data-step]");
        if (step) {
          const box = step.closest("[data-stepper]");
          const id = box.dataset.stepper;
          store.actions.setBuilderCups(id, (store.getState().builder[id] || 0) + Number(step.dataset.step));
          ui.setStepper(box, store.getState().builder[id] || 0);
        }
        const st = e.target.closest("[data-kit-status]");
        if (st) store.actions.setCafeStatus("kiln", st.dataset.kitStatus);
        const chip = e.target.closest("[data-kit-chip]");
        if (chip) chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed") !== "true");
        const tog = e.target.closest("[data-kit-toggle]");
        if (tog) tog.setAttribute("aria-checked", tog.getAttribute("aria-checked") !== "true");
        const seg = e.target.closest(".segmented__option");
        if (seg) ui.selectSegment(seg.parentElement, seg.dataset.value);
        const t = e.target.closest("[data-kit-toast]");
        if (t) {
          ui.toast(t.dataset.kitToast);
          const check = $("[data-kit-check]", el);
          const clone = check.cloneNode(true); check.replaceWith(clone); // replay draw
        }
      };
      el.addEventListener("click", onClick);

      const form = $("[data-kit-form]", el);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const field = $("#kit-name", el).closest(".field");
        const ok = $("#kit-name", el).value.trim().length > 0;
        field.dataset.invalid = String(!ok);
        $("#kit-name", el).setAttribute("aria-invalid", String(!ok));
        if (ok) ui.toast("Looks good.");
        else $("#kit-name", el).focus();
      });

      const offs = [
        store.on("builder", () => paintPrice(true)),
        store.on("redeem", ({ member }) => {
          const a = store.select.member();
          if (member.id === a.id) $("[data-kit-ayesha]", el).textContent = `${a.cupsLeft} of ${a.cupsTotal}`;
        }),
        store.on("cafe:status", ({ cafeId, status }) => {
          if (cafeId !== "kiln") return;
          $$("[data-kit-status]", el).forEach((b) => b.setAttribute("aria-pressed", b.dataset.kitStatus === status));
        }),
      ];
      return () => { el.removeEventListener("click", onClick); offs.forEach((f) => f()); };
    },
  });
})();

</script>
<script>
/* ---- src/cafe.js ---- */
/* =====================================================================
   Lahore Coffee Club — cafe.js
   Café partner view (#/cafe). Used by a busy barista with one hand:
   big targets, little reading. Replaces the Pass 1 shell in router.js.

   Reads and writes the shared store, so a redemption here updates the
   member’s cups everywhere, and a status change here updates the map.
   ===================================================================== */
(function () {
  "use strict";
  const LCC = window.LCC;
  const { store, fmt, ui } = LCC;
  const { html, raw, $, $$, icon } = ui;

  const STATUS_HINTS = { quiet: "Walk right in", moderate: "Short wait", packed: "Expect a queue" };
  const RESET_AFTER_MS = 5000;
  const RECENT_LIMIT = 6;

  LCC.router.register("cafe", {
    title: "Café view",
    mount(el) {
      let cafeId = store.getState().partnerCafeId;
      // Redeem panel state: idle | error | found | success
      let r = freshRedeem();
      let resetTimer = null;
      let scanTimer = null;

      function freshRedeem() {
        return { state: "idle", code: "", message: "", lookup: null, drinkId: null, result: null };
      }
      const cafe = () => store.select.cafe(cafeId);
      const oneCupDrinks = () => cafe().drinks.filter((d) => d.credits === 1);

      /* ---------------------------------------------------------------
         Shell
         --------------------------------------------------------------- */
      function renderAll() {
        const c = cafe();
        const area = store.select.area(c.area);
        const open = store.select.openState(c);
        el.innerHTML = html`
          <div class="surface cafe">
            <header class="cafe-header">
              <div class="stack" style="--stack-gap:var(--space-2)">
                <p class="eyebrow">Partner view</p>
                <h1 class="t-h1">${c.name}</h1>
                <p class="t-small t-muted">${area.name} · ${fmt.date(Date.now())}</p>
              </div>
              <div class="cafe-header__aside">
                <label class="viewing-as">
                  <span class="t-micro t-faint">Viewing as</span>
                  <span class="select">
                    <select class="input" data-viewing>
                      ${store.select.cafes().map((x) => html`<option value="${x.id}" ${x.id === cafeId ? raw("selected") : ""}>${x.name}</option>`)}
                    </select>
                  </span>
                </label>
                <span class="open-indicator" data-open-indicator data-open="${open.open}">${open.label}</span>
              </div>
            </header>

            <div class="cafe-grid">
              <section class="card" aria-labelledby="redeem-h">
                <div class="panel-title"><h2 class="eyebrow" id="redeem-h">Redeem a cup</h2></div>
                <div data-redeem-body></div>
              </section>

              <div class="cafe-grid__side">
                <section class="card" aria-labelledby="busy-h">
                  <div class="panel-title"><h2 class="eyebrow" id="busy-h">How busy are you?</h2></div>
                  ${busyControl()}
                  <p class="t-small t-faint busy-updated" data-busy-updated data-rel-time="${c.statusUpdatedAt}" data-rel-prefix="Updated">Updated ${fmt.ago(c.statusUpdatedAt)}</p>
                </section>

                <section class="card" aria-labelledby="today-h">
                  <div class="panel-title"><h2 class="eyebrow" id="today-h">Today</h2></div>
                  <dl class="today-stats">
                    <div><dt>Redemptions</dt><dd class="t-h1 num" data-stat="redemptions" data-value="0">0</dd></div>
                    <div><dt>New customers</dt><dd class="t-h1 num" data-stat="new" data-value="0">0</dd></div>
                    <div class="today-stats__wide">
                      <dt>Payout today</dt>
                      <dd class="t-h1 num" data-stat="payout" data-value="0">${fmt.rs(0)}</dd>
                      <dd class="t-small t-faint num" data-payout-meta></dd>
                    </div>
                  </dl>
                  <div class="row" style="margin-top:var(--space-4);border-top:var(--hairline)">
                    <div class="row__main">
                      <div class="row__title">This month so far</div>
                      <div class="row__meta num" data-month-meta></div>
                    </div>
                    <span class="row__trail num" style="color:var(--ink);font-size:var(--fs-16)" data-stat="month" data-value="0">${fmt.rs(0)}</span>
                  </div>
                  <hr class="divider" style="margin-block:var(--space-5) var(--space-3)">
                  <h3 class="eyebrow">Recent redemptions</h3>
                  <ol class="recent" role="list" data-recent aria-live="polite"></ol>
                  <p class="t-small t-faint" data-recent-more></p>
                </section>
              </div>
            </div>

            <p class="t-small t-faint" style="margin-top:var(--space-6)">Works on any phone or tablet. No special hardware.</p>
          </div>`;
        paintRedeem();
        paintToday();
      }

      /* ---------------------------------------------------------------
         Redeem panel
         --------------------------------------------------------------- */
      function paintRedeem({ focus = false } = {}) {
        const body = $("[data-redeem-body]", el);
        if (!body) return;

        if (r.state === "idle" || r.state === "error") {
          const invalid = r.state === "error";
          body.innerHTML = html`
            <form class="stack" style="--stack-gap:var(--space-4)" data-code-form novalidate>
              <div class="field" data-invalid="${invalid}">
                <label class="field__label" for="member-code">Member code</label>
                <input class="input code-input" id="member-code" name="code" value="${r.code}"
                  inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000"
                  aria-describedby="member-code-hint member-code-err" aria-invalid="${invalid}">
                <p class="field__hint" id="member-code-hint">Six digits, under the QR on the member’s pass.</p>
                <p class="field__error" id="member-code-err" role="alert">${r.message}</p>
              </div>
              <div class="redeem-actions">
                <button type="submit" class="btn btn--primary">Check code</button>
                <button type="button" class="btn btn--secondary" data-sim-scan>Simulate scan</button>
              </div>
            </form>`;
          if (focus) { const input = $("#member-code", body); input.focus(); if (invalid) input.select(); }
          return;
        }

        if (r.state === "found") {
          const { member, usedToday, dailyLimit } = r.lookup;
          const plan = store.select.memberPlan(member);
          const name = [member.firstName, member.lastName].filter(Boolean).join(" ");
          body.innerHTML = html`
            <div class="stack enter" style="--stack-gap:var(--space-5)">
              <div class="member-head">
                <div class="stack" style="--stack-gap:var(--space-1)">
                  <p class="t-h2" id="member-name">${name}</p>
                  <p class="t-small t-muted">${plan.name} plan · ${fmt.cups(plan.cups)} a month</p>
                </div>
                <span class="badge badge--accent">Valid pass</span>
              </div>
              <dl class="member-stats">
                <div><dt>Cups left</dt><dd class="t-h1 num">${member.cupsLeft}</dd></div>
                <div><dt>Here today</dt><dd class="t-h1 num">${usedToday} <span class="t-small t-faint">of ${dailyLimit}</span></dd></div>
              </dl>
              <fieldset style="border:0;padding:0">
                <legend class="field__label" style="margin-bottom:var(--space-3)">Drink</legend>
                <div class="cluster" style="--cluster-gap:var(--space-2)">
                  ${oneCupDrinks().map((d) => html`<button type="button" class="chip" data-drink="${d.id}" aria-pressed="${d.id === r.drinkId}">${d.name}</button>`)}
                </div>
              </fieldset>
              <button type="button" class="btn btn--primary btn--block btn--tall" data-redeem aria-describedby="member-name">Redeem 1 cup</button>
              <button type="button" class="btn btn--link" data-reset style="justify-self:start">Not ${member.firstName}? Enter another code</button>
            </div>`;
          if (focus) $("[data-redeem]", body).focus();
          return;
        }

        if (r.state === "success") {
          const { member, entry, before } = r.result;
          const drink = store.select.drink(cafeId, entry.drinkId);
          body.innerHTML = html`
            <div class="redeem-success" role="status">
              <svg class="check-draw" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/><path d="M15 24.5l6 6 12-13" pathLength="1"/></svg>
              <p class="t-h2">Cup redeemed.</p>
              <p class="t-body t-muted">${member.firstName} has <span class="num" style="color:var(--ink);font-weight:500" data-cups-left data-value="${before}">${before}</span> ${raw(`<span data-cups-word>${before === 1 ? "cup" : "cups"}</span>`)} left this month.</p>
              <p class="t-small t-faint">${drink ? drink.name : "1 cup"} · ${fmt.time(entry.at)}</p>
              <button type="button" class="btn btn--secondary" data-reset style="margin-top:var(--space-3)">Next customer</button>
            </div>`;
          const cups = $("[data-cups-left]", body);
          const word = $("[data-cups-word]", body);
          setTimeout(() => {
            ui.animateNumber(cups, member.cupsLeft, { duration: 600 });
            word.textContent = member.cupsLeft === 1 ? "cup" : "cups";
          }, ui.reducedMotion() ? 0 : 450);
          if (focus) $("[data-reset]", body).focus({ preventScroll: true });
        }
      }

      function check(code, { focus = true } = {}) {
        r.code = code;
        const res = store.lookupCode(code, cafeId, 1);
        if (res.ok) {
          r = { ...freshRedeem(), state: "found", code, lookup: res, drinkId: oneCupDrinks()[0]?.id };
        } else {
          r = { ...freshRedeem(), state: "error", code, message: res.message };
        }
        paintRedeem({ focus });
      }

      function redeemNow() {
        const before = r.lookup.member.cupsLeft;
        const res = store.actions.redeem({ code: r.code, cafeId, drinkId: r.drinkId });
        if (!res.ok) {
          // e.g. the code expired while the barista was choosing a drink
          r = { ...freshRedeem(), state: "error", code: r.code, message: res.message };
          paintRedeem({ focus: true });
          return;
        }
        r = { ...freshRedeem(), state: "success", result: { member: res.member, entry: res.entry, before } };
        paintRedeem({ focus: true });
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => reset({ focus: el.contains(document.activeElement) }), RESET_AFTER_MS);
      }

      function reset({ focus = true } = {}) {
        clearTimeout(resetTimer);
        clearTimeout(scanTimer);
        r = freshRedeem();
        paintRedeem({ focus });
      }

      function simulateScan(btn) {
        // BACKEND: a real scan decodes the QR payload (LCC1:<member>:<code>) on device
        btn.disabled = true;
        btn.textContent = "Scanning…";
        clearTimeout(scanTimer);
        scanTimer = setTimeout(() => check(store.select.pass(store.getState().memberId).code), 600);
      }

      /* ---------------------------------------------------------------
         Busy status
         --------------------------------------------------------------- */
      function busyControl() {
        const current = cafe().status;
        const index = store.statuses.indexOf(current);
        return html`
          <div class="busy" role="radiogroup" aria-labelledby="busy-h" style="--index:${index}" data-busy>
            <span class="busy__thumb" aria-hidden="true"></span>
            ${store.statuses.map((s) => html`
              <button type="button" role="radio" class="busy__option" data-busy-option="${s}"
                aria-checked="${s === current}" tabindex="${s === current ? 0 : -1}">
                ${ui.cupIcon(s, { size: 32, cls: "busy__icon" })}
                <span class="busy__label">${fmt.statusLabel(s)}</span>
                <span class="busy__hint">${STATUS_HINTS[s]}</span>
              </button>`)}
          </div>`;
      }

      function paintBusy() {
        const group = $("[data-busy]", el);
        if (!group) return;
        const c = cafe();
        group.style.setProperty("--index", store.statuses.indexOf(c.status));
        $$("[data-busy-option]", group).forEach((b) => {
          const on = b.dataset.busyOption === c.status;
          b.setAttribute("aria-checked", on);
          b.tabIndex = on ? 0 : -1;
        });
        const upd = $("[data-busy-updated]", el);
        upd.dataset.relTime = c.statusUpdatedAt;
        upd.textContent = `Updated ${fmt.ago(c.statusUpdatedAt)}`;
      }

      function setBusy(status) {
        // store.actions.setCafeStatus carries the // BACKEND: PATCH /cafes/:id/status seam
        store.actions.setCafeStatus(cafeId, status);
      }

      /* ---------------------------------------------------------------
         Today
         --------------------------------------------------------------- */
      function paintToday(newEntryId) {
        // BACKEND: GET /cafes/:id/summary?date=today
        const s = store.select.cafeSummary(cafeId);
        ui.animateNumber($('[data-stat="redemptions"]', el), s.redemptionsToday);
        ui.animateNumber($('[data-stat="new"]', el), s.newCustomersToday);
        ui.animateNumber($('[data-stat="payout"]', el), s.payoutToday, { format: fmt.rs, duration: 700 });
        ui.animateNumber($('[data-stat="month"]', el), s.payoutMonth, { format: fmt.rs, duration: 700 });
        $("[data-payout-meta]", el).textContent = `${fmt.cups(s.cupsToday)} × ${fmt.rs(s.payoutPerCup)}, your rate per cup`;
        $("[data-month-meta]", el).textContent = `${fmt.cups(s.monthCups)}, paid on the 1st`;

        const list = $("[data-recent]", el);
        const shown = s.today.slice(0, RECENT_LIMIT);
        list.innerHTML = shown.length
          ? html`${shown.map((e) => {
              const m = store.select.member(e.memberId);
              const d = store.select.drink(cafeId, e.drinkId);
              return html`<li class="row${e.id === newEntryId ? " enter" : ""}">
                <span class="row__trail num">${fmt.time(e.at)}</span>
                <div class="row__main">
                  <div class="row__title">${d ? d.name : "Coffee"}</div>
                  <div class="row__meta">${m ? m.firstName : "Member"}${e.firstVisit ? " · first visit" : ""}</div>
                </div>
                <span class="badge">${fmt.cups(e.credits)}</span>
              </li>`;
            })}`.s
          : html`<li class="row"><div class="row__main row__meta">No cups redeemed yet today.</div></li>`.s;
        const more = s.today.length - shown.length;
        $("[data-recent-more]", el).textContent = more > 0 ? `And ${more} earlier today.` : "";
      }

      function paintOpen() {
        const ind = $("[data-open-indicator]", el);
        if (!ind) return;
        const open = store.select.openState(cafe());
        ind.dataset.open = open.open;
        ind.textContent = open.label;
      }

      /* ---------------------------------------------------------------
         Events
         --------------------------------------------------------------- */
      const onClick = (e) => {
        const t = e.target;
        const opt = t.closest("[data-busy-option]");
        if (opt) return setBusy(opt.dataset.busyOption);
        if (t.closest("[data-sim-scan]")) return simulateScan(t.closest("[data-sim-scan]"));
        if (t.closest("[data-redeem]")) return redeemNow();
        if (t.closest("[data-reset]")) return reset();
        const drink = t.closest("[data-drink]");
        if (drink) {
          r.drinkId = drink.dataset.drink;
          $$("[data-drink]", el).forEach((b) => b.setAttribute("aria-pressed", b === drink));
        }
      };

      const onInput = (e) => {
        if (e.target.id !== "member-code") return;
        const input = e.target;
        const digits = input.value.replace(/\D/g, "").slice(0, 6);
        if (input.value !== digits) input.value = digits;
        r.code = digits;
        // Clear the error as soon as they start correcting
        const field = input.closest(".field");
        if (field.dataset.invalid === "true") { field.dataset.invalid = "false"; input.setAttribute("aria-invalid", "false"); r.state = "idle"; }
        if (digits.length === 6) check(digits);
      };

      const onSubmit = (e) => {
        if (!e.target.matches("[data-code-form]")) return;
        e.preventDefault();
        const code = $("#member-code", el).value.replace(/\D/g, "");
        if (code.length !== 6) {
          r = { ...freshRedeem(), state: "error", code, message: code.length ? `That’s ${code.length} digit${code.length === 1 ? "" : "s"}. Member codes have six.` : "Enter the six-digit code from the member’s pass." };
          paintRedeem({ focus: true });
          return;
        }
        check(code);
      };

      const onChange = (e) => {
        if (e.target.matches("[data-viewing]")) store.actions.setPartnerCafe(e.target.value);
      };

      // Radio group keys: arrows move and select, Home/End jump
      const onKeydown = (e) => {
        const opt = e.target.closest?.("[data-busy-option]");
        if (!opt) return;
        const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
        const list = store.statuses;
        let i = list.indexOf(opt.dataset.busyOption);
        if (e.key in keys) i = (i + keys[e.key] + list.length) % list.length;
        else if (e.key === "Home") i = 0;
        else if (e.key === "End") i = list.length - 1;
        else return;
        e.preventDefault();
        setBusy(list[i]);
        $(`[data-busy-option="${list[i]}"]`, el).focus();
      };

      el.addEventListener("click", onClick);
      el.addEventListener("input", onInput);
      el.addEventListener("submit", onSubmit);
      el.addEventListener("change", onChange);
      el.addEventListener("keydown", onKeydown);

      const offs = [
        store.on("cafe:status", ({ cafeId: id }) => { if (id === cafeId) paintBusy(); }),
        store.on("redeem", ({ entry }) => {
          if (entry.cafeId !== cafeId) return;
          paintToday(entry.id);
          // A redemption from another window for the member on screen: refresh their numbers
          if (r.state === "found" && r.lookup.member.id === entry.memberId) check(r.code, { focus: false });
        }),
        store.on("cafe:viewing", ({ cafeId: id }) => {
          cafeId = id;
          clearTimeout(resetTimer); clearTimeout(scanTimer);
          r = freshRedeem();
          renderAll();
          $("[data-viewing]", el)?.focus();
        }),
        store.on("tick", paintOpen),
      ];

      renderAll();

      return () => {
        clearTimeout(resetTimer);
        clearTimeout(scanTimer);
        offs.forEach((off) => off());
        el.removeEventListener("click", onClick);
        el.removeEventListener("input", onInput);
        el.removeEventListener("submit", onSubmit);
        el.removeEventListener("change", onChange);
        el.removeEventListener("keydown", onKeydown);
      };
    },
  });
})();

</script>
</body>
</html>
